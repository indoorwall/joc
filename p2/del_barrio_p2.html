<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff0ff">
<title>Del barrio al negocio · P2.5</title>
<!--
  PROTOTIPO P2.4 — Capítulo 1 + MONETIZATION LAB (todo simulado: sin anuncios reales, sin pagos, sin SDK, sin servidor). Lista para pruebas con personas (telemetría local).
  Juego de gestión por decisiones: una acción por semana, sin partidos jugables.
  ARCHIVO GENERADO por p2/build.cjs a partir de p2/src (no editar a mano):
    00 configuración y datos · 01 utilidades · 02 estado y guardado (saveVersion 2)
    03 liga · 04 carrera · 05 patrocinios · 06 negocios · 07 eventos · 08 decisiones e hitos
    09 semana · 10 simulación y balance · 11 avatar · 12 telemetría · 13 tienda · 14 relaciones · 15 monetización simulada · 16 deseo y colección · 20 interfaz
  Sin anuncios, compras, cuentas ni conexiones. Clubes y marcas ficticios; importes de juego.
-->
<style>
/* P2.3 · Identidad de juego móvil: azul noche y morado oscuro con degradados, azul eléctrico de acento,
   oro para dinero y recompensas, y un color por categoría (deporte, relaciones, empresa, tienda).
   Sin verde. Fondo decorativo por etapa (barrio, club, empresa, magnate) hecho con SVG.
   Jerarquía de la semana: SITUACIÓN → DECISIÓN → CONSECUENCIA. */
:root {
  --bg1: #2a1a78; --bg2: #0b1033; --bg3: #3b1c6e;
  --acc: #3d7bff; --acc2: #8b5cf6; --acc-d: #2546b8; --acc-soft: #eaf0ff; --acc-txt: #fff; --acc-ink: #2546b8;
  --card: #ffffff; --ink: #1a1640; --dim: #6a6890; --line: #e4e2f3; --panel: #f3f1fd;
  --gold: #ffc83d; --gold-d: #c8901a; --good: #0aa5c4; --bad: #ef4766; --blue: #3d7bff; --amber: #ff9f2e;
  --c-dep: #3d7bff; --c-rel: #ff4f8b; --c-emp: #1fc7b6; --c-tienda: #d94bff;
  --grad: linear-gradient(135deg, #3d7bff, #8b5cf6);
  --f: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; color: var(--ink); background: var(--bg2); }
body { font-family: var(--f); font-size: 16px; line-height: 1.35; -webkit-text-size-adjust: 100%; overflow-x: hidden;
  background: radial-gradient(130% 60% at 15% 0%, var(--bg1), transparent 60%), radial-gradient(120% 60% at 100% 20%, var(--bg3), transparent 65%), var(--bg2) fixed; min-height: 100vh; }
body[data-etapa="club"] { --bg1: #1d3a9e; --bg3: #33207a; }
body[data-etapa="empresa"] { --bg1: #142a6e; --bg3: #2b1460; }
body[data-etapa="magnate"] { --bg1: #3a2168; --bg3: #5a3a12; }
#decor { position: fixed; left: 0; right: 0; bottom: 0; height: 52vh; z-index: 0; pointer-events: none; opacity: .9; }
#decor svg { width: 100%; height: 100%; display: block; }
button, input { font-family: inherit; color: inherit; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; z-index: 1; }
.num { font-variant-numeric: tabular-nums; }
.oro { color: var(--gold); } .oro2 { color: var(--gold-d); font-weight: 900; }

/* Cabecera */
#top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; color: #fff;
  padding: calc(var(--safe-top) + 8px) 12px 8px; background: linear-gradient(rgba(11,16,51,.92), rgba(11,16,51,.55)); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
#top:empty { display: none; }
.hava { width: 48px; height: 48px; flex: none; border-radius: 50%; background: #fff; border: 3px solid var(--gold); box-shadow: 0 0 0 3px rgba(255,200,61,.25); padding: 0; overflow: hidden; cursor: pointer; display: block; }
.hava svg { width: 100%; height: 100%; display: block; }
.hwho { flex: 1; min-width: 0; }
.hwho b { display: block; font-size: 16px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hwho span { display: block; font-size: 12px; color: rgba(255,255,255,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hres { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; max-width: 54%; }
.pill { display: inline-flex; align-items: center; gap: 3px; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.2); color: #fff; border-radius: 999px;
  padding: 1px 8px 1px 6px; font-weight: 900; font-size: 14px; white-space: nowrap; }
.pill.oro { color: var(--gold); border-color: rgba(255,200,61,.55); background: rgba(255,200,61,.12); }
.pill.mal { color: #ff9a8f; }

main { padding: 0 12px calc(var(--safe-bottom) + 92px); }
main.conBoton { padding-bottom: calc(var(--safe-bottom) + 170px); }
.card { background: var(--card); border-radius: 20px; padding: 12px 14px; margin: 10px 0; box-shadow: 0 5px 0 rgba(20,10,70,.45), 0 10px 24px rgba(5,5,30,.35); }
.sec { font-size: 12px; font-weight: 900; color: rgba(255,255,255,.85); text-transform: uppercase; letter-spacing: .08em; margin: 14px 4px 6px; display: flex; justify-content: space-between; gap: 8px; }
.card .sec { color: var(--dim); margin: 10px 0 6px; }
.small { font-size: 13px; color: var(--dim); margin: 4px 0; }
.muted { color: var(--dim); }
h2 { margin: 0 0 4px; font-size: 18px; line-height: 1.2; }
.sit h2 { font-size: 17px; }
h3 { margin: 0 0 4px; font-size: 16px; }
p { margin: 6px 0; }

/* SITUACIÓN */
.sit { padding: 0; overflow: hidden; }
.escena { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 19px; background: var(--grad); }
.escena b { font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sit .in { padding: 10px 14px 12px; }
.datos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
.datos.dos { grid-template-columns: 1fr 1fr; }
.dato { background: var(--panel); border-radius: 10px; padding: 4px 6px; min-width: 0; }
.dato small { display: block; font-size: 11px; text-transform: none; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 800; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
.dato b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctx { margin: 8px 0 0; padding: 7px 10px; border-radius: 12px; background: #fff6dc; border: 2px solid var(--gold); font-weight: 800; font-size: 14px; }
.barra { height: 8px; background: var(--line); border-radius: 5px; overflow: hidden; margin-top: 6px; }
.barra i { display: block; height: 100%; background: var(--grad); border-radius: 5px; }
.barra.urg i { background: var(--amber); }
.prox { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; color: var(--dim); }
.prox b { color: var(--ink); }

/* DECISIÓN */
.dec h2 { display: flex; gap: 8px; align-items: center; }
.opt { display: block; width: 100%; text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 7px 12px; margin: 7px 0 0; cursor: pointer;
  box-shadow: 0 3px 0 var(--line); min-height: 48px; }
.opt:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt b { display: block; font-size: 16px; }
.opt .l { display: inline; font-size: 13px; color: var(--dim); margin-right: 8px; line-height: 1.5; }
.opt .ls { display: block; margin-top: 2px; }
.opt .l i { font-style: normal; font-weight: 800; }
.opt .v { color: var(--good); } .opt .c { color: #b7791f; } .opt .r { color: var(--bad); }
.opt:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
.opt .bl { display: block; font-size: 12px; font-weight: 800; color: var(--bad); margin-top: 2px; }
.opt.prin { border-color: var(--acc); background: var(--acc-soft); box-shadow: 0 3px 0 var(--acc-d); }
.evento { border: 3px solid var(--gold); }

/* CONSECUENCIA */
.lin { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.lin:last-child { border-bottom: 0; }
.lin .ic { flex: none; width: 22px; text-align: center; }
.lin.bien { color: #087a93; } .lin.mal { color: #b8203f; }
.resumen { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip { display: inline-flex; gap: 4px; align-items: center; background: var(--panel); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 800; }
.chip.bien { background: #dcf6fb; color: #087a93; } .chip.mal { background: #ffe5ec; color: #b8203f; }
details.por summary { font-size: 14px; color: var(--blue); cursor: pointer; padding: 8px 0 4px; font-weight: 800; min-height: 40px; display: flex; align-items: center; }
details.por p { font-size: 13px; color: var(--dim); }
.hito { background: linear-gradient(90deg, #fff1c0, #fffaf0); border: 2px solid var(--gold); border-radius: 12px; padding: 8px 10px; margin: 6px 0; font-size: 14px; }

/* Botones y formularios */
.btn { border: 0; border-radius: 14px; background: var(--grad); color: #fff; font-weight: 900; font-size: 15px; padding: 9px 14px; min-height: 44px; cursor: pointer; box-shadow: 0 4px 0 #3b2a9e; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #3b2a9e; }
.btn.g { background: var(--grad); color: var(--acc-txt); box-shadow: 0 4px 0 #3b2a9e; }
.btn.w { background: #efedfb; color: var(--ink); box-shadow: 0 4px 0 #cfcbe8; }
.btn.r { background: var(--bad); box-shadow: 0 4px 0 #a5203d; }
.btn.mini { min-height: 36px; padding: 4px 10px; font-size: 13px; flex: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.full { display: block; width: 100%; margin-top: 10px; min-height: 50px; font-size: 17px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 4px 0 8px; }
.seg button { min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-size: 14px; font-weight: 800; cursor: pointer; padding: 4px; box-shadow: 0 3px 0 var(--line); }
.seg button.sel { border-color: var(--acc); background: var(--acc-soft); box-shadow: 0 3px 0 var(--acc-d); }
.paso { display: flex; align-items: center; gap: 10px; }
.paso button { width: 48px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-size: 22px; font-weight: 900; cursor: pointer; }
.paso b { min-width: 30px; text-align: center; font-size: 18px; }
input[type=text], input[type=number], textarea { width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: #fff; }
textarea { min-height: 80px; font-family: ui-monospace, monospace; font-size: 12px; }
.fila { display: flex; gap: 8px; align-items: center; }
.fila > * { flex: 1; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 14px; border-bottom: 1px dashed var(--line); }
.kv:last-child { border-bottom: 0; }
.kv b { text-align: right; }
.prev { background: var(--panel); border-radius: 12px; padding: 8px 10px; font-size: 14px; margin-top: 6px; }

/* Tabla de liga */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { padding: 6px 4px; text-align: right; }
td:nth-child(2), th:nth-child(2) { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
th { font-size: 11px; color: var(--dim); text-transform: uppercase; }
tr.yo td { background: var(--acc-soft); font-weight: 900; }
tr.asc td:first-child { box-shadow: inset 4px 0 0 var(--good); }
tr.desc td:first-child { box-shadow: inset 4px 0 0 var(--bad); }

/* Navegación inferior */
nav#nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; z-index: 6;
  background: rgba(14,14,52,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid rgba(255,255,255,.12); border-radius: 22px 22px 0 0; padding: 6px 8px calc(var(--safe-bottom) + 6px); }
nav#nav .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
nav#nav:empty { display: none; }
nav#nav button { border: 0; background: none; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 12px; font-weight: 900; color: rgba(255,255,255,.65); cursor: pointer; border-radius: 12px; position: relative; }
nav#nav button span { font-size: 23px; }
nav#nav button.sel { color: #fff; background: var(--grad); box-shadow: 0 4px 14px rgba(61,123,255,.45); }
nav#nav button.g-carrera.sel { background: linear-gradient(135deg, #3d7bff, #2546b8); }
nav#nav button.g-vida.sel { background: linear-gradient(135deg, #ff7aa8, #ff4f8b); }
nav#nav button.g-imperio.sel { background: linear-gradient(135deg, #d94bff, #1fc7b6); }
nav#nav button.g-perfil.sel { background: linear-gradient(135deg, #8b5cf6, #ff9f2e); }
nav#nav button i { position: absolute; top: 4px; right: 12%; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }

/* Inicio */
.intro { text-align: center; padding-top: 30px; color: #fff; }
.intro h1 { font-size: 32px; margin: 10px 0 4px; background: linear-gradient(90deg, #fff, #ffc83d); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
.intro .card { text-align: left; color: var(--ink); }

.fin { text-align: center; }
.fin .big { font-size: 54px; }
pre { white-space: pre-wrap; font-size: 11px; background: var(--panel); padding: 8px; border-radius: 10px; max-height: 360px; overflow: auto; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.opt.mini { min-height: 40px; padding: 6px 12px; background: var(--panel); box-shadow: none; }
.opt.mini b { display: inline; font-size: 14px; }
.opt.mini .bl { display: inline; margin-left: 6px; }
.caminos { font-size: 13px; color: var(--dim); margin-top: 6px; line-height: 1.6; }
.caminos b { color: var(--ink); white-space: nowrap; }
.caminos .ok { color: var(--good); }

/* Botón de jugar la semana (como en P1) */
.jugar { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-bottom) + 74px); width: min(456px, calc(100% - 24px));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-height: 62px; border: 0; border-radius: 18px;
  background: linear-gradient(135deg, #3d7bff 0%, #6d5cff 55%, #a64bff 100%); color: var(--acc-txt); font-size: 22px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
  box-shadow: 0 6px 0 #33229a, 0 12px 26px rgba(80,60,255,.5); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.jugar small { font-size: 13px; letter-spacing: 0; text-transform: none; font-weight: 800; opacity: .95; }
.jugar:active:not(:disabled) { transform: translate(-50%, 4px); box-shadow: 0 2px 0 #33229a; }
.jugar:disabled { background: #5b5a86; box-shadow: 0 6px 0 #3b3a63; cursor: not-allowed; color: #fff; }
.opt.elegida { border-color: var(--acc); background: var(--acc-soft); box-shadow: 0 3px 0 var(--acc-d); }
.opt.elegida b::after { content: ' ✓'; color: var(--acc); }

/* Tu personaje */
.lookTop { display: flex; gap: 12px; align-items: center; }
.lookPrev { width: 118px; flex: none; background: var(--panel); border-radius: 16px; padding: 6px; }
.lookPrev svg { width: 100%; height: auto; display: block; }
.lookInfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.lookTabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
.lookTabs::-webkit-scrollbar { display: none; }
.lookTabs button { flex: none; border: 2px solid var(--line); background: #fff; border-radius: 12px; min-height: 44px; padding: 4px 10px; font-size: 13px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 4px; }
.lookTabs button.sel { border-color: var(--acc); background: var(--acc-soft); box-shadow: 0 3px 0 var(--acc-d); }
.lookGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
.lk { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.lk svg { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--panel); }
.lk b { font-size: 11px; line-height: 1.15; text-align: center; overflow-wrap: anywhere; }
.lk span { font-size: 10px; color: var(--dim); text-align: center; }
.lk.sel { border-color: var(--acc); background: var(--acc-soft); box-shadow: 0 3px 0 var(--acc-d); }
.lk:disabled { opacity: .5; cursor: not-allowed; }
@media (max-width: 360px) { .lookGrid { grid-template-columns: repeat(3, 1fr); } }

.card.fiesta { background: linear-gradient(160deg, #fff1c0, #ffffff 60%); border-color: var(--gold); }
.card.fiesta h2 { font-size: 22px; }
.opt .ocupa { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 800; color: #6b4d00; background: #fff1c2; border-radius: 999px; padding: 1px 8px; }
nav#nav button em { position: absolute; top: 1px; right: 4px; font-style: normal; font-size: 9px; font-weight: 900; background: var(--bad); color: #fff; border-radius: 999px; padding: 0 5px; }
.hito.desb { background: linear-gradient(90deg, #ece6ff, #f7f5ff); border-color: var(--acc2); }

/* P2.2: tres variables, informe de prueba, opciones compactas */
.tres { display: grid; gap: 8px; margin: 8px 0; }
.tres > div { background: var(--panel); border-radius: 10px; padding: 6px 10px; }
.tres b { font-size: 14px; }
.tres span { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; }
.tres .barra { margin-top: 4px; }
.opt.compacta { padding: 6px 12px; min-height: 44px; }
.opt.compacta b { font-size: 15px; }
details.mas summary { color: var(--dim); min-height: 36px; font-size: 13px; }
.preg { display: block; font-size: 14px; font-weight: 800; margin-top: 12px; }
.seg.diez { grid-template-columns: repeat(10, 1fr); gap: 3px; }
.seg.diez button { min-height: 40px; padding: 0; font-size: 13px; }
.chipsel { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chipsel button { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; min-height: 40px; font-weight: 800; font-size: 13px; cursor: pointer; }
.chipsel button.sel { border-color: var(--acc); background: var(--acc-soft); }
textarea.respuesta { min-height: 52px; font-family: inherit; font-size: 15px; margin-top: 4px; }
#textoInforme { min-height: 220px; margin-top: 10px; }

/* ===== P2.3: juego móvil ===== */
/* Subpestañas del grupo (Carrera, Imperio, Perfil) */
.subtabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
.subtabs::-webkit-scrollbar { display: none; }
.subtabs button { flex: none; position: relative; border: 2px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); color: #fff; border-radius: 999px; min-height: 42px; padding: 4px 14px; font-weight: 900; font-size: 14px; cursor: pointer; }
.subtabs button.sel { background: #fff; color: var(--ink); border-color: #fff; box-shadow: 0 4px 0 rgba(20,10,70,.5); }
.subtabs button em { position: absolute; top: -6px; right: -4px; font-style: normal; font-size: 9px; font-weight: 900; background: var(--bad); color: #fff; border-radius: 999px; padding: 0 5px; }

/* Inicio: héroe en su escenario */
.hero { display: flex; gap: 10px; align-items: stretch; margin: 10px 0 0; padding: 8px; border-radius: 22px; color: #fff;
  background: linear-gradient(135deg, rgba(61,123,255,.35), rgba(139,92,246,.35)); border: 2px solid rgba(255,255,255,.16); box-shadow: 0 10px 26px rgba(5,5,30,.4); }
.hero.e-club { background: linear-gradient(135deg, rgba(61,123,255,.45), rgba(31,199,182,.25)); }
.hero.e-empresa { background: linear-gradient(135deg, rgba(31,199,182,.35), rgba(139,92,246,.35)); }
.hero.e-magnate { background: linear-gradient(135deg, rgba(255,200,61,.4), rgba(139,92,246,.35)); border-color: rgba(255,200,61,.5); }
.stage { width: 76px; flex: none; border-radius: 16px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center;
  background: radial-gradient(70% 40% at 50% 100%, rgba(255,255,255,.35), transparent 70%), linear-gradient(#5b7dff, #7a4fe0); }
.stage svg { width: 100%; height: auto; max-height: 112px; display: block; }
.heroInfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.heroInfo .etq { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,.75); }
.heroInfo .obj { font-size: 15px; line-height: 1.2; }
.heroInfo small { font-size: 11px; color: rgba(255,255,255,.75); font-weight: 800; }
.xp { height: 10px; border-radius: 6px; background: rgba(0,0,0,.35); overflow: hidden; margin-top: 3px; }
.xp i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #ffc83d, #ff9f2e); box-shadow: 0 0 10px rgba(255,200,61,.7); }
.saldo { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; font-weight: 900; font-size: 15px; }
.saldo span:last-child { color: rgba(255,255,255,.8); font-size: 13px; align-self: center; }

/* Accesos rápidos del inicio */
.accesos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
.acc { position: relative; border: 0; border-radius: 18px; min-height: 74px; color: #fff; font-weight: 900; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  box-shadow: 0 4px 0 rgba(20,10,70,.55); }
.acc span { font-size: 26px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
.acc.c-rel { background: linear-gradient(150deg, #ff7aa8, #ff4f8b 60%, #d6336f); }
.acc.c-tienda { background: linear-gradient(150deg, #ec86ff, #d94bff 60%, #a531d6); }
.acc.c-emp { background: linear-gradient(150deg, #5fe4d6, #1fc7b6 60%, #129a8c); }
.acc.c-dep { background: linear-gradient(150deg, #78a3ff, #3d7bff 60%, #2546b8); }
.acc.lock { background: rgba(255,255,255,.08); border: 2px dashed rgba(255,255,255,.25); box-shadow: none; color: rgba(255,255,255,.6); cursor: default; }
.acc em { position: absolute; top: -6px; right: -2px; font-style: normal; font-size: 9px; background: var(--gold); color: var(--ink); border-radius: 999px; padding: 1px 6px; }

/* Gran desbloqueo (NUEVO: EMPRESA) */
.card.mega { padding-top: 0; overflow: hidden; border: 3px solid var(--gold); background: linear-gradient(180deg, #fff, #fff8e4); }
.megaTop { position: relative; height: 96px; margin: 0 -14px 10px; background: linear-gradient(#0b1033, #2a1a78); overflow: hidden; }
.megaTop svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.megaTop span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 46px; filter: drop-shadow(0 0 18px rgba(255,200,61,.9)); animation: latido 1.4s ease-in-out infinite; }
.card.mega h2 { font-size: 24px; letter-spacing: .02em; }
@keyframes latido { 50% { transform: translate(-50%, -50%) scale(1.15); } }

/* Tienda */
.tiendaTop { border-top: 6px solid var(--c-tienda); }
.tiendaTop .fila > div:first-child { flex: 2; }
.saldoBox { flex: none !important; text-align: right; background: #1a1640; color: #fff; border-radius: 14px; padding: 6px 10px; }
.saldoBox small { display: block; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
.saldoBox b { font-size: 17px; white-space: nowrap; }
.cats { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cats button { flex: none; display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 72px; min-height: 58px; border-radius: 16px; border: 2px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); color: #fff; font-weight: 900; font-size: 11px; cursor: pointer; padding: 4px 6px; }
.cats button span { font-size: 22px; }
.cats button.sel { background: linear-gradient(150deg, #ec86ff, #d94bff); border-color: #fff; box-shadow: 0 4px 0 #7a1fa0; }
.prods { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.prod { position: relative; text-align: left; border: 0; border-radius: 18px; background: #fff; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-height: 150px; box-shadow: 0 5px 0 rgba(20,10,70,.45); }
.prod .pic { font-size: 34px; width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: linear-gradient(150deg, #f6e3ff, #ead9ff); }
.prod b { font-size: 14px; line-height: 1.15; }
.prod .pd { font-size: 11px; color: var(--dim); line-height: 1.25; }
.prod .precio { margin-top: auto; align-self: flex-start; font-weight: 900; font-size: 14px; color: #6b4a00; background: linear-gradient(90deg, #ffe08a, #ffc83d); border-radius: 999px; padding: 2px 10px; }
.prod .bl { font-size: 11px; font-weight: 800; color: var(--bad); }
.prod:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(20,10,70,.45); }
.prod.conf { outline: 3px solid var(--gold); }
.prod.conf .precio { background: var(--grad); color: #fff; }
.prod.tuyo { background: linear-gradient(160deg, #ffffff, #efe6ff); cursor: default; }
.prod.tuyo .precio { background: var(--c-tienda); color: #fff; }
.prod.bloq { cursor: not-allowed; }
.prod.bloq .pic { filter: grayscale(.8); opacity: .6; }
.prod.bloq .precio { background: #eceaf6; color: var(--dim); }
.cosas { border-top: 6px solid var(--c-tienda); }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.slot { background: var(--panel); border-radius: 14px; padding: 6px 4px; text-align: center; min-width: 0; }
.slot .sic { display: block; font-size: 26px; }
.slot small { display: block; font-size: 10px; font-weight: 900; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
.slot b { display: block; font-size: 11px; line-height: 1.15; overflow-wrap: anywhere; }
.slot.vacio .sic { opacity: .35; }
.coleccion { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.cosas .kv { align-items: center; }

/* ¡Nueva compra! */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(8,8,30,.72); display: flex; align-items: center; justify-content: center; padding: 20px; animation: aparece .2s ease-out; }
.compraOk { position: relative; overflow: hidden; width: min(360px, 100%); text-align: center; background: linear-gradient(180deg, #2a1a78, #0b1033); color: #fff; border-radius: 26px; padding: 22px 18px 18px; border: 3px solid var(--gold); box-shadow: 0 0 40px rgba(255,200,61,.45); }
.compraOk small { position: relative; font-weight: 900; letter-spacing: .12em; color: var(--gold); font-size: 14px; }
.compraOk .bigic { position: relative; font-size: 84px; line-height: 1.1; margin: 8px 0 2px; animation: salta .6s cubic-bezier(.2,1.6,.4,1); }
.compraOk h2 { position: relative; font-size: 22px; }
.compraOk p { position: relative; color: rgba(255,255,255,.85); font-size: 14px; }
.compraOk .rayos { position: absolute; left: 50%; top: 40%; width: 520px; height: 520px; margin: -260px 0 0 -260px; background: repeating-conic-gradient(rgba(255,200,61,.16) 0 10deg, transparent 10deg 20deg); animation: gira 12s linear infinite; }
.compraOk .btn { position: relative; }
@keyframes aparece { from { opacity: 0; } }
@keyframes salta { from { transform: scale(.2); } }
@keyframes gira { to { transform: rotate(360deg); } }

/* Relaciones */
.relTop { border-top: 6px solid var(--c-rel); }
.pers { display: flex; gap: 12px; align-items: center; background: #fff; border-radius: 20px; padding: 10px 12px; margin: 8px 0; box-shadow: 0 5px 0 rgba(20,10,70,.45); border-left: 6px solid var(--c-rel); }
.pava { width: 64px; height: 64px; flex: none; border-radius: 50%; overflow: hidden; background: #ffe1ec; border: 3px solid var(--c-rel); display: flex; align-items: center; justify-content: center; font-size: 30px; }
.pava svg { width: 100%; height: 100%; display: block; }
.pinfo { flex: 1; min-width: 0; }
.pinfo b { font-size: 15px; letter-spacing: .03em; }
.pinfo .rol { font-size: 13px; color: var(--dim); font-weight: 800; }
.corazon { font-size: 13px; color: var(--dim); margin-top: 2px; }
.corazon b { font-size: 17px; color: var(--c-rel); }
.barra.rel { margin-top: 3px; }
.barra.rel i { background: linear-gradient(90deg, #ff9abf, #ff4f8b); }
.pinfo .estado { display: block; font-size: 13px; font-weight: 800; margin-top: 3px; }
.pinfo .hist { display: block; font-size: 11px; color: var(--dim); margin-top: 2px; }
.pers.bloq { background: rgba(255,255,255,.1); box-shadow: none; border-left-color: rgba(255,255,255,.25); color: rgba(255,255,255,.75); }
.pers.bloq .pava { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); filter: grayscale(1); }
.pers.bloq .estado { color: rgba(255,255,255,.7); }

/* Patrimonio */
.patri { border-top: 6px solid var(--gold); }
.patri > small { font-size: 11px; font-weight: 900; letter-spacing: .1em; color: var(--dim); }
.patri .big { font-size: 34px; font-weight: 900; color: var(--gold-d); margin: 2px 0 6px; text-shadow: 0 2px 0 #ffe9a8; }

/* Colores por categoría en las tarjetas de cada sección */
.dec.evento { border: 3px solid var(--gold); }
.sit { border: 0; }

/* ===== P2.4: Monetization Lab (simulado), deseo, garaje, casa, historia ===== */
.lab { display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: .04em; background: #fff1c0; color: #6b4a00; border-radius: 999px; padding: 1px 8px; vertical-align: middle; }
.blanco { color: rgba(255,255,255,.8); margin: 0 4px 6px; }
.flash { position: sticky; top: 70px; z-index: 8; margin: 8px 0; padding: 10px 14px; border-radius: 14px; background: var(--grad); color: #fff; font-weight: 900; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
/* Escena: tu casa de fondo, tu personaje y tu vehículo */
.escenaCasa { position: relative; width: 100%; height: 100%; min-height: 108px; border-radius: 14px; overflow: hidden; }
.escenaCasa > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.escenaCasa .pj { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 62px; }
.escenaCasa .pj svg { width: 100%; height: auto; display: block; }
.escenaCasa .veh { position: absolute; right: -6px; bottom: 2px; width: 52px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.escenaCasa .veh svg { width: 100%; height: auto; display: block; }
.escenaCasa.grande { height: 170px; }
.escenaCasa.grande .pj { width: 90px; left: 40%; }
.escenaCasa.grande .veh { width: 120px; right: 6px; }
.stage { width: 96px; padding: 0; }
.perfilTop { padding: 0 0 6px; overflow: hidden; } .perfilTop h2 { padding: 8px 14px 0; }
.casaCard .escenaCasa { margin-bottom: 4px; }
/* Objetivo personal */
.deseoBar { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; margin: 8px 0 0; padding: 8px 12px; border-radius: 18px; border: 2px solid rgba(255,79,139,.6); background: rgba(255,79,139,.14); color: #fff; cursor: pointer; }
.deseoBar .dic { font-size: 30px; }
.deseoBar .dtx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.deseoBar small { font-size: 11px; font-weight: 800; color: rgba(255,255,255,.8); }
.deseoBar .xp i { background: linear-gradient(90deg, #ff9abf, #ff4f8b); box-shadow: none; }
/* Productos: rareza, deseo, cupón */
.prod { cursor: default; }
.prod .rz { position: absolute; top: 8px; right: 38px; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: .05em; color: #fff; background: var(--rz); border-radius: 999px; padding: 1px 6px; }
.prod.rz-legendario { box-shadow: 0 5px 0 #8a5a00, 0 0 0 2px #ffc83d inset; }
.prod.rz-epico { box-shadow: 0 5px 0 #4a1f8a, 0 0 0 2px #c79bff inset; }
.prod .deseo { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: #fff; font-size: 18px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.prod .precio { border: 0; cursor: pointer; min-height: 36px; }
.prod .precio s { opacity: .6; font-weight: 700; }
.prod .precio:disabled { cursor: not-allowed; }
.prod.prox { opacity: .75; }
.rw { display: block; width: 100%; margin-top: 6px; border: 2px dashed #8b5cf6; background: #f3eeff; color: #4a1f8a; border-radius: 12px; padding: 6px 8px; font-size: 12px; font-weight: 900; cursor: pointer; text-align: left; min-height: 40px; }
.rw small { display: block; font-weight: 800; color: var(--dim); }
.rw:disabled { opacity: .6; cursor: not-allowed; }
.cuponOk { font-size: 11px; font-weight: 900; color: #a531d6; }
.prods.uno { grid-template-columns: 1fr; }
.ofertaEsp { display: flex; flex-direction: column; gap: 4px; border: 3px solid var(--gold); background: linear-gradient(160deg, #fff4cc, #fff); }
.colec .kv span .small { margin-left: 4px; }
/* Ofertas simuladas */
.iapCard { border: 3px solid #c79bff; background: linear-gradient(160deg, #f6efff, #fff 60%); }
.iapCard.rz-legendario { border-color: var(--gold); background: linear-gradient(160deg, #fff4cc, #fff 60%); }
.iapCard .mom { display: block; font-weight: 900; letter-spacing: .06em; color: #a531d6; margin-bottom: 4px; }
.iapCard .fila > div:last-child { flex: 3; }
.iapPrev { flex: none !important; width: 64px; height: 64px; border-radius: 50%; overflow: hidden; border: 3px solid var(--gold); background: #fff; }
.iapPrev svg { width: 100%; height: 100%; display: block; }
.iapPrev.grande { width: 120px; height: auto; border-radius: 18px; margin: 6px auto; background: var(--panel); }
.iapBtn .lab { margin-left: 6px; }
.modal { position: relative; width: min(380px, 100%); max-height: 90vh; overflow: auto; background: #fff; border-radius: 24px; padding: 18px 16px 16px; text-align: center; border: 3px solid #c79bff; box-shadow: 0 0 40px rgba(139,92,246,.45); }
.modal h2 { font-size: 21px; margin: 6px 0; }
.modal .recompensa { background: var(--panel); border-radius: 14px; padding: 10px; margin: 10px 0; }
.modal .recompensa small { display: block; color: var(--dim); font-weight: 800; }
.modal .precioGrande { font-size: 40px; font-weight: 900; color: var(--gold-d); }
.modal ul.cont { text-align: left; margin: 6px 0; padding-left: 18px; font-size: 14px; }
.seg.tres3 { grid-template-columns: 1fr 1fr 1.4fr; }
/* Recompensas en el inicio */
.premioT { border: 3px solid var(--gold); background: linear-gradient(160deg, #fff4cc, #fff 60%); }
.rwCard { border: 2px dashed #8b5cf6; }
/* Garaje */
.vehC { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.vehC:last-of-type { border-bottom: 0; }
.vehC .vsvg { width: 96px; flex: none; background: linear-gradient(#eef2ff, #dfe4ff); border-radius: 12px; padding: 4px; }
.vehC .vsvg svg { width: 100%; height: auto; display: block; }
.vehC > div:last-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.vehC.act .vsvg { outline: 3px solid var(--acc); }
/* Mi historia */
.trofeos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.trofeos > div { background: linear-gradient(160deg, #fff4cc, #fff); border: 2px solid #ffe08a; border-radius: 14px; padding: 6px 2px; text-align: center; min-width: 0; }
.trofeos span { display: block; font-size: 22px; } .trofeos b { display: block; font-size: 14px; overflow-wrap: anywhere; } .trofeos small { display: block; font-size: 10px; color: var(--dim); font-weight: 800; line-height: 1.1; }

/* Inversiones desbloqueables */
.invHead { border-top: 6px solid var(--c-emp); }
.inv { background: #fff; border-radius: 20px; padding: 12px 14px; margin: 8px 0; box-shadow: 0 5px 0 rgba(20,10,70,.45); border-left: 6px solid var(--c-emp); }
.invTop { display: flex; gap: 10px; align-items: center; }
.invIc { width: 52px; height: 52px; flex: none; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; background: linear-gradient(150deg, #d8fbf7, #b4efe8); }
.invTop b { display: block; font-size: 16px; line-height: 1.2; }
.inv .chip { margin-top: 3px; }
.inv.tuya .chip { background: #dcf6fb; color: #087a93; }
.inv.disp { border-left-color: var(--gold); box-shadow: 0 5px 0 rgba(20,10,70,.45), 0 0 0 2px var(--gold) inset; }
.inv.disp .chip { background: #fff1c0; color: #6b4a00; }
.inv.bloq .invIc { filter: grayscale(.7); opacity: .7; }
.inv.iotra, .inv.iprox { background: rgba(255,255,255,.1); box-shadow: none; border-left-color: rgba(255,255,255,.25); color: rgba(255,255,255,.8); }
.inv.iotra .small, .inv.iprox .small { color: rgba(255,255,255,.65); }
.inv.iotra .invIc, .inv.iprox .invIc { background: rgba(255,255,255,.1); filter: grayscale(1); }
.inv.iotra .chip, .inv.iprox .chip { background: rgba(255,255,255,.15); color: #fff; }
.inv.iprox .kv { border-color: rgba(255,255,255,.15); }
.reqs { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; font-size: 13px; color: var(--dim); }
.reqs .ok { color: #087a93; font-weight: 800; }

/* Editor del personaje: grupos (Cara, Pelo, Cuerpo, Ropa, Extras) y capas de cada grupo */
.lookGrupos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 10px; }
.lookGrupos button { border: 2px solid var(--line); background: var(--panel); border-radius: 12px; min-height: 48px; padding: 2px; font-size: 12px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0; color: var(--ink); }
.lookGrupos button span { font-size: 18px; }
.lookGrupos button.sel { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 3px 0 #3b2a9e; }

/* =====================================================================
   P2.5 · TEMA CLARO Y BUCLE DE PASAR PANTALLAS (sobrescribe lo anterior)
   Cielo de día, tarjetas blancas, botones grandes de colores con relieve.
   ===================================================================== */
:root {
  --bg1: #dff0ff; --bg2: #f4ecff; --ink: #1d1a3a; --dim: #6f6b8f; --line: #e6e3f5; --panel: #f4f2fd; --card: #ffffff;
  --azul: #2f7bff; --azul-d: #1d55c9; --rosa: #ff4f8b; --rosa-d: #c92d63; --naranja: #ff9a2e; --naranja-d: #c96d10;
  --turquesa: #12bfae; --turquesa-d: #0b8a7e; --violeta: #8b5cf6; --violeta-d: #5f35c9; --oro2: #ffc22e; --oro2-d: #c88c00;
  --f: "Nunito", ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
html, body { background: var(--bg2); color: var(--ink); }
body { background: linear-gradient(180deg, var(--bg1), var(--bg2)) fixed; }
#decor, nav#nav { display: none !important; }
main { padding: 0 16px calc(var(--safe-bottom) + 28px); }
.card { box-shadow: 0 4px 0 #e2dcf7, 0 6px 18px rgba(40,30,120,.06); }
.sec, .card .sec { color: var(--dim); }
.blanco { color: var(--dim); }
.intro { color: var(--ink); }
.intro h1 { background: linear-gradient(90deg, #5f35c9, #2f7bff); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Barra superior */
#top { flex-wrap: wrap; color: var(--ink); background: linear-gradient(rgba(223,240,255,.95), rgba(223,240,255,.8)); padding: calc(var(--safe-top) + 10px) 16px 8px; gap: 8px 10px; }
.hava { width: 46px; height: 46px; border: 3px solid #fff; box-shadow: 0 3px 10px rgba(40,30,120,.18); background: #bfe0ff; }
.hwho b { font-size: 18px; }
.hwho span { color: var(--dim); font-weight: 800; }
.dinero { background: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 900; font-size: 17px; box-shadow: 0 3px 10px rgba(40,30,120,.12); white-space: nowrap; }
.dinero b { color: #c88c00; }
.ener { flex-basis: 100%; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 900; color: var(--dim); }
.ener .bar { flex: 1; height: 10px; border-radius: 6px; background: #e6e3f5; overflow: hidden; }
.ener .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd34d, #ff9a2e); border-radius: 6px; }
.atras { background: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 900; font-size: 15px; color: var(--violeta-d); box-shadow: 0 3px 10px rgba(40,30,120,.12); min-height: 40px; cursor: pointer; border: 0; }

.pant { display: grid; gap: 14px; padding-top: 6px; animation: entra .35s cubic-bezier(.2,1.2,.4,1); }
@keyframes entra { from { opacity: 0; transform: translateY(16px) scale(.98); } }
.pant h1 { font-size: 25px; font-weight: 900; margin: 4px 0 0; text-wrap: balance; }

/* Escenario exterior por etapa */
.exterior { position: relative; height: 180px; border-radius: 26px; overflow: hidden; background: linear-gradient(180deg, #a9d6ff 0%, #cfe6ff 62%, #8fd0a8 62.5%, #7cc596 100%); }
.exterior.e-club { background: linear-gradient(180deg, #8fc4ff 0%, #c4dcff 55%, #5fb878 55.5%, #4fa968 100%); }
.exterior.e-empresa { background: linear-gradient(180deg, #ffd6a8 0%, #ffe9d2 62%, #b9c3d8 62.5%, #a7b2c9 100%); }
.exterior.e-magnate { background: linear-gradient(180deg, #ffe08a 0%, #fff1c9 62%, #d6c08a 62.5%, #c9b073 100%); }
.exterior .sol { position: absolute; right: 22px; top: 16px; width: 36px; height: 36px; border-radius: 50%; background: #ffe066; box-shadow: 0 0 0 10px rgba(255,224,102,.35); }
.exterior .edif { position: absolute; bottom: 38%; width: 44px; border-radius: 6px 6px 0 0; background: #fff; opacity: .75; }
.exterior .grada { position: absolute; left: 0; right: 0; bottom: 45%; height: 40px; background: repeating-linear-gradient(90deg, #ffffff 0 10px, #e9eefc 10px 20px); opacity: .8; }
.exterior .foco { position: absolute; top: 8px; width: 16px; height: 50px; border-radius: 4px; background: #fff; box-shadow: 0 0 22px 8px rgba(255,255,255,.8); }
.exterior .foco.f1 { left: 18px; } .exterior .foco.f2 { left: 64px; }
.exterior .pj { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); width: 98px; animation: bota 2.4s ease-in-out infinite; }

/* Objetivo */

.op.naranja { background: var(--naranja); box-shadow: 0 6px 0 var(--naranja-d); }
.op.rosa { background: var(--rosa); box-shadow: 0 6px 0 var(--rosa-d); }
.op.turquesa { background: var(--turquesa); box-shadow: 0 6px 0 var(--turquesa-d); }

.masOps { justify-self: center; background: none; border: 0; color: var(--dim); font-weight: 900; font-size: 15px; padding: 8px 12px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 40px; }

/* Botón grande que late */

/* Resultado */
.res { text-align: center; min-height: calc(100vh - 140px); align-content: center; }

.cambios { display: grid; gap: 8px; }
.cam { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff; border-radius: 18px; padding: 12px 16px; font-weight: 900; font-size: 17px; box-shadow: 0 4px 0 #e2dcf7; }
.cam .v { font-size: 20px; white-space: nowrap; }

.marcador { background: #fff; border-radius: 22px; padding: 12px; box-shadow: 0 4px 0 #e2dcf7; display: grid; gap: 4px; border: 3px solid #e2dcf7; }

.lineasRes { background: #fff; border-radius: 18px; padding: 6px 12px; text-align: left; box-shadow: 0 4px 0 #e2dcf7; }

/* Situación */
.sit { background: #fff; border-radius: 26px; padding: 18px 16px; box-shadow: 0 6px 0 #e2dcf7; display: grid; gap: 10px; text-align: center; overflow: hidden; }
.sit.dorada { border: 3px solid var(--oro2); background: linear-gradient(180deg, #fff6d6, #fff 40%); }
.sit .quien { width: 92px; height: 92px; border-radius: 50%; overflow: hidden; margin: 0 auto; border: 4px solid var(--rosa); background: #ffe1ec; }
.sit .quien svg { width: 100%; height: 100%; display: block; }
.sit h2 { margin: 0; font-size: 23px; font-weight: 900; text-wrap: balance; }
.sit > p { margin: 0; color: var(--dim); font-weight: 800; }

.resp b { font-size: 18px; }
.resp .l { display: block; font-size: 13px; color: var(--dim); font-weight: 700; }
.resp .l i { font-style: normal; font-weight: 900; } .resp .v { color: #0b8a7e; } .resp .c { color: #b7791f; } .resp .r { color: #d1355f; }

.sit.mega { padding-top: 0; } .sit .megaTop { margin: 0 -16px 6px; }

/* Celebración */
.fiesta { text-align: center; min-height: calc(100vh - 140px); align-content: center; position: relative; }
.fiesta .rayos { position: absolute; left: 50%; top: 14%; width: 420px; height: 420px; margin-left: -210px; background: repeating-conic-gradient(rgba(255,194,46,.25) 0 10deg, transparent 10deg 20deg); border-radius: 50%; z-index: -1; animation: gira 14s linear infinite; }
.fiesta h2 { font-size: 30px; font-weight: 900; margin: 0; text-wrap: balance; }

.fiesta .eti { font-weight: 900; letter-spacing: .1em; color: #c88c00; }
.confeti { position: fixed; top: -12px; width: 10px; height: 14px; border-radius: 3px; z-index: 30; animation: cae linear forwards; pointer-events: none; }

/* Mi mundo */
.mundoBtn { position: sticky; bottom: calc(var(--safe-bottom) + 12px); justify-self: center; display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 900; font-size: 16px; box-shadow: 0 6px 18px rgba(40,30,120,.2); cursor: pointer; z-index: 4; min-height: 48px; }

.hoja { width: 100%; max-width: 480px; background: #fff; border-radius: 28px 28px 0 0; padding: 10px 16px calc(var(--safe-bottom) + 20px); animation: sube .3s cubic-bezier(.2,1.2,.4,1); max-height: 90vh; overflow: auto; }

.hoja .asa { width: 44px; height: 5px; border-radius: 3px; background: #dcd8ee; margin: 0 auto 12px; }

.iconos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; }

/* Secciones en claro (antes pensadas para fondo oscuro) */

/* «Mi mundo» en la barra de arriba: nunca tapa nada */

.cele .rayos { position: absolute; left: 50%; top: 10%; width: 460px; height: 460px; margin-left: -230px; background: repeating-conic-gradient(rgba(255,194,46,.22) 0 10deg, transparent 10deg 20deg); border-radius: 50%; z-index: -1; animation: gira 14s linear infinite; }

        const ops = [

  // Tienda (gasto opcional): «gasta» compra lo que le apetece guardando un colchón; «caprichos» casi sin colchón y a lo grande
  const CONSUMO = { ahorra: null, gasta: { reserva: 1500, parte: 0.35 }, caprichos: { reserva: 400, parte: 0.8 } };
  function comprarBot(s, B, log) {
    const C = CONSUMO[B.consumo || 'ahorra']; if (!C) return;

    // Lo más caro que pueda permitirse (y que no tenga ya); los consumibles también
    const l = P2.PRODUCTOS.filter(P => !P2.bloqueoProducto(s, P) && P.precio > 0 && P.precio <= libre).sort((a, b) => b.precio - a.precio);
    if (l.length && P2.comprar(s, l[0].id)) { log.compras += l[0].precio; log.nCompras++; }
  }
  // Anuncios con recompensa simulados (P2.4): «moderado» usa alguno; «maximo» todo lo que el límite permite
  function rewardedBot(s, B, log) {

    }

  // Extras del inicio: recompensa de temporada, energía patrocinada y oferta (simulada) en un buen momento

        ${tp.extra ? '<p class="small">✅ También tienes las 🕶️ Gafas edición temporada.</p>' : `${rwBtn(s, 'temporada', {}, 'Consigue también: 🕶️ Gafas edición temporada')}<p class="small">Solo estética: no dan estadísticas.</p>`}

  function rwBtn(s, tipo, data, texto) {

  // ---------- SITUACIÓN ----------
  function htmlSituacion(s) {
    const P = s.p, K = CFG.captacion;

      const quedan = P2.semanasCaptacion(s);

      datos = dato('Nivel', nf(P.nivel)) + dato('Energía', Math.round(P.energia)) + dato('Reputación', `${Math.floor(P.rep)}/${K.repOjeador}`) + dato('Ahorros', eur(P.dinero));

        dato('Confianza', `${Math.round(s.confianza)}`) + dato('Titular', pt ? pt.nivel.replace('nula', 'no juegas') : '—');

  const htmlDesbloqueo = x => `<div class="hito desb">🔓 <b>Nueva sección: ${x.ic} ${esc(x.n)}</b><br>${esc(x.d || '')} La tienes abajo, en «${esc((P2.GRUPOS.find(g => g.id === x.grupo) || { n: 'Inicio' }).n)}».</div>`;

  // ---------- Vistas ----------
  function htmlLiga(s) {

  function htmlEmpresa(s) {

      const media = Math.round(T.historialVendedor.reduce((a, b) => a + b, 0) / T.historialVendedor.length);
      h += `<div class="card"><h2>${T.ic} Peluquería en traspaso</h2><p>Barrio de ${esc(s.ciudad)}. El dueño se jubila y el negocio va justo: casi no gana. Bien llevada puede dar mucho más.</p>
        ${kv('Traspaso', eur(T.traspaso))}${kv('Beneficio de las últimas semanas', `~${eur(media)}/semana`)}${kv('Cómo la deja', `${T.configInicial.empleados} empleados, sueldos bajos, precios baratos · alquiler ${eur(T.alquiler)}/semana`)}

        `${kv('Vale ahora', eur(p.valor))}${kv('Has puesto', eur(p.aportado))}${kv('Dividendos cobrados', eur(p.dividendos))}${kv('Cómo va', `${E.ic || ''} ${esc(E.n || '—')}`)}${kv('Próximas noticias', `semana ${p.proximo}`)}
        <p class="small">No la gestionas. Cada ${P2.SOCIO.trimestre} semanas llega el resultado: puede haber dividendo, no haberlo, perder valor o pedirte más capital.</p>`}</div>`; }
    return h;
  }
  function htmlNegocio(s, n) {

      <div class="sec">Publicidad</div>${seg('marketing', T.marketing)}

      <details class="por"><summary>❓ ¿Cómo se calcula?</summary><p>Demanda = ${T.demandaBase} × (0,4 + fama/100) × precio × publicidad × contexto × tu fama de futbolista. Atiendes como mucho la capacidad (empleados × ${T.capacidadEmpleado}). Coste: alquiler, fijos, sueldos, publicidad y material. La fama del negocio va hacia la calidad real: cobrar caro con sueldos bajos acaba hundiéndola; las colas también.</p>
        <p>Valor = beneficio medio de las últimas ${CFG.empresa.valoracion.semanasMedia} semanas × ${CFG.empresa.valoracion.multiplo} + caja + fama × ${CFG.empresa.valoracion.porFama} − deuda.</p></details>
      <div class="sec">Dinero entre tu cuenta y la caja</div>
      <div class="fila"><input type="number" inputmode="numeric" min="0" step="100" id="imp_${n.id}" placeholder="Importe (€)"></div>

      ${n.deuda ? `<p class="small">🏦 Préstamo: debes ${eur(n.deuda)} (cuota ${eur(n.cuota)}/semana).</p>` : ''}
      ${n.local ? `<p class="small">🏢 Local propio: vale ${eur(n.valorLocal)}${n.hipoteca && n.hipoteca.deuda ? ` · hipoteca pendiente ${eur(n.hipoteca.deuda)} (${eur(n.hipoteca.cuota)}/semana + intereses)` : ''}.</p>` : n.fianza ? `<p class="small">🔑 Fianza del local: ${eur(n.fianza)} (se recupera al vender).</p>` : ''}
      ${n.mejoraInicial && n.mejoraInicial !== 'nada' ? `<p class="small">✨ Mejora inicial: ${esc((P2.tipoDe(n).mejorasIniciales.find(m => m.id === n.mejoraInicial) || {}).n || '')}.</p>` : ''}
      ${rent ? `<div class="fila" style="margin-top:8px">${!n.deuda ? `<button class="btn w" data-act="prestamo" data-neg="${n.id}">🏦 Pedir ${eur(CFG.empresa.prestamo.importe)}</button>` : ''}<button class="btn r" data-act="vender" data-neg="${n.id}">${ui.vender === n.id ? '⚠️ Toca otra vez para vender' : `🤝 Vender por ${eur(v)}`}</button></div>` : '<p class="small">🔒 Financiación y venta: al mantenerla rentable 6 semanas seguidas.</p>'}

  // Las tres variables: nivel (cómo juegas), reputación deportiva (cómo te ve el fútbol), marca personal (cómo te ven las marcas)
  function htmlTresVariables(s) {

  // ---------- 🛍️ TIENDA ----------
  const SLOTS = [['vehiculo', '🚗', 'Vehículo'], ['vivienda', '🏠', 'Vivienda'], ['movil', '📱', 'Móvil'], ['calzado', '👟', 'Calzado']];

    const E = P.ef || {}, l = [];

        ${!tuyo && P2.MONETIZATION.activa && !P.proximamente && !P.consumible && P.precio >= P2.MONETIZATION.rewarded.cupon.precioMin && pv === P.precio && !(P.req && P.req.hito && !s.hitos[P.req.hito]) ? rwBtn(s, 'cupon', { id: P.id }, `Cupón −${Math.round(P2.MONETIZATION.rewarded.cupon.pct * 100)} % · ahorras ${eur(P2.descuentoCupon(P.precio))}`) : ''}

    };
    return `<div class="card tiendaTop"><div class="fila"><div><h2>🛍️ Tienda</h2><p class="small">Disfruta lo que ganas. Nada es obligatorio para competir; algunos objetos ayudan un poco. Toca 🤍 para marcar tu objetivo.</p></div>

  function htmlOfertaEspecial(s, tile) {

  // Escaparate «Estilo premium» dentro de la Tienda (variante C del test): lleva a la ficha de Premium
  function htmlPremiumTienda(s) {
    if (!P2.MONETIZATION.activa) return '';

  // Tus cosas: lo que llevas puesto en cada hueco y tu colección
  function htmlCosas(s) {
    const inv = s.inventario || [];

    const vender = it => { const P = P2.producto(it.id); return P.patrimonial ? `<button class="btn w mini" data-act="venderP" data-id="${it.uid}">${ui.venderP === it.uid ? '⚠️ Toca otra vez' : `Vender ${eur(it.valorActual)}`}</button>` : ''; };

      ${inv.filter(it => P2.producto(it.id).patrimonial).map(it => { const P = P2.producto(it.id); return `<div class="kv"><span>${P.ic} ${esc(P.n)} <span class="small">compra ${esc(eur(it.precioCompra))}</span></span>${vender(it)}</div>`; }).join('')}

      ${inv.length ? '' : '<p class="small">Aún no te has comprado nada. Vives en casa de tus padres y vas andando a todas partes.</p>'}</div>`;

  function htmlRw(s) {

  // ---------- ❤️ RELACIONES ----------
  const caraDe = R => P2.avatarSVG({ p: { energia: 80 }, hitos: {} }, Object.assign({}, P2.LOOK_INICIAL, R.look || {}), 'busto');
  function htmlRelaciones(s) {

  // =====================================================================
  //  BUCLE PRINCIPAL (P2.5): pasar pantallas. Semana → Resultado → (Situación / Celebración) → Semana
  //  Un botón grande por pantalla. Lo demás está en «Mi mundo», solo si quieres.
  // =====================================================================
  const COLORES_OP = ['azul', 'naranja', 'rosa', 'turquesa', 'violeta'];
  // Lo que da cada acción, a la vista (vista previa sobre una copia: no toca la partida ni su azar)
  const EXTRA_OP = { jornada: '📋 Prueba si tu nivel llega (≈50)', torneo: '🏆 Si ganas: invitación', campus: '📋 Te proponen para las pruebas', preparador: '📋 +3 en la prueba',
    gestionar: '💼 Tu empresa rinde más', prensa: '📣 Más marca personal', entrenoExtra: '👔 Le gusta al míster' };
  function previaAccion(s, id) {
    const una = rng => {
      const c = JSON.parse(JSON.stringify(Object.assign({}, s, { tele: null, diario: [] }))); if (rng != null) c.rng = rng;
      const a = { dinero: c.p.dinero, energia: c.p.energia, nivel: c.p.nivel, rep: c.p.rep, marca: c.p.marca || 0 };
      try { P2.aplicarAccionSemana(c, id, { lineas: [], porque: [], ingresos: [], hitos: [], desbloqueos: [] }); } catch (_) { return null; }
      return { dinero: c.p.dinero - a.dinero, energia: c.p.energia - a.energia, nivel: c.p.nivel - a.nivel, rep: c.p.rep - a.rep, marca: (c.p.marca || 0) - a.marca };
    };
    const x = una(null), y = una((s.rng ^ 0x5bd1e995) >>> 0);
    if (!x) return { d: {}, aprox: false };
    return { d: x, aprox: !!y && ['nivel', 'rep', 'marca', 'dinero'].some(k => Math.abs(x[k] - y[k]) > 0.05) };
  }
  const ETQ = { nivel: '💪', rep: '⭐', marca: '📣', dinero: '💶', energia: '⚡', confianza: '👔' };
  function chipsAccion(s, id) {
    const { d, aprox } = previaAccion(s, id), l = [];
    for (const k of ['nivel', 'rep', 'marca', 'dinero', 'energia']) {
      const v = d[k]; if (!v || Math.abs(v) < 0.05) continue;
      l.push(`<span class="chip">${ETQ[k]} ${aprox && k !== 'energia' ? '≈' : ''}${v > 0 ? '+' : '−'}${k === 'dinero' ? eur(Math.abs(v)) : nf(Math.round(Math.abs(v) * 10) / 10)}</span>`);
    }
    if (EXTRA_OP[id]) l.push(`<span class="chip">${esc(EXTRA_OP[id])}</span>`);
    return l.join('');
  }
  // Orden de las opciones: lo especial de la semana primero, después lo básico de tu fase
  const PRIORIDAD = ['jornada', 'torneo', 'campus', 'preparador', 'entrenar', 'entrenoExtra', 'plaza', 'prensa', 'gestionar', 'trabajar', 'mediaJornada', 'descansar'];
  function opcionesSemana(s) {
    const l = P2.accionesDisponibles(s).sort((a, b) => PRIORIDAD.indexOf(a.id) - PRIORIDAD.indexOf(b.id));
    const libres = l.filter(x => !x.bloqueo), bloq = l.filter(x => x.bloqueo);
    let top = libres.slice(0, 3);
    if (s.p.energia < 45 && !top.some(x => x.id === 'descansar')) { const d = libres.find(x => x.id === 'descansar'); if (d) top = top.slice(0, 2).concat(d); }
    return { top, resto: libres.filter(x => !top.includes(x)), bloq };
  }
  function tarjetaOp(s, x, i) {
    const v = P2.varianteSemana(s, x.id), dest = P2.destacadaSemana(s) === x.id;
    return `<button class="op ${COLORES_OP[i % COLORES_OP.length]} ${dest ? 'dest' : ''}" data-act="jugarYa" data-id="${x.id}">${dest ? '<span class="fuego">🔥 Esta semana rinde +20 %</span>' : ''}<span class="ic">${v ? v.ic : x.A.ic}</span><span class="tx"><b>${esc(v ? v.n : x.A.n)}</b>${v && v.d ? `<small>${esc(v.d)}</small>` : ''}<span class="chips">${chipsAccion(s, x.id)}</span></span><span class="go" aria-hidden="true">›</span></button>`;
  }
  function escenaExterior(s) {
    const e = etapa(s), V = vehiculo(s);
    const edif = { barrio: [[14, 70], [66, 96], [null, 60, 72]], club: [], empresa: [[10, 110], [58, 140], [null, 120, 60], [null, 90, 14]], magnate: [[10, 120], [58, 150], [null, 130, 60], [null, 100, 14]] }[e] || [];
    return `<div class="exterior e-${e}"><span class="sol"></span>${e === 'club' ? '<span class="grada"></span><span class="foco f1"></span><span class="foco f2"></span>' : ''}
