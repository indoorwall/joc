<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Del barrio al negocio · P1</title>
<!--
  PROTOTIPO P1 (v0.5) — Simulador de vida de un futbolista: 10 pantallas, carrera, retirada, familia, negocios, casas con hipoteca, coches y clubes.
  Estilo «simulador de vida»: diario semanal, barras de estado, botón grande «+ Semana», menús y ventanas emergentes.
  No hay partidos controlables, física ni gráficos 3D: los partidos se simulan con reglas explicadas.
  Archivo autónomo: no carga nada de Internet. Sin anuncios, compras, cuentas ni servicios de IA.
  Clubes, ciudades y estadios ficticios generados al azar. Importes en euros, de juego y provisionales.

  ORGANIZACIÓN DEL CÓDIGO:
    1. CONFIGURACIÓN · 2. UTILIDADES · 3. MUNDO (clubes, calendario, clasificación) · 4. ESTADO
    5. REGLAS · 6. PLAN SEMANAL · 7. SEMANA (jornada, economía, prensa, mercado, fin de temporada)
    8. IMPREVISTOS · 9. EVENTOS · 10. BIENES (negocios, inmuebles, coches, clubes)
   11. VIDA (relaciones, actividades, felicidad, logros, diario) · 12. PANTALLAS · 13. HIPOTECAS, HIJOS Y RETIRADA
   14. INTERFAZ · GANCHOS DE PRUEBA
-->
<style>
  :root {
    --bg: #eef1f6; --card: #ffffff; --ink: #1f2937; --dim: #6b7280; --line: #e5e7eb;
    --blue: #2f80ed; --green: #27ae60; --green2: #2ecc71; --amber: #f2a93b; --red: #eb5757; --purple: #7b61ff; --gold: #f5b700;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.35; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
  button { font-family: inherit; color: inherit; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative; }

  /* Cabecera */
  #top { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
    padding: calc(var(--safe-top) + 8px) 12px 8px; display: flex; align-items: center; gap: 10px; }
  #top:empty { display: none; }
  .ava { width: 48px; height: 48px; border-radius: 50%; background: #fff4d6; display: grid; place-items: center; font-size: 30px; flex: none; border: 2px solid var(--gold); }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { display: block; font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bank { text-align: right; flex: none; }
  .bank b { display: block; color: var(--green); font-size: 18px; font-weight: 800; }
  .bank button { border: 0; background: none; font-size: 13px; color: var(--blue); padding: 2px 0 0; cursor: pointer; font-weight: 700; }

  /* Misión */
  .mision { position: sticky; top: calc(var(--safe-top) + 65px); z-index: 4; margin: 8px 10px 0; background: #fffbea; border: 1px solid #f6e3a1;
    border-radius: 14px; padding: 8px 12px; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.05); }
  .mision b { display: block; }
  .mision .pb { height: 6px; background: #f1e6bf; border-radius: 3px; overflow: hidden; margin-top: 5px; }
  .mision .pb i { display: block; height: 100%; background: var(--gold); }
  .mision p { margin: 4px 0 0; color: var(--dim); font-size: 13px; }

  /* Diario */
  main { padding: 6px 10px calc(var(--safe-bottom) + 220px); }
  .entry { background: var(--card); border-radius: 14px; padding: 10px 12px; margin: 8px 0; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .entry .eh { font-size: 12px; font-weight: 800; color: var(--blue); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .entry .el { display: flex; gap: 8px; padding: 3px 0; font-size: 15px; }
  .entry .el .i { flex: none; width: 22px; text-align: center; }
  .entry.now { border: 2px dashed #c7d2fe; background: #f8faff; }
  .res { display: inline-block; font-size: 11px; font-weight: 800; color: #fff; border-radius: 6px; padding: 1px 6px; margin-left: 4px; vertical-align: 1px; }
  .res.victoria { background: var(--green); } .res.empate { background: #9ca3af; } .res.derrota { background: var(--red); }
  details.por summary { font-size: 13px; color: var(--blue); cursor: pointer; padding-top: 4px; font-weight: 700; }
  details.por h4 { margin: 8px 0 2px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .rl { font-size: 13px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .rl:last-child { border-bottom: 0; }
  .rl .r { color: var(--dim); display: block; }
  .vacio { text-align: center; color: var(--dim); padding: 30px 10px; }

  /* Barra inferior: estados + acciones */
  #dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 6; width: 100%; max-width: 480px;
    background: var(--card); border-top: 1px solid var(--line); padding: 8px 10px calc(var(--safe-bottom) + 8px); box-shadow: 0 -4px 14px rgba(0,0,0,.06); }
  #dock:empty { display: none; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; margin-bottom: 8px; }
  .st { display: grid; grid-template-columns: 22px 1fr 34px; align-items: center; gap: 6px; font-size: 13px; }
  .st .b { height: 10px; background: #edf0f4; border-radius: 5px; overflow: hidden; }
  .st .b i { display: block; height: 100%; border-radius: 5px; transition: width .5s ease; }
  .st .v { text-align: right; font-weight: 700; color: var(--dim); font-variant-numeric: tabular-nums; }
  .plan { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: var(--dim); margin-bottom: 6px; border: 0; background: none; width: 100%; cursor: pointer; }
  .plan b { color: var(--ink); }
  .acts { display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: center; gap: 4px; }
  .ab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--dim);
    padding: 4px 0; cursor: pointer; min-height: 52px; justify-content: flex-end; }
  .ab span { font-size: 24px; line-height: 1; }
  .ab .dot { position: absolute; }
  .age { width: 72px; height: 72px; border-radius: 50%; border: 0; background: radial-gradient(circle at 30% 30%, #4ee08a, var(--green)); color: #fff;
    font-weight: 900; font-size: 15px; line-height: 1.05; box-shadow: 0 6px 14px rgba(39,174,96,.4); cursor: pointer; justify-self: center; }
  .age span { display: block; font-size: 30px; line-height: .9; }
  .age:active { transform: scale(.95); }
  .age:disabled { background: #c4c9d1; box-shadow: none; }

  /* Hojas (pantallas completas) */
  #hoja { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #hoja:empty { display: none; }
  .hh { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); display: flex; align-items: center;
    padding: calc(var(--safe-top) + 10px) 12px 10px; gap: 10px; max-width: 480px; margin: 0 auto; }
  .hh h2 { flex: 1; margin: 0; font-size: 19px; }
  .hh button { border: 0; background: #f1f3f6; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .hb { max-width: 480px; margin: 0 auto; padding: 10px 10px calc(var(--safe-bottom) + 30px); }
  .sec { font-size: 12px; font-weight: 800; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 16px 4px 6px; }
  .card { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .card h3 { margin: 0 0 4px; font-size: 18px; }
  .small { font-size: 13px; color: var(--dim); }
  .row { display: flex; align-items: center; gap: 10px; }
  .row .ic { font-size: 30px; width: 40px; text-align: center; flex: none; }
  .row .tx { flex: 1; min-width: 0; }
  .row .tx b { display: block; }
  .row .tx span { font-size: 13px; color: var(--dim); }
  .lista .row { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .lista .row:last-child { border-bottom: 0; }
  .btn { border: 0; border-radius: 12px; background: var(--blue); color: #fff; font-weight: 800; font-size: 15px; padding: 10px 14px; min-height: 44px; cursor: pointer; }
  .btn.g { background: var(--green); } .btn.r { background: var(--red); } .btn.w { background: #f1f3f6; color: var(--ink); }
  .btn.full { display: block; width: 100%; margin-top: 8px; min-height: 52px; font-size: 17px; }
  .btn:disabled { background: #d1d5db; color: #6b7280; cursor: not-allowed; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin: 6px 0; }
  .seg button { min-height: 46px; border-radius: 10px; border: 2px solid var(--line); background: #fff; font-size: 14px; font-weight: 700; cursor: pointer; padding: 4px; }
  .seg button.sel { border-color: var(--blue); background: #eaf2ff; color: var(--blue); }
  .seg button:disabled { opacity: .45; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: #f1f3f6; overflow-wrap: anywhere; }
  .chip.g { background: #dcf5e6; color: #166534; } .chip.b { background: #fde2e1; color: #991b1b; }
  .lock { font-size: 12px; color: var(--dim); margin-top: 3px; }
  .pbar { height: 8px; background: #edf0f4; border-radius: 4px; overflow: hidden; margin-top: 5px; }
  .pbar i { display: block; height: 100%; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 6px 2px; border-bottom: 1px solid var(--line); }
  td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; }
  tr.tot td { font-weight: 800; border-bottom: 0; }
  tr.hd td { font-size: 11px; color: var(--dim); font-weight: 800; text-transform: uppercase; }
  tr.yo td { background: #eaf2ff; font-weight: 800; }
  tr.ascenso td:first-child, tr.campeon td:first-child { box-shadow: inset 3px 0 0 var(--green); padding-left: 6px; }
  tr.descenso td:first-child { box-shadow: inset 3px 0 0 var(--red); padding-left: 6px; }
  .dotc { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 3px solid; margin-right: 5px; vertical-align: -1px; }
  .up { color: var(--green); } .down { color: var(--red); }
  .big { font-size: 32px; font-weight: 900; text-align: center; margin: 4px 0; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #f1f3f6; margin: 2px 2px 2px 0; }
  .badge.g { background: #dcf5e6; color: #166534; } .badge.b { background: #fde2e1; color: #991b1b; } .badge.n { background: #fff4d6; color: #92400e; }
  .scene { height: 150px; border-radius: 14px; overflow: hidden; position: relative; margin-bottom: 10px; }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene .chap { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt { position: relative; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 10px 8px; text-align: center; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 110px; font: inherit; }
  .opt .ic { font-size: 30px; } .opt .t { font-weight: 800; font-size: 14px; }
  .opt .chips { justify-content: center; }
  .opt.sel { border-color: var(--green); background: #effbf3; }
  .opt.sel::after { content: '✔'; position: absolute; top: 6px; right: 8px; color: var(--green); font-weight: 900; }
  .opt:disabled { opacity: .5; cursor: not-allowed; }
  .logros { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .logro { background: #fff; border-radius: 12px; padding: 10px; text-align: center; font-size: 13px; font-weight: 700; }
  .logro span { display: block; font-size: 30px; }
  .logro.no { opacity: .4; filter: grayscale(1); }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 70px; }
  .chart div { flex: 1; background: var(--blue); border-radius: 3px 3px 0 0; min-height: 3px; }
  .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; text-align: center; align-items: center; font-size: 13px; }
  .vs b { display: block; font-size: 14px; }

  /* Ventana emergente */
  #modal { position: fixed; inset: 0; z-index: 30; background: rgba(17, 24, 39, .55); display: flex; align-items: flex-end; justify-content: center; }
  #modal:empty { display: none; }
  .pop { background: #fff; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 18px 14px calc(var(--safe-bottom) + 16px); animation: sube .25s ease; }
  @keyframes sube { from { transform: translateY(40px); opacity: 0; } }
  .pop .pi { font-size: 54px; text-align: center; line-height: 1.1; }
  .pop h2 { text-align: center; margin: 6px 0 4px; font-size: 21px; }
  .pop .pd { text-align: center; color: var(--dim); margin: 0 0 12px; }
  .po { display: block; width: 100%; text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 12px; margin-top: 8px; cursor: pointer; font: inherit; min-height: 52px; }
  .po b { display: block; font-size: 16px; }
  .po:active { background: #f3f6fb; }

  /* Presentación */
  .intro { padding: calc(var(--safe-top) + 30px) 16px 40px; }
  .intro .logo { font-size: 56px; text-align: center; }
  .intro h1 { text-align: center; margin: 6px 0; font-size: 30px; }
  .intro .sub { text-align: center; color: var(--dim); margin-bottom: 18px; }
  .intro input { width: 100%; font: inherit; font-size: 18px; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: #fff; }
  .avas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .avas button { font-size: 30px; min-height: 54px; border-radius: 12px; border: 2px solid var(--line); background: #fff; cursor: pointer; }
  .avas button.sel { border-color: var(--blue); background: #eaf2ff; }
  .note { font-size: 12px; color: var(--dim); text-align: center; margin: 12px 6px 0; }

  #toast { position: fixed; left: 50%; top: calc(var(--safe-top) + 74px); transform: translateX(-50%); z-index: 40; width: calc(100% - 24px); max-width: 456px; pointer-events: none; }
  #toast div { background: #111827; color: #fff; border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 14px; animation: toast 3.5s ease both; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-10px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 35; }
  .confetti i { position: absolute; top: -20px; width: 8px; height: 14px; border-radius: 2px; animation: fall 2.6s linear both; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .mision { display: block; width: calc(100% - 20px); text-align: left; font: inherit; cursor: pointer; }
  .mision .pn { display: inline-block; font-size: 11px; font-weight: 900; letter-spacing: .08em; color: #92400e; background: #fde68a; border-radius: 6px; padding: 1px 6px; margin-bottom: 3px; }
  .nivel.hecha { background: #f0faf3; } .nivel.actual { border: 2px solid var(--gold); background: #fffbea; } .nivel.bloq { opacity: .6; }
  .nivel .tx span { font-size: 11px; font-weight: 900; letter-spacing: .08em; color: var(--dim); }
  .obj { font-size: 14px; padding: 4px 0; }
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="main"></main>
  <div id="dock"></div>
</div>
<div id="hoja"></div>
<div id="modal"></div>
<div id="toast" aria-live="polite"></div>
<script>

'use strict';

/* =====================================================================
   1. CONFIGURACIÓN
   Importes en euros, PROVISIONALES y de juego: no son salarios ni precios reales.
   Países y nombres de división son de ambientación; todos los clubes, ciudades y
   estadios se generan al azar y son ficticios.
   ===================================================================== */
const P3 = (e, n, p) => ({ economico: { nombre: 'Económico', precio: e, factor: 1.4, fama: +1 }, normal: { nombre: 'Normal', precio: n, factor: 1.0, fama: 0 }, premium: { nombre: 'Premium', precio: p, factor: 0.45, fama: -3, famaSinPenal: 60 } });
const S2 = (cb, kb, cg, kg) => ({ basico: { nombre: 'Básico', coste: cb, capacidad: kb, fama: -1 }, bueno: { nombre: 'Bueno', coste: cg, capacidad: kg, fama: +1 } });
const CFG = {
  moneda: '€',
  guardado: 'del_barrio_al_negocio_p1_v5',
  inicio: { edad: 17, nivel: 30, energia: 70, rep: 5, dinero: 60 },
  energiaMax: 100, nivelMax: 99,

  barrio: { recuperacion: 10, repOjeador: 25, plazaRepBase: 3, plazaBonusEnergia: 2, trabajoPago: 60, entrenadorCoste: 90 },
  prueba: { semanasCorto: 3, semanasLargo: 5, penalLargo: 4, suerte: 5 },

  temporada: { equipos: 10, jornadas: 18, mercadoInvierno: 9, ascienden: 2, descienden: 2, añoInicio: 2026 },

  club: {
    recuperacion: 20, energiaTitular: 15, energiaSuplente: 5, probJugarSuplente: 0.5,
    lesionUmbral: 35, lesionPctPorPunto: 2, lesionSemanas: [1, 4],
    umbralSobreFuerza: 8,          // titular si selección >= fuerza del club + 8
    fisioCoste: 60, viajeNegocio: 150, gastosFamilia: 40,
    semanasMinMejora: 6, partidosMinMejora: 4, notasMejora: 5, notaMejora: 6.3, mejoraFactor: 1.35,
    partidosMinPrimaAscenso: 5,
    calidadTier: [1.4, 1.25, 1.1, 1.0, 0.9],   // mejora por entrenar según división (1 = máxima)
    visTier: [2.0, 1.6, 1.3, 1.1, 1.0],        // cuánto se nota tu rendimiento en la reputación
    edadCrec: [[20, 1.2], [24, 1.0], [28, 0.7], [99, 0.4]],
    mejoraNormal: 0.3, mejoraExtra: 0.6,   // nivel por semana antes de multiplicadores
    potencial: [75, 92], margenTecho: 15,  // cerca de tu techo mejoras más despacio
    probSuceso: 0.45,
  },
  // Impuesto simplificado: tipo según lo ganado esa semana (salario + primas)
  impuestos: [[300, 0.05], [1000, 0.15], [4000, 0.30], [Infinity, 0.45]],

  posiciones: {
    delantero: { n: 'Delantero', ic: '🎯', gol: 0.35, asis: 0.15, repGol: 2, primaGol: 0.10, notaExtra: 0 },
    medio:     { n: 'Centrocampista', ic: '🧠', gol: 0.14, asis: 0.30, repGol: 2, primaGol: 0.05, notaExtra: 0.1 },
    defensa:   { n: 'Defensa', ic: '🛡️', gol: 0.06, asis: 0.08, repGol: 3, primaGol: 0.03, notaExtra: 0.3 },
  },

  paises: {
    es: {
      n: 'España', flag: '🇪🇸', vida: 140, vis: 1.0, extranjero: 0,
      pre: ['Val', 'Villa', 'Torre', 'Puebla ', 'Castro', 'Fuente', 'Monte', 'Alba', 'Peña', 'Vega ', 'Sierra ', 'Campo'],
      suf: ['verde', 'mora', 'alta', 'blanca', 'nueva', 'llana', 'clara', 'hermosa', 'seca', 'dorada', 'fría', 'serena'],
      tipos: ['CD #', 'UD #', 'CF #', 'SD #', 'Real #', 'Atlético #', 'Racing #', 'Club #'],
      estadio: (c, cap) => (cap < 3000 ? 'Campo Municipal de ' : cap < 15000 ? 'Estadio Municipal de ' : 'Estadio de ') + c,
      ligas: [
        { n: 'Primera División', fuerza: 80, cap: [15000, 80000], sueldo: [8000, 40000] },
        { n: 'Segunda División', fuerza: 70, cap: [6000, 30000], sueldo: [1500, 6000] },
        { n: 'Primera Federación', fuerza: 60, cap: [2500, 15000], sueldo: [400, 1500] },
        { n: 'Segunda Federación', fuerza: 52, cap: [800, 5000], sueldo: [150, 500] },
        { n: 'Tercera Federación', fuerza: 45, cap: [200, 2000], sueldo: [40, 160] },
      ],
    },
    pt: {
      n: 'Portugal', flag: '🇵🇹', vida: 110, vis: 0.9, extranjero: 8,
      pre: ['Vila ', 'São ', 'Porto ', 'Monte ', 'Ribeira ', 'Castelo ', 'Foz ', 'Lagoa ', 'Alto ', 'Serra '],
      suf: ['Nova', 'Verde', 'do Mar', 'Alegre', 'Branca', 'Real', 'da Serra', 'do Sul', 'Velha', 'Grande'],
      tipos: ['SC #', 'FC #', 'CD #', 'GD #', 'União #', 'Desportivo #'],
      estadio: (c, cap) => (cap < 3000 ? 'Campo Municipal de ' : 'Estádio de ') + c,
      ligas: [

/* =====================================================================
   2. UTILIDADES
   ===================================================================== */
function rnd(s) { // mulberry32, estado guardado en la partida (resultados reproducibles)
  s.rng = (s.rng + 0x6D2B79F5) | 0;
  let t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = v => Math.round(v * 10) / 10;
const red = (v, m) => Math.round(v / m) * m;
const nf = v => String(r1(v)).replace('.', ',');
const nf3 = v => String(+v.toFixed(3)).replace('.', ',');
const cr = n => (n < 0 ? '−' : '') + String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' ' + CFG.moneda;
const sg = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + nf(Math.abs(n));
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const azar = (s, arr) => arr[Math.floor(rnd(s) * arr.length)];
function poisson(s, l) { const L = Math.exp(-l); let k = 0, p = rnd(s); while (p > L && k < 9) { k++; p *= rnd(s); } return k; }
function tipoImpuesto(bruto) { for (const [hasta, t] of CFG.impuestos) if (bruto <= hasta) return t; return 0.45; }

/* =====================================================================
   3. MUNDO: países, ligas y clubes ficticios
   ===================================================================== */
function nombreCiudad(s, P) {
  const a = azar(s, P.pre), b = azar(s, P.suf);
  return a + (/[ -]$/.test(a) ? b.charAt(0).toUpperCase() + b.slice(1) : b);
}
function siglas(n) {
  const w = n.replace(/[^A-Za-zÀ-ÿ0-9 ]/g, ' ').split(' ').filter(x => x && x !== 'de');
  return w.map(x => x[0]).join('').toUpperCase().slice(0, 3);
}
function generarMundo(s) {
  const clubs = {}, ligas = {}, de = {};
  let n = 0;
  for (const [pk, P] of Object.entries(CFG.paises)) {
    const usadas = new Set();
    P.ligas.forEach((L, i) => {
      const key = `${pk}-${i + 1}`;
      ligas[key] = [];
      for (let k = 0; k < CFG.temporada.equipos; k++) {
        let ciudad, g = 0;
        do { ciudad = nombreCiudad(s, P); } while (usadas.has(ciudad) && ++g < 80);
        usadas.add(ciudad);
        const nombre = azar(s, P.tipos).replace('#', ciudad);
        const cap = Math.max(100, red(L.cap[0] * Math.pow(L.cap[1] / L.cap[0], rnd(s)), 50));
        const [c1, c2] = azar(s, CFG.colores);
        const id = 'c' + (n++);
        clubs[id] = { id, pais: pk, nombre, ciudad, cap, c1, c2, siglas: siglas(nombre), estadio: P.estadio(ciudad, cap),
          fuerza: Math.round(L.fuerza + (rnd(s) * 2 - 1) * 5) };
        ligas[key].push(id);
        de[id] = key;
      }
    });
  }
  return { clubs, ligas, de };
}
function infoLiga(key) {
  const [p, t] = key.split('-');
  const P = CFG.paises[p];
  return { key, pais: p, tier: +t, P, L: P.ligas[+t - 1], n: P.ligas.length };
}
const club = (s, id) => s.mundo.clubs[id];
const ligaDe = (s, id) => infoLiga(s.mundo.de[id]);
const miClub = s => club(s, s.contrato.clubId);
function nombreLiga(key) { const i = infoLiga(key); return `${i.P.flag} ${i.L.n}`; }

/* ---- Temporada: calendario y clasificación ---- */
function calendario(s, ids) {
  const t = ids.slice();
  for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(rnd(s) * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; }
  const n = t.length, ida = [];
  for (let r = 0; r < n - 1; r++) {
    const ronda = [];
    for (let i = 0; i < n / 2; i++) { const a = t[i], b = t[n - 1 - i]; ronda.push((r + i) % 2 ? [b, a] : [a, b]); }
    ida.push(ronda);
    t.splice(1, 0, t.pop());
  }
  return ida.concat(ida.map(r => r.map(([a, b]) => [b, a])));
}
function iniciarTemporada(s, key, jornadasPrevias, año) {
  const ids = s.mundo.ligas[key];
  const T = { liga: key, año, jornada: 0, cal: calendario(s, ids), tabla: {} };
  for (const id of ids) T.tabla[id] = { pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0, pts: 0, forma: [] };
  s.temporada = T;
  for (let j = 0; j < jornadasPrevias; j++) { for (const [h, a] of T.cal[j]) simPartido(s, T, h, a); T.jornada++; }
}
function apuntar(T, h, a, gh, ga) {
  const A = T.tabla[h], B = T.tabla[a];
  A.pj++; B.pj++; A.gf += gh; A.gc += ga; B.gf += ga; B.gc += gh;
  const r = gh > ga ? ['V', 'D'] : gh < ga ? ['D', 'V'] : ['E', 'E'];
  for (const [x, k] of [[A, r[0]], [B, r[1]]]) {
    if (k === 'V') { x.g++; x.pts += 3; } else if (k === 'E') { x.e++; x.pts += 1; } else x.p++;
    x.forma.push(k); if (x.forma.length > 5) x.forma.shift();
  }
}
const golesEsperados = (fa, fb, casa) => clamp(1.3 * Math.exp((fa - fb + (casa ? 3 : -3)) / 20), 0.15, 4);
function simPartido(s, T, h, a) {
  const fh = club(s, h).fuerza, fa = club(s, a).fuerza;
  const gh = poisson(s, golesEsperados(fh, fa, true)), ga = poisson(s, golesEsperados(fa, fh, false));
  apuntar(T, h, a, gh, ga);
  return [gh, ga];
}
function clasificacion(T) {
  return Object.keys(T.tabla).sort((x, y) => {
    const a = T.tabla[x], b = T.tabla[y];
    return b.pts - a.pts || (b.gf - b.gc) - (a.gf - a.gc) || b.gf - a.gf || (x < y ? -1 : 1);
  });
}
function posicion(s, id) { return clasificacion(s.temporada).indexOf(id) + 1; }
function zona(key, pos) { // 'ascenso' | 'descenso' | 'campeon' | ''
  const i = infoLiga(key), T = CFG.temporada;
  if (i.tier === 1 && pos === 1) return 'campeon';
  if (i.tier > 1 && pos <= T.ascienden) return 'ascenso';
  if (i.tier < i.n && pos > T.equipos - T.descienden) return 'descenso';
  return '';
}
function proximoPartido(s) {
  const T = s.temporada;
  if (!T || T.jornada >= T.cal.length) return null;
  const yo = s.contrato.clubId;
  const m = T.cal[T.jornada].find(p => p.includes(yo));
  return m ? { casa: m[0] === yo, rival: m[0] === yo ? m[1] : m[0], jornada: T.jornada + 1 } : null;
}

  const local = s.mundo.ligas['es-5'][0];
  club(s, local).fuerza = CFG.paises.es.ligas[4].fuerza - 2;

  s.ciudad = club(s, local).ciudad;
  s.rel = [
    { id: 'madre', tipo: 'madre', nombre: 'Mamá', v: 85, semana: 0 },

    { id: 'amigo', tipo: 'amigo', nombre: azar(s, CFG.nombres), v: 75, semana: 0 },
  ];
  generarAnuncios(s);
  return s;
}

function repPlaza(s) {
  const b = CFG.barrio;
  return b.plazaRepBase + Math.floor(s.p.nivel / 10) + (s.p.energia >= 50 ? b.plazaBonusEnergia : 0);
}
function pruebaBase(s) { return s.p.nivel + s.p.energia / 5 + s.p.rep / 5 + (s.prep ? s.prep.ajuste : 0); }
function factorTecho(s) { return r1(clamp((s.potencial - s.p.nivel) / CFG.club.margenTecho, 0, 1)); }
function mejoraSemana(s, extra) { return (extra ? CFG.club.mejoraExtra : CFG.club.mejoraNormal) * calidadEntreno(s) * crecimientoEdad(s) * factorTecho(s); }
function crecimientoEdad(s) { for (const [hasta, f] of CFG.club.edadCrec) if (s.edad <= hasta) return f; return 0.4; }
function calidadEntreno(s) { return CFG.club.calidadTier[ligaDe(s, s.contrato.clubId).tier - 1] || 0.9; }
function visibilidad(s, id) { const i = ligaDe(s, id); return r1((CFG.club.visTier[i.tier - 1] || 1) * i.P.vis); }
function umbralTitular(s) { return miClub(s).fuerza + CFG.club.umbralSobreFuerza; }
function modsSeleccion(s, accionId) {
  const l = s.mods.filter(m => m.tipo === 'sel').map(m => [m.v, m.motivo]);
  if (accionId === 'patrocinio') l.push([-8, 'faltaste a una sesión']);
  if (s.contrato && clubPropio(s, s.contrato.clubId)) l.push([3, 'eres el dueño del club']);
  return l;
}
function puntSeleccion(s, accionId) { return s.p.nivel + s.p.energia / 4 + modsSeleccion(s, accionId).reduce((a, [v]) => a + v, 0); }
function notaMedia(s) {
  const n = s.stats.notas.slice(-CFG.club.notasMejora);
  return n.length ? n.reduce((a, b) => a + b, 0) / n.length : 0;
}
function tramoActual(s) { return s.trayectoria[s.trayectoria.length - 1]; }
function enEspaña(s) { return s.fase !== 'club' || miClub(s).pais === 'es'; }

for (const a of Object.values(ACCIONES)) a.t = a.ic + ' ' + a.n;
function pagoPatrocinio(s) { return red((20 + s.p.rep * 3) * visibilidad(s, s.contrato.clubId), 5); }

/* =====================================================================
   7. SEMANA
   ===================================================================== */
function planPorDefecto(s) { return s.fase === 'barrio' ? 'plaza' : s.fase === 'prep' ? 'entrenarSolo' : s.fase === 'retirado' ? (s.negocios.length ? 'gestionar' : 'rentas') : s.lesion > 0 ? 'reposo' : 'normal'; }
function elegir(id) {
  const a = ACCIONES[id];
  if (!a || !a.fases.includes(S.fase) || S.pendiente) return false;
  if (a.disponible && a.disponible(S)) return false;
  S.plan = id;
  guardar(); render();
  return true;
}
function foto(s) { return { nivel: s.p.nivel, energia: s.p.energia, rep: s.p.rep, dinero: s.p.dinero, fel: s.p.fel, pat: patrimonio(s) }; }

function avanzarSemana() {
  const s = S;
  if (s.pendiente || s.intro) return false;
  let id = s.plan, a = ACCIONES[id];
  const nota = [];
  if (!a || !a.fases.includes(s.fase) || (a.disponible && a.disponible(s))) {
    const alt = planPorDefecto(s);
    if (a && a.fases.includes(s.fase)) nota.push(['🔁', `No puedo hacer «${a.n.toLowerCase()}» esta semana: ${a.disponible(s)} Hago «${ACCIONES[alt].n.toLowerCase()}».`]);
    id = alt; a = ACCIONES[id];
    if (a.disponible && a.disponible(s)) { id = s.fase === 'club' ? 'reposo' : s.fase === 'retirado' ? 'rentas' : 'descansar'; a = ACCIONES[id]; }
    if (s.plan !== 'patrocinio') s.plan = id;
  }
  const R = { semana: s.semana, accion: a.t, accionId: id, fase: s.fase, dep: [], eco: [], neg: [], opo: [], prensa: [], negocios: [], partido: null, antes: foto(s) };
  const mods = modsSeleccion(s, id);
  a.aplicar(s, R);
  s.p.energia = clamp(s.p.energia, 0, CFG.energiaMax);

  if (s.fase === 'barrio' || s.fase === 'prep') {
    s.p.energia = clamp(s.p.energia + CFG.barrio.recuperacion, 0, CFG.energiaMax);
    R.dep.push(['Recuperación semanal', `+${CFG.barrio.recuperacion} energía`, 'Todas las semanas recuperas algo de energía.']);
  }
  if (s.fase === 'barrio') {
    if (s.p.rep >= CFG.barrio.repOjeador) {
      encolar(s, { tipo: 'ojeador', clubId: elegirClubOjeador(s) });
      R.opo.push(['🕵️ Un ojeador me ha visto jugar', `Mi reputación (${s.p.rep}) llega a ${CFG.barrio.repOjeador}.`]);
    }
  } else if (s.fase === 'prep') {
    s.prep.semanasRestantes -= 1;
    if (s.prep.semanasRestantes <= 0) {
      const suerte = Math.round((rnd(s) * 2 - 1) * CFG.prueba.suerte);
      const score = Math.round(pruebaBase(s) + suerte);
      encolar(s, { tipo: 'ofertas', ventana: 'inicio', score, ofertas: primerasOfertas(s, score) });
      R.prueba = { score, suerte, nivel: s.p.nivel, energia: s.p.energia, rep: s.p.rep, ajuste: s.prep.ajuste };
      R.dep.push(['Día de las pruebas', `Puntuación: ${score}`,
        `Nivel ${nf(s.p.nivel)} + energía ${s.p.energia}/5 + reputación ${s.p.rep}/5${s.prep.ajuste ? ` ${sg(s.prep.ajuste)} por pedir más tiempo` : ''} + suerte ${sg(suerte)}.`]);
      R.opo.push(['📝 Dos clubes me hacen una oferta', 'Toca comparar y firmar.']);
    }
  } else if (s.fase === 'club') {
    semanaClub(s, R, mods);
  } else {
    semanaRetirado(s, R);
  }

  for (const n of s.negocios) semanaNegocio(s, R, n);
  semanaInmuebles(s, R);
  semanaCoches(s, R);
  semanaClubes(s, R);
  semanaVida(s, R);
  procesarAgenda(s, R);
  tickMods(s, R);
  comprobarLogros(s, R);
  const ing = R.eco.filter(([, v]) => v > 0).reduce((x, [, v]) => x + v, 0) + R.eco.filter(([t]) => t.startsWith('Impuestos')).reduce((x, [, v]) => x + v, 0);
  s.ingresosHist.push(Math.max(0, ing)); if (s.ingresosHist.length > 6) s.ingresosHist.shift();

  // Imprevistos: uno de vez en cuando (si no hay otra decisión pendiente)
  if (!s.pendiente && rnd(s) < CFG.club.probSuceso) {
    const ev = elegirSuceso(s);
    if (ev) encolar(s, { tipo: 'suceso', id: ev.id, data: ev.data });
  }

  for (const [, v] of R.eco) { if (v > 0) s.acum.ingresosPers += v; else s.acum.gastosPers -= v; }
  s.p.nivel = clamp(r1(s.p.nivel), 0, CFG.nivelMax);
  s.p.rep = clamp(Math.round(s.p.rep), 0, 100);
  R.dineroFinal = s.p.dinero;
  R.patrimonio = patrimonio(s);
  s.historial.push({ semana: s.semana, dinero: s.p.dinero, patrimonio: R.patrimonio });
  if (s.historial.length > 26) s.historial.shift();
  R.despues = foto(s);
  s.ultimo = R;
  s.semanaAct.lineas = nota.concat(s.semanaAct.lineas);
  s.log.push(entradaDiario(s, R));
  if (s.log.length > 40) s.log.shift();
  // Para que la partida guardada pese poco, solo las 8 últimas semanas conservan el «por qué»
  for (let k = 0; k < s.log.length - 8; k++) if (s.log[k].por) { s.log[k].por = null; s.log[k].prensa = null; }
  s.semanaAct = { acts: [], lineas: [] };
  s.semana += 1;
  guardar();
  render();
  return true;
}

function tickMods(s, R) {
  for (const m of s.mods) {
    if (m.tipo === 'ingreso') { s.p.dinero += m.v; R.eco.push([m.motivo, m.v]); }
    m.sem -= 1;
  }
  s.mods = s.mods.filter(m => m.sem > 0);
}
function procesarAgenda(s, R) {
  const hoy = s.agenda.filter(x => x.semana <= s.semana);
  s.agenda = s.agenda.filter(x => x.semana > s.semana);
  for (const x of hoy) {
    if (x.tipo === 'devolucion') {
      if (x.devuelve) { s.p.dinero += x.importe; R.eco.push(['Tu amigo te devuelve el préstamo', x.importe]); R.opo.push(['Te devuelven el dinero', `Tu amigo cumple: +${cr(x.importe)}.`]); }
      else R.opo.push(['El préstamo no vuelve', `Tu amigo no puede devolverte los ${cr(x.importe)}.`]);
    }
  }
}

function semanaClub(s, R, mods) {
  const c = s.contrato, K = CFG.club, T = s.temporada, yo = c.clubId, mi = miClub(s);
  const pos = CFG.posiciones[s.posicion];
  c.semanas += 1;
  const tramo = tramoActual(s);
  s.mejorTier = Math.min(s.mejorTier || 9, ligaDe(s, yo).tier);
  const dec = declive(s);
  if (dec) { s.p.nivel = Math.max(0, s.p.nivel - dec); R.dep.push([`Edad: −${nf(dec)} nivel`, '', `Con ${s.edad} años el cuerpo ya no responde igual (a partir de los 31 se pierde nivel cada semana).`]); }
  const P = { jornada: T.jornada + 1, liga: T.liga };
  R.clubId = yo;
  const energiaAntes = s.p.energia;
  let juega = false, titular = false;

  for (const [h, a] of T.cal[T.jornada]) {
    if (h !== yo && a !== yo) { simPartido(s, T, h, a); continue; }
    const casa = h === yo, rivalId = casa ? a : h, rival = club(s, rivalId);
    Object.assign(P, { casa, rivalId, rivalPos: posicion(s, rivalId) });
    s.stats.partidos += 1;

    // Selección
    if (s.lesion > 0) {
      P.rol = 'lesionado';
      s.lesion -= 1;
      R.dep.push(['No juegas: tienes una lesión', s.lesion > 0 ? `Quedan ${s.lesion} semanas` : 'Recuperación completa para la próxima semana', 'La duración de cada lesión es de ' + K.lesionSemanas.join(' a ') + ' semanas (el fisio la acorta).']);
    } else {
      const sel = puntSeleccion(s, R.accionId), umbral = umbralTitular(s);
      P.seleccion = r1(sel); P.umbral = umbral;
      if (sel >= umbral) P.rol = 'titular';
      else P.rol = rnd(s) < K.probJugarSuplente ? 'suplente' : 'banquillo';
      const extras = mods.map(([v, m]) => `${sg(v)} (${m})`).join(' ');
      R.dep.push([P.rol === 'titular' ? 'Eres titular' : P.rol === 'suplente' ? 'Sales desde el banquillo' : 'No llegas a jugar', '',
        `Selección = nivel ${nf(s.p.nivel)} + energía ${s.p.energia}/4${extras ? ' ' + extras : ''} = ${nf(sel)}. Para ser titular: fuerza del club ${mi.fuerza} + ${K.umbralSobreFuerza} = ${umbral}.${P.rol !== 'titular' ? ` Como suplente juegas el ${Math.round(K.probJugarSuplente * 100)} % de las veces.` : ''}`]);
    }
    juega = P.rol === 'titular' || P.rol === 'suplente';
    titular = P.rol === 'titular';

    // Nota antes de los goles
    let lUs = golesEsperados(mi.fuerza, rival.fuerza, casa), lThem = golesEsperados(rival.fuerza, mi.fuerza, !casa);
    if (juega) {
      const suerte = (rnd(s) * 2 - 1) * 1.2;
      P.notaBase = clamp(6 + pos.notaExtra + (s.p.nivel - rival.fuerza) / 8 + (s.p.energia - 60) / 30 + (s.p.fel - 50) / CFG.felicidad.efectoNota + suerte, 3, 10);
      P.suerte = suerte;
      lUs *= Math.exp((P.notaBase - 6) * (titular ? 0.12 : 0.05));
    }
    const gUs = poisson(s, lUs), gThem = poisson(s, lThem);
    P.goles = 0; P.asist = 0;
    if (juega) {
      const f = (titular ? 1 : 0.35) * clamp(P.notaBase / 6.5, 0.6, 1.4);
      for (let g = 0; g < gUs; g++) { const u = rnd(s); if (u < pos.gol * f) P.goles++; else if (u < (pos.gol + pos.asis) * f) P.asist++; }
      P.nota = r1(clamp(P.notaBase + 0.6 * P.goles + 0.3 * P.asist - (s.posicion === 'defensa' ? 0.15 * Math.max(0, gThem - 1) : 0), 3, 10));
    }
    P.gf = gUs; P.gc = gThem;
    P.resultado = gUs > gThem ? 'victoria' : gUs < gThem ? 'derrota' : 'empate';
    apuntar(T, h, a, casa ? gUs : gThem, casa ? gThem : gUs);
    const estadio = club(s, h);
    P.estadio = estadio.estadio;
    P.publico = Math.round(estadio.cap * clamp(0.45 + rnd(s) * 0.35 + (casa ? 0.1 : 0), 0.2, 0.98) / 10) * 10;
  }
  T.jornada += 1;

  if (juega) {
    s.stats.jugados += 1; s.stats.goles += P.goles; s.stats.asist += P.asist;
    s.stats.notas.push(P.nota); if (s.stats.notas.length > 20) s.stats.notas.shift();
    tramo.pj += 1; if (titular) tramo.tit += 1; tramo.goles += P.goles; tramo.asist += P.asist; tramo.sumaNota += P.nota;
    R.dep.push([`Tu nota: ${nf(P.nota)}`, P.goles || P.asist ? `${'⚽'.repeat(P.goles)}${'👟'.repeat(P.asist)}` : '',
      `6${pos.notaExtra ? ' + ' + nf(pos.notaExtra) + ' por ser ' + pos.n.toLowerCase() : ''} + (nivel ${nf(s.p.nivel)} − fuerza del rival ${club(s, P.rivalId).fuerza})/8 + (energía ${s.p.energia} − 60)/30 + (felicidad ${s.p.fel} − 50)/100 + suerte ${sg(r1(P.suerte))}${P.goles ? ` + 0,6 por gol` : ''}${P.asist ? ` + 0,3 por asistencia` : ''}.`]);
  }
  R.dep.push([`${P.casa ? mi.nombre : club(s, P.rivalId).nombre} ${P.casa ? P.gf : P.gc}-${P.casa ? P.gc : P.gf} ${P.casa ? club(s, P.rivalId).nombre : mi.nombre}`, '',
    `Goles esperados según la fuerza de cada equipo (${mi.fuerza} contra ${club(s, P.rivalId).fuerza}) y quién juega en casa${juega ? '; tu nota empuja a tu equipo' : ''}.`]);

  // Reputación
  const vis = visibilidad(s, yo);
  let dRep;
  if (juega) dRep = Math.round(((P.nota - 6) * 2 * vis + P.goles * pos.repGol) * (titular ? 1 : 0.5)) + (P.resultado === 'victoria' ? 1 : 0);
  else dRep = -1;
  s.p.rep = clamp(s.p.rep + dRep, 0, 100);
  R.dep.push([`Reputación ${sg(dRep)}`, '', juega
    ? `((nota − 6) × 2 × visibilidad de tu liga ${nf(vis)} + goles × ${pos.repGol})${titular ? '' : ' × 0,5 por jugar poco'}${P.resultado === 'victoria' ? ' + 1 por la victoria' : ''}.`
    : 'Si no juegas pierdes 1 punto de reputación.']);

  // Energía y lesiones
  if (P.rol === 'titular') s.p.energia -= K.energiaTitular;
  if (P.rol === 'suplente') s.p.energia -= K.energiaSuplente;
  if (juega && energiaAntes < K.lesionUmbral) {
    const prob = (K.lesionUmbral - energiaAntes) * K.lesionPctPorPunto;
    if (rnd(s) * 100 < prob) {
      s.lesion = K.lesionSemanas[0] + Math.floor(rnd(s) * (K.lesionSemanas[1] - K.lesionSemanas[0] + 1));
      P.lesion = s.lesion;
      R.dep.push(['⚠️ Te lesionas', `${s.lesion} ${s.lesion === 1 ? 'semana' : 'semanas'} sin jugar`, `Jugaste con energía ${energiaAntes} (< ${K.lesionUmbral}): riesgo ${prob} %.`]);
    } else R.dep.push(['Sin lesión, por poco', '', `Jugaste con energía ${energiaAntes} (< ${K.lesionUmbral}): había un riesgo de lesión del ${prob} %.`]);
  }
  s.p.energia = clamp(s.p.energia + K.recuperacion, 0, CFG.energiaMax);
  R.dep.push(['Recuperación semanal', `+${K.recuperacion} energía`, `Partido: titular −${K.energiaTitular}, suplente −${K.energiaSuplente}.`]);
  R.partido = P;

  // Economía personal
  let bruto = c.salario;
  R.eco.push([`Salario (${mi.nombre})`, c.salario]);
  if (juega && P.resultado === 'victoria' && c.primaVictoria) { bruto += c.primaVictoria; R.eco.push(['Prima por victoria', c.primaVictoria]); }
  if (juega && P.goles && c.primaGol) { bruto += c.primaGol * P.goles; R.eco.push([`Prima por gol (${P.goles})`, c.primaGol * P.goles]); }
  const tipo = tipoImpuesto(bruto), imp = Math.round(bruto * tipo);
  s.p.dinero += bruto - imp;
  R.eco.push([`Impuestos (${Math.round(tipo * 100)} %)`, -imp]);
  s.acum.impuestos += imp;
  const gv = gastosVida(s);
  s.p.dinero -= gv.v;
  R.eco.push([`Gastos (${gv.motivo})`, -gv.v]);

  // Prensa
  prensaSemana(s, R, P);

  // Mercado de invierno y fin de temporada
  if (T.jornada === CFG.temporada.mercadoInvierno) abrirMercado(s, R, 'invierno');
  if (T.jornada >= CFG.temporada.jornadas) finTemporada(s, R);
  else if (!c.mejora && condicionMejora(s).ok) {
    c.mejora = true;
    encolar(s, { tipo: 'mejora', oferta: ofertaMejora(s) });
    R.opo.push(['📝 El club quiere mejorarme el contrato', 'Mi rendimiento les ha convencido.']);
  }
}

function prensaSemana(s, R, P) {
  const mi = miClub(s), rv = club(s, P.rivalId), dia = ['Diario del Gol', 'La Jugada', 'Deporte Local', 'Marcador Final'][s.semana % 4];
  const marc = P.casa ? `${mi.nombre} ${P.gf}-${P.gc} ${rv.nombre}` : `${rv.nombre} ${P.gc}-${P.gf} ${mi.nombre}`;
  let txt;
  if (P.nota >= 8) txt = `«${s.nombre} se sale»: ${marc}. Nota ${nf(P.nota)}${P.goles ? ` y ${P.goles} ${P.goles === 1 ? 'gol' : 'goles'}` : ''}.`;
  else if (P.goles) txt = `${marc}: ${P.goles === 1 ? 'gol' : 'doblete'} de ${s.nombre}.`;
  else if (P.rol === 'lesionado') txt = `${marc}. ${s.nombre}, baja por lesión.`;
  else if (P.rol === 'banquillo') txt = `${marc}. ${s.nombre} no sale del banquillo.`;
  else txt = `${marc}. ${P.resultado === 'victoria' ? 'Victoria' : P.resultado === 'empate' ? 'Reparto de puntos' : 'Derrota'} en la jornada ${P.jornada}.`;
  R.prensa.push([dia, txt]);
  const T = s.temporada, orden = clasificacion(T), lider = club(s, orden[0]);
  R.prensa.push([dia, `${lider.nombre} lidera la ${infoLiga(T.liga).L.n} con ${T.tabla[orden[0]].pts} puntos. ${mi.nombre}, ${orden.indexOf(mi.id) + 1}º.`]);
}

/* ---- Contrato: mejora, mercado y fin de temporada ---- */
function condicionMejora(s) {
  const K = CFG.club, c = s.contrato, media = notaMedia(s);
  const jugados = tramoActual(s) ? tramoActual(s).pj : 0;
  return { semanas: c.semanas, jugados, media, notaReq: K.notaMejora,
    ok: c.semanas >= K.semanasMinMejora && jugados >= K.partidosMinMejora && media >= K.notaMejora };
}
function ofertaMejora(s) {
  const c = s.contrato;
  return { salario: red(c.salario * CFG.club.mejoraFactor, 10), temporadas: Math.max(c.temporadasRestantes, 1) + 1 };
}

function elegirClubOjeador(s) { // un club de 4ª división española
  const ids = s.mundo.ligas['es-4'].slice().sort((a, b) => club(s, a).fuerza - club(s, b).fuerza);
  return ids[Math.floor(ids.length / 2)];
}
function primerasOfertas(s, score) {
  const O = CFG.primerasOfertas, l = O.local, f = O.fuera;
  const ojeador = s.pendienteOjeador || elegirClubOjeador(s);
  return [
    { clubId: s.clubLocal, salario: red(l.salarioBase + Math.max(0, score - l.desde) * l.porPunto, 5), temporadas: l.temporadas, fichaje: l.fichaje,
      primaVictoria: l.primaVictoria, primaGol: 0, primaAscenso: l.primaAscenso, subidaAscenso: l.subidaAscenso, bajadaDescenso: 0,
      vida: CFG.club.gastosFamilia, familia: true, motivo: `El club de tu barrio. Sueldo = ${l.salarioBase} + ${l.porPunto} por punto de prueba por encima de ${l.desde}.` },
    { clubId: ojeador, salario: score >= f.umbral ? f.salarioBueno : f.salarioFormacion, temporadas: f.temporadas, fichaje: f.fichaje,
      primaVictoria: f.primaVictoria, primaGol: 0, primaAscenso: f.primaAscenso, subidaAscenso: f.subidaAscenso, bajadaDescenso: f.bajadaDescenso,
      vida: CFG.paises.es.vida, familia: false, motivo: score >= f.umbral ? `El club del ojeador. Tu prueba (${score}) llega a ${f.umbral}: contrato completo.` : `El club del ojeador. Tu prueba (${score}) no llega a ${f.umbral}: contrato de formación.` },
  ];
}
function repRequerida(id, s) { const i = ligaDe(s, id); return Math.max(0, Math.round((i.L.fuerza - 40) * 1.2) + i.P.extranjero); }
function terminosOferta(s, id) {
  const c = club(s, id), i = ligaDe(s, id), L = i.L;
  const f = clamp((s.p.nivel - (c.fuerza - 8)) / 20, 0, 1);
  const salario = red((L.sueldo[0] + (L.sueldo[1] - L.sueldo[0]) * (0.2 + 0.6 * f)) * (0.9 + rnd(s) * 0.2) * (rel(s, 'agente') ? 1 + CFG.agente.sueldoExtra : 1), 10);
  const conAscenso = i.tier > 1 && rnd(s) < 0.7;
  const pos = CFG.posiciones[s.posicion];
  const familia = c.pais === 'es' && c.ciudad === s.ciudad;
  return {
    clubId: id, salario, temporadas: 1 + Math.floor(rnd(s) * 3), fichaje: red(salario * (2 + rnd(s) * 6), 50),
    primaVictoria: red(salario * 0.12, 5), primaGol: red(salario * pos.primaGol, 5),
    primaAscenso: conAscenso ? red(salario * (6 + rnd(s) * 6), 100) : 0, subidaAscenso: conAscenso ? azar(s, [20, 30, 50]) : 0,
    bajadaDescenso: i.tier < i.n && rnd(s) < 0.5 ? 25 : 0,
    vida: familia ? CFG.club.gastosFamilia : i.P.vida, familia,
    motivo: `Tu nivel (${Math.round(s.p.nivel)}) encaja con su equipo (fuerza ${c.fuerza}) y tu reputación (${s.p.rep}) llega a la que piden (${repRequerida(id, s)}).`,
  };
}
function generarOfertas(s, max) {
  if (s.edad >= CFG.retiro.edadSinOfertas) return [];
  if (s.edad >= 34) max = Math.min(max, 1);
  const cands = [];
  for (const c of Object.values(s.mundo.clubs)) {
    if (s.contrato && c.id === s.contrato.clubId) continue;
    const d = s.p.nivel - c.fuerza;
    if (d < -5 || d > 12) continue;
    if (s.p.rep < repRequerida(c.id, s)) continue;
    cands.push({ id: c.id, peso: 1 / (1 + Math.abs(d - 3)) + (c.pais !== 'es' ? 0.05 : 0) });
  }
  const out = [];
  while (out.length < max && cands.length) {
    const tot = cands.reduce((a, x) => a + x.peso, 0);
    let u = rnd(s) * tot, k = 0;
    while (k < cands.length - 1 && (u -= cands[k].peso) > 0) k++;
    out.push(terminosOferta(s, cands[k].id));
    cands.splice(k, 1);
  }
  return out;
}
function abrirMercado(s, R, ventana) {
  const ofertas = generarOfertas(s, (ventana === 'invierno' ? 2 : 3) + (rel(s, 'agente') ? 1 : 0));
  const c = s.contrato;
  if (ventana === 'verano' && c.temporadasRestantes <= 0 && s.edad < CFG.retiro.edadSinRenovacion) {
    const m = notaMedia(s), sube = m >= CFG.club.notaMejora;
    ofertas.unshift({ ...c, renovacion: true, salario: red(c.salario * (sube ? 1.1 : 0.9), 10), temporadas: 2, fichaje: 0,
      motivo: `Renovación con tu club: sueldo ${sube ? '+10 %' : '−10 %'} porque tu nota media (${nf(m)}) ${sube ? 'llega' : 'no llega'} a ${nf(CFG.club.notaMejora)}.` });
  }
  if (!ofertas.length) {
    if (ventana === 'verano' && c.temporadasRestantes <= 0) { retirarse(s, true, R); return; }
    R.opo.push([`Mercado de ${ventana}`, 'Ningún club ha preguntado por ti. Mejora tu nivel o tu reputación.']);
    if (ventana === 'verano') arrancarNuevaTemporada(s);
    return;
  }
  encolar(s, { tipo: 'ofertas', ventana, ofertas });
  R.opo.push([`Mercado de ${ventana}: ${ofertas.length} ${ofertas.length === 1 ? 'oferta' : 'ofertas'}`, 'Puedes fichar o seguir donde estás.']);
}

function finTemporada(s, R) {
  const T = s.temporada, c = s.contrato, yo = c.clubId, orden = clasificacion(T);
  const pos = orden.indexOf(yo) + 1, z = zona(T.liga, pos), tramo = tramoActual(s);
  const info = { tipo: 'fin', clubId: yo, año: T.año, liga: T.liga, pos, zona: z, tabla: orden.map(id => [id, { ...T.tabla[id] }]), primas: [], tramo: { ...tramo } };
  if (z === 'ascenso' || z === 'campeon') {
    s.ascensos += 1;
    if (c.primaAscenso) {
      if (tramo.pj >= CFG.club.partidosMinPrimaAscenso) {
        const imp = Math.round(c.primaAscenso * tipoImpuesto(c.primaAscenso));
        s.p.dinero += c.primaAscenso - imp; s.acum.ingresosPers += c.primaAscenso - imp; s.acum.impuestos += imp;
        info.primas.push(`Prima por ${z === 'campeon' ? 'título' : 'ascenso'}: +${cr(c.primaAscenso)} (−${cr(imp)} de impuestos)`);
        R.eco.push([`Prima por ${z === 'campeon' ? 'título' : 'ascenso'} (neta)`, c.primaAscenso - imp]);
      } else info.primas.push(`Sin prima por ascenso: necesitabas ${CFG.club.partidosMinPrimaAscenso} partidos jugados (tienes ${tramo.pj}).`);
    }
    if (c.subidaAscenso) { const antes = c.salario; c.salario = red(c.salario * (1 + c.subidaAscenso / 100), 10); info.primas.push(`Cláusula de ascenso: sueldo ${cr(antes)} → ${cr(c.salario)} (+${c.subidaAscenso} %)`); }
  }
  if (z === 'descenso' && c.bajadaDescenso) { const antes = c.salario; c.salario = red(c.salario * (1 - c.bajadaDescenso / 100), 10); info.primas.push(`Cláusula de descenso: sueldo ${cr(antes)} → ${cr(c.salario)} (−${c.bajadaDescenso} %)`); }

  actualizarMundo(s, T.liga, orden);
  cumpleaños(s, R);
  c.temporadasRestantes -= 1;
  info.ligaNueva = s.mundo.de[yo];
  encolar(s, info);
  R.opo.push([z === 'campeon' ? '🏆 ¡Campeones de liga!' : z === 'ascenso' ? '🎉 ¡Ascenso!' : z === 'descenso' ? '😢 Descenso' : 'Fin de temporada',
    `${miClub(s).nombre} termina ${pos}º en la ${infoLiga(T.liga).L.n}. Cumples ${s.edad} años.`]);
  if (s.edad >= CFG.retiro.edadForzosa) { retirarse(s, true, R); return; }
  abrirMercado(s, R, 'verano');
}
function actualizarMundo(s, ligaJugador, ordenJugador) {
  const M = s.mundo, T = CFG.temporada, mov = [];
  for (const [pk, P] of Object.entries(CFG.paises)) {
    const ordenes = P.ligas.map((L, i) => {
      const key = `${pk}-${i + 1}`;
      if (key === ligaJugador) return ordenJugador.slice();
      return M.ligas[key].map(id => [id, club(s, id).fuerza + rnd(s) * 12]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    });
    for (let i = 0; i < ordenes.length; i++) {
      if (i > 0) for (const id of ordenes[i].slice(0, T.ascienden)) mov.push([id, `${pk}-${i}`, +3]);
      if (i < ordenes.length - 1) for (const id of ordenes[i].slice(-T.descienden)) mov.push([id, `${pk}-${i + 2}`, -3]);
    }
  }
  for (const [id, key, df] of mov) {
    const old = M.de[id];
    M.ligas[old] = M.ligas[old].filter(x => x !== id);
    M.ligas[key].push(id);
    M.de[id] = key;
    club(s, id).fuerza += df;
  }
  for (const c of Object.values(M.clubs)) { // cada club se acerca al nivel de su división
    const L = infoLiga(M.de[c.id]).L;
    c.fuerza = Math.round(c.fuerza + (L.fuerza - c.fuerza) * 0.2 + (rnd(s) * 2 - 1) * 2);
  }
}
function arrancarNuevaTemporada(s) {
  const año = s.temporada.año + 1;
  iniciarTemporada(s, s.mundo.de[s.contrato.clubId], 0, año);
  nuevoTramo(s);
}
function nuevoTramo(s) {
  s.trayectoria.push({ año: s.temporada.año, clubId: s.contrato.clubId, liga: s.mundo.de[s.contrato.clubId], pj: 0, tit: 0, goles: 0, asist: 0, sumaNota: 0 });
}
function firmar(s, o, ventana) {
  const cambia = !s.contrato || s.contrato.clubId !== o.clubId;
  const paisAntes = s.contrato ? miClub(s).pais : 'es';
  s.contrato = { clubId: o.clubId, salario: o.salario, temporadasRestantes: o.temporadas, fichaje: o.fichaje,
    primaVictoria: o.primaVictoria, primaGol: o.primaGol, primaAscenso: o.primaAscenso, subidaAscenso: o.subidaAscenso,
    bajadaDescenso: o.bajadaDescenso, vida: o.vida, familia: o.familia, mejora: false, semanas: 0 };
  s.fase = 'club';
  s.prep = null;
  const msgs = [];
  if (o.fichaje) {
    const imp = Math.round(o.fichaje * tipoImpuesto(o.fichaje));
    s.p.dinero += o.fichaje - imp; s.acum.ingresosPers += o.fichaje - imp; s.acum.impuestos += imp;
    msgs.push(`Prima de fichaje: +${cr(o.fichaje - imp)} netos.`);
  }
  if (cambia && club(s, o.clubId).pais !== paisAntes) {
    s.mods.push({ tipo: 'sel', v: -4, sem: 6, motivo: 'adaptación al país' });
    msgs.push(`Nuevo país: −4 en la selección durante 6 semanas (adaptación).`);
  }
  if (ventana === 'inicio') { iniciarTemporada(s, s.mundo.de[o.clubId], 0, CFG.temporada.añoInicio); nuevoTramo(s); }
  else if (ventana === 'invierno' && cambia) { iniciarTemporada(s, s.mundo.de[o.clubId], s.temporada.jornada, s.temporada.año); nuevoTramo(s); }
  else if (ventana === 'verano') arrancarNuevaTemporada(s);
  return msgs;
}

/* =====================================================================

    msg = `Pruebas con el ${club(s, ev.clubId).nombre} dentro de ${s.prep.semanasRestantes} semanas.`; ic = '🕵️';
  } else if (ev.tipo === 'ofertas') {

      if (ev.ventana === 'inicio' || (ev.ventana === 'verano' && s.contrato.temporadasRestantes <= 0)) return false;
      if (ev.ventana === 'verano') arrancarNuevaTemporada(s);

    } else {
      const o = ev.ofertas[Number(opcion)];

      const msgs = firmar(s, o, ev.ventana);
      if (!ACCIONES[s.plan] || !ACCIONES[s.plan].fases.includes('club')) s.plan = 'normal';
      msg = `${o.renovacion ? 'Renuevo con' : 'Firmo por'} el ${club(s, o.clubId).nombre}: ${cr(o.salario)}/semana. ${msgs.join(' ')}`; ic = '✍️';
    }

    else if (opcion === 'pedir') {

    } else if (opcion === 'largo') {

      msg = `Firmo ${c.temporadasRestantes} temporadas por ${cr(sal)} por semana y cobro ahora ${cr(prima - imp)} netos de prima.`;
    } else return false;

    msg = `${textoSuceso(s, e, ev.data || {}, 't')} → ${op.n}. ${msg}`;

  guardar(); render();
  return true;

function pantallaActual(s) { return s.pantalla < PANTALLAS.length ? PANTALLAS[s.pantalla] : null; }
function progresoObjetivos(s) { const P = pantallaActual(s); return P ? P.obj.map(([t, f]) => [t, clamp(f(s), 0, 1)]) : []; }
function desbloqueado(s, clave) {
  const nivel = CFG.desbloqueos[clave] || (CFG.negocios[clave] && CFG.negocios[clave].pantalla) || 1;
  return s.pantalla + 1 >= nivel;
}
function textoBloqueo(s, clave) {
  const nivel = CFG.desbloqueos[clave] || (CFG.negocios[clave] && CFG.negocios[clave].pantalla) || 1;
  return `Se desbloquea en la pantalla ${nivel}: ${PANTALLAS[nivel - 1].n}`;
}
function comprobarPantalla(s) {
  let P = pantallaActual(s);
  while (P && progresoObjetivos(s).every(([, v]) => v >= 1)) {
    const n = s.pantalla;
    for (const [ic, v] of P.premio) { aplicarFx(s, [[ic, v]]); if (ic === '€') s.acum.ingresosPers += v; }
    s.pantalla += 1;
    encolar(s, { tipo: 'pantalla', n });
    anotar(s, '🎮', `¡Pantalla ${n + 1} superada: ${P.n}! Premio: ${P.premio.map(([ic, v]) => ic === '€' ? cr(v) : `${ic} +${v}`).join(', ')}.`);
    celebrar = true;
    P = pantallaActual(s);

}

/* =====================================================================
   13. HIPOTECAS, HIJOS Y RETIRADA
   Un «año de juego» es una temporada: 18 semanas. Plazos y edades van en años de juego.
   ===================================================================== */
function cuotaHipoteca(principal, semanas, interes) {
  const r = interes / CFG.hipoteca.semanasAño;
  return Math.round(principal * r / (1 - Math.pow(1 + r, -semanas)));
}
function ingresoMedio(s) { const h = s.ingresosHist; return h.length ? h.reduce((a, b) => a + b, 0) / h.length : 0; }
function cuotasActuales(s) { return s.inmuebles.reduce((a, i) => a + (i.hipoteca ? i.hipoteca.cuota : 0), 0); }
function capacidadHipoteca(s) { return Math.max(0, Math.round(CFG.hipoteca.esfuerzoMax * ingresoMedio(s) - cuotasActuales(s))); }
function condicionesHipoteca(s, a) {
  const H = CFG.hipoteca, entrada = red(a.precio * H.entrada, 100), principal = a.precio - entrada, semanas = s.plazoHipoteca * H.semanasAño;
  const cuota = cuotaHipoteca(principal, semanas, s.interesHipoteca);
  return { entrada, principal, semanas, cuota, gastos: red(a.precio * CFG.inmo.gastosCompra, 100) };
}
function bloqueoInmueble(s, a, conHipoteca) {
  if (!desbloqueado(s, 'inmuebles')) return textoBloqueo(s, 'inmuebles');
  const gastos = red(a.precio * CFG.inmo.gastosCompra, 100);
  if (!conHipoteca) return s.p.dinero >= a.precio + gastos ? null : `Necesitas ${cr(a.precio + gastos)}.`;
  const h = condicionesHipoteca(s, a);
  if (s.p.dinero < h.entrada + h.gastos) return `Entrada + gastos: ${cr(h.entrada + h.gastos)}.`;
  if (h.cuota > capacidadHipoteca(s)) return `El banco no te la da: cuota ${cr(h.cuota)}/sem y solo puedes pagar ${cr(capacidadHipoteca(s))}/sem.`;
  return null;
}
function amortizarHipoteca(id) {
  const s = S, i = s.inmuebles.find(x => x.id === id);
  if (!i || !i.hipoteca) return false;
  const h = i.hipoteca, pago = Math.min(CFG.hipoteca.amortizar, h.deuda);
  if (s.p.dinero < pago) return false;
  s.p.dinero -= pago; h.deuda -= pago;
  if (h.deuda <= 1) { i.hipoteca = null; s.hipotecasPagadas += 1; s.aviso = '¡Hipoteca liquidada!'; }
  else { h.cuota = cuotaHipoteca(h.deuda, h.restantes, h.interes); s.aviso = `Amortizas ${cr(pago)}: la cuota baja a ${cr(h.cuota)}/sem.`; }
  anotar(s, '🏦', s.aviso);
  comprobarLogros(s, null);
  guardar(); render();
  return true;
}
function cambiarPlazo(años) { if (!CFG.hipoteca.plazos.includes(años)) return false; S.plazoHipoteca = años; guardar(); render(); return true; }

function bloqueoHijo(s) {
  const H = CFG.hijos, p = rel(s, 'pareja');
  if (!desbloqueado(s, 'hijos')) return textoBloqueo(s, 'hijos');
  if (!p) return 'Necesitas pareja.';
  if (s.embarazo) return `Ya estáis esperando un bebé (${s.embarazo} semanas).`;
  if (p.v < H.relMin) return `Vuestra relación debe estar en ${H.relMin} o más.`;
  if (s.edad < H.edadMin) return `Desde los ${H.edadMin} años.`;
  if (s.rel.filter(r => r.tipo === 'hijo').length >= H.max) return `Máximo ${H.max} hijos.`;
  return null;
}
function costeHijo(h) {
  if (h.edad >= 18) return 0;
  const base = CFG.hijos.costes.find(([hasta]) => h.edad <= hasta)[1];
  return base + (h.privado && h.edad >= 6 ? CFG.hijos.privado : 0);
}
function icHijo(h) { return h.edad < 3 ? '👶' : h.edad < 13 ? '🧒' : '🧑'; }
function cumpleaños(s, R) {
  s.edad += 1;
  for (const h of s.rel.filter(r => r.tipo === 'hijo')) {
    h.edad += 1;
    if (h.edad === 6) R.opo.push(['🎒', `${h.nombre} empieza el colegio. En Relaciones puedes elegir colegio público o privado.`]);
    if (h.edad === 18) R.opo.push(['🎓', `${h.nombre} cumple 18 años: ya no te cuesta dinero.`]);
  }
}
function declive(s) { for (const [hasta, v] of CFG.retiro.declive) if (s.edad <= hasta) return v; return 0.35; }
function retirarse(s, forzado, R) {
  if (s.fase !== 'club' || (!forzado && s.edad < CFG.retiro.edadMin)) return false;
  const c = miClub(s), RR = CFG.retiro;
  const homenaje = s.p.rep >= RR.homenajeRep ? s.p.rep * RR.homenajePorRep : 0;
  s.ultimoClub = c.id;
  s.fase = 'retirado'; s.contrato = null; s.lesion = 0; s.semanasAño = 0;
  s.plan = s.negocios.length ? 'gestionar' : 'rentas';
  s.mods = s.mods.filter(m => m.tipo !== 'sel');
  s.cola = s.cola.filter(e => !['ofertas', 'mejora'].includes(e.tipo));
  if (s.pendiente && ['ofertas', 'mejora'].includes(s.pendiente.tipo)) s.pendiente = s.cola.shift() || null;
  if (homenaje) { s.p.dinero += homenaje; s.acum.ingresosPers += homenaje; }
  const txt = `${forzado ? 'Ningún club me ofrece contrato: ' : ''}me retiro del fútbol a los ${s.edad} años tras ${s.stats.jugados} partidos y ${s.stats.goles} goles.${homenaje ? ` Partido de homenaje en el ${c.estadio}: +${cr(homenaje)}.` : ''}`;
  if (R) R.opo.push(['👋', txt]); else anotar(s, '👋', txt);
  encolar(s, { tipo: 'retiro', homenaje, club: c.id, forzado: !!forzado, edad: s.edad, jugados: s.stats.jugados, goles: s.stats.goles });
  comprobarLogros(s, R);
  return true;
}
function retirarseYa() { const ok = retirarse(S, false, null); if (ok) { S.hoja = null; guardar(); render(); } return ok; }
function semanaRetirado(s, R) {
  s.p.energia = clamp(s.p.energia + CFG.club.recuperacion, 0, CFG.energiaMax);
  const gv = gastosVida(s);
  s.p.dinero -= gv.v;
  R.eco.push([`Gastos (${gv.motivo})`, -gv.v]);
  if (s.plan !== 'tele' && s.semana % 6 === 0 && s.p.rep > 0) { s.p.rep -= 1; R.dep.push(['Reputación −1', '', 'Retirado, la gente se va olvidando de ti poco a poco (salvo si sales en la tele).']); }
  s.semanasAño += 1;
  if (s.semanasAño >= CFG.hipoteca.semanasAño) { s.semanasAño = 0; cumpleaños(s, R); R.opo.push(['🎂', `Cumplo ${s.edad} años.`]); }
  // El mundo sigue: se juega la liga de tu club (o la última en la que jugaste)
  const T = s.temporada;
  if (T) {
    for (const [h, a] of T.cal[T.jornada]) simPartido(s, T, h, a);
    T.jornada += 1;
    if (T.jornada >= CFG.temporada.jornadas) {
      actualizarMundo(s, T.liga, clasificacion(T));
      iniciarTemporada(s, s.clubes.length ? s.mundo.de[s.clubes[0].clubId] : T.liga, 0, T.año + 1);
      for (const o of s.clubes) R.opo.push(['🏟️', `El ${club(s, o.clubId).nombre} jugará la próxima temporada en ${nombreLiga(s.mundo.de[o.clubId])}.`]);
    }
  }
}

function beneficioTipico(s, tipo) {

  n.empleados = clamp(Math.round(d / cap), 1, T.empleadosMax);
  const cl = Math.min(d, n.empleados * cap), ing = cl * T.precios.normal.precio;
  return Math.round(ing - T.alquiler - T.fijos - n.empleados * T.sueldos.basico.coste - (T.costePct ? ing * T.costePct : cl * T.costeCliente));
}

  const u = n.ultimo, dem = Math.round(demandaNegocio(s, n)), cap = capacidadNegocio(n), mx = Math.max(dem, cap, 1), pr = T.precios[n.precio];

      <div class="small" style="margin-top:8px">👥 ${T.unidad[0].toUpperCase() + T.unidad.slice(1)} previstas: ~${dem}</div><div class="pbar"><i style="width:${dem / mx * 100}%;background:var(--purple)"></i></div>
      <div class="small" style="margin-top:6px">${T.icEmp} Capacidad: ${cap}</div><div class="pbar"><i style="width:${cap / mx * 100}%;background:var(--blue)"></i></div>
      <p class="small">${dem > cap ? '⚠️ Más demanda que capacidad: perderás clientes y fama.' : dem < cap * 0.6 ? '💸 Sobra personal: pagas sueldos de más.' : '👍 Demanda y capacidad equilibradas.'}</p></div>
    <div class="sec">Precio</div><div class="card"><div class="seg">${Object.entries(T.precios).map(([k, p]) => `<button data-act="neg" data-t="${tipo}" data-c="precio" data-v="${k}" class="${n.precio === k ? 'sel' : ''}">${p.nombre}<br>${cr(p.precio)}</button>`).join('')}</div>
      <p class="small">${n.precio === 'economico' ? 'Muchos clientes y +1 fama/semana, poco margen.' : n.precio === 'normal' ? 'Equilibrado.' : `Pocos clientes y mucho margen; −3 fama/semana mientras la fama sea < ${pr.famaSinPenal}.`}</p></div>
    <div class="sec">Personal</div><div class="card"><div class="row"><button class="btn w" data-act="neg" data-t="${tipo}" data-c="empleados" data-v="-1" ${n.empleados <= 1 ? 'disabled' : ''}>−</button>
      <div class="tx" style="text-align:center;font-size:26px">${T.icEmp.repeat(n.empleados)}<span style="display:block">${n.empleados} ${n.empleados === 1 ? 'persona' : 'personas'}</span></div>
      <button class="btn w" data-act="neg" data-t="${tipo}" data-c="empleados" data-v="1" ${n.empleados >= T.empleadosMax || n.caja < T.costeContratar ? 'disabled' : ''}>+</button></div>
      <p class="small">Contratar: −${cr(T.costeContratar)} de la caja. Despedir: una semana de sueldo.</p>
      <div class="seg">${Object.entries(T.sueldos).map(([k, x]) => `<button data-act="neg" data-t="${tipo}" data-c="sueldo" data-v="${k}" class="${n.sueldo === k ? 'sel' : ''}">Sueldo ${x.nombre.toLowerCase()}<br>${cr(x.coste)}</button>`).join('')}</div>
      <p class="small">Básico: ${T.sueldos.basico.capacidad} por persona y −1 fama/semana. Bueno: ${T.sueldos.bueno.capacidad} por persona y +1 fama/semana.</p></div>
    <div class="sec">Caja ↔ tu dinero</div><div class="card"><div class="seg">
      <button data-act="traspaso" data-t="${tipo}" data-v="aCaja" ${s.p.dinero >= C.traspaso ? '' : 'disabled'}>👛 → 🏪 ${cr(C.traspaso)}</button>
      <button data-act="traspaso" data-t="${tipo}" data-v="aPersonal" ${n.caja >= C.traspaso ? '' : 'disabled'}>🏪 → 👛 ${cr(C.traspaso)}</button></div></div>
    ${u ? `<div class="sec">Última semana</div><div class="card"><table>
      <tr><td>Ingresos (${u.clientes} ${T.unidad})</td><td class="n up">+${cr(u.ingresos)}</td></tr><tr><td>Alquiler</td><td class="n down">−${cr(u.alquiler)}</td></tr>
      <tr><td>Suministros y seguros</td><td class="n down">−${cr(u.fijos || 0)}</td></tr><tr><td>Sueldos</td><td class="n down">−${cr(u.sueldos)}</td></tr><tr><td>${T.costePct ? 'Compras' : 'Género y consumo'}</td><td class="n down">−${cr(u.productos)}</td></tr>
      <tr class="tot"><td>Resultado</td><td class="n ${u.resultado >= 0 ? 'up' : 'down'}">${u.resultado >= 0 ? '+' : ''}${cr(u.resultado)}</td></tr></table></div>` : ''}
    <button class="btn r full" data-act="venderNeg" data-v="${tipo}">Vender por ${cr(valorNegocio(n))} + caja</button>`);
}

      <div class="pbar"><i style="width:${r.v}%;background:${colorBarra(r.v)}"></i></div></div><b>${r.v}</b></div>
    <div class="chips" style="margin-top:8px">${interaccionesDe(r).map(([k, x]) => `<button class="btn ${k === 'romper' || k === 'despedir' ? 'r' : k === 'tenerHijo' ? 'g' : 'w'}" style="min-height:38px;padding:6px 10px;font-size:13px" data-act="rel" data-id="${r.id}" data-v="${k}" ${r.semana === s.semana || (k === 'tenerHijo' && bh) ? 'disabled' : ''}>${x.ic} ${x.n}</button>`).join('')}</div>
    ${r.tipo === 'pareja' && bh ? `<p class="lock">👶 ${esc(bh)}</p>` : ''}

/* ---- Ventanas emergentes ---- */
function htmlOferta(o, idx) {
  const s = S, c = club(s, o.clubId), i = ligaDe(s, o.clubId), umbral = c.fuerza + CFG.club.umbralSobreFuerza, sel = puntSeleccion(s, null);
  const neto = o.salario - Math.round(o.salario * tipoImpuesto(o.salario)) - o.vida;
  const extras = [o.fichaje ? `🎁 Fichaje ${cr(o.fichaje)}` : '', o.primaVictoria ? `🏆 ${cr(o.primaVictoria)}/victoria` : '', o.primaGol ? `⚽ ${cr(o.primaGol)}/gol` : '',
    o.primaAscenso ? `⬆️ Ascenso ${cr(o.primaAscenso)}` : '', o.subidaAscenso ? `📈 +${o.subidaAscenso} % si asciende` : '', o.bajadaDescenso ? `📉 −${o.bajadaDescenso} % si desciende` : ''].filter(Boolean);
  return `<button class="po" data-act="resolver" data-v="${idx}"><div class="row"><div class="ic">${escudoClub(c, 34)}</div><div class="tx"><b>${o.renovacion ? 'Renovar con ' : ''}${esc(c.nombre)}</b>
    <span>${i.P.flag} ${esc(i.L.n)} · ${esc(c.estadio)} (${cr(c.cap).replace(' €', '')})</span></div></div>
    <div class="chips"><span class="chip g">💶 ${cr(o.salario)}/sem</span><span class="chip">📄 ${o.temporadas} temp.</span><span class="chip">🏠 vida ${cr(o.vida)}${o.familia ? ' (familia)' : ''}</span>
    <span class="chip ${sel >= umbral ? 'g' : 'b'}">${sel >= umbral ? '✅ titular' : '🪑 suplente'} (${umbral})</span>${extras.map(x => `<span class="chip">${x}</span>`).join('')}</div>
    <div class="small" style="margin-top:4px">Te quedan ~${cr(neto)}/sem (sueldo − impuestos − vida). ${esc(o.motivo)}</div></button>`;
}
function popup() {
  const s = S, ev = s.pendiente, P = CFG.prueba;
  if (!ev) return '';
  if (ev.tipo === 'ojeador') {
    const c = club(s, ev.clubId);
    return `<div class="pi">🕵️</div><h2>Un ojeador quiere verte</h2><p class="pd">«Soy del ${esc(c.nombre)} (${esc(nombreLiga(s.mundo.de[c.id]))}). Te he visto en la plaza. ¿Cuándo puedes hacer unas pruebas?»<br><small>En la prueba cuenta: nivel + energía/5 + reputación/5 ± ${P.suerte}.</small></p>
      <button class="po" data-act="resolver" data-v="corto"><b>⏩ En ${P.semanasCorto} semanas</b>${chips([['✅', 'sin penalización'], ['⏱️', 'menos tiempo']])}</button>
      <button class="po" data-act="resolver" data-v="largo"><b>⏳ Pedir ${P.semanasLargo} semanas</b>${chips([['📅', `+${P.semanasLargo - P.semanasCorto} semanas`], ['📉', `−${P.penalLargo} en la prueba`]])}</button>`;
  }
  if (ev.tipo === 'ofertas') {
    const quedarse = ev.ventana === 'invierno' || (ev.ventana === 'verano' && s.contrato.temporadasRestantes > 0);
    const tit = ev.ventana === 'inicio' ? `Prueba: ${ev.score} puntos. ¡Dos clubes te quieren!` : ev.ventana === 'invierno' ? 'Mercado de invierno' : 'Mercado de verano';
    return `<div class="pi">📝</div><h2>${tit}</h2><p class="pd">Toca la oferta que quieras firmar.${ev.ventana !== 'inicio' ? ' Si te vas, tu club recibe el traspaso.' : ' Ninguna es mejor en todo.'}</p>
      ${ev.ofertas.map((o, i) => htmlOferta(o, i)).join('')}
      ${quedarse ? `<button class="po" data-act="resolver" data-v="quedarse"><b>🏠 Seguir en el ${esc(miClub(s).nombre)}</b></button>` : ''}`;
  }
  if (ev.tipo === 'mejora') {
    const o = ev.oferta, N = CFG.negociacion, c = s.contrato, prob = clamp(s.p.rep, N.probMin, N.probMax), salL = red(o.salario * N.largoFactor, 10);
    return `<div class="pi">✍️</div><h2>El club quiere mejorarte el contrato</h2><p class="pd">Ahora cobras ${cr(c.salario)}. Te ofrecen ${cr(o.salario)}/semana y ${o.temporadas} temporadas.</p>
      <button class="po" data-act="resolver" data-v="aceptar"><b>🤝 Aceptar</b>${chips([['💶', `${cr(o.salario)}/sem`], ['✅', 'seguro']])}</button>
      <button class="po" data-act="resolver" data-v="pedir"><b>🎲 Pedir un ${Math.round((N.pedirMasFactor - 1) * 100)} % más</b>${chips([['🍀', `${prob} %: ${cr(red(o.salario * N.pedirMasFactor, 10))}/sem`], ['😠', `si falla: −${N.tensionSeleccion} selección ${N.tensionSemanas} sem`]])}</button>
      <button class="po" data-act="resolver" data-v="largo"><b>🔒 Contrato largo con prima</b>${chips([['€', salL * N.largoPrimaSemanas], ['📄', `+${N.largoTemporadas} temporadas`], ['💶', `${cr(salL)}/sem`]])}</button>`;
  }
  if (ev.tipo === 'suceso') {
    const e = SUCESOS[ev.id], d = ev.data || {};
    return `<div class="pi">${e.ic}</div><h2>${esc(textoSuceso(s, e, d, 't'))}</h2><p class="pd">${esc(textoSuceso(s, e, d, 'd'))}</p>
      ${e.ops.map((o, i) => `<button class="po" data-act="resolver" data-v="${i}"><b>${esc(o.n)}</b>${chips(o.fx(s, d))}</button>`).join('')}`;
  }
  if (ev.tipo === 'pantalla') {
    const P = PANTALLAS[ev.n], N = PANTALLAS[ev.n + 1];
    return `<div class="pi">🎮</div><h2>¡Pantalla ${ev.n + 1} superada!</h2><p class="pd"><b>${P.ic} ${esc(P.n)}</b></p>
      <div class="chips" style="justify-content:center">${P.premio.map(([ic, v]) => chip(ic, v)).join('')}</div>
      <div class="card" style="margin-top:12px;background:#f4fbf6">🔓 <b>Desbloqueado:</b> ${esc(P.desbloquea)}</div>
      ${N ? `<div class="card" style="background:#fffbea"><div class="small">SIGUIENTE · PANTALLA ${ev.n + 2}</div><b>${N.ic} ${esc(N.n)}</b>${N.obj.map(([t]) => `<div class="small">⬜ ${esc(t)}</div>`).join('')}</div>` : '<div class="card">🏆 <b>¡Has completado el juego!</b> Puedes seguir jugando tu vida.</div>'}
      <button class="btn g full" data-act="resolver" data-v="ok">${N ? 'Siguiente pantalla ▶' : '¡Genial!'}</button>`;
  }
  if (ev.tipo === 'retiro') {
    const c = club(s, ev.club);
    return `<div class="pi">👋</div><h2>${ev.forzado ? 'Fin de tu carrera' : 'Cuelgas las botas'}</h2><p class="pd">${ev.forzado ? 'Ningún club te ofrece contrato. ' : ''}Te retiras a los ${ev.edad} años en el ${esc(c.nombre)}.</p>
      <div class="chips" style="justify-content:center">${chip('👕', `${ev.jugados} partidos`)}${chip('⚽', `${ev.goles} goles`)}${chip('⬆️', `${s.ascensos} ascensos`)}${ev.homenaje ? chip('€', ev.homenaje) : ''}</div>
      ${ev.homenaje ? `<p class="small" style="text-align:center">Partido de homenaje en el ${esc(c.estadio)}.</p>` : ''}
      <div class="card" style="margin-top:10px">Ahora empieza otra vida: tus negocios, tus casas, tu familia… o la tele. Cambia tu plan semanal en «Carrera».</div>
      <button class="btn g full" data-act="resolver" data-v="ok">Empezar mi nueva vida</button>`;
  }
  if (ev.tipo === 'fin') {
    const i = infoLiga(ev.liga), mi = club(s, ev.clubId), z = ev.zona, t = ev.tramo;
    const ban = z === 'campeon' ? '🏆 ¡Campeones!' : z === 'ascenso' ? '🎉 ¡Ascenso!' : z === 'descenso' ? '😢 Descenso' : `${ev.pos}º puesto`;
    return `<div class="pi">${z === 'campeon' ? '🏆' : z === 'ascenso' ? '🎉' : z === 'descenso' ? '😢' : '🏁'}</div><h2>Fin de la temporada ${ev.año}/${String(ev.año + 1).slice(2)}</h2>
      <p class="pd"><b>${ban}</b> · ${esc(mi.nombre)} en ${esc(i.L.n)}${ev.ligaNueva !== ev.liga ? `<br>La próxima temporada: ${esc(nombreLiga(ev.ligaNueva))}` : ''}</p>
      <div class="chips" style="justify-content:center">${chip('👕', `${t.pj} partidos`)}${chip('⚽', `${t.goles} goles`)}${chip('⭐', `nota ${t.pj ? nf(t.sumaNota / t.pj) : '—'}`)}${chip('🎂', `${s.edad} años`)}</div>
      ${ev.primas.map(p => `<p class="small">💰 ${esc(p)}</p>`).join('')}
      <div style="margin-top:10px">${tablaHTML(ev.liga, ev.tabla, ev.clubId)}</div>
      <button class="btn g full" data-act="resolver" data-v="ok">Continuar</button>`;
  }
  return '';
}

    <div class="card"><div class="sec" style="margin-top:0">Nombre</div><input id="nombre" maxlength="16" placeholder="Tu nombre" value="${esc(S.nombre)}" autocomplete="off">
      <div class="sec">Personaje</div><div class="avas">${CFG.avatares.map(a => `<button data-act="avatar" data-v="${a}" class="${S.avatar === a ? 'sel' : ''}">${a}</button>`).join('')}</div>
      <div class="sec">Posición</div><div class="seg">${Object.entries(CFG.posiciones).map(([k, p]) => `<button data-act="posicion" data-v="${k}" class="${S.posicion === k ? 'sel' : ''}">${p.ic}<br>${p.n}</button>`).join('')}</div>
      <p class="small">${S.posicion === 'delantero' ? 'Más goles y titulares, pero tu nota depende de marcar.' : S.posicion === 'medio' ? 'Más asistencias y notas regulares.' : 'Pocos goles, pero notas más estables (+0,3).'}</p></div>
    <button class="btn g full" data-act="empezar" id="btnEmpezar">Empezar una nueva vida</button>
    <p class="note">Clubes ficticios. Importes de juego.</p></div>`;
}

function render() {
  if (!S || silencio) return;
  renderTop();
  renderDock();
  const main = $('main');
  if (S.intro) { main.innerHTML = pantallaIntro(); $('hoja').innerHTML = ''; $('modal').innerHTML = ''; return; }
  const abajo = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
  main.innerHTML = pantallaDiario();
  const h = S.hoja;
  $('hoja').innerHTML = !h ? '' : h === 'carrera' ? hojaCarrera() : h === 'bienes' ? hojaBienes() : h === 'relaciones' ? hojaRelaciones() : h === 'actividades' ? hojaActividades()
    : h === 'logros' ? hojaLogros() : h === 'pantallas' ? hojaPantallas() : h === 'ajustes' ? hojaAjustes() : h.startsWith('negocio:') ? hojaNegocio(h.slice(8)) : h.startsWith('club:') ? hojaClub(h.slice(5)) : '';
  const mh = S.pendiente ? `<div class="pop" id="evento">${popup()}</div>` : '';
  if (mh !== modalHtml) { $('modal').innerHTML = mh; modalHtml = mh; }
  if (celebrar) { document.body.insertAdjacentHTML('beforeend', confeti()); setTimeout(() => document.querySelectorAll('body > .confetti').forEach(x => x.remove()), 3500); celebrar = false; }
  if (S.aviso) { $('toast').innerHTML = `<div>${esc(S.aviso)}</div>`; S.aviso = null; }
  if (abajo || bajarDiario) { window.scrollTo(0, document.body.scrollHeight); bajarDiario = false; }
}
let bajarDiario = true, modalHtml = '';

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v, id = b.dataset.id;
  if (act !== 'reiniciar' && act !== 'noReiniciar') confirmarReinicio = false;
  const hojaAntes = S.hoja;
  switch (act) {
    case 'avatar': S.nombre = $('nombre').value; S.avatar = v; render(); break;
    case 'posicion': S.nombre = $('nombre').value; S.posicion = v; render(); break;
    case 'empezar': S.nombre = ($('nombre').value || '').trim().slice(0, 16) || 'Crack'; S.intro = false; bajarDiario = true; guardar(); render(); break;
    case 'avanzar': bajarDiario = true; S.hoja = null; avanzarSemana(); break;
    case 'elegir': elegir(b.dataset.id); break;
    case 'hoja': S.hoja = v; guardar(); render(); break;
    case 'cerrar': S.hoja = S.hoja && (S.hoja.startsWith('negocio:') || S.hoja.startsWith('club:')) ? 'bienes' : null; guardar(); render(); break;
    case 'resolver': celebrar = !!(S.pendiente && S.pendiente.tipo === 'ofertas' && v !== 'quedarse') || (S.pendiente && S.pendiente.tipo === 'pantalla') || (S.pendiente && S.pendiente.tipo === 'fin' && ['ascenso', 'campeon'].includes(S.pendiente.zona)); if (!resolver(v)) celebrar = false; break;
    case 'caja': S.cajaElegida = Number(v); render(); break;
    case 'comprarNeg': comprarNegocio(v, S.cajaElegida); break;
    case 'neg': cambiarNegocio(b.dataset.t, b.dataset.c, b.dataset.c === 'empleados' ? Number(v) : v); break;
    case 'traspaso': traspasar(b.dataset.t, v); break;
    case 'venderNeg': venderNegocio(v); S.hoja = 'bienes'; render(); break;
    case 'comprarInm': comprarInmueble(id, v === 'hipoteca'); break;
    case 'plazo': cambiarPlazo(Number(v)); break;
    case 'amortizar': amortizarHipoteca(id); break;
    case 'retirarse': retirarseYa(); break;
    case 'inm': modoInmueble(id, v); break;
    case 'venderInm': venderInmueble(id); break;
    case 'comprarCoche': comprarCoche(v); break;
    case 'venderCoche': venderCoche(id); break;
    case 'comprarClub': comprarClub(id); break;
    case 'clubSet': cambiarClub(id, b.dataset.c, v); break;
    case 'traspasoClub': traspasarClub(id, v); break;
    case 'venderClub': venderClub(id); S.hoja = 'bienes'; render(); break;
    case 'rel': interactuar(id, v); break;
    case 'actividad': realizarActividad(v); break;
    case 'reiniciar': if (confirmarReinicio) reiniciar(); else { confirmarReinicio = true; render(); } break;
    case 'noReiniciar': confirmarReinicio = false; render(); break;
  }
  if (S.hoja !== hojaAntes) $('hoja').scrollTop = 0;
});

S = cargar() || nuevaPartida();
guardar();
render();

/* =====================================================================
   13. GANCHOS DE PRUEBA (no afectan al juego)
   ===================================================================== */
window.__P1 = {
  CFG, ACCIONES, SUCESOS, ACTIVIDADES, LOGROS,
  get S() { return S; }, set S(v) { S = v; }, set silencio(v) { silencio = v; },
  nueva(seed, pos) { S = nuevaPartida(seed); S.intro = false; S.nombre = 'Prueba'; if (pos) S.posicion = pos; guardar(); render(); return S; },
  elegir, avanzarSemana, resolver, reiniciar, render: () => render(),
  comprarNegocio, cambiarNegocio, traspasar, venderNegocio, comprarInmueble, modoInmueble, venderInmueble, comprarCoche, venderCoche,
  comprarClub, cambiarClub, traspasarClub, venderClub, interactuar, realizarActividad, bloqueoActividad,
  PANTALLAS, progresoObjetivos: () => progresoObjetivos(S), desbloqueado: k => desbloqueado(S, k), comprobarPantalla: () => comprobarPantalla(S),
  cambiarPlazo, amortizarHipoteca, capacidadHipoteca: () => capacidadHipoteca(S), condicionesHipoteca: a => condicionesHipoteca(S, a), bloqueoInmueble: (a, h) => bloqueoInmueble(S, a, h),
  bloqueoHijo: () => bloqueoHijo(S), retirarseYa, beneficioTipico: t => beneficioTipico(S, t), bloqueoNegocio: t => bloqueoNegocio(S, t),
  objetivos: () => objetivos(S), patrimonio: () => patrimonio(S), valorClub: id => valorClub(S, id), clubesEnVenta: () => clubesEnVenta(S),
  pruebaBase: () => pruebaBase(S), condicionMejora: () => condicionMejora(S), clasificacion: () => clasificacion(S.temporada),
  club: id => club(S, id), ligaDe: id => ligaDe(S, id), posicion: id => posicion(S, id), umbralTitular: () => umbralTitular(S),
  generarOfertas: n => generarOfertas(S, n), gastosVida: () => gastosVida(S), elegirSuceso: () => elegirSuceso(S),
  disponible: id => !(ACCIONES[id].disponible && ACCIONES[id].disponible(S)) && ACCIONES[id].fases.includes(S.fase),
};
</script>
</body>
