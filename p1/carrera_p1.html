  const u = s.ultimo, pers = u ? u.eco : [], tot = pers.reduce((x, [, v]) => x + v, 0), A = s.acum;
  h += `<div class="sec">Mi dinero · última semana</div><div class="card">${pers.length ? `<table>${pers.map(([t, v]) => `<tr><td>${esc(t)}</td><td class="n ${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : ''}${cr(v)}</td></tr>`).join('')}
      <tr class="tot"><td>Neto</td><td class="n">${tot >= 0 ? '+' : ''}${cr(tot)}</td></tr></table>` : '<p class="small">Sin movimientos todavía.</p>'}
    <p class="small">Desde el principio: ingresos ${cr(A.ingresosPers)}, gastos ${cr(A.gastosPers)}, impuestos ${cr(A.impuestos)}.</p></div>
    <p class="note">Importes de juego, provisionales: no son precios reales.</p>`;
  return hoja('🏢 Empresa', h);
}

function hojaNegocio(tipo) {
  const s = S, T = CFG.negocios[tipo], n = negocioDe(s, tipo), C = CFG.negocioComun;
  if (!n) {
    const b = bloqueoNegocio(s, tipo);
    if (!T.cajaOpciones.includes(s.cajaElegida)) s.cajaElegida = T.cajaOpciones[0];
    const total = T.precio + s.cajaElegida;
    return hoja(`${T.ic} ${T.n}`, `<div class="card" style="text-align:center"><div style="font-size:64px">${T.ic}</div><h3>${T.n} en traspaso</h3>
      <p>Precio: <b>${cr(T.precio)}</b> + dinero para su <b>caja</b>.</p>
      <p class="small">Cada semana: alquiler ${cr(T.alquiler)} + suministros y seguros ${cr(T.fijos)} + sueldos con Seguridad Social (${cr(T.sueldos.basico.coste)}–${cr(T.sueldos.bueno.coste)} por persona) + ${T.costePct ? `compras: el ${Math.round(T.costePct * 100)} % de lo que vendes` : `${cr(T.costeCliente)} por ${T.unidad.replace(/s$/, '')}`}. La caja va aparte de tu dinero.</p>
      <p>Con la plantilla que tiene y precios normales ganaría unos <b>${cr(beneficioTipico(S, tipo))}/semana</b> (recuperas la inversión en ~${Math.max(1, Math.round(T.precio / Math.max(1, beneficioTipico(S, tipo))))} semanas).</p></div>
      ${b ? `<div class="card">🔒 ${esc(b)}</div>` : `<div class="sec">Caja inicial</div><div class="seg">${T.cajaOpciones.map(c => `<button data-act="caja" data-v="${c}" class="${s.cajaElegida === c ? 'sel' : ''}">${cr(c)}</button>`).join('')}</div>
      <div class="pbar"><i style="width:${pct(s.p.dinero, total)}%;background:var(--green2)"></i></div>
      <button class="btn g full" id="btnComprar" data-act="comprarNeg" data-v="${tipo}" ${s.p.dinero >= total ? '' : 'disabled'}>${s.p.dinero >= total ? `Comprar por ${cr(total)}` : `Te faltan ${cr(total - s.p.dinero)}`}</button>`}`);
  }
  const u = n.ultimo, dem = Math.round(demandaNegocio(s, n)), cap = capacidadNegocio(n), mx = Math.max(dem, cap, 1), pr = T.precios[n.precio];
  return hoja(`${T.ic} ${T.n}`, `<div class="card"><div class="row"><div class="ic">${T.ic}</div><div class="tx"><b id="caja" class="${n.caja < 0 ? 'down' : ''}">Caja ${cr(n.caja)}</b><span>Fama ${Math.round(n.fama)}/100 · vale ${cr(valorNegocio(n))}</span></div></div>
      <div class="small" style="margin-top:8px">👥 ${T.unidad[0].toUpperCase() + T.unidad.slice(1)} previstas: ~${dem}</div><div class="pbar"><i style="width:${dem / mx * 100}%;background:var(--purple)"></i></div>
      <div class="small" style="margin-top:6px">${T.icEmp} Capacidad: ${cap}</div><div class="pbar"><i style="width:${cap / mx * 100}%;background:var(--blue)"></i></div>
      ${n.caja < 0 ? `<p class="small down">⚖️ Caja en negativo ${n.semNeg || 0} ${(n.semNeg || 0) === 1 ? 'semana' : 'semanas'}: a las ${C.semanasConcurso} entra en concurso y cierra. Pasa dinero a la caja o cambia precio y personal.</p>` : ''}
      <p class="small">${dem > cap ? '⚠️ Más demanda que capacidad: perderás clientes y fama.' : dem < cap * 0.6 ? '💸 Sobra personal: pagas sueldos de más.' : '👍 Demanda y capacidad equilibradas.'}</p></div>
    <div class="sec">Precio</div><div class="card"><div class="seg">${Object.entries(T.precios).map(([k, p]) => `<button data-act="neg" data-t="${tipo}" data-c="precio" data-v="${k}" class="${n.precio === k ? 'sel' : ''}">${p.nombre}<br>${cr(p.precio)}</button>`).join('')}</div>
      <p class="small">${n.precio === 'economico' ? 'Muchos clientes y +1 fama/semana, poco margen.' : n.precio === 'normal' ? 'Equilibrado.' : `Pocos clientes y mucho margen; −3 fama/semana mientras la fama sea < ${pr.famaSinPenal}.`}</p></div>
    <div class="sec">Personal</div><div class="card"><div class="row"><button class="btn w" data-act="neg" data-t="${tipo}" data-c="empleados" data-v="-1" ${n.empleados <= 1 ? 'disabled' : ''}>−</button>
      <div class="tx" style="text-align:center;font-size:26px">${T.icEmp.repeat(n.empleados)}<span style="display:block">${n.empleados} ${n.empleados === 1 ? 'persona' : 'personas'}</span></div>
      <button class="btn w" data-act="neg" data-t="${tipo}" data-c="empleados" data-v="1" ${n.empleados >= T.empleadosMax || n.caja < T.costeContratar ? 'disabled' : ''}>+</button></div>
      <p class="small">Contratar: −${cr(T.costeContratar)} de la caja. Despedir: una semana de sueldo.</p>
      <div class="seg">${Object.entries(T.sueldos).map(([k, x]) => `<button data-act="neg" data-t="${tipo}" data-c="sueldo" data-v="${k}" class="${n.sueldo === k ? 'sel' : ''}">Sueldo ${x.nombre.toLowerCase()}<br>${cr(x.coste)}</button>`).join('')}</div>
      <p class="small">Básico: ${T.sueldos.basico.capacidad} por persona y −1 fama/semana. Bueno: ${T.sueldos.bueno.capacidad} por persona y +1 fama/semana.</p></div>
    <div class="sec">👔 Gerente</div><div class="card"><p class="small">Ajusta la plantilla a la demanda cada semana y no usa precios que hunden la fama. Cobra el ${Math.round(C.gerente.pct * 100)} % de los ingresos (mínimo ${cr(C.gerente.min)}/semana).</p>
      <button class="btn ${n.gerente ? 'r' : 'g'} full" data-act="gerente" data-v="${tipo}">${n.gerente ? 'Despedir al gerente' : 'Contratar un gerente'}</button></div>
    ${htmlDecisiones(s, n, tipo)}
    <div class="sec">Caja ↔ tu dinero</div><div class="card"><div class="seg">
      <button data-act="traspaso" data-t="${tipo}" data-v="aCaja" ${s.p.dinero >= C.traspaso ? '' : 'disabled'}>👛 → 🏪 ${cr(C.traspaso)}</button>
      <button data-act="traspaso" data-t="${tipo}" data-v="aPersonal" ${n.caja >= C.traspaso ? '' : 'disabled'}>🏪 → 👛 ${cr(C.traspaso)}</button></div></div>
    ${u ? `<div class="sec">Última semana</div><div class="card"><table>
      <tr><td>Ingresos (${u.clientes} ${T.unidad})</td><td class="n up">+${cr(u.ingresos)}</td></tr><tr><td>Alquiler</td><td class="n down">−${cr(u.alquiler)}</td></tr>
      <tr><td>Suministros y seguros</td><td class="n down">−${cr(u.fijos || 0)}</td></tr>${u.gerente ? `<tr><td>Gerente</td><td class="n down">−${cr(u.gerente)}</td></tr>` : ''}<tr><td>Sueldos</td><td class="n down">−${cr(u.sueldos)}</td></tr><tr><td>${T.costePct ? 'Compras' : 'Género y consumo'}</td><td class="n down">−${cr(u.productos)}</td></tr>
      <tr class="tot"><td>Resultado</td><td class="n ${u.resultado >= 0 ? 'up' : 'down'}">${u.resultado >= 0 ? '+' : ''}${cr(u.resultado)}</td></tr></table></div>` : ''}
    <button class="btn r full" data-act="venderNeg" data-v="${tipo}">Vender por ${cr(valorNegocio(n))} + caja</button>`);
}

function hojaClub(id) {
  const s = S, o = clubPropio(s, id), c = club(s, id), K = CFG.clubCompra;
  if (!o) return hoja('Club', '<p>Ya no es tuyo.</p>');

  return hoja(`🏟️ ${esc(c.nombre)}`, `<div class="scene">${escenaEstadio(c)}<div class="chap">${esc(c.estadio)} · ${cr(c.cap).replace(' €', '')} plazas</div></div>

function accionPrueba(v) {
  const s = S, PANTALLAS = pantallas(s), [k, n] = String(v).split(':'), num = Number(n) || 0;
  let txt = '';
  if (k === 'dinero') { s.p.dinero += num; txt = `+${cr(num)} a tu dinero.`; }
  else if (k === 'caja') { s.negocios.forEach(x => { x.caja += 50000; }); txt = s.negocios.length ? `+${cr(50000)} a la caja de cada negocio.` : 'No tienes negocios.'; }
  else if (k === 'barras') { s.p.energia = 100; s.p.fel = 100; txt = 'Energía y felicidad al máximo.'; }
  else if (k === 'nivel') { s.p.nivel = clamp(s.p.nivel + 10, 0, 100); s.p.rep = clamp(s.p.rep + 10, 0, 100); txt = 'Nivel y reputación +10.'; }
  else if (k === 'pantalla' || k === 'todo') {
    const fin = k === 'todo' ? PANTALLAS.length - 1 : Math.min(s.pantalla + 1, PANTALLAS.length - 1);
    if (fin <= s.pantalla) txt = 'Ya está todo desbloqueado.';
    else { s.pantalla = fin; txt = `Saltas a la pantalla ${fin + 1}: ${PANTALLAS[fin].n}.`; }
  } else if (k === 'semanas') {
    let h = 0; S.hoja = null;
    silencio = true;
    try { for (; h < num && !S.pendiente; h++) if (!avanzarSemana()) break; } finally { silencio = false; }
    bajarDiario = true; guardar(); render(); return;
  }
  anotar(s, '🧪', `Prueba: ${txt}`);
  s.aviso = `🧪 ${txt}`;
  guardar(); render();
}
// Copia de seguridad: la partida en un código de texto que se puede guardar y volver a cargar
let codigoExport = '';
function exportarPartida() {
  codigoExport = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  try { navigator.clipboard.writeText(codigoExport).then(() => { S.aviso = 'Código copiado: guárdalo en una nota.'; render(); }, () => {}); } catch (_) {}
  render(); return codigoExport;
}
function importarPartida(codigo) {
  const t = (codigo != null ? codigo : ($('codigoImport') || {}).value || '').trim();
  try {
    const s = JSON.parse(decodeURIComponent(escape(atob(t))));
    if (!s || s.v !== 5 || !s.p || !s.mundo) throw new Error('no es una partida');
    S = migrar(s); S.hoja = null; S.aviso = '¡Partida cargada!'; codigoExport = '';
    guardar(); render(); return true;
  } catch (_) { S.aviso = 'Ese código no es una partida válida.'; render(); return false; }
}
function ponerGerente(tipo) {
  const n = negocioDe(S, tipo);
  if (!n) return false;
  n.gerente = !n.gerente;
  anotar(S, '👔', n.gerente ? `Contrato un gerente para mi ${CFG.negocios[tipo].n.toLowerCase()}.` : `Despido al gerente de mi ${CFG.negocios[tipo].n.toLowerCase()}.`);
  guardar(); render(); return true;
}

function itemLook(cap, id) { return (CFG.look.items[cap] || []).find(x => x.id === id); }
function itemsLook(s, cap) { return (CFG.look.items[cap] || []).filter(it => !it.dep || it.dep === (s.deporte || 'futbol')); }
function reqLook(s, it) {
  const r = it.req;
  if (!r) return null;
  if (r.pantalla && s.pantalla < r.pantalla) return `Supera la pantalla ${r.pantalla}`;
  if (r.mes != null && mesActual(s) !== r.mes) return `Solo en ${MESES[r.mes]}`;
  if (r.logro) { const ids = [].concat(r.logro); if (!ids.some(id => s.logros[id])) { const l = LOGROS.find(x => ids.includes(x[0]) && (!x[4] || x[4] === (s.deporte || 'futbol'))); return `Logro «${l ? l[2] : ids[0]}»`; } }
  if (r.patro && !(s.patros || []).length) return 'Ten un patrocinador';
  return null;
}
function precioLook(s, it) { return it.gratisCat && (s.patros || []).some(p => p.cat === it.gratisCat) ? 0 : it.p || 0; }
function tieneLook(s, cap, it) { return s.armario.includes(`${cap}:${it.id}`) || (!it.p && !it.req); }
// Ponerte algo: si no es tuyo, se compra (o se desbloquea) primero
function ponerLook(cap, id) {
  const s = S, it = itemLook(cap, id);
  if (!it || (it.dep && it.dep !== (s.deporte || 'futbol'))) return false;
  if (!tieneLook(s, cap, it)) {
    if (reqLook(s, it)) return false;
    const pr = precioLook(s, it);
    if (s.p.dinero < pr) return false;
    s.p.dinero -= pr; s.armario.push(`${cap}:${id}`);
    if (pr) { sonar('caja'); s.acum.gastosPers += pr; s.gastoLook = (s.gastoLook || 0) + pr; s.compras = (s.compras || 0) + 1; s.p.fel = clamp(s.p.fel + CFG.look.felEstreno, 0, 100); }
    const regalo = it.gratisCat && !pr ? (s.patros.find(p => p.cat === it.gratisCat) || {}).marca : null;
    anotar(s, '🛍️', pr ? `Me compro: ${it.n.toLowerCase()} (−${cr(pr)}). ¡Estreno! (+${CFG.look.felEstreno} ánimo)` : `Estreno: ${it.n.toLowerCase()}${regalo ? `, regalo de ${regalo}` : ''}.`);
  }
  s.look[cap] = id;
  guardar(); render();
  return true;
}

/* =====================================================================
   17. MEJORAS: en qué gastar tu dinero (personal, material y caprichos)
   ===================================================================== */
const GRUPOS_MEJORA = [['personal', '👥 Tu equipo', 'Se paga cada semana. Si un día no puedes pagar, se va.'], ['material', '🏠 Material y casa', 'Se paga una vez y es tuyo para siempre.'], ['caprichos', '🎁 Caprichos', 'Se gastan al usarlos y hay que esperar para repetir.']];
function itemMejora(g, id) { return (CFG.mejoras[g] || []).find(x => x.id === id); }
function mejorasDe(s, g) { return CFG.mejoras[g].filter(x => !x.dep || x.dep === (s.deporte || 'futbol')); }
// Suma de los efectos de tu personal y tu material
function efMejoras(s) {
  const e = { entreno: 0, energia: 0, animo: 0, lesion: 0, viajes: 0, coste: 0 };
  const sumar = x => { for (const k in x.ef) e[k] += x.ef[k]; };
  for (const id of s.personal || []) { const x = itemMejora('personal', id); if (x) { sumar(x); e.coste += x.sem; } }
  for (const id of s.materialCasa || []) { const x = itemMejora('material', id); if (x && (!x.dep || x.dep === (s.deporte || 'futbol'))) sumar(x); }
  e.lesion = Math.min(e.lesion, CFG.mejorasMaxLesion);
  return e;
}
function chipsMejora(ef) {
  const l = [];
  if (ef.entreno) l.push(['📈', `Entrenamiento +${Math.round(ef.entreno * 100)} %`]);
  if (ef.energia) l.push(['⚡', `+${ef.energia}/semana`]);
  if (ef.animo) l.push(['😊', `+${ef.animo} al ánimo`]);
  if (ef.lesion) l.push(['🩹', `Lesiones −${Math.round(ef.lesion * 100)} %`]);
  if (ef.viajes) l.push(['🚐', `Viajes −${Math.round(ef.viajes * 100)} %`]);
  return l;
}
function costeViajeZona(s, Z) { return Math.round(Z.coste * (1 - efMejoras(s).viajes)); }
function dineroLibre(s) { return s.deporte === 'escalada' && s.esc ? dineroEsc(s) : s.p.dinero; }

function contratar(id) {
  const s = S, x = itemMejora('personal', id);
  if (!x || s.personal.includes(id) || s.p.dinero < x.sem) return false;
  s.personal.push(id);
  anotar(s, x.ic, `Contrato a mi ${x.n.toLowerCase()}: ${cr(x.sem)} por semana.`);
  guardar(); render(); return true;
}
function despedir(id) {
  const s = S, x = itemMejora('personal', id);
  if (!x || !s.personal.includes(id)) return false;
  s.personal = s.personal.filter(y => y !== id);
  anotar(s, '👋', `Dejo de contar con mi ${x.n.toLowerCase()}.`);
  guardar(); render(); return true;
}
function comprarMaterial(id) {
  const s = S, x = itemMejora('material', id);
  if (!x || (x.dep && x.dep !== (s.deporte || 'futbol')) || s.materialCasa.includes(id) || s.p.dinero < x.p) return false;
  s.p.dinero -= x.p; s.acum.gastosPers += x.p; s.materialCasa.push(id); sonar('caja');
  s.p.fel = clamp(s.p.fel + 2, 0, 100);
  anotar(s, x.ic, `Me compro: ${x.n.toLowerCase()} (−${cr(x.p)}).`);
  guardar(); render(); return true;
}
function bloqueoCapricho(s, x) {
  const ult = (s.usoCapricho || {})[x.id];
  if (ult != null && s.semana - ult < x.espera) return `Otra vez en ${x.espera - (s.semana - ult)} ${x.espera - (s.semana - ult) === 1 ? 'semana' : 'semanas'}`;
  if (s.p.dinero < x.p) return `Necesitas ${cr(x.p)}`;
  return null;
}
function usarCapricho(id) {
  const s = S, x = itemMejora('caprichos', id);
  if (!x || bloqueoCapricho(s, x)) return false;
  s.p.dinero -= x.p; s.acum.gastosPers += x.p; sonar('caja');
  aplicarFx(s, x.fx);
  s.usoCapricho = Object.assign({}, s.usoCapricho, { [id]: s.semana });
  anotar(s, x.ic, `${x.n} (−${cr(x.p)}). ${x.txt}`);
  guardar(); render(); return true;
}
// Cada semana: se paga al personal y se notan los efectos
function semanaMejoras(s, R) {
  for (const id of s.personal.slice()) {
    const x = itemMejora('personal', id);
    if (!x) continue;
    if (dineroLibre(s) < x.sem) { s.personal = s.personal.filter(y => y !== id); R.opo.push(['👋', `Mi ${x.n.toLowerCase()} se va: no le puedo pagar.`]); continue; }
    if (s.deporte === 'escalada' && s.esc) pagarEsc(s, R, x.sem, x.n); else { s.p.dinero -= x.sem; R.eco.push([x.n, -x.sem]); }
  }
  const e = efMejoras(s);
  if (e.energia) s.p.energia = clamp(s.p.energia + e.energia, 0, CFG.energiaMax);
  const l = chipsMejora(e).map(([i, t]) => `${i} ${t}`).join(' · ');
  if (l) R.dep.push(['Tu equipo y tu material', l, 'El entrenamiento extra se suma a lo que mejoras; la energía, cada semana; el ánimo, a tu felicidad; y las lesiones son menos probables.']);
}
function resumenMejoras(s) {
  const e = efMejoras(s), l = chipsMejora(e).map(([i, t]) => `${i} ${t}`).join(' · ');
  return `<div class="row"><div class="ic">🛒</div><div class="tx"><b>${s.personal.length ? `${s.personal.length} en tu equipo · ${cr(e.coste)}/sem` : 'Sin equipo propio'}</b><span>${l || 'Entrenador, fisio, nutricionista, psicólogo, material para casa y caprichos.'}</span></div>
    <button class="btn" data-act="hoja" data-v="mejoras">Ver</button></div>`;
}
function hojaMejoras() {
  const s = S, e = efMejoras(s), resumen = chipsMejora(e);
  let h = `<div class="card"><div class="row"><div class="ic">💰</div><div class="tx"><b>${cr(s.p.dinero)}</b><span>${e.coste ? `Tu equipo te cuesta ${cr(e.coste)} por semana` : 'Ahora mismo no pagas a nadie'}${s.deporte === 'escalada' && s.esc && s.esc.becaSaldo > 0 ? ` (la beca del Estado lo paga primero: te quedan ${cr(s.esc.becaSaldo)})` : ''}.</span></div></div>
    ${resumen.length ? chips(resumen) : '<p class="small">Contrata, compra o date un capricho: cada cosa dice lo que te da.</p>'}</div>`;
  for (const [g, tit, sub] of GRUPOS_MEJORA) {
    h += `<div class="sec">${tit}</div><p class="small">${sub}</p><div class="card lista">`;
    for (const x of mejorasDe(s, g)) {
      let btn;
      if (g === 'personal') btn = s.personal.includes(x.id) ? `<button class="btn r" data-act="despedir" data-id="${x.id}">Despedir</button>` : `<button class="btn g" data-act="contratar" data-id="${x.id}" ${s.p.dinero < x.sem ? 'disabled' : ''}>${cr(x.sem)}/sem</button>`;
      else if (g === 'material') btn = s.materialCasa.includes(x.id) ? '<button class="btn w" disabled>✓ Tuyo</button>' : `<button class="btn g" data-act="material" data-id="${x.id}" ${s.p.dinero < x.p ? 'disabled' : ''}>${cr(x.p)}</button>`;
      else { const b = bloqueoCapricho(s, x); btn = `<button class="btn" data-act="capricho" data-id="${x.id}" ${b ? 'disabled' : ''}>${cr(x.p)}</button>`; }
      const fx = g === 'caprichos' ? x.fx : chipsMejora(Object.assign({ entreno: 0, energia: 0, animo: 0, lesion: 0, viajes: 0 }, x.ef));
      const b = g === 'caprichos' ? bloqueoCapricho(s, x) : null;
      h += `<div class="row" style="flex-wrap:wrap"><div class="ic">${x.ic}</div><div class="tx"><b>${esc(x.n)}</b><span>${esc(x.d)}</span>${chips(fx)}${b && !b.startsWith('Necesitas') ? `<span class="lock">⏳ ${esc(b)}</span>` : ''}</div>${btn}</div>`;
    }
    h += '</div>';
  }
  h += `<p class="small">Para el aspecto de tu personaje (ropa, peinados, gafas…) está la <button class="link" data-act="hoja" data-v="avatar">tienda de tu personaje</button>. Importes de juego.</p>`;
  return hoja('🛒 Mejoras', h);
}

/* =====================================================================

   Cada opción dice su probabilidad (según tu nivel, energía y ánimo) y el resultado cambia de verdad.
   ===================================================================== */
const JUGADAS = {
  ataque: { ic: '⚽', t: ev => `Minuto ${ev.min}: ${ev.gf === ev.gc ? 'empate' : 'perdéis por uno'} y el balón te cae a ti`, d: () => 'El estadio se levanta. Tienes medio segundo para decidir.',

          { id: 'fuerte', n: 'Reventarla', base: 0.32, gol: true, rep: 2, ok: '¡Un misil! El portero ni la ve.', mal: 'La mandas a la grada. Un señor de la fila 20 la caza al vuelo.' },
          { id: 'pase', n: 'Pase al compañero solo', base: 0.5, asist: true, ok: 'Pase de la muerte y tu compañero la empuja. ¡Gol!', mal: 'Tu compañero estaba en fuera de juego. Por un pelo.' }] },
  defensa: { ic: '🛡️', t: ev => `Minuto ${ev.min}: ganáis por uno y el rival sale a la contra`, d: () => 'Tres contra dos. Si marcan, se acaba la victoria.',
    ops: [{ id: 'tactica', n: 'Falta táctica', base: 0.85, amarilla: true, ok: 'Cortas la jugada. Amarilla, pero los tres puntos se quedan.', mal: 'El árbitro da ventaja… y marcan igual.' },
          { id: 'cruce', n: 'Ir al cruce a muerte', base: 0.55, rep: 2, ok: '¡Cruce perfecto! El estadio corea tu nombre.', mal: 'Te regatean y marcan. Silencio en la grada.' },
          { id: 'repliegue', n: 'Correr hacia atrás y aguantar', base: 0.45, ok: 'Llegas a tiempo, tapas el tiro y sale fuera. ¡Final!', mal: 'No llegas: gol del rival.' }] },
  final: { ic: '🧗', t: ev => `${ev.mod === 'bloque' ? 'Último bloque' : ev.mod === 'dificultad' ? 'Últimos movimientos de la vía' : 'Última carrera'} de la final: vas ${ev.pos}º`,
    d: ev => `${ev.nombre}. ${ev.pos === 2 ? 'El oro está a un movimiento.' : 'El podio está en juego.'}`,
    ops: [{ id: 'todo', n: 'Ir a por todas', base: 0.35, sube: 1, baja: 1, ok: '¡Lo das todo y sale! Subes un puesto.', mal: 'Te sale el pie en el último movimiento. Bajas un puesto.' },
          { id: 'leer', n: 'Leerlo con calma', base: 0.42, tecnica: true, sube: 1, baja: 0, ok: 'Ves el paso que nadie había visto. Subes un puesto.', mal: 'No encuentras el método, pero aguantas tu puesto.' },
          { id: 'seguro', n: 'Asegurar', base: 0.8, sube: 0, baja: 1, ok: 'Sin riesgos: mantienes tu puesto.', mal: 'Hasta lo fácil se complica: bajas un puesto.' }] },
};
function probJugada(s, ev, o) {
  let adj = (s.p.energia - 50) / 400 + (s.p.fel - 50) / 400;
  if (ev.dep === 'futbol') adj += (s.p.nivel - (ev.fuerzaRival || s.p.nivel)) / 120;
  else { const E = s.esc; adj += (E.at.cabeza - 50) / 200 + (o.tecnica ? (E.at.tecnica - 50) / 150 : 0); }
  return clamp(o.base + adj, 0.08, 0.92);
}
// Fútbol: tras un partido igualado (no en la última jornada), a veces llega la jugada decisiva
function prepararMomento(s, P, yo) {
  const K = CFG.momentos, T = s.temporada, dif = P.gf - P.gc;
  if (Math.abs(dif) > 1 || T.jornada >= CFG.temporada.jornadas) return;

/* =====================================================================

// El rival avanza a la vez que tú (un poco por delante, para picarte)
function semanaPersonajes(s, R) {
  const P = pjs(s), r = P.rival, esc = s.deporte === 'escalada';
  if (r.lesion > 0) r.lesion--;

// ---- Temporadas del año: Navidad, Reyes, verano, Halloween ----
function mesActual(s) {
