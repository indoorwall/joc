<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3a2d7a">
<title>Del barrio al negocio · P1</title>
<!--
  PROTOTIPO P1 (v0.3) — Juego de gestión y decisiones: carrera de futbolista + inversión en un negocio.
  No hay partidos controlables, física ni gráficos 3D: los partidos se simulan con reglas explicadas.
  Archivo autónomo: no carga nada de Internet. Sin anuncios, compras, cuentas ni servicios de IA.
  Clubes, ciudades y estadios ficticios generados al azar. Importes en euros, de juego y provisionales.

  ORGANIZACIÓN DEL CÓDIGO:
    1. CONFIGURACIÓN  → países, divisiones, sueldos, estadios, negocio... (todo ajustable)
    2. UTILIDADES     → azar reproducible, formato
    3. MUNDO          → clubes ficticios, calendario, clasificación, partidos
    4. ESTADO         → partida nueva, guardado local, reinicio
    5. REGLAS         → fórmulas (prueba, selección, nota, entrenamiento, negocio, patrimonio)
    6. DECISIONES     → acciones semanales con ventajas y costes
    7. SEMANA         → avanzar una semana: jornada, economía, prensa, mercado, fin de temporada
    8. SUCESOS        → imprevistos de la vida con dos opciones
    9. EVENTOS        → ojeador, ofertas, mejora de contrato, fin de temporada, meta
   10. NEGOCIO        → compra, personal, precios, caja
   11. OBJETIVOS      → misión actual y siguientes
   12. INTERFAZ       → pantallas y botones
   13. GANCHOS DE PRUEBA (solo para pruebas automáticas)
-->
<style>
  :root {
    --ink: #2a2340;
    --paper: #fff8e7;
    --paper-2: #ffeec4;
    --sky1: #3a2d7a;
    --sky2: #6a3fb0;
    --yellow: #ffc93c;
    --green: #4fd36a;
    --red: #ff6b5e;
    --blue: #48a9ff;
    --pink: #ff7eb6;
    --dim: #6d6488;
    --chip-g: #c4f5cf;
    --chip-b: #ffd0ca;
    --chip-n: #ffe7a3;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: linear-gradient(170deg, var(--sky1), var(--sky2) 60%, #8b4fc0) fixed;
    background-color: var(--sky1);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.35;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
    -webkit-user-select: none; user-select: none;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
  button { font-family: inherit; color: inherit; }

  /* ---------- HUD ---------- */
  #top {
    position: sticky; top: 0; z-index: 5;
    padding: calc(var(--safe-top) + 8px) 12px 8px;
    background: rgba(32, 24, 70, .92);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border-bottom: 3px solid var(--ink);
  }
  #top:empty { display: none; }
  .hudrow { display: flex; align-items: center; gap: 8px; }
  .ava { width: 44px; height: 44px; border-radius: 50%; background: var(--yellow); border: 3px solid var(--ink);
         display: grid; place-items: center; font-size: 26px; box-shadow: 0 3px 0 var(--ink); flex: none; }
  .who { flex: 1; min-width: 0; color: #fff; }
  .who b { display: block; font-size: 17px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { font-size: 12px; opacity: .8; font-weight: 700; }
  .coin { background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 900;
          font-size: 17px; box-shadow: 0 3px 0 var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 4px; }
  .coin i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; background: var(--yellow); border: 2px solid var(--ink);
            display: grid; place-items: center; font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .sp { background: rgba(255,255,255,.12); border-radius: 12px; padding: 4px 8px; color: #fff; font-size: 12px; font-weight: 800; }
  .sp b { font-size: 16px; }
  .sp small { display: block; font-size: 10px; opacity: .75; margin-top: 2px; text-transform: uppercase; letter-spacing: .06em; }
  .bar { height: 7px; background: rgba(0,0,0,.35); border-radius: 4px; overflow: hidden; margin-top: 3px; }
  .bar i { display: block; height: 100%; border-radius: 4px; transition: width .6s ease; }

  /* ---------- Contenido ---------- */
  main { padding: 12px 14px calc(var(--safe-bottom) + 170px); }
  .card { background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; padding: 14px; margin-bottom: 14px;
          box-shadow: 0 5px 0 var(--ink); position: relative; }
  .card h2 { margin: 0 0 6px; font-size: 12px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .card h3 { margin: 0 0 6px; font-size: 21px; font-weight: 900; line-height: 1.15; }
  .card p { margin: 6px 0; }
  .small { font-size: 13px; color: var(--dim); }
  .sec-t { color: #fff; font-weight: 900; font-size: 18px; margin: 18px 4px 10px; text-shadow: 0 2px 0 var(--ink); }

  /* Escena */
  .scene { height: 178px; border: 3px solid var(--ink); border-radius: 22px; overflow: hidden; position: relative;
           box-shadow: 0 5px 0 var(--ink); margin-bottom: 14px; background: #333; }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .chap { position: absolute; top: 10px; left: 10px; background: var(--ink); color: #fff; font-weight: 900; font-size: 11px;
          letter-spacing: .08em; padding: 5px 10px; border-radius: 999px; max-width: calc(100% - 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero { position: absolute; bottom: 10px; left: 18%; font-size: 58px; line-height: 1; animation: bob 2.4s ease-in-out infinite;
          filter: drop-shadow(0 4px 0 rgba(0,0,0,.25)); }
  .bubble { position: absolute; right: 10px; bottom: 14px; width: 56%; background: #fff; border: 3px solid var(--ink); border-radius: 16px;
            padding: 7px 10px; font-size: 13px; font-weight: 800; line-height: 1.25; }
  .bubble::before { content: ''; position: absolute; left: -12px; bottom: 14px; border: 6px solid transparent; border-right: 8px solid var(--ink); }
  .badge { display: inline-block; font-size: 12px; font-weight: 900; padding: 3px 9px; border-radius: 999px; border: 2px solid var(--ink); background: #fff; margin: 2px 3px 2px 0; }
  .badge.g { background: var(--chip-g); } .badge.b { background: var(--chip-b); } .badge.n { background: var(--chip-n); }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  /* Misión */
  .mission { background: linear-gradient(180deg, #fff3c4, var(--paper)); }
  .mission .h { display: flex; align-items: center; gap: 8px; }
  .mission .h .ic { font-size: 30px; }
  .xp { height: 18px; background: #e9dfc6; border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; margin: 10px 0 4px; position: relative; }
  .xp i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--yellow) 0 10px, #ffb52e 10px 20px); transition: width .8s ease; }
  .xp span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 900; }
  .road { display: flex; justify-content: space-between; align-items: flex-start; margin: 12px 0 2px; position: relative; }
  .road::before { content: ''; position: absolute; left: 18px; right: 18px; top: 17px; height: 4px; background: var(--ink); opacity: .2; border-radius: 2px; }
  .node { position: relative; z-index: 1; width: 20%; text-align: center; font-size: 10px; font-weight: 900; color: var(--dim); }
  .node i { font-style: normal; width: 38px; height: 38px; margin: 0 auto 3px; border-radius: 50%; border: 3px solid var(--ink); background: #ddd;
            display: grid; place-items: center; font-size: 17px; filter: grayscale(1); opacity: .6; }
  .node.done i { background: var(--green); filter: none; opacity: 1; }
  .node.now i { background: var(--yellow); filter: none; opacity: 1; animation: pulse 1.6s infinite; }
  .node.now { color: var(--ink); }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,201,60,.9); } 50% { box-shadow: 0 0 0 7px rgba(255,201,60,0); } }

  /* Cartas de decisión */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt { position: relative; background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; padding: 12px 8px 10px;
         box-shadow: 0 5px 0 var(--ink); text-align: center; cursor: pointer; min-height: 138px; font: inherit;
         display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .12s ease; }
  .opt:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  .opt .ic { font-size: 38px; line-height: 1.1; }
  .opt .t { font-weight: 900; font-size: 15px; line-height: 1.15; }
  .opt.sel { background: #fff1b8; transform: translateY(-4px) rotate(-1deg); box-shadow: 0 9px 0 var(--ink); outline: 4px solid var(--yellow); outline-offset: 2px; }
  .opt.sel::after { content: '✔'; position: absolute; top: -12px; right: -8px; width: 30px; height: 30px; border-radius: 50%;
                    background: var(--green); border: 3px solid var(--ink); display: grid; place-items: center; font-weight: 900; color: #fff; }
  .opt:disabled { filter: grayscale(1); opacity: .55; cursor: not-allowed; }
  .opt .lock { font-size: 12px; font-weight: 800; color: var(--dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 2px; }
  .chip { font-size: 12px; font-weight: 900; padding: 2px 7px; border-radius: 999px; border: 2px solid var(--ink); background: var(--chip-n); white-space: nowrap; }
  .chip.g { background: var(--chip-g); } .chip.b { background: var(--chip-b); }
  .plan { background: #fff; border-style: dashed; margin-top: 14px; }
  .plan .pro { color: #15803d; font-weight: 800; } .plan .con { color: #c2410c; font-weight: 800; }

  /* Botones */
  .btn { display: block; width: 100%; min-height: 58px; border: 3px solid var(--ink); border-radius: 18px; background: var(--yellow);
         font-size: 19px; font-weight: 900; letter-spacing: .02em; padding: 12px 16px; cursor: pointer; margin-bottom: 10px;
         box-shadow: 0 6px 0 var(--ink); text-transform: uppercase; transition: transform .08s ease; }
  .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
  .btn.go { background: var(--green); color: #fff; text-shadow: 0 2px 0 var(--ink); }
  .btn.sec { background: #fff; font-size: 16px; min-height: 50px; text-transform: none; }
  .btn.danger { background: var(--red); color: #fff; font-size: 16px; text-transform: none; }
  .btn:disabled { background: #b9b3c9; color: #6d6488; text-shadow: none; cursor: not-allowed; box-shadow: 0 6px 0 #6d6488; border-color: #6d6488; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin: 8px 0 10px; }
  .seg button { min-height: 52px; border-radius: 14px; border: 3px solid var(--ink); background: #fff; font-size: 15px; font-weight: 900;
                padding: 6px 4px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); }
  .seg button.sel { background: var(--yellow); transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
  .seg button:disabled { opacity: .45; }

  /* Dock y pestañas */
  #dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 6; width: 100%; max-width: 480px; padding: 16px 14px 0;
          background: linear-gradient(180deg, rgba(58,45,122,0), rgba(58,45,122,.95) 30%); }
  #dock:empty { display: none; }
  nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-bottom: calc(var(--safe-bottom) + 8px); }
  nav button { min-height: 54px; border-radius: 16px; border: 3px solid var(--ink); background: #5b4a9a; color: #fff;
               font-size: 12px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
  nav button span { font-size: 20px; line-height: 1; }
  nav button.on { background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--ink); transform: translateY(-3px); }

  /* Resultados */
  .board { background: #1b1638; color: #fff; text-align: center; padding: 16px 12px; }
  .board h2 { color: #b9b0e0; }
  .teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; font-weight: 900; font-size: 14px; }
  .score { font-family: ui-monospace, Menlo, monospace; font-size: 44px; font-weight: 900; color: var(--yellow); letter-spacing: .05em;
           background: #000; border-radius: 12px; padding: 2px 14px; border: 3px solid #444; }
  .ribbon { display: inline-block; margin-top: 12px; padding: 6px 18px; border-radius: 999px; font-weight: 900; font-size: 18px;
            letter-spacing: .1em; border: 3px solid #fff; animation: pop .5s ease both .3s; }
  .ribbon.victoria { background: var(--green); } .ribbon.empate { background: #8a84a6; } .ribbon.derrota { background: var(--red); }
  .me { display: flex; align-items: center; gap: 12px; text-align: left; }
  .nota { flex: none; width: 74px; height: 74px; border-radius: 50%; border: 4px solid var(--ink); display: grid; place-items: center;
          font-size: 28px; font-weight: 900; animation: pop .5s ease both .5s; }
  .nota.hi { background: var(--green); color: #fff; } .nota.mid { background: var(--yellow); } .nota.lo { background: var(--red); color: #fff; } .nota.no { background: #ddd; font-size: 30px; }
  .rewards { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .rw { font-size: 17px; font-weight: 900; padding: 6px 12px; border-radius: 14px; border: 3px solid var(--ink); background: #fff; box-shadow: 0 3px 0 var(--ink);
        animation: pop .45s ease both; }
  .rw.g { background: var(--chip-g); } .rw.b { background: var(--chip-b); }
  .big { font-size: 64px; font-weight: 900; text-align: center; line-height: 1; margin: 8px 0; animation: pop .6s ease both .2s; }
  .news { background: linear-gradient(180deg, #fff3c4, #ffe08a); }
  .news .it { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
  .news .it .ic { font-size: 26px; }
  details.why { background: #fff; }
  details.why summary { font-weight: 900; cursor: pointer; list-style: none; padding: 4px 0; font-size: 16px; }
  details.why summary::-webkit-details-marker { display: none; }
  details.why h4 { margin: 12px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  .res-line { padding: 7px 0; border-bottom: 2px dashed #e6dcc4; }
  .res-line:last-child { border-bottom: 0; }
  .res-line .h { font-weight: 900; }
  .res-line .r { color: var(--dim); font-size: 13px; display: block; margin-top: 2px; }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }

  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td { padding: 6px 0; border-bottom: 2px dashed #e6dcc4; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 800; }
  tr.tot td { font-weight: 900; border-bottom: 0; font-size: 17px; }
  .up { color: #15803d; } .down { color: #c2410c; }

  /* Clubes */
  .club .top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .club .top h3 { margin: 0; }
  .cmp { display: grid; grid-template-columns: 112px 1fr auto; gap: 6px 8px; align-items: center; font-size: 14px; font-weight: 800; margin: 8px 0; }
  .cmp .b { height: 12px; background: #e9dfc6; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .cmp .b i { display: block; height: 100%; }
  .cmp .v { font-size: 13px; white-space: nowrap; }
  details.more summary { font-weight: 900; font-size: 14px; cursor: pointer; color: var(--dim); padding: 6px 0; }

  /* Negocio y finanzas */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .tile { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; padding: 8px 6px; text-align: center; box-shadow: 0 4px 0 var(--ink); }
  .tile .ic { font-size: 22px; }
  .tile b { display: block; font-size: 16px; font-weight: 900; white-space: nowrap; }
  .tile span { font-size: 11px; font-weight: 800; color: var(--dim); }
  .stars { color: #f5a300; letter-spacing: 1px; font-size: 15px; }
  .staff { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
  .staff .rb { width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; font-size: 26px; font-weight: 900;
               box-shadow: 0 4px 0 var(--ink); cursor: pointer; flex: none; }
  .staff .rb:disabled { opacity: .4; }
  .staff .people { font-size: 34px; text-align: center; flex: 1; }
  .meter { margin: 6px 0; font-size: 13px; font-weight: 800; }
  .meter .b { height: 14px; background: #e9dfc6; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; margin-top: 2px; }
  .meter .b i { display: block; height: 100%; }
  .bigmoney { font-size: 40px; font-weight: 900; text-align: center; margin: 4px 0; }
  .chart { display: flex; align-items: flex-end; gap: 4px; height: 90px; padding-top: 6px; }
  .chart div { flex: 1; background: var(--blue); border: 2px solid var(--ink); border-radius: 6px 6px 2px 2px; min-height: 4px; }
  .chart div.last { background: var(--yellow); }
  .note { font-size: 12px; color: rgba(255,255,255,.8); text-align: center; margin: 14px 8px 0; font-weight: 700; }

  /* Intro */
  .intro { padding: calc(var(--safe-top) + 30px) 18px 40px; text-align: center; color: #fff; }
  .logo { font-size: 64px; animation: bob 2.4s ease-in-out infinite; }
  .intro h1 { font-size: 34px; font-weight: 900; line-height: 1.05; margin: 8px 0 6px; text-shadow: 0 3px 0 var(--ink); letter-spacing: .02em; }
  .intro .sub { font-weight: 800; opacity: .9; margin-bottom: 22px; }
  .intro .card { text-align: left; color: var(--ink); }
  .intro input { width: 100%; font: inherit; font-size: 18px; font-weight: 800; padding: 12px 14px; border-radius: 14px; border: 3px solid var(--ink); background: #fff;
                 -webkit-user-select: text; user-select: text; }
  .avas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .avas button { font-size: 32px; min-height: 58px; border-radius: 16px; border: 3px solid var(--ink); background: #fff; box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
  .avas button.sel { background: var(--yellow); transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }

  /* Aviso flotante y confeti */
  #toast { position: fixed; left: 50%; top: calc(var(--safe-top) + 110px); transform: translateX(-50%); z-index: 9; width: calc(100% - 28px); max-width: 452px; pointer-events: none; }
  #toast div { background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 10px 14px; font-weight: 800; font-size: 14px;
               box-shadow: 0 5px 0 var(--ink); animation: toast 4.5s ease both; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-20px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-10px); } }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 8; }
  .confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border: 2px solid var(--ink); border-radius: 3px; animation: fall 2.8s linear both; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* v0.3: liga, partido, prensa */
  .age { font-size: 12px; font-weight: 800; opacity: .85; margin-left: 4px; }
  .badges { margin: -6px 0 12px; }
  .next .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; text-align: center; }
  .next .vs b { display: block; font-size: 14px; line-height: 1.15; margin-top: 2px; }
  .next .vs span { font-size: 11px; color: var(--dim); font-weight: 800; }
  .next .v { font-size: 22px; font-weight: 900; background: var(--ink); color: var(--yellow); border-radius: 12px; padding: 4px 8px; }
  table.liga td { padding: 5px 2px; font-size: 14px; }
  table.liga tr.hd td, table tr.hd td { font-size: 11px; color: var(--dim); font-weight: 900; text-transform: uppercase; }
  table.liga tr.ascenso td:first-child, table.liga tr.campeon td:first-child { box-shadow: inset 4px 0 0 var(--green); padding-left: 8px; }
  table.liga tr.descenso td:first-child { box-shadow: inset 4px 0 0 var(--red); padding-left: 8px; }
  table.liga tr.yo td { background: #fff1b8; font-weight: 900; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 3px solid; margin-right: 6px; vertical-align: -1px; }
  .key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: 0; }
  .key.ascenso { background: var(--green); } .key.descenso { background: var(--red); }
  .paper { background: #fbf7ee; font-family: Georgia, "Times New Roman", serif; }
  .paper p { margin: 8px 0; font-size: 15px; }
  .paper .medio { font-family: inherit; font-weight: 900; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; background: var(--ink); color: #fff; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }
  details.more p { margin: 4px 0; }
</style>
</head>
<body>
<div id="app">

/* =====================================================================
   2. UTILIDADES
   ===================================================================== */
function rnd(s) { // mulberry32, estado guardado en la partida (resultados reproducibles)
  s.rng = (s.rng + 0x6D2B79F5) | 0;
  let t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = v => Math.round(v * 10) / 10;
const red = (v, m) => Math.round(v / m) * m;
const nf = v => String(r1(v)).replace('.', ',');
const cr = n => (n < 0 ? '−' : '') + String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' ' + CFG.moneda;
const sg = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + nf(Math.abs(n));
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const azar = (s, arr) => arr[Math.floor(rnd(s) * arr.length)];
function poisson(s, l) { const L = Math.exp(-l); let k = 0, p = rnd(s); while (p > L && k < 9) { k++; p *= rnd(s); } return k; }
function tipoImpuesto(bruto) { for (const [hasta, t] of CFG.impuestos) if (bruto <= hasta) return t; return 0.45; }

/* =====================================================================
   3. MUNDO: países, ligas y clubes ficticios
   ===================================================================== */
function nombreCiudad(s, P) {
  const a = azar(s, P.pre), b = azar(s, P.suf);
  return a + (/[ -]$/.test(a) ? b.charAt(0).toUpperCase() + b.slice(1) : b);
}
function siglas(n) {
  const w = n.replace(/[^A-Za-zÀ-ÿ0-9 ]/g, ' ').split(' ').filter(x => x && x !== 'de');
  return w.map(x => x[0]).join('').toUpperCase().slice(0, 3);
}
function generarMundo(s) {
  const clubs = {}, ligas = {}, de = {};
  let n = 0;
  for (const [pk, P] of Object.entries(CFG.paises)) {
    const usadas = new Set();
    P.ligas.forEach((L, i) => {
      const key = `${pk}-${i + 1}`;
      ligas[key] = [];
      for (let k = 0; k < CFG.temporada.equipos; k++) {
        let ciudad, g = 0;
        do { ciudad = nombreCiudad(s, P); } while (usadas.has(ciudad) && ++g < 80);
        usadas.add(ciudad);
        const nombre = azar(s, P.tipos).replace('#', ciudad);
        const cap = Math.max(100, red(L.cap[0] * Math.pow(L.cap[1] / L.cap[0], rnd(s)), 50));
        const [c1, c2] = azar(s, CFG.colores);
        const id = 'c' + (n++);
        clubs[id] = { id, pais: pk, nombre, ciudad, cap, c1, c2, siglas: siglas(nombre), estadio: P.estadio(ciudad, cap),
          fuerza: Math.round(L.fuerza + (rnd(s) * 2 - 1) * 5) };
        ligas[key].push(id);
        de[id] = key;
      }
    });
  }
  return { clubs, ligas, de };
}
function infoLiga(key) {
  const [p, t] = key.split('-');
  const P = CFG.paises[p];
  return { key, pais: p, tier: +t, P, L: P.ligas[+t - 1], n: P.ligas.length };
}
const club = (s, id) => s.mundo.clubs[id];
const ligaDe = (s, id) => infoLiga(s.mundo.de[id]);
const miClub = s => club(s, s.contrato.clubId);
function nombreLiga(key) { const i = infoLiga(key); return `${i.P.flag} ${i.L.n}`; }

/* ---- Temporada: calendario y clasificación ---- */
function calendario(s, ids) {
  const t = ids.slice();
  for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(rnd(s) * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; }
  const n = t.length, ida = [];
  for (let r = 0; r < n - 1; r++) {
    const ronda = [];
    for (let i = 0; i < n / 2; i++) { const a = t[i], b = t[n - 1 - i]; ronda.push((r + i) % 2 ? [b, a] : [a, b]); }
    ida.push(ronda);
    t.splice(1, 0, t.pop());
  }
  return ida.concat(ida.map(r => r.map(([a, b]) => [b, a])));
}
function iniciarTemporada(s, key, jornadasPrevias, año) {
  const ids = s.mundo.ligas[key];
  const T = { liga: key, año, jornada: 0, cal: calendario(s, ids), tabla: {} };
  for (const id of ids) T.tabla[id] = { pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0, pts: 0, forma: [] };
  s.temporada = T;
  for (let j = 0; j < jornadasPrevias; j++) { for (const [h, a] of T.cal[j]) simPartido(s, T, h, a); T.jornada++; }
}
function apuntar(T, h, a, gh, ga) {
  const A = T.tabla[h], B = T.tabla[a];
  A.pj++; B.pj++; A.gf += gh; A.gc += ga; B.gf += ga; B.gc += gh;
  const r = gh > ga ? ['V', 'D'] : gh < ga ? ['D', 'V'] : ['E', 'E'];
  for (const [x, k] of [[A, r[0]], [B, r[1]]]) {
    if (k === 'V') { x.g++; x.pts += 3; } else if (k === 'E') { x.e++; x.pts += 1; } else x.p++;
    x.forma.push(k); if (x.forma.length > 5) x.forma.shift();
  }
}
const golesEsperados = (fa, fb, casa) => clamp(1.3 * Math.exp((fa - fb + (casa ? 3 : -3)) / 20), 0.15, 4);
function simPartido(s, T, h, a) {
  const fh = club(s, h).fuerza, fa = club(s, a).fuerza;
  const gh = poisson(s, golesEsperados(fh, fa, true)), ga = poisson(s, golesEsperados(fa, fh, false));
  apuntar(T, h, a, gh, ga);
  return [gh, ga];
}
function clasificacion(T) {
  return Object.keys(T.tabla).sort((x, y) => {
    const a = T.tabla[x], b = T.tabla[y];
    return b.pts - a.pts || (b.gf - b.gc) - (a.gf - a.gc) || b.gf - a.gf || (x < y ? -1 : 1);
  });
}
function posicion(s, id) { return clasificacion(s.temporada).indexOf(id) + 1; }
function zona(key, pos) { // 'ascenso' | 'descenso' | 'campeon' | ''
  const i = infoLiga(key), T = CFG.temporada;
  if (i.tier === 1 && pos === 1) return 'campeon';
  if (i.tier > 1 && pos <= T.ascienden) return 'ascenso';
  if (i.tier < i.n && pos > T.equipos - T.descienden) return 'descenso';
  return '';
}
function proximoPartido(s) {
  const T = s.temporada;
  if (!T || T.jornada >= T.cal.length) return null;
  const yo = s.contrato.clubId;
  const m = T.cal[T.jornada].find(p => p.includes(yo));
  return m ? { casa: m[0] === yo, rival: m[0] === yo ? m[1] : m[0], jornada: T.jornada + 1 } : null;
}

let S = null;

function nuevaPartida(seed) {
  const i = CFG.inicio;
  const s = {
    v: 3,
    rng: (seed == null ? (Date.now() & 0x7fffffff) : seed) | 0,
    semana: 1, edad: i.edad,
    fase: 'barrio',
    p: { nivel: i.nivel, energia: i.energia, rep: i.rep, dinero: i.dinero },
    prep: null, contrato: null, temporada: null,
    lesion: 0, mods: [], agenda: [],
    trayectoria: [], stats: { partidos: 0, jugados: 0, goles: 0, asist: 0, notas: [] },
    negocio: null,
    pendiente: null, cola: [],
    eleccion: null, ultimo: null, verResultado: false, tab: 'semana',
    acum: { ingresosPers: 0, gastosPers: 0, impuestos: 0, ingresosNeg: 0, gastosNeg: 0 },
    historial: [], metaVista: false,
    cajaElegida: CFG.negocio.cajaOpciones[0],
    intro: true, nombre: '', avatar: CFG.avatares[0], posicion: 'delantero',
  };
  s.potencial = Math.round(CFG.club.potencial[0] + rnd(s) * (CFG.club.potencial[1] - CFG.club.potencial[0]));
  s.mundo = generarMundo(s);
  // El club del barrio: un equipo de la última división española
  const local = s.mundo.ligas['es-5'][0];
  club(s, local).fuerza = CFG.paises.es.ligas[4].fuerza - 2;
  s.clubLocal = local;
  s.ciudad = club(s, local).ciudad;
  return s;
}

function guardar() {
  try { localStorage.setItem(CFG.guardado, JSON.stringify(S)); return true; } catch (_) { return false; }
}
function cargar() {
  try {
    const t = localStorage.getItem(CFG.guardado);
    if (!t) return null;
    const s = JSON.parse(t);
    return s && s.v === 3 ? s : null;
  } catch (_) { return null; }
}
function reiniciar(seed) {
  try { localStorage.removeItem(CFG.guardado); } catch (_) {}
  S = nuevaPartida(seed);
  confirmarReinicio = false;
  guardar();
  render();
}
function encolar(s, ev) { if (!s.pendiente) s.pendiente = ev; else s.cola.push(ev); }

/* =====================================================================
   5. REGLAS (fórmulas que se muestran al jugador)
   ===================================================================== */
function repPlaza(s) {
  const b = CFG.barrio;
  return b.plazaRepBase + Math.floor(s.p.nivel / 10) + (s.p.energia >= 50 ? b.plazaBonusEnergia : 0);
}
function pruebaBase(s) { return s.p.nivel + s.p.energia / 5 + s.p.rep / 5 + (s.prep ? s.prep.ajuste : 0); }
function factorTecho(s) { return r1(clamp((s.potencial - s.p.nivel) / CFG.club.margenTecho, 0, 1)); }
function mejoraSemana(s, extra) { return (extra ? CFG.club.mejoraExtra : CFG.club.mejoraNormal) * calidadEntreno(s) * crecimientoEdad(s) * factorTecho(s); }
function crecimientoEdad(s) { for (const [hasta, f] of CFG.club.edadCrec) if (s.edad <= hasta) return f; return 0.4; }
function calidadEntreno(s) { return CFG.club.calidadTier[ligaDe(s, s.contrato.clubId).tier - 1] || 0.9; }
function visibilidad(s, id) { const i = ligaDe(s, id); return r1((CFG.club.visTier[i.tier - 1] || 1) * i.P.vis); }
function umbralTitular(s) { return miClub(s).fuerza + CFG.club.umbralSobreFuerza; }
function modsSeleccion(s, accionId) {
  const l = s.mods.filter(m => m.tipo === 'sel').map(m => [m.v, m.motivo]);
  if (accionId === 'patrocinio') l.push([-8, 'faltaste a una sesión']);
  if (accionId === 'visitaNegocio') l.push([-4, 'semana fuera del equipo']);
  return l;
}
function puntSeleccion(s, accionId) { return s.p.nivel + s.p.energia / 4 + modsSeleccion(s, accionId).reduce((a, [v]) => a + v, 0); }
function notaMedia(s) {
  const n = s.stats.notas.slice(-CFG.club.notasMejora);
  return n.length ? n.reduce((a, b) => a + b, 0) / n.length : 0;
}
function tramoActual(s) { return s.trayectoria[s.trayectoria.length - 1]; }
function valorNegocio(s) { return s.negocio ? Math.round(CFG.negocio.precio * (0.5 + s.negocio.fama / 100)) : 0; }
function patrimonio(s) { return s.p.dinero + (s.negocio ? s.negocio.caja + valorNegocio(s) : 0); }

for (const a of Object.values(ACCIONES)) a.t = a.ic + ' ' + a.n;

/* =====================================================================
   7. SEMANA
   ===================================================================== */
function elegir(id) {
  if (S.pendiente || S.verResultado) return false;
  const a = ACCIONES[id];
  if (!a || !a.fases.includes(S.fase)) return false;
  if (a.disponible && a.disponible(S)) return false;
  S.eleccion = id;
  guardar(); render();
  return true;
}
function foto(s) {
  return { nivel: s.p.nivel, energia: s.p.energia, rep: s.p.rep, dinero: s.p.dinero, caja: s.negocio ? s.negocio.caja : null, fama: s.negocio ? s.negocio.fama : null };
}

function avanzarSemana() {
  const s = S;
  if (s.pendiente || s.verResultado || !s.eleccion) return false;
  const id = s.eleccion, a = ACCIONES[id];
  if (!a || !a.fases.includes(s.fase) || (a.disponible && a.disponible(s))) { s.eleccion = null; render(); return false; }

  const R = { semana: s.semana, accion: a.t, accionId: id, fase: s.fase, dep: [], eco: [], neg: [], opo: [], prensa: [], negocio: null, partido: null, antes: foto(s) };
  const dineroAntes = s.p.dinero;
  const mods = modsSeleccion(s, id);
  a.aplicar(s, R);
  s.p.energia = clamp(s.p.energia, 0, CFG.energiaMax);

  if (s.fase === 'barrio' || s.fase === 'prep') {
    s.p.energia = clamp(s.p.energia + CFG.barrio.recuperacion, 0, CFG.energiaMax);
    R.dep.push(['Recuperación semanal', `+${CFG.barrio.recuperacion} energía`, 'Todas las semanas recuperas algo de energía.']);
  }
  if (s.fase === 'barrio') {
    if (s.p.rep >= CFG.barrio.repOjeador) {
      encolar(s, { tipo: 'ojeador', clubId: elegirClubOjeador(s) });
      R.opo.push(['Un ojeador te ha visto jugar', `Tu reputación (${s.p.rep}) llega a ${CFG.barrio.repOjeador}. Quiere invitarte a unas pruebas.`]);
    }
  } else if (s.fase === 'prep') {
    s.prep.semanasRestantes -= 1;
    if (s.prep.semanasRestantes <= 0) {
      const suerte = Math.round((rnd(s) * 2 - 1) * CFG.prueba.suerte);
      const score = Math.round(pruebaBase(s) + suerte);
      encolar(s, { tipo: 'ofertas', ventana: 'inicio', score, ofertas: primerasOfertas(s, score) });
      R.prueba = { score, suerte, nivel: s.p.nivel, energia: s.p.energia, rep: s.p.rep, ajuste: s.prep.ajuste };
      R.dep.push(['Día de las pruebas', `Puntuación: ${score}`,
        `Nivel ${nf(s.p.nivel)} + energía ${s.p.energia}/5 + reputación ${s.p.rep}/5${s.prep.ajuste ? ` ${sg(s.prep.ajuste)} por pedir más tiempo` : ''} + suerte ${sg(suerte)}.`]);
      R.opo.push(['Dos clubes te hacen una oferta', 'Compara las condiciones antes de firmar.']);
    }
  } else {
    semanaClub(s, R, mods);
  }

  if (s.negocio) semanaNegocio(s, R);
  procesarAgenda(s, R);
  tickMods(s, R);

  if (s.fase === 'club' && !s.negocio && s.p.dinero >= CFG.negocio.precio + CFG.negocio.cajaOpciones[0] && dineroAntes < CFG.negocio.precio + CFG.negocio.cajaOpciones[0]) {
    R.opo.push(['Ya puedes comprar la peluquería', `Ve a la pestaña «Negocio». Necesitas ${cr(CFG.negocio.precio)} + una caja inicial.`]);
  }
  if (!s.metaVista && s.negocio && patrimonio(s) >= CFG.metaPatrimonio) {
    s.metaVista = true;
    encolar(s, { tipo: 'meta' });
    R.opo.push(['¡Objetivo de la versión cumplido!', `Tu patrimonio supera ${cr(CFG.metaPatrimonio)}.`]);
  }
  // Sucesos: pequeños imprevistos de la vida (solo si no hay otra decisión pendiente)
  if (!s.pendiente && rnd(s) < CFG.club.probSuceso) {
    const ev = elegirSuceso(s);
    if (ev) encolar(s, { tipo: 'suceso', id: ev });
  }

  for (const [, v] of R.eco) { if (v > 0) s.acum.ingresosPers += v; else s.acum.gastosPers -= v; }
  s.p.nivel = clamp(r1(s.p.nivel), 0, CFG.nivelMax);
  s.p.rep = clamp(Math.round(s.p.rep), 0, 100);
  R.dineroFinal = s.p.dinero;
  R.patrimonio = patrimonio(s);
  s.historial.push({ semana: s.semana, dinero: s.p.dinero, caja: s.negocio ? s.negocio.caja : null, patrimonio: R.patrimonio });
  if (s.historial.length > 12) s.historial.shift();

  R.despues = foto(s);
  s.ultimo = R;
  s.eleccion = null;
  s.semana += 1;
  s.verResultado = true;
  guardar();
  render();
  return true;
}

function tickMods(s, R) {
  for (const m of s.mods) {
    if (m.tipo === 'ingreso') { s.p.dinero += m.v; R.eco.push([m.motivo, m.v]); }
    m.sem -= 1;
  }
  s.mods = s.mods.filter(m => m.sem > 0);
}
function procesarAgenda(s, R) {
  const hoy = s.agenda.filter(x => x.semana <= s.semana);
  s.agenda = s.agenda.filter(x => x.semana > s.semana);
  for (const x of hoy) {
    if (x.tipo === 'devolucion') {
      if (x.devuelve) { s.p.dinero += x.importe; R.eco.push(['Tu amigo te devuelve el préstamo', x.importe]); R.opo.push(['Te devuelven el dinero', `Tu amigo cumple: +${cr(x.importe)}.`]); }
      else R.opo.push(['El préstamo no vuelve', `Tu amigo no puede devolverte los ${cr(x.importe)}.`]);
    }
  }
}

function semanaClub(s, R, mods) {
  const c = s.contrato, K = CFG.club, T = s.temporada, yo = c.clubId, mi = miClub(s);
  const pos = CFG.posiciones[s.posicion];
  c.semanas += 1;
  const tramo = tramoActual(s);
  const P = { jornada: T.jornada + 1, liga: T.liga };
  R.clubId = yo;
  const energiaAntes = s.p.energia;
  let juega = false, titular = false;

  for (const [h, a] of T.cal[T.jornada]) {
    if (h !== yo && a !== yo) { simPartido(s, T, h, a); continue; }
    const casa = h === yo, rivalId = casa ? a : h, rival = club(s, rivalId);
    Object.assign(P, { casa, rivalId, rivalPos: posicion(s, rivalId) });
    s.stats.partidos += 1;

    // Selección
    if (s.lesion > 0) {
      P.rol = 'lesionado';
      s.lesion -= 1;
      R.dep.push(['No juegas: tienes una lesión', s.lesion > 0 ? `Quedan ${s.lesion} semanas` : 'Recuperación completa para la próxima semana', 'La duración de cada lesión es de ' + K.lesionSemanas.join(' a ') + ' semanas (el fisio la acorta).']);
    } else {
      const sel = puntSeleccion(s, R.accionId), umbral = umbralTitular(s);
      P.seleccion = r1(sel); P.umbral = umbral;
      if (sel >= umbral) P.rol = 'titular';
      else P.rol = rnd(s) < K.probJugarSuplente ? 'suplente' : 'banquillo';
      const extras = mods.map(([v, m]) => `${sg(v)} (${m})`).join(' ');
      R.dep.push([P.rol === 'titular' ? 'Eres titular' : P.rol === 'suplente' ? 'Sales desde el banquillo' : 'No llegas a jugar', '',
        `Selección = nivel ${nf(s.p.nivel)} + energía ${s.p.energia}/4${extras ? ' ' + extras : ''} = ${nf(sel)}. Para ser titular: fuerza del club ${mi.fuerza} + ${K.umbralSobreFuerza} = ${umbral}.${P.rol !== 'titular' ? ` Como suplente juegas el ${Math.round(K.probJugarSuplente * 100)} % de las veces.` : ''}`]);
    }
    juega = P.rol === 'titular' || P.rol === 'suplente';
    titular = P.rol === 'titular';

    // Nota antes de los goles
    let lUs = golesEsperados(mi.fuerza, rival.fuerza, casa), lThem = golesEsperados(rival.fuerza, mi.fuerza, !casa);
    if (juega) {
      const suerte = (rnd(s) * 2 - 1) * 1.2;
      P.notaBase = clamp(6 + pos.notaExtra + (s.p.nivel - rival.fuerza) / 8 + (s.p.energia - 60) / 30 + suerte, 3, 10);
      P.suerte = suerte;
      lUs *= Math.exp((P.notaBase - 6) * (titular ? 0.12 : 0.05));
    }
    const gUs = poisson(s, lUs), gThem = poisson(s, lThem);
    P.goles = 0; P.asist = 0;
    if (juega) {
      const f = (titular ? 1 : 0.35) * clamp(P.notaBase / 6.5, 0.6, 1.4);
      for (let g = 0; g < gUs; g++) { const u = rnd(s); if (u < pos.gol * f) P.goles++; else if (u < (pos.gol + pos.asis) * f) P.asist++; }
      P.nota = r1(clamp(P.notaBase + 0.6 * P.goles + 0.3 * P.asist - (s.posicion === 'defensa' ? 0.15 * Math.max(0, gThem - 1) : 0), 3, 10));
    }
    P.gf = gUs; P.gc = gThem;
    P.resultado = gUs > gThem ? 'victoria' : gUs < gThem ? 'derrota' : 'empate';
    apuntar(T, h, a, casa ? gUs : gThem, casa ? gThem : gUs);
    const estadio = club(s, h);
    P.estadio = estadio.estadio;
    P.publico = Math.round(estadio.cap * clamp(0.45 + rnd(s) * 0.35 + (casa ? 0.1 : 0), 0.2, 0.98) / 10) * 10;
  }
  T.jornada += 1;

  if (juega) {
    s.stats.jugados += 1; s.stats.goles += P.goles; s.stats.asist += P.asist;
    s.stats.notas.push(P.nota); if (s.stats.notas.length > 20) s.stats.notas.shift();
    tramo.pj += 1; if (titular) tramo.tit += 1; tramo.goles += P.goles; tramo.asist += P.asist; tramo.sumaNota += P.nota;
    R.dep.push([`Tu nota: ${nf(P.nota)}`, P.goles || P.asist ? `${'⚽'.repeat(P.goles)}${'👟'.repeat(P.asist)}` : '',
      `6${pos.notaExtra ? ' + ' + nf(pos.notaExtra) + ' por ser ' + pos.n.toLowerCase() : ''} + (nivel ${nf(s.p.nivel)} − fuerza del rival ${club(s, P.rivalId).fuerza})/8 + (energía ${s.p.energia} − 60)/30 + suerte ${sg(r1(P.suerte))}${P.goles ? ` + 0,6 por gol` : ''}${P.asist ? ` + 0,3 por asistencia` : ''}.`]);
  }
  R.dep.push([`${P.casa ? mi.nombre : club(s, P.rivalId).nombre} ${P.casa ? P.gf : P.gc}-${P.casa ? P.gc : P.gf} ${P.casa ? club(s, P.rivalId).nombre : mi.nombre}`, '',
    `Goles esperados según la fuerza de cada equipo (${mi.fuerza} contra ${club(s, P.rivalId).fuerza}) y quién juega en casa${juega ? '; tu nota empuja a tu equipo' : ''}.`]);

  // Reputación
  const vis = visibilidad(s, yo);
  let dRep;
  if (juega) dRep = Math.round(((P.nota - 6) * 2 * vis + P.goles * pos.repGol) * (titular ? 1 : 0.5)) + (P.resultado === 'victoria' ? 1 : 0);
  else dRep = -1;
  s.p.rep = clamp(s.p.rep + dRep, 0, 100);
  R.dep.push([`Reputación ${sg(dRep)}`, '', juega
    ? `((nota − 6) × 2 × visibilidad de tu liga ${nf(vis)} + goles × ${pos.repGol})${titular ? '' : ' × 0,5 por jugar poco'}${P.resultado === 'victoria' ? ' + 1 por la victoria' : ''}.`
    : 'Si no juegas pierdes 1 punto de reputación.']);

  // Energía y lesiones
  if (P.rol === 'titular') s.p.energia -= K.energiaTitular;
  if (P.rol === 'suplente') s.p.energia -= K.energiaSuplente;
  if (juega && energiaAntes < K.lesionUmbral) {
    const prob = (K.lesionUmbral - energiaAntes) * K.lesionPctPorPunto;
    if (rnd(s) * 100 < prob) {
      s.lesion = K.lesionSemanas[0] + Math.floor(rnd(s) * (K.lesionSemanas[1] - K.lesionSemanas[0] + 1));
      P.lesion = s.lesion;
      R.dep.push(['⚠️ Te lesionas', `${s.lesion} ${s.lesion === 1 ? 'semana' : 'semanas'} sin jugar`, `Jugaste con energía ${energiaAntes} (< ${K.lesionUmbral}): riesgo ${prob} %.`]);
    } else R.dep.push(['Sin lesión, por poco', '', `Jugaste con energía ${energiaAntes} (< ${K.lesionUmbral}): había un riesgo de lesión del ${prob} %.`]);
  }
  s.p.energia = clamp(s.p.energia + K.recuperacion, 0, CFG.energiaMax);
  R.dep.push(['Recuperación semanal', `+${K.recuperacion} energía`, `Partido: titular −${K.energiaTitular}, suplente −${K.energiaSuplente}.`]);
  R.partido = P;

  // Economía personal
  let bruto = c.salario;
  R.eco.push([`Salario (${mi.nombre})`, c.salario]);
  if (juega && P.resultado === 'victoria' && c.primaVictoria) { bruto += c.primaVictoria; R.eco.push(['Prima por victoria', c.primaVictoria]); }
  if (juega && P.goles && c.primaGol) { bruto += c.primaGol * P.goles; R.eco.push([`Prima por gol (${P.goles})`, c.primaGol * P.goles]); }
  const tipo = tipoImpuesto(bruto), imp = Math.round(bruto * tipo);
  s.p.dinero += bruto - imp;
  R.eco.push([`Impuestos (${Math.round(tipo * 100)} %)`, -imp]);
  s.acum.impuestos += imp;
  s.p.dinero -= c.vida;
  R.eco.push([c.vida === K.gastosFamilia ? 'Gastos (vives con tu familia)' : `Gastos de vida (${CFG.paises[mi.pais].n})`, -c.vida]);

  // Prensa
  prensaSemana(s, R, P);

  // Mercado de invierno y fin de temporada
  if (T.jornada === CFG.temporada.mercadoInvierno) abrirMercado(s, R, 'invierno');
  if (T.jornada >= CFG.temporada.jornadas) finTemporada(s, R);
  else if (!c.mejora && condicionMejora(s).ok) {
    c.mejora = true;
    encolar(s, { tipo: 'mejora', oferta: ofertaMejora(s) });
    R.opo.push(['El club quiere mejorar tu contrato', 'Tu rendimiento ha convencido al club.']);
  }
}

function prensaSemana(s, R, P) {
  const mi = miClub(s), rv = club(s, P.rivalId), dia = ['Diario del Gol', 'La Jugada', 'Deporte Local', 'Marcador Final'][s.semana % 4];
  const marc = P.casa ? `${mi.nombre} ${P.gf}-${P.gc} ${rv.nombre}` : `${rv.nombre} ${P.gc}-${P.gf} ${mi.nombre}`;
  let txt;
  if (P.nota >= 8) txt = `«${s.nombre} se sale»: ${marc}. Nota ${nf(P.nota)}${P.goles ? ` y ${P.goles} ${P.goles === 1 ? 'gol' : 'goles'}` : ''}.`;
  else if (P.goles) txt = `${marc}: ${P.goles === 1 ? 'gol' : 'doblete'} de ${s.nombre}.`;
  else if (P.rol === 'lesionado') txt = `${marc}. ${s.nombre}, baja por lesión.`;
  else if (P.rol === 'banquillo') txt = `${marc}. ${s.nombre} no sale del banquillo.`;
  else txt = `${marc}. ${P.resultado === 'victoria' ? 'Victoria' : P.resultado === 'empate' ? 'Reparto de puntos' : 'Derrota'} en la jornada ${P.jornada}.`;
  R.prensa.push([dia, txt]);
  const T = s.temporada, orden = clasificacion(T), lider = club(s, orden[0]);
  R.prensa.push([dia, `${lider.nombre} lidera la ${infoLiga(T.liga).L.n} con ${T.tabla[orden[0]].pts} puntos. ${mi.nombre}, ${orden.indexOf(mi.id) + 1}º.`]);
}

/* ---- Contrato: mejora, mercado y fin de temporada ---- */
function condicionMejora(s) {
  const K = CFG.club, c = s.contrato, media = notaMedia(s);
  const jugados = tramoActual(s) ? tramoActual(s).pj : 0;
  return { semanas: c.semanas, jugados, media, notaReq: K.notaMejora,
    ok: c.semanas >= K.semanasMinMejora && jugados >= K.partidosMinMejora && media >= K.notaMejora };
}
function ofertaMejora(s) {
  const c = s.contrato;
  return { salario: red(c.salario * CFG.club.mejoraFactor, 10), temporadas: Math.max(c.temporadasRestantes, 1) + 1 };
}

function elegirClubOjeador(s) { // un club de 4ª división española
  const ids = s.mundo.ligas['es-4'].slice().sort((a, b) => club(s, a).fuerza - club(s, b).fuerza);
  return ids[Math.floor(ids.length / 2)];
}
function primerasOfertas(s, score) {
  const O = CFG.primerasOfertas, l = O.local, f = O.fuera;
  const ojeador = s.pendienteOjeador || elegirClubOjeador(s);
  return [
    { clubId: s.clubLocal, salario: red(l.salarioBase + Math.max(0, score - l.desde) * l.porPunto, 5), temporadas: l.temporadas, fichaje: l.fichaje,
      primaVictoria: l.primaVictoria, primaGol: 0, primaAscenso: l.primaAscenso, subidaAscenso: l.subidaAscenso, bajadaDescenso: 0,
      vida: CFG.club.gastosFamilia, familia: true, motivo: `El club de tu barrio. Sueldo = ${l.salarioBase} + ${l.porPunto} por punto de prueba por encima de ${l.desde}.` },
    { clubId: ojeador, salario: score >= f.umbral ? f.salarioBueno : f.salarioFormacion, temporadas: f.temporadas, fichaje: f.fichaje,
      primaVictoria: f.primaVictoria, primaGol: 0, primaAscenso: f.primaAscenso, subidaAscenso: f.subidaAscenso, bajadaDescenso: f.bajadaDescenso,
      vida: CFG.paises.es.vida, familia: false, motivo: score >= f.umbral ? `El club del ojeador. Tu prueba (${score}) llega a ${f.umbral}: contrato completo.` : `El club del ojeador. Tu prueba (${score}) no llega a ${f.umbral}: contrato de formación.` },
  ];
}
function repRequerida(id, s) { const i = ligaDe(s, id); return Math.max(0, Math.round((i.L.fuerza - 40) * 1.2) + i.P.extranjero); }
function terminosOferta(s, id) {
  const c = club(s, id), i = ligaDe(s, id), L = i.L;
  const f = clamp((s.p.nivel - (c.fuerza - 8)) / 20, 0, 1);
  const salario = red((L.sueldo[0] + (L.sueldo[1] - L.sueldo[0]) * (0.2 + 0.6 * f)) * (0.9 + rnd(s) * 0.2), 10);
  const conAscenso = i.tier > 1 && rnd(s) < 0.7;
  const pos = CFG.posiciones[s.posicion];
  const familia = c.pais === 'es' && c.ciudad === s.ciudad;
  return {
    clubId: id, salario, temporadas: 1 + Math.floor(rnd(s) * 3), fichaje: red(salario * (2 + rnd(s) * 6), 50),
    primaVictoria: red(salario * 0.12, 5), primaGol: red(salario * pos.primaGol, 5),
    primaAscenso: conAscenso ? red(salario * (6 + rnd(s) * 6), 100) : 0, subidaAscenso: conAscenso ? azar(s, [20, 30, 50]) : 0,
    bajadaDescenso: i.tier < i.n && rnd(s) < 0.5 ? 25 : 0,
    vida: familia ? CFG.club.gastosFamilia : i.P.vida, familia,
    motivo: `Tu nivel (${Math.round(s.p.nivel)}) encaja con su equipo (fuerza ${c.fuerza}) y tu reputación (${s.p.rep}) llega a la que piden (${repRequerida(id, s)}).`,
  };
}
function generarOfertas(s, max) {
  const cands = [];
  for (const c of Object.values(s.mundo.clubs)) {
    if (s.contrato && c.id === s.contrato.clubId) continue;
    const d = s.p.nivel - c.fuerza;
    if (d < -5 || d > 12) continue;
    if (s.p.rep < repRequerida(c.id, s)) continue;
    cands.push({ id: c.id, peso: 1 / (1 + Math.abs(d - 3)) + (c.pais !== 'es' ? 0.05 : 0) });
  }
  const out = [];
  while (out.length < max && cands.length) {
    const tot = cands.reduce((a, x) => a + x.peso, 0);
    let u = rnd(s) * tot, k = 0;
    while (k < cands.length - 1 && (u -= cands[k].peso) > 0) k++;
    out.push(terminosOferta(s, cands[k].id));
    cands.splice(k, 1);
  }
  return out;
}
function abrirMercado(s, R, ventana) {
  const ofertas = generarOfertas(s, ventana === 'invierno' ? 2 : 3);
  const c = s.contrato;
  if (ventana === 'verano' && c.temporadasRestantes <= 0) {
    const m = notaMedia(s), sube = m >= CFG.club.notaMejora;
    ofertas.unshift({ ...c, renovacion: true, salario: red(c.salario * (sube ? 1.1 : 0.9), 10), temporadas: 2, fichaje: 0,
      motivo: `Renovación con tu club: sueldo ${sube ? '+10 %' : '−10 %'} porque tu nota media (${nf(m)}) ${sube ? 'llega' : 'no llega'} a ${nf(CFG.club.notaMejora)}.` });
  }
  if (!ofertas.length) {
    R.opo.push([`Mercado de ${ventana}`, 'Ningún club ha preguntado por ti. Mejora tu nivel o tu reputación.']);
    if (ventana === 'verano') arrancarNuevaTemporada(s);
    return;
  }
  encolar(s, { tipo: 'ofertas', ventana, ofertas });
  R.opo.push([`Mercado de ${ventana}: ${ofertas.length} ${ofertas.length === 1 ? 'oferta' : 'ofertas'}`, 'Puedes fichar o seguir donde estás.']);
}

function finTemporada(s, R) {
  const T = s.temporada, c = s.contrato, yo = c.clubId, orden = clasificacion(T);
  const pos = orden.indexOf(yo) + 1, z = zona(T.liga, pos), tramo = tramoActual(s);
  const info = { tipo: 'fin', año: T.año, liga: T.liga, pos, zona: z, tabla: orden.map(id => [id, { ...T.tabla[id] }]), primas: [], tramo: { ...tramo } };
  if (z === 'ascenso' || z === 'campeon') {
    if (c.primaAscenso) {
      if (tramo.pj >= CFG.club.partidosMinPrimaAscenso) {
        const imp = Math.round(c.primaAscenso * tipoImpuesto(c.primaAscenso));
        s.p.dinero += c.primaAscenso - imp; s.acum.ingresosPers += c.primaAscenso - imp; s.acum.impuestos += imp;
        info.primas.push(`Prima por ${z === 'campeon' ? 'título' : 'ascenso'}: +${cr(c.primaAscenso)} (−${cr(imp)} de impuestos)`);
        R.eco.push([`Prima por ${z === 'campeon' ? 'título' : 'ascenso'} (neta)`, c.primaAscenso - imp]);
      } else info.primas.push(`Sin prima por ascenso: necesitabas ${CFG.club.partidosMinPrimaAscenso} partidos jugados (tienes ${tramo.pj}).`);
    }
    if (c.subidaAscenso) { const antes = c.salario; c.salario = red(c.salario * (1 + c.subidaAscenso / 100), 10); info.primas.push(`Cláusula de ascenso: sueldo ${cr(antes)} → ${cr(c.salario)} (+${c.subidaAscenso} %)`); }
  }
  if (z === 'descenso' && c.bajadaDescenso) { const antes = c.salario; c.salario = red(c.salario * (1 - c.bajadaDescenso / 100), 10); info.primas.push(`Cláusula de descenso: sueldo ${cr(antes)} → ${cr(c.salario)} (−${c.bajadaDescenso} %)`); }

  actualizarMundo(s, T.liga, orden);
  s.edad += 1;
  c.temporadasRestantes -= 1;
  info.ligaNueva = s.mundo.de[yo];
  encolar(s, info);
  R.opo.push([z === 'campeon' ? '🏆 ¡Campeones de liga!' : z === 'ascenso' ? '🎉 ¡Ascenso!' : z === 'descenso' ? '😢 Descenso' : 'Fin de temporada',
    `${miClub(s).nombre} termina ${pos}º en la ${infoLiga(T.liga).L.n}. Cumples ${s.edad} años.`]);
  abrirMercado(s, R, 'verano');
}
function actualizarMundo(s, ligaJugador, ordenJugador) {
  const M = s.mundo, T = CFG.temporada, mov = [];
  for (const [pk, P] of Object.entries(CFG.paises)) {
    const ordenes = P.ligas.map((L, i) => {
      const key = `${pk}-${i + 1}`;
      if (key === ligaJugador) return ordenJugador.slice();
      return M.ligas[key].map(id => [id, club(s, id).fuerza + rnd(s) * 12]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    });
    for (let i = 0; i < ordenes.length; i++) {
      if (i > 0) for (const id of ordenes[i].slice(0, T.ascienden)) mov.push([id, `${pk}-${i}`, +3]);
      if (i < ordenes.length - 1) for (const id of ordenes[i].slice(-T.descienden)) mov.push([id, `${pk}-${i + 2}`, -3]);
    }
  }
  for (const [id, key, df] of mov) {
    const old = M.de[id];
    M.ligas[old] = M.ligas[old].filter(x => x !== id);
    M.ligas[key].push(id);
    M.de[id] = key;
    club(s, id).fuerza += df;
  }
  for (const c of Object.values(M.clubs)) { // cada club se acerca al nivel de su división
    const L = infoLiga(M.de[c.id]).L;
    c.fuerza = Math.round(c.fuerza + (L.fuerza - c.fuerza) * 0.2 + (rnd(s) * 2 - 1) * 2);
  }
}
function arrancarNuevaTemporada(s) {
  const año = s.temporada.año + 1;
  iniciarTemporada(s, s.mundo.de[s.contrato.clubId], 0, año);
  nuevoTramo(s);
}
function nuevoTramo(s) {
  s.trayectoria.push({ año: s.temporada.año, clubId: s.contrato.clubId, liga: s.mundo.de[s.contrato.clubId], pj: 0, tit: 0, goles: 0, asist: 0, sumaNota: 0 });
}
function firmar(s, o, ventana) {
  const cambia = !s.contrato || s.contrato.clubId !== o.clubId;
  const paisAntes = s.contrato ? miClub(s).pais : 'es';
  s.contrato = { clubId: o.clubId, salario: o.salario, temporadasRestantes: o.temporadas, fichaje: o.fichaje,
    primaVictoria: o.primaVictoria, primaGol: o.primaGol, primaAscenso: o.primaAscenso, subidaAscenso: o.subidaAscenso,
    bajadaDescenso: o.bajadaDescenso, vida: o.vida, familia: o.familia, mejora: false, semanas: 0 };
  s.fase = 'club';
  s.prep = null;
  const msgs = [];
  if (o.fichaje) {
    const imp = Math.round(o.fichaje * tipoImpuesto(o.fichaje));
    s.p.dinero += o.fichaje - imp; s.acum.ingresosPers += o.fichaje - imp; s.acum.impuestos += imp;
    msgs.push(`Prima de fichaje: +${cr(o.fichaje - imp)} netos.`);
  }
  if (cambia && club(s, o.clubId).pais !== paisAntes) {
    s.mods.push({ tipo: 'sel', v: -4, sem: 6, motivo: 'adaptación al país' });
    msgs.push(`Nuevo país: −4 en la selección durante 6 semanas (adaptación).`);
  }
  if (ventana === 'inicio') { iniciarTemporada(s, s.mundo.de[o.clubId], 0, CFG.temporada.añoInicio); nuevoTramo(s); }
  else if (ventana === 'invierno' && cambia) { iniciarTemporada(s, s.mundo.de[o.clubId], s.temporada.jornada, s.temporada.año); nuevoTramo(s); }
  else if (ventana === 'verano') arrancarNuevaTemporada(s);
  return msgs;
}

function elegirSuceso(s) {

/* =====================================================================
   9. EVENTOS (decisiones que llegan en una semana)
   ===================================================================== */
function resolver(opcion) {
  const s = S, ev = s.pendiente;
  if (!ev || s.verResultado) return false;
  let msg = '';
  if (ev.tipo === 'ojeador') {
    const largo = opcion === 'largo';
    if (opcion !== 'corto' && !largo) return false;
    s.fase = 'prep';
    s.pendienteOjeador = ev.clubId;
    s.prep = { semanasRestantes: largo ? CFG.prueba.semanasLargo : CFG.prueba.semanasCorto, ajuste: largo ? -CFG.prueba.penalLargo : 0 };
  } else if (ev.tipo === 'ofertas') {
    if (opcion === 'quedarse') {
      if (ev.ventana === 'inicio' || (ev.ventana === 'verano' && s.contrato.temporadasRestantes <= 0)) return false;
      if (ev.ventana === 'verano') arrancarNuevaTemporada(s);
      msg = `Sigues en ${miClub(s).nombre}.`;
    } else {
      const o = ev.ofertas[Number(opcion)];
      if (!o) return false;
      const msgs = firmar(s, o, ev.ventana);
      msg = `${o.renovacion ? 'Renuevas con' : 'Firmas por'} ${club(s, o.clubId).nombre}: ${cr(o.salario)}/semana. ${msgs.join(' ')}`;
    }
  } else if (ev.tipo === 'mejora') {
    const o = ev.oferta, N = CFG.negociacion, c = s.contrato;
    if (opcion === 'aceptar') { c.salario = o.salario; c.temporadasRestantes = o.temporadas; msg = `Firmas: ${cr(o.salario)} por semana.`; }
    else if (opcion === 'pedir') {
      const prob = clamp(s.p.rep, N.probMin, N.probMax);
      if (rnd(s) * 100 < prob) { c.salario = red(o.salario * N.pedirMasFactor, 10); c.temporadasRestantes = o.temporadas; msg = `¡El club acepta! Firmas por ${cr(c.salario)} por semana (probabilidad era ${prob} %).`; }
      else { c.salario = o.salario; c.temporadasRestantes = o.temporadas; s.mods.push({ tipo: 'sel', v: -N.tensionSeleccion, sem: N.tensionSemanas, motivo: 'relación tensa con el club' }); msg = `El club no acepta (probabilidad era ${prob} %). Firmas la oferta inicial y la relación queda tensa: −${N.tensionSeleccion} en la selección durante ${N.tensionSemanas} semanas.`; }
    } else if (opcion === 'largo') {
      const sal = red(o.salario * N.largoFactor, 10), prima = sal * N.largoPrimaSemanas;
      c.salario = sal; c.temporadasRestantes = o.temporadas + N.largoTemporadas;
      const imp = Math.round(prima * tipoImpuesto(prima));
      s.p.dinero += prima - imp; s.acum.ingresosPers += prima - imp; s.acum.impuestos += imp;
      msg = `Firmas ${c.temporadasRestantes} temporadas por ${cr(sal)} por semana y cobras ahora ${cr(prima - imp)} netos de prima.`;
    } else return false;
  } else if (ev.tipo === 'suceso') {
    const e = SUCESOS[ev.id], op = e && e.ops[Number(opcion)];
    if (!op) return false;
    msg = op[2](s);
    s.p.nivel = clamp(r1(s.p.nivel), 0, CFG.nivelMax); s.p.rep = clamp(s.p.rep, 0, 100);
  } else if (ev.tipo === 'fin' || ev.tipo === 'meta') {
    // solo informativo
  } else return false;
  s.pendiente = s.cola.shift() || null;
  s.aviso = msg;
  guardar(); render();
  return true;
}

/* =====================================================================
   10. NEGOCIO
   ===================================================================== */
function comprarNegocio(caja) {
  const s = S, N = CFG.negocio;
  if (s.negocio || s.fase !== 'club' || !N.cajaOpciones.includes(caja)) return false;
  if (s.p.dinero < N.precio + caja) return false;
  s.p.dinero -= N.precio + caja;
  s.acum.gastosPers += N.precio + caja;
  s.negocio = { fama: N.famaInicial, precio: 'normal', empleados: 1, sueldo: 'basico', caja, semanas: 0, ultimo: null };
  s.aviso = `Has comprado la ${N.nombre} por ${cr(N.precio)} y pones ${cr(caja)} en su caja. Desde ahora, la caja del negocio y tu dinero van por separado.`;
  s.tab = 'negocio';
  guardar(); render();
  return true;
}
function cambiarNegocio(campo, valor) {
  const n = S.negocio, N = CFG.negocio;
  if (!n || S.verResultado) return false;
  if (campo === 'precio' && N.precios[valor]) n.precio = valor;
  else if (campo === 'sueldo' && N.sueldos[valor]) n.sueldo = valor;
  else if (campo === 'empleados') {
    const v = n.empleados + valor;
    if (v < N.empleadosMin || v > N.empleadosMax) return false;
    if (valor > 0) { if (n.caja < N.costeContratar) return false; n.caja -= N.costeContratar; S.acum.gastosNeg += N.costeContratar; S.aviso = `Contratas a una persona más: −${cr(N.costeContratar)} de la caja (formación).`; }
    else { const ind = N.sueldos[n.sueldo].coste; n.caja -= ind; S.acum.gastosNeg += ind; S.aviso = `Despides a una persona: −${cr(ind)} de indemnización (una semana de sueldo).`; }
    n.empleados = v;
  } else return false;
  guardar(); render();
  return true;
}
function traspasar(dir) {
  const s = S, n = s.negocio, t = CFG.negocio.traspaso;
  if (!n || s.verResultado) return false;
  if (dir === 'aCaja') { if (s.p.dinero < t) return false; s.p.dinero -= t; n.caja += t; s.aviso = `Pasas ${cr(t)} de tu dinero a la caja del negocio.`; }
  else if (dir === 'aPersonal') { if (n.caja < t) return false; n.caja -= t; s.p.dinero += t; s.aviso = `Retiras ${cr(t)} de la caja a tu dinero personal.`; }
  else return false;
  guardar(); render();
  return true;
}
function semanaNegocio(s, R) {
  const n = s.negocio, N = CFG.negocio;
  const pr = N.precios[n.precio], su = N.sueldos[n.sueldo];
  const famaAntes = n.fama, fm = factorModsNegocio(s);
  const demanda = Math.round(demandaNegocio(s, n) * (0.9 + rnd(s) * 0.2));
  const cap = capacidadNegocio(n);
  const clientes = Math.min(demanda, cap), perdidos = demanda - clientes;
  const ingresos = clientes * pr.precio, sueldos = n.empleados * su.coste, productos = Math.round(clientes * N.productoPorCliente);
  const gastos = N.alquiler + sueldos + productos, resultado = ingresos - gastos;
  n.caja += resultado; n.semanas += 1;
  s.acum.ingresosNeg += ingresos; s.acum.gastosNeg += gastos;
  const fam = [];
  let dPrecio = pr.fama;
  if (n.precio === 'premium' && n.fama >= pr.famaSinPenal) dPrecio = 0;
  if (dPrecio) fam.push([dPrecio, n.precio === 'premium' ? `precio premium con fama < ${pr.famaSinPenal}` : 'precios populares']);
  fam.push([su.fama, su.fama > 0 ? 'personal bien pagado' : 'rotación por sueldo básico']);
  if (perdidos > 5) fam.push([N.colasFama, `${perdidos} clientes sin atender`]);
  if (n.caja < 0) fam.push([N.impagoFama, 'caja en negativo: pagos con retraso']);
  for (const [d] of fam) n.fama += d;
  n.fama = clamp(n.fama, 0, 100);
  n.ultimo = { demanda, cap, clientes, perdidos, ingresos, sueldos, productos, alquiler: N.alquiler, gastos, resultado, famaAntes, fama: n.fama, fam };
  R.negocio = n.ultimo;
  R.neg.push([`Clientes: ${clientes} de ${demanda} interesados`, perdidos > 0 ? `${perdidos} se van sin atender` : '',
    `Demanda = ${N.demandaBase} × precio ${pr.nombre.toLowerCase()} ${nf(pr.factor)} × (0,2 + fama ${famaAntes}/80) × (1 + tu reputación ${s.p.rep}/200)${fm !== 1 ? ` × ${nf(fm)} (competencia)` : ''} ± 10 %. Capacidad = ${n.empleados} × ${su.capacidad}.`]);
  R.neg.push([`Resultado semanal: ${resultado >= 0 ? '+' : ''}${cr(resultado)}`, '',
    `Ingresos ${cr(ingresos)} (${clientes} × ${pr.precio} €) − alquiler ${cr(N.alquiler)} − sueldos ${cr(sueldos)} − productos ${cr(productos)}.`]);
  R.neg.push([`Fama ${famaAntes} → ${n.fama}`, '', fam.map(([d, t]) => `${sg(d)} ${t}`).join(' · ')]);
  if (n.caja < 0) R.opo.push(['⚠️ La caja del negocio está en negativo', 'Pasa dinero personal a la caja o cambia precios/personal; cada semana en negativo resta fama.']);
}

function objetivos(s) {
  const out = [], N = CFG.negocio;
  if (s.fase === 'barrio') {
    out.push({ t: 'Llama la atención de un ojeador', d: `Reputación ${s.p.rep} de ${CFG.barrio.repOjeador}. Los partidos en la plaza dan reputación (más con nivel y energía).`, prog: s.p.rep / CFG.barrio.repOjeador });
    out.push({ t: 'Preparar las pruebas' });
    return out;
  }
  if (s.fase === 'prep') {
    const k = s.prep.semanasRestantes, est = Math.round(pruebaBase(s)), u = CFG.primerasOfertas.fuera.umbral;
    out.push({ t: k === 1 ? 'Las pruebas son al final de esta semana' : `Prepara las pruebas: quedan ${k} semanas`,
      d: `Puntuación estimada: ${est} (± ${CFG.prueba.suerte}) = nivel + energía/5 + reputación/5${s.prep.ajuste ? ` ${sg(s.prep.ajuste)}` : ''}. Con ${u} o más, el club del ojeador ofrece contrato completo.`,
      prog: clamp(est / u, 0, 1) });
    out.push({ t: 'Elegir entre dos clubes' });
    return out;
  }
  const c = s.contrato, cm = condicionMejora(s), i = ligaDe(s, c.clubId), T = s.temporada, pos = posicion(s, c.clubId);
  const objCompra = N.precio + N.cajaOpciones[0];
  if (s.metaVista) out.push({ t: 'Objetivos de esta versión cumplidos', d: 'Puedes seguir tu carrera o reiniciar en «Finanzas».', prog: 1 });
  if (!c.mejora) out.push({ t: 'Gánate una mejora de contrato',
    d: `${CFG.club.semanasMinMejora} semanas en el club (${cm.semanas}), ${CFG.club.partidosMinMejora} partidos jugados (${cm.jugados}) y nota media ≥ ${nf(cm.notaReq)} en los últimos ${CFG.club.notasMejora} (${cm.media ? nf(cm.media) : '—'}).`,
    prog: Math.min(cm.semanas / CFG.club.semanasMinMejora, cm.jugados / CFG.club.partidosMinMejora, cm.media / cm.notaReq, 1) });
  if (!s.negocio) out.push({ t: 'Ahorra para comprar la peluquería', d: `Dinero ${cr(s.p.dinero)} de ${cr(objCompra)} (precio ${cr(N.precio)} + caja mínima ${cr(N.cajaOpciones[0])}). Sube de categoría para cobrar más.`, prog: s.p.dinero / objCompra });
  if (i.tier > 1) out.push({ t: `Sube a ${i.P.ligas[i.tier - 2].n}`, d: `${miClub(s).nombre} va ${pos}º (ascienden los ${CFG.temporada.ascienden} primeros, jornada ${T.jornada}/${CFG.temporada.jornadas}). También puedes fichar por un club de más categoría en el mercado.`, prog: 1 - (pos - 1) / (CFG.temporada.equipos - 1) });
  if (s.negocio) out.push({ t: `Haz crecer tu patrimonio hasta ${cr(CFG.metaPatrimonio)}`, d: `Ahora: ${cr(patrimonio(s))} = dinero personal + caja del negocio + valor del negocio.`, prog: patrimonio(s) / CFG.metaPatrimonio });
  return out;
}

function estrellas(f) { const k = Math.round(f / 20); return '★'.repeat(k) + '☆'.repeat(5 - k); }

      : '<p><b>🔒 Necesitas un contrato profesional para comprarla.</b></p>'}

  }
  const n = s.negocio, u = n.ultimo, dem = Math.round(demandaNegocio(s, n)), cap = capacidadNegocio(n), mx = Math.max(dem, cap, 1);
  const pr = N.precios[n.precio];

      ${s.mods.filter(m => m.tipo === 'demanda').map(m => `<span class="badge b">📉 ${esc(m.motivo)} (${m.sem} sem)</span>`).join('')}

/* ---- Resultado de la semana ---- */
function pantallaResultado() {
  const R = S.ultimo, A = R.antes, D = R.despues;
  const lineas = items => items.map(([h, v, r]) => `<div class="res-line"><span class="h">${esc(h)}</span>${v ? ` <span>${esc(v)}</span>` : ''}${r ? `<span class="r">${esc(r)}</span>` : ''}</div>`).join('');
  let html = `<section class="card" id="resultado" style="text-align:center"><h2>Semana ${R.semana} · resumen</h2><h3>${esc(R.accion)}</h3></section>`;
  const P = R.partido;
  if (P) {
    const mi = club(S, R.clubId), rv = club(S, P.rivalId);
    const h = P.casa ? mi : rv, a = P.casa ? rv : mi, gh = P.casa ? P.gf : P.gc, ga = P.casa ? P.gc : P.gf;
    const notaCls = P.nota == null ? 'no' : P.nota >= 7 ? 'hi' : P.nota >= 6 ? 'mid' : 'lo';
    const rol = { titular: '✅ Titular', suplente: '🔁 Suplente', banquillo: '🪑 Sin jugar', lesionado: '🤕 Lesión' }[P.rol];
    const motivo = P.rol === 'lesionado' ? 'No puedes jugar hasta recuperarte.' : `Selección ${nf(P.seleccion)} frente a ${P.umbral} para ser titular.`;
    html += `<section class="card board"><h2>${esc(infoLiga(P.liga).L.n)} · Jornada ${P.jornada}</h2>
      <div class="teams"><div>${escudoClub(h, 40)}<br>${esc(h.nombre)}</div><div class="score">${gh}-${ga}</div><div>${escudoClub(a, 40)}<br>${esc(a.nombre)}</div></div>
      <div class="ribbon ${P.resultado}">${P.resultado.toUpperCase()}</div>
      <p class="small" style="color:#b9b0e0;margin-top:10px">🏟️ ${esc(P.estadio)} · ${cr(P.publico).replace(' €', '')} espectadores</p></section>
      <section class="card"><div class="me"><div class="nota ${notaCls}">${P.nota == null ? '—' : nf(P.nota)}</div>
      <div><h3 style="margin:0">${rol} ${'⚽'.repeat(P.goles || 0)}${'👟'.repeat(P.asist || 0)}</h3><p class="small" style="margin:2px 0">${esc(motivo)}</p>
      ${P.nota != null ? `<p class="small" style="margin:2px 0">Nota: tu nivel frente al rival (fuerza ${rv.fuerza}), tu energía y algo de suerte${P.goles ? '; los goles suman' : ''}.</p>` : ''}</div></div></section>`;
  }
  if (R.prueba) {
    html += `<section class="card board"><h2>Día de las pruebas</h2><div class="big">${R.prueba.score}</div>
      <p>💪 ${nf(R.prueba.nivel)} + ⚡ ${R.prueba.energia}/5 + ⭐ ${R.prueba.rep}/5${R.prueba.ajuste ? ` ${sg(R.prueba.ajuste)}` : ''} + 🍀 ${sg(R.prueba.suerte)}</p></section>`;
  }
  const rw = [];
  const add = (ic, d, txt) => { if (d && Math.abs(d) >= 0.05) rw.push(`<span class="rw ${d > 0 ? 'g' : 'b'}" style="animation-delay:${0.15 + rw.length * 0.12}s">${txt || `${ic} ${sg(d)}`}</span>`); };
  add('€', D.dinero - A.dinero, `👛 ${D.dinero - A.dinero > 0 ? '+' : ''}${cr(D.dinero - A.dinero)}`);
  add('💪', D.nivel - A.nivel); add('⚡', D.energia - A.energia); add('⭐', D.rep - A.rep);
  if (A.caja != null && D.caja != null) add('🏪', D.caja - A.caja, `🏪 ${D.caja - A.caja > 0 ? '+' : ''}${cr(D.caja - A.caja)}`);
  if (A.fama != null && D.fama != null) add('✨', D.fama - A.fama);
  if (rw.length) html += `<section class="card"><h2 style="text-align:center">Botín de la semana</h2><div class="rewards">${rw.join('')}</div></section>`;
  if (R.opo.length) html += `<section class="card news"><h2>📣 Novedades</h2>${R.opo.map(([h, r]) =>
    `<div class="it"><span class="ic">${/^\p{Extended_Pictographic}/u.test(h) ? '' : '🔔'}</span><div><b>${esc(h)}</b><div class="small">${esc(r)}</div></div></div>`).join('')}</section>`;
  if (R.prensa && R.prensa.length) html += `<section class="card paper"><h2>📰 Prensa</h2>${R.prensa.map(([m, t]) => `<p><span class="medio">${esc(m)}</span> ${esc(t)}</p>`).join('')}</section>`;
  html += `<details class="card why"><summary>🔍 ¿Por qué ha pasado esto? (reglas)</summary>
    ${R.dep.length ? `<h4>⚽ Deporte</h4>${lineas(R.dep)}` : ''}
    ${R.eco.length ? `<h4>👛 Tu dinero</h4><table>${R.eco.map(([t, v]) => `<tr><td>${esc(t)}</td><td class="n ${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : ''}${cr(v)}</td></tr>`).join('')}
      <tr class="tot"><td>Ahora tienes</td><td class="n">${cr(R.dineroFinal)}</td></tr></table>` : ''}
    ${R.neg.length ? `<h4>🏪 Negocio</h4>${lineas(R.neg)}` : ''}</details>`;
  return html;
}

        <div class="tile"><div class="ic">⚽</div><b>${t.goles}</b><span>Goles</span></div>
        <div class="tile"><div class="ic">⭐</div><b>${t.pj ? nf(t.sumaNota / t.pj) : '—'}</b><span>Nota media</span></div></div>

  if (ev.tipo === 'suceso') {
    const e = SUCESOS[ev.id];

  if (ev.tipo === 'meta') {

  return '';
}

function render() {
  if (!S) return;
  renderTop();
  const main = $('main'), dock = $('dock');
  let html, d = '';
  if (S.intro) html = pantallaIntro();
  else if (S.verResultado) {
    html = pantallaResultado();
    d = `<button class="btn ${S.pendiente ? '' : 'go'}" data-act="continuar" id="btnContinuar">${S.pendiente ? '🔔 ¡Tienes algo pendiente!' : 'Continuar ▶'}</button><div style="height:calc(var(--safe-bottom) + 8px)"></div>`;
  } else if (S.pendiente) html = pantallaEvento();
  else {
    html = S.tab === 'negocio' ? pantallaNegocio() : S.tab === 'finanzas' ? pantallaFinanzas() : S.tab === 'liga' ? pantallaLiga() : pantallaSemana();
    const a = S.eleccion && ACCIONES[S.eleccion];
    d = (S.tab === 'semana' ? `<button class="btn go" data-act="avanzar" id="btnAvanzar" ${a ? '' : 'disabled'}>${a ? `▶ Jugar semana ${S.semana}` : 'Elige un plan'}</button>` : '') +
      `<nav>${[['semana', '⚽', 'Carrera'], ['liga', '🏆', 'Liga'], ['negocio', '✂️', 'Negocio'], ['finanzas', '💰', 'Finanzas']].map(([k, ic, t]) =>
        `<button data-act="tab" data-v="${k}" class="${S.tab === k ? 'on' : ''}"><span>${ic}</span>${t}</button>`).join('')}</nav>`;
  }
  if (celebrar) { html = confeti() + html; celebrar = false; }
  main.innerHTML = html;
  dock.innerHTML = d;
  if (S.aviso) { $('toast').innerHTML = `<div>${esc(S.aviso)}</div>`; S.aviso = null; }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v;
  const prevTab = S.tab;
  if (act !== 'reiniciar' && act !== 'noReiniciar') confirmarReinicio = false;
  switch (act) {
    case 'avatar': S.nombre = $('nombre').value; S.avatar = v; render(); break;
    case 'posicion': S.nombre = $('nombre').value; S.posicion = v; render(); break;
    case 'empezar': S.nombre = ($('nombre').value || '').trim().slice(0, 16) || 'Crack'; S.intro = false; guardar(); render(); break;
    case 'elegir': elegir(b.dataset.id); break;
    case 'avanzar': avanzarSemana(); break;
    case 'continuar': S.verResultado = false; S.tab = 'semana'; guardar(); render(); break;
    case 'resolver': celebrar = !!(S.pendiente && S.pendiente.tipo === 'ofertas' && v !== 'quedarse'); if (!resolver(v)) celebrar = false; break;
    case 'tab': S.tab = v; guardar(); render(); break;
    case 'caja': S.cajaElegida = Number(v); render(); break;
    case 'comprar': celebrar = true; if (!comprarNegocio(S.cajaElegida)) celebrar = false; break;
    case 'neg': cambiarNegocio(b.dataset.c, b.dataset.c === 'empleados' ? Number(v) : v); break;
    case 'traspaso': traspasar(v); break;
    case 'reiniciar': if (confirmarReinicio) reiniciar(); else { confirmarReinicio = true; render(); } break;
    case 'noReiniciar': confirmarReinicio = false; render(); break;
  }
  if (S.tab !== prevTab || ['continuar', 'resolver', 'avanzar', 'empezar', 'comprar'].includes(act)) window.scrollTo(0, 0);
});

S = cargar() || nuevaPartida();
guardar();
render();

window.__P1 = {
  CFG, ACCIONES, SUCESOS,
  get S() { return S; }, set S(v) { S = v; },
  nueva(seed, pos) { S = nuevaPartida(seed); S.intro = false; S.nombre = 'Prueba'; if (pos) S.posicion = pos; guardar(); render(); return S; },
  elegir, avanzarSemana, resolver, comprarNegocio, cambiarNegocio, traspasar, reiniciar,
  continuar() { S.verResultado = false; S.tab = 'semana'; guardar(); render(); },
  objetivos: () => objetivos(S), patrimonio: () => patrimonio(S), valorNegocio: () => valorNegocio(S),
  pruebaBase: () => pruebaBase(S), condicionMejora: () => condicionMejora(S), clasificacion: () => clasificacion(S.temporada),
  club: id => club(S, id), ligaDe: id => ligaDe(S, id), posicion: id => posicion(S, id), umbralTitular: () => umbralTitular(S),
  generarOfertas: n => generarOfertas(S, n), render: () => render(),
  disponible: id => !(ACCIONES[id].disponible && ACCIONES[id].disponible(S)) && ACCIONES[id].fases.includes(S.fase),
};
</script>
