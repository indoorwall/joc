<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Del barrio al negocio · P1</title>
<!--
  PROTOTIPO P1 (v0.10) — Simulador de vida de un deportista (fútbol o escalada): 10 pantallas, carrera, retirada, familia, negocios, casas con hipoteca, coches y clubes.
  Estilo «juego de móvil»: HUD arriba, escena del lugar donde estás, tres fichas para la semana (mañana, tarde y noche) y un botón JUGAR SEMANA.
  No hay partidos controlables, física ni gráficos 3D: los partidos se simulan con reglas explicadas.
  Archivo autónomo: no carga nada de Internet. Sin anuncios, compras, cuentas ni servicios de IA.
  Clubes, ciudades y estadios ficticios generados al azar. Importes en euros, de juego y provisionales.

  ORGANIZACIÓN DEL CÓDIGO:
    1. CONFIGURACIÓN · 2. UTILIDADES · 3. MUNDO (clubes, calendario, clasificación) · 4. ESTADO
    5. REGLAS · 6. PLAN SEMANAL · 7. SEMANA (jornada, economía, prensa, mercado, fin de temporada)
    8. IMPREVISTOS · 9. EVENTOS · 10. BIENES (negocios, inmuebles, coches, clubes)
   11. VIDA (relaciones, actividades, felicidad, logros, diario) · 12. PANTALLAS · 13. HIPOTECAS, HIJOS Y RETIRADA
   15. ESCALADA (grados, zonas, competiciones, patrocinios) · 14. INTERFAZ · GANCHOS DE PRUEBA
-->
<style>
  /* Estilo «juego de móvil»: fondo oscuro según el deporte, paneles claros y redondeados,
     botones gruesos con relieve, HUD arriba y una sola acción principal: JUGAR SEMANA. */
  :root {
    --bg1: #0f3d2c; --bg2: #072217; --acc: #2ecc71; --acc-d: #1b8a4a; --acc-soft: #e2f7ea;
    --card: #ffffff; --ink: #18213a; --dim: #66708a; --line: #e3e7ef; --panel: #f4f6fb;
    --gold: #ffcf3a; --gold-d: #c99700; --good: #1f9d55; --bad: #e0483a;
    --blue: #2f6fe4; --green: #1f9d55; --green2: #2ecc71; --amber: #f2a93b; --red: #e0483a; --purple: #7b61ff;
    --f: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --f-num: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  body[data-dep="escalada"] { --bg1: #3a2a63; --bg2: #171230; --acc: #ff8a3d; --acc-d: #c4571a; --acc-soft: #ffeadb; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; color: var(--ink); background: var(--bg2); }
  body { font-family: var(--f); font-size: 16px; line-height: 1.35; -webkit-text-size-adjust: 100%; overflow-x: hidden;
    background: radial-gradient(120% 70% at 50% 0%, var(--bg1), var(--bg2)) fixed; min-height: 100vh; }
  button { font-family: inherit; color: inherit; }
  button:focus-visible, summary:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
  .num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

  /* HUD */
  #top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; color: #fff;
    padding: calc(var(--safe-top) + 10px) 12px 10px; background: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,0)); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #top:empty { display: none; }
  .hava { position: relative; width: 50px; height: 50px; flex: none; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 30px;
    border: 3px solid var(--gold); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
  .hava i { position: absolute; right: -6px; bottom: -4px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--acc); color: #fff; font-style: normal;
    font-size: 12px; font-weight: 900; display: grid; place-items: center; border: 2px solid #fff; padding: 0 4px; }
  .hwho { flex: 1; min-width: 0; }
  .hwho b { display: block; font-size: 17px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hwho span { display: block; font-size: 12px; color: rgba(255,255,255,.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hres { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  .pill { display: inline-flex; align-items: center; gap: 4px; background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.18); color: #fff; border-radius: 999px;
    padding: 2px 10px 2px 6px; font-weight: 900; font-size: 15px; }
  .pill.oro { color: var(--gold); }
  .pill.down { color: #ff9a8f; }
  .hbtns { display: flex; gap: 4px; }
  .hbtns button { border: 0; background: rgba(255,255,255,.14); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 800; padding: 3px 8px; min-height: 26px; cursor: pointer; }

  main { padding: 0 12px calc(var(--safe-bottom) + 170px); }

  /* Nivel (pantalla) */
  .mision { display: block; width: 100%; margin: 4px 0 10px; text-align: left; font: inherit; cursor: pointer; color: #fff;
    background: rgba(0,0,0,.28); border: 2px solid rgba(255,255,255,.14); border-radius: 16px; padding: 6px 12px 8px; }
  .mision .pn { display: inline-block; font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: var(--gold); border-radius: 6px; padding: 1px 7px; }
  .mision b { display: inline; font-size: 16px; font-weight: 900; margin-left: 6px; }
  .mision .pb { height: 8px; background: rgba(255,255,255,.18); border-radius: 5px; overflow: hidden; margin-top: 6px; }
  .mision .pb i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #ffe58a); border-radius: 5px; }
  .mision p { margin: 5px 0 0; font-size: 13px; color: rgba(255,255,255,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Escena */
  .escena { position: relative; height: 114px; border-radius: 20px; overflow: hidden; border: 3px solid rgba(255,255,255,.22); box-shadow: 0 6px 0 rgba(0,0,0,.3); }
  .escena svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .escena .marcas { position: absolute; left: 10px; right: 70px; top: 19px; display: flex; flex-wrap: nowrap; overflow: hidden; justify-content: flex-start; gap: 4px; background: none; border: 0; padding: 13px 0; min-height: 0; box-shadow: none; }
  .escena .marcas span { max-width: 132px; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; background: rgba(255,255,255,.94); color: #15202b; font-weight: 900; font-size: 11px; border-radius: 6px; padding: 2px 6px; box-shadow: 0 2px 0 rgba(0,0,0,.35); white-space: nowrap; }
  .relp { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; font-size: 13px; font-weight: 800; }
  .relp .pb { flex: 1; height: 10px; border-radius: 99px; background: rgba(0,0,0,.12); overflow: hidden; }
  .relp .pb i { display: block; height: 100%; border-radius: 99px; }
  .patro .ob { font-size: 13px; margin-top: 4px; }
  .patro .lema { display: block; font-style: italic; color: var(--muted, #667); font-size: 12px; }
  .hava { padding: 0; cursor: pointer; }
  .hava .hcara { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
  .hava .hcara svg { width: 100%; height: 100%; display: block; }
  .escena .yo { position: absolute; right: 4px; bottom: 0; width: 60px; height: 104px; padding: 0; border: 0; background: none; box-shadow: none; min-height: 0; cursor: pointer; }
  .escena .yo svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .lookTop { display: flex; gap: 12px; align-items: center; background: #fff; color: #15202b; border-radius: 18px; padding: 10px; }
  .lookPrev { width: 96px; height: 168px; flex: none; border-radius: 14px; background: radial-gradient(circle at 50% 35%, var(--acc-soft), #fff 75%); }
  .lookPrev svg { width: 100%; height: 100%; display: block; }
  .lookInfo { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-weight: 700; }
  .lookInfo b { font-size: 18px; font-weight: 900; }
  .lookInfo .small { color: #5b6475; }
  .lookTabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; padding: 12px 0 8px; }
  .lookTabs::-webkit-scrollbar { display: none; }
  .lookTabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; min-height: 54px; padding: 4px 0; border-radius: 14px; border: 2px solid var(--line); background: #fff; color: #15202b; font-weight: 800; font-size: 11px; box-shadow: 0 3px 0 var(--line); cursor: pointer; }
  .lookTabs button span { font-size: 20px; }
  .lookTabs button { font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lookTabs button.sel { border-color: var(--acc); background: var(--acc-soft); box-shadow: 0 3px 0 var(--acc-d); }
  .lookGrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .lk { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px 8px; border-radius: 14px; border: 2px solid var(--line); background: #fff; color: #15202b; box-shadow: 0 3px 0 var(--line); min-width: 0; cursor: pointer; }
  .lk svg { width: 100%; height: 74px; display: block; background: #eef2f8; border-radius: 10px; }
  .lk b { font-size: 12px; line-height: 1.15; text-align: center; }
  .lk .pr { font-size: 11px; font-weight: 800; color: #5b6475; text-align: center; line-height: 1.2; }
  .lk.sel { border-color: var(--acc); background: var(--acc-soft); box-shadow: 0 3px 0 var(--acc-d); }
  .lk:disabled { opacity: .6; cursor: default; }
  .lk.caro .pr { color: var(--red); }
  .introLook { display: flex; gap: 10px; align-items: center; }
  .introLook .lookPrev { width: 84px; height: 148px; }
  .introOps { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .sw { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw button { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line); cursor: pointer; padding: 0; }
  .sw button.sel { box-shadow: 0 0 0 3px var(--acc); }
  .pelos { display: flex; flex-wrap: wrap; gap: 6px; }
  .pelos button { flex: 1 0 auto; min-height: 36px; padding: 4px 8px; border-radius: 10px; border: 2px solid var(--line); background: #fff; color: #15202b; font-weight: 800; font-size: 12px; cursor: pointer; }
  .pelos button.sel { border-color: var(--acc); background: var(--acc-soft); }
  .escena .bocata { position: absolute; right: 64px; bottom: 31px; pointer-events: none; max-width: 58%; background: #fff; color: #15202b; font-weight: 800; font-size: 12px; line-height: 1.2; padding: 5px 9px; border-radius: 12px; box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .escena .bocata > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .escena .bocata::after { content: ''; position: absolute; right: -10px; bottom: 7px; border: 6px solid transparent; border-left-color: #fff; }
  .escena .yo.salta { animation: salta .6s ease-in-out 3; }
  @keyframes salta { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  @media (prefers-reduced-motion: reduce) { .escena .yo.salta { animation: none; } }
  button.pill { border: 0; cursor: pointer; font: inherit; }
  .link { background: none; border: 0; padding: 0; color: var(--acc); font: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; }
  .carta { background: #fffdf3; color: #2a2d34; border: 2px dashed #d9cfa8; text-align: left; font-size: 14px; }
  .carta p { margin: 6px 0; }
  textarea.codigo { width: 100%; min-height: 70px; margin: 8px 0; border-radius: 12px; border: 2px solid var(--line); padding: 8px; font-size: 11px; font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
  .entry .mas { min-height: 44px; }
  .retos { display: flex; align-items: center; gap: 8px; width: 100%; margin: -4px 0 8px; padding: 8px 12px; min-height: 44px; border-radius: 14px; border: 2px solid rgba(255,255,255,.14); background: rgba(0,0,0,.3); color: #fff; font: inherit; font-weight: 900; font-size: 13px; cursor: pointer; text-align: left; }
  .retos .rc { flex: 1; letter-spacing: 2px; }
  .retos .rq { font-size: 11px; color: rgba(255,255,255,.7); font-weight: 800; white-space: nowrap; }
  .tarjeta { border-radius: 24px; padding: 18px; color: #fff; text-align: center; background: linear-gradient(160deg, #0f7a3a, #0b3d1f); box-shadow: 0 8px 0 rgba(0,0,0,.3); border: 3px solid rgba(255,255,255,.25); }
  .tarjeta.esc { background: linear-gradient(160deg, #6a3fd0, #2b1a63); }
  .tarjeta .tt1 { font-weight: 900; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; color: var(--gold); }
  .tarjeta .tav { width: 120px; height: 200px; margin: 6px auto 0; }
  .tarjeta .tav svg { width: 100%; height: 100%; }
  .tarjeta .tn { font-size: 26px; font-weight: 900; }
  .tarjeta .ts { font-size: 13px; opacity: .85; margin-bottom: 12px; }
  .tgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .td { background: rgba(255,255,255,.12); border-radius: 14px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .td span { font-size: 20px; }
  .td b { font-size: 17px; font-weight: 900; }
  .td i { font-style: normal; font-size: 10px; opacity: .85; text-transform: uppercase; letter-spacing: .03em; line-height: 1.2; }
  .tarjeta .tpie { margin-top: 12px; font-size: 11px; opacity: .7; font-weight: 800; }
  .ic.salon { font-size: 22px; }
  .avs { width: 44px; height: 44px; flex: none; border-radius: 50%; overflow: hidden; }
  .avs svg { width: 100%; height: 100%; display: block; }
  .escena .fecha { position: absolute; left: 10px; top: 7px; background: rgba(0,0,0,.6); color: #fff; font-weight: 900; font-size: 13px; border-radius: 999px; padding: 3px 10px; }
  .escena .lugar { position: absolute; left: 10px; bottom: 10px; right: 68px; color: #fff; font-weight: 900; font-size: 14px; text-shadow: 0 2px 4px rgba(0,0,0,.7);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Indicadores */
  .gauges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 10px 0; }
  .gauges.g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .gauges > * { min-width: 0; }
  @media (max-width: 400px) {
    .gauges:not(.g6) .gauge { padding: 3px 6px; gap: 2px 4px; }
    .gauges:not(.g6) .gauge .ic { font-size: 15px; }
    .gauges:not(.g6) .gauge .n { font-size: 0; letter-spacing: 0; justify-content: flex-end; }
    .gauges:not(.g6) .gauge .n b { font-size: 13px; }
  }
  @media (max-width: 360px) {
    .gauges.g6 .gauge { padding: 3px 5px; gap: 2px 4px; }
    .gauges.g6 .gauge .ic { font-size: 14px; }
    .gauges.g6 .gauge .n { font-size: 8.5px; letter-spacing: 0; }
  }
  .gauge { background: rgba(0,0,0,.3); border: 2px solid rgba(255,255,255,.12); border-radius: 14px; padding: 3px 8px; color: #fff; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 6px; }
  .gauge .ic { font-size: 18px; grid-row: span 2; }
  .gauge .n { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: rgba(255,255,255,.7); display: flex; justify-content: space-between; }
  .gauge .n b { color: #fff; font-size: 12px; letter-spacing: 0; }
  .gauge .bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
  .gauge .bar i { display: block; height: 100%; border-radius: 4px; }

  /* Panel de la semana */
  .panel { background: var(--card); border-radius: 22px; padding: 12px; box-shadow: 0 6px 0 rgba(0,0,0,.28); margin-top: 4px; }
  .panel .ph { font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 0 2px 6px; display: flex; justify-content: space-between; align-items: center; gap: 6px; white-space: nowrap; }
  button.gauge { font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; }
  .perfil { display: flex; align-items: center; gap: 12px; } .perfil .avs { width: 58px; height: 58px; border-radius: 50%; overflow: hidden; background: var(--acc-soft); flex: none; }
  .perfil .avs svg { width: 100%; height: 100%; } .perfil .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; } .perfil .tx > span { font-size: 13px; color: var(--dim); }
  .seg.tipos-post { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); } .seg.tipos-post button { font-size: 12px; line-height: 1.25; min-height: 52px; }
  .mas-fama summary { cursor: pointer; font-weight: 800; color: var(--acc); padding: 10px 2px; min-height: 44px; }
  .post { background: var(--card); color: var(--ink); border-radius: 16px; padding: 10px 12px; margin: 8px 0; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
  .post .ph2 { font-size: 13px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; } .post .ph2 span { color: var(--dim); font-size: 12px; margin-left: auto; }
  .post p { margin: 6px 0; font-size: 15px; } .post .pl { font-size: 13px; font-weight: 800; color: #d64570; } .post .pc { font-size: 12px; color: var(--dim); margin-top: 3px; }
  .panel .ph .fz { font: inherit; letter-spacing: .02em; border: 0; border-radius: 999px; padding: 3px 9px; margin: -4px 0; min-height: 26px; white-space: nowrap; font-size: 12px; color: #fff; background: #d98a1f; cursor: pointer; }
  .panel .ph .fz.agotado { background: #d64545; } .panel .ph .fz.justo { background: #8a97a8; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; text-align: center; font: inherit; cursor: pointer;
    background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 5px 4px 6px; min-height: 84px; box-shadow: 0 4px 0 var(--line); }
  .slot:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .slot .tt { font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .slot .te { font-size: 26px; line-height: 1.1; }
  .slot b { font-size: 13px; line-height: 1.15; font-weight: 800; }
  .slot.principal { background: var(--acc-soft); border-color: var(--acc); box-shadow: 0 4px 0 var(--acc-d); }
  .slot.libre b { color: var(--dim); }
  .finde { margin-top: 10px; background: #fff7db; border: 2px solid var(--gold); border-radius: 14px; padding: 8px 10px; font-weight: 800; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .prox { list-style: none; margin: 8px 2px 0; padding: 0; font-size: 13px; color: var(--dim); }
  .prox li { padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prox .cu { font-weight: 900; color: var(--ink); margin-right: 4px; }
  .jugar { position: fixed; z-index: 24; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-bottom) + 84px); width: min(456px, calc(100% - 24px));
    display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; border: 0; border-radius: 18px;
    background: linear-gradient(var(--acc), var(--acc)); color: #fff; font-size: 22px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
    box-shadow: 0 6px 0 var(--acc-d), 0 10px 18px rgba(0,0,0,.25); text-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .jugar:active { transform: translate(-50%, 4px); box-shadow: 0 2px 0 var(--acc-d); }
  body.con-hoja .jugar { display: none; }
  .jugar:disabled { background: #b8bfcc; box-shadow: 0 6px 0 #8e95a3; cursor: not-allowed; }
  .hecho { font-size: 13px; color: var(--dim); margin-top: 8px; }
  .hecho div { padding: 1px 0; }

  /* Última semana / partes */
  .entry { background: var(--card); border-radius: 18px; padding: 12px; margin: 12px 0; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  .entry .eh { font-size: 12px; font-weight: 900; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  .entry .el { display: flex; gap: 8px; padding: 3px 0; font-size: 14px; }
  .entry .el .i { flex: none; width: 22px; text-align: center; }
  .entry .mas { border: 0; background: none; color: var(--blue); font-weight: 800; font-size: 13px; padding: 4px 0; cursor: pointer; }
  .res { display: inline-block; font-size: 11px; font-weight: 900; color: #fff; border-radius: 6px; padding: 1px 6px; margin-left: 4px; vertical-align: 1px; }
  .res.victoria { background: var(--good); } .res.empate { background: #8a93a3; } .res.derrota { background: var(--bad); }
  details.por summary { font-size: 13px; color: var(--blue); cursor: pointer; padding-top: 4px; font-weight: 800; }
  details.por h4 { margin: 8px 0 2px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .rl { font-size: 13px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .rl:last-child { border-bottom: 0; }

/* =====================================================================
   2. UTILIDADES
   ===================================================================== */
function rnd(s) { // mulberry32, estado guardado en la partida (resultados reproducibles)
  s.rng = (s.rng + 0x6D2B79F5) | 0;
  let t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = v => Math.round(v * 10) / 10;
const red = (v, m) => Math.round(v / m) * m;
const nf = v => String(r1(v)).replace('.', ',');
const nf3 = v => String(+v.toFixed(3)).replace('.', ',');
const cr = n => (n < 0 ? '−' : '') + String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' ' + CFG.moneda;
const sg = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + nf(Math.abs(n));
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const azar = (s, arr) => arr[Math.floor(rnd(s) * arr.length)];
function poisson(s, l) { const L = Math.exp(-l); let k = 0, p = rnd(s); while (p > L && k < 9) { k++; p *= rnd(s); } return k; }
function tipoImpuesto(bruto) { for (const [hasta, t] of CFG.impuestos) if (bruto <= hasta) return t; return 0.45; }

/* =====================================================================
   3. MUNDO: países, ligas y clubes ficticios
   ===================================================================== */
function nombreCiudad(s, P) {
  const a = azar(s, P.pre), b = azar(s, P.suf);
  return a + (/[ -]$/.test(a) ? b.charAt(0).toUpperCase() + b.slice(1) : b);
}
function siglas(n) {
  const w = n.replace(/[^A-Za-zÀ-ÿ0-9 ]/g, ' ').split(' ').filter(x => x && x !== 'de');
  return w.map(x => x[0]).join('').toUpperCase().slice(0, 3);
}
function generarMundo(s) {
  const clubs = {}, ligas = {}, de = {};
  let n = 0;
  for (const [pk, P] of Object.entries(CFG.paises)) {
    const usadas = new Set();
    P.ligas.forEach((L, i) => {
      const key = `${pk}-${i + 1}`;
      ligas[key] = [];
      for (let k = 0; k < CFG.temporada.equipos; k++) {
        let ciudad, g = 0;
        do { ciudad = nombreCiudad(s, P); } while (usadas.has(ciudad) && ++g < 80);
        usadas.add(ciudad);
        const nombre = azar(s, P.tipos).replace('#', ciudad);
        const cap = Math.max(100, red(L.cap[0] * Math.pow(L.cap[1] / L.cap[0], rnd(s)), 50));
        const [c1, c2] = azar(s, CFG.colores);
        const id = 'c' + (n++);
        clubs[id] = { id, pais: pk, nombre, ciudad, cap, c1, c2, siglas: siglas(nombre), estadio: P.estadio(ciudad, cap),
          fuerza: Math.round(L.fuerza + (rnd(s) * 2 - 1) * 5) };
        ligas[key].push(id);
        de[id] = key;
      }
    });
  }
  return { clubs, ligas, de };
}
function infoLiga(key) {
  const [p, t] = key.split('-');
  const P = CFG.paises[p];
  return { key, pais: p, tier: +t, P, L: P.ligas[+t - 1], n: P.ligas.length };
}
const club = (s, id) => s.mundo.clubs[id];
const ligaDe = (s, id) => infoLiga(s.mundo.de[id]);
const miClub = s => club(s, s.contrato.clubId);
function nombreLiga(key) { const i = infoLiga(key); return `${i.P.flag} ${i.L.n}`; }

/* ---- Temporada: calendario y clasificación ---- */
function calendario(s, ids) {
  const t = ids.slice();
  for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(rnd(s) * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; }
  const n = t.length, ida = [];
  for (let r = 0; r < n - 1; r++) {
    const ronda = [];
    for (let i = 0; i < n / 2; i++) { const a = t[i], b = t[n - 1 - i]; ronda.push((r + i) % 2 ? [b, a] : [a, b]); }
    ida.push(ronda);
    t.splice(1, 0, t.pop());
  }
  return ida.concat(ida.map(r => r.map(([a, b]) => [b, a])));
}
function iniciarTemporada(s, key, jornadasPrevias, año) {
  const ids = s.mundo.ligas[key];
  const T = { liga: key, año, jornada: 0, cal: calendario(s, ids), tabla: {} };
  for (const id of ids) T.tabla[id] = { pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0, pts: 0, forma: [] };
  s.temporada = T;
  for (let j = 0; j < jornadasPrevias; j++) { for (const [h, a] of T.cal[j]) simPartido(s, T, h, a); T.jornada++; }
}
function apuntar(T, h, a, gh, ga) {
  const A = T.tabla[h], B = T.tabla[a];
  A.pj++; B.pj++; A.gf += gh; A.gc += ga; B.gf += ga; B.gc += gh;
  const r = gh > ga ? ['V', 'D'] : gh < ga ? ['D', 'V'] : ['E', 'E'];
  for (const [x, k] of [[A, r[0]], [B, r[1]]]) {
    if (k === 'V') { x.g++; x.pts += 3; } else if (k === 'E') { x.e++; x.pts += 1; } else x.p++;
    x.forma.push(k); if (x.forma.length > 5) x.forma.shift();
  }
}
const golesEsperados = (fa, fb, casa) => clamp(1.3 * Math.exp((fa - fb + (casa ? 3 : -3)) / 20), 0.15, 4);
function simPartido(s, T, h, a) {
  const fh = club(s, h).fuerza, fa = club(s, a).fuerza;
  const gh = poisson(s, golesEsperados(fh, fa, true)), ga = poisson(s, golesEsperados(fa, fh, false));
  apuntar(T, h, a, gh, ga);
  return [gh, ga];
}
function clasificacion(T) {
  return Object.keys(T.tabla).sort((x, y) => {
    const a = T.tabla[x], b = T.tabla[y];
    return b.pts - a.pts || (b.gf - b.gc) - (a.gf - a.gc) || b.gf - a.gf || (x < y ? -1 : 1);
  });
}
function posicion(s, id) { return clasificacion(s.temporada).indexOf(id) + 1; }
function zona(key, pos) { // 'ascenso' | 'descenso' | 'campeon' | ''
  const i = infoLiga(key), T = CFG.temporada;
  if (i.tier === 1 && pos === 1) return 'campeon';
  if (i.tier > 1 && pos <= T.ascienden) return 'ascenso';
  if (i.tier < i.n && pos > T.equipos - T.descienden) return 'descenso';
  return '';
}
function proximoPartido(s) {
  const T = s.temporada;
  if (!T || T.jornada >= T.cal.length) return null;
  const yo = s.contrato.clubId;
  const m = T.cal[T.jornada].find(p => p.includes(yo));
  return m ? { casa: m[0] === yo, rival: m[0] === yo ? m[1] : m[0], jornada: T.jornada + 1 } : null;
}

function migrar(s) {

  if (s.esc) { delete s.esc['patros']; delete s.esc.ofrecida; delete s.esc.proxOferta; }

function repPlaza(s) {
  const b = CFG.barrio;
  return b.plazaRepBase + Math.floor(s.p.nivel / 10) + (s.p.energia >= 50 ? b.plazaBonusEnergia : 0);

function pruebaBase(s) { return s.p.nivel + s.p.energia / 5 + s.p.rep / 5 + (s.prep ? s.prep.ajuste : 0); }
function factorTecho(s) { return r1(clamp((s.potencial - s.p.nivel) / CFG.club.margenTecho, 0, 1)); }
function mejoraSemana(s, extra) { return (extra ? CFG.club.mejoraExtra : CFG.club.mejoraNormal) * calidadEntreno(s) * crecimientoEdad(s) * factorTecho(s) * (1 + efMejoras(s).entreno) * forma(s).entreno; }
// ---- Estado de forma: la energía decide cuánto aprovechas el entreno y cómo rindes ----
function forma(s) { const e = s.p.energia; return CFG.forma.tramos.find(t => e < t.hasta) || CFG.forma.tramos[CFG.forma.tramos.length - 1]; }
function efectoForma(s, bajo, alto) { const d = s.p.energia - 60; return d < 0 ? d / bajo : d / alto; }
function textoForma(s) { const f = forma(s); return f.id === 'fresco' ? '' : `${f.ic} ${f.n}: entrenas al ${Math.round(f.entreno * 100)} % y rindes peor`; }
// Cada semana de entreno puede salir mal (más si vas cansado o desanimado) o redonda (si vas en forma y con ánimo)
function tiradaEntreno(s, R) {
  const K = CFG.forma, e = s.p.energia, fel = s.p.fel, u = rnd(s);
  const mala = K.malaBase + Math.max(0, 60 - e) * K.malaPorCansancio + Math.max(0, 50 - fel) * K.malaPorAnimo;
  const buena = e >= 60 && fel >= 55 ? K.buenaBase + (fel - 55) * K.buenaPorAnimo : 0;
  if (u < mala) { R.opo.push(['😩', azar(s, ['Semana de entreno para olvidar: nada me sale.', 'Hoy las piernas no iban. Semana tirada.', 'Entreno flojo: estaba con la cabeza en otra parte.'])]); s.cont.malaSemana = (s.cont.malaSemana || 0) + 1; return { f: K.factorMala, t: ' · semana mala' }; }
  if (u < mala + buena) { R.opo.push(['🔥', azar(s, ['¡Semana redonda! Todo me sale en los entrenos.', 'Entreno de cine: hoy estaba en otro nivel.', 'Me noto volando: semana perfecta.'])]); return { f: K.factorBuena, t: ' · semana redonda' }; }
  return { f: 1, t: '' };
}
function crecimientoEdad(s) { for (const [hasta, f] of CFG.club.edadCrec) if (s.edad <= hasta) return f; return 0.4; }
function calidadEntreno(s) { return CFG.club.calidadTier[ligaDe(s, s.contrato.clubId).tier - 1] || 0.9; }
function visibilidad(s, id) { const i = ligaDe(s, id); return r1((CFG.club.visTier[i.tier - 1] || 1) * i.P.vis); }

  return l;
}

  if (juega) { pT.pj += 1; pT.goles += P.goles; if (titular) pT.tit += 1; if (P.goles >= 3) s.hattrick = (s.hattrick || 0) + 1;
    if (titular) s.cont.titular++; if (P.nota >= 7) s.cont.nota7++; if (P.resultado === 'victoria') s.cont.victorias++; }
  if (juega && P.efForma <= -0.8) R.opo.push(['😫', `Llegué ${forma(s).id === 'agotado' ? 'reventado/a' : 'cansado/a'} al partido: ${nf(r1(P.efForma))} en mi nota. Necesito descansar.`]);
  else if (juega && P.efAnimo <= -0.5) R.opo.push(['😞', `Con el ánimo por los suelos no hay quien juegue: ${nf(r1(P.efAnimo))} en mi nota.`]);
  if (juega) {
    s.stats.jugados += 1; s.stats.goles += P.goles; s.stats.asist += P.asist;
    s.stats.notas.push(P.nota); if (s.stats.notas.length > 20) s.stats.notas.shift();
    tramo.pj += 1; if (titular) tramo.tit += 1; tramo.goles += P.goles; tramo.asist += P.asist; tramo.sumaNota += P.nota;
    R.dep.push([`Tu nota: ${nf(P.nota)}`, P.goles || P.asist ? `${'⚽'.repeat(P.goles)}${'👟'.repeat(P.asist)}` : '',
      `6${pos.notaExtra ? ' + ' + nf(pos.notaExtra) + ' por ser ' + pos.n.toLowerCase() : ''} + (nivel ${nf(s.p.nivel)} − fuerza del rival ${club(s, P.rivalId).fuerza})/8 + forma ${sg(r1(P.efForma))} (energía ${s.p.energia}) + ánimo ${sg(r1(P.efAnimo))} (felicidad ${s.p.fel}) + suerte ${sg(r1(P.suerte))}${P.goles ? ` + 0,6 por gol` : ''}${P.asist ? ` + 0,3 por asistencia` : ''}.`]);
  }
  R.dep.push([`${P.casa ? mi.nombre : club(s, P.rivalId).nombre} ${P.casa ? P.gf : P.gc}-${P.casa ? P.gc : P.gf} ${P.casa ? club(s, P.rivalId).nombre : mi.nombre}`, '',
    `Goles esperados según la fuerza de cada equipo (${mi.fuerza} contra ${club(s, P.rivalId).fuerza}) y quién juega en casa${juega ? '; tu nota empuja a tu equipo' : ''}.`]);

  // Reputación
  const vis = visibilidad(s, yo);
  let dRep;
  if (juega) dRep = Math.round(((P.nota - 6) * 2 * vis + P.goles * pos.repGol) * (titular ? 1 : 0.5)) + (P.resultado === 'victoria' ? 1 : 0);
  else dRep = -1;
  s.p.rep = clamp(s.p.rep + dRep, 0, 100);
  R.dep.push([`Reputación ${sg(dRep)}`, '', juega
    ? `((nota − 6) × 2 × visibilidad de tu liga ${nf(vis)} + goles × ${pos.repGol})${titular ? '' : ' × 0,5 por jugar poco'}${P.resultado === 'victoria' ? ' + 1 por la victoria' : ''}.`
    : 'Si no juegas pierdes 1 punto de reputación.']);

  // Energía y lesiones
  if (P.rol === 'titular') s.p.energia -= K.energiaTitular;
  if (P.rol === 'suplente') s.p.energia -= K.energiaSuplente;
  if (juega && energiaAntes < K.lesionUmbral) {
    const prob = Math.round((K.lesionUmbral - energiaAntes) * K.lesionPctPorPunto * (1 - efMejoras(s).lesion));
    if (rnd(s) * 100 < prob) {
      s.lesion = K.lesionSemanas[0] + Math.floor(rnd(s) * (K.lesionSemanas[1] - K.lesionSemanas[0] + 1));
      P.lesion = s.lesion;
      R.dep.push(['⚠️ Te lesionas', `${s.lesion} ${s.lesion === 1 ? 'semana' : 'semanas'} sin jugar`, `Jugaste con energía ${energiaAntes} (< ${K.lesionUmbral}): riesgo ${prob} %.`]);
    } else R.dep.push(['Sin lesión, por poco', '', `Jugaste con energía ${energiaAntes} (< ${K.lesionUmbral}): había un riesgo de lesión del ${prob} %.`]);
  }
  s.p.energia = clamp(s.p.energia + K.recuperacion, 0, CFG.energiaMax);
  R.dep.push(['Recuperación semanal', `+${K.recuperacion} energía`, `Partido: titular −${K.energiaTitular}, suplente −${K.energiaSuplente}.`]);
  R.partido = P;
  if (juega) prepararMomento(s, P, yo);

  // Economía personal
  let bruto = c.salario;
  R.eco.push([`Salario (${mi.nombre})`, c.salario]);
  if (juega && P.resultado === 'victoria' && c.primaVictoria) { bruto += c.primaVictoria; R.eco.push(['Prima por victoria', c.primaVictoria]); }
  if (juega && P.goles && c.primaGol) { bruto += c.primaGol * P.goles; R.eco.push([`Prima por gol (${P.goles})`, c.primaGol * P.goles]); }
  const tipo = tipoImpuesto(bruto), imp = Math.round(bruto * tipo);
  s.p.dinero += bruto - imp;
  R.eco.push([`Impuestos (${Math.round(tipo * 100)} %)`, -imp]);
  s.acum.impuestos += imp;
  const gv = gastosVida(s);
  s.p.dinero -= gv.v;
  R.eco.push([`Gastos (${gv.motivo})`, -gv.v]);

  // Prensa
  prensaSemana(s, R, P);

  // Mercado de invierno y fin de temporada
  if (T.jornada === CFG.temporada.mercadoInvierno) abrirMercado(s, R, 'invierno');
  if (T.jornada >= CFG.temporada.jornadas) finTemporada(s, R);
  else if (!c.mejora && condicionMejora(s).ok) {
    c.mejora = true;
    encolar(s, { tipo: 'mejora', oferta: ofertaMejora(s) });
    R.opo.push(['📝 El club quiere mejorarme el contrato', 'Mi rendimiento les ha convencido.']);
  }
}

function prensaSemana(s, R, P) {
  const mi = miClub(s), rv = club(s, P.rivalId), dia = ['Diario del Gol', 'La Jugada', 'Deporte Local', 'Marcador Final'][s.semana % 4];
  const marc = P.casa ? `${mi.nombre} ${P.gf}-${P.gc} ${rv.nombre}` : `${rv.nombre} ${P.gc}-${P.gf} ${mi.nombre}`;
  let txt;
  if (P.nota >= 8) txt = `«${s.nombre} se sale»: ${marc}. Nota ${nf(P.nota)}${P.goles ? ` y ${P.goles} ${P.goles === 1 ? 'gol' : 'goles'}` : ''}.`;
  else if (P.goles) txt = `${marc}: ${P.goles === 1 ? 'gol' : 'doblete'} de ${s.nombre}.`;
  else if (P.rol === 'lesionado') txt = `${marc}. ${s.nombre}, baja por lesión.`;
  else if (P.rol === 'banquillo') txt = `${marc}. ${s.nombre} no sale del banquillo.`;
  else txt = `${marc}. ${P.resultado === 'victoria' ? 'Victoria' : P.resultado === 'empate' ? 'Reparto de puntos' : 'Derrota'} en la jornada ${P.jornada}.`;
  R.prensa.push([dia, txt]);
  const T = s.temporada, orden = clasificacion(T), lider = club(s, orden[0]);
  R.prensa.push([dia, `${lider.nombre} lidera la ${infoLiga(T.liga).L.n} con ${T.tabla[orden[0]].pts} puntos. ${mi.nombre}, ${orden.indexOf(mi.id) + 1}º.`]);
}

/* ---- Contrato: mejora, mercado y fin de temporada ---- */
function condicionMejora(s) {
  const K = CFG.club, c = s.contrato, media = notaMedia(s);
  const jugados = tramoActual(s) ? tramoActual(s).pj : 0;
  return { semanas: c.semanas, jugados, media, notaReq: K.notaMejora,
    ok: c.semanas >= K.semanasMinMejora && jugados >= K.partidosMinMejora && media >= K.notaMejora };
}
function ofertaMejora(s) {
  const c = s.contrato;
  return { salario: red(c.salario * CFG.club.mejoraFactor, 10), temporadas: Math.max(c.temporadasRestantes, 1) + 1 };
}

function elegirClubOjeador(s) { // un club de 4ª división española
  const ids = s.mundo.ligas['es-4'].slice().sort((a, b) => club(s, a).fuerza - club(s, b).fuerza);
  return ids[Math.floor(ids.length / 2)];
}
function primerasOfertas(s, score) {
  const O = CFG.primerasOfertas, l = O.local, f = O.fuera;
  const ojeador = s.pendienteOjeador || elegirClubOjeador(s);
  return [
    { clubId: s.clubLocal, salario: red(l.salarioBase + Math.max(0, score - l.desde) * l.porPunto, 5), temporadas: l.temporadas, fichaje: l.fichaje,
      primaVictoria: l.primaVictoria, primaGol: 0, primaAscenso: l.primaAscenso, subidaAscenso: l.subidaAscenso, bajadaDescenso: 0,
      vida: CFG.club.gastosFamilia, familia: true, motivo: `El club de tu barrio. Sueldo = ${l.salarioBase} + ${l.porPunto} por punto de prueba por encima de ${l.desde}.` },
    { clubId: ojeador, salario: score >= f.umbral ? f.salarioBueno : f.salarioFormacion, temporadas: f.temporadas, fichaje: f.fichaje,
      primaVictoria: f.primaVictoria, primaGol: 0, primaAscenso: f.primaAscenso, subidaAscenso: f.subidaAscenso, bajadaDescenso: f.bajadaDescenso,
      vida: CFG.paises.es.vida, familia: false, motivo: score >= f.umbral ? `El club del ojeador. Tu prueba (${score}) llega a ${f.umbral}: contrato completo.` : `El club del ojeador. Tu prueba (${score}) no llega a ${f.umbral}: contrato de formación.` },
  ];
}
function repRequerida(id, s) { const i = ligaDe(s, id); return Math.max(0, Math.round((i.L.fuerza - 40) * 1.2) + i.P.extranjero); }
function terminosOferta(s, id) {
  const c = club(s, id), i = ligaDe(s, id), L = i.L;
  const f = clamp((s.p.nivel - (c.fuerza - 8)) / 20, 0, 1);
  const salario = red((L.sueldo[0] + (L.sueldo[1] - L.sueldo[0]) * (0.2 + 0.6 * f)) * (0.9 + rnd(s) * 0.2) * (rel(s, 'agente') ? 1 + CFG.agente.sueldoExtra : 1), 10);
  const conAscenso = i.tier > 1 && rnd(s) < 0.7;
  const pos = CFG.posiciones[s.posicion];
  const familia = c.pais === 'es' && c.ciudad === s.ciudad;
  return {
    clubId: id, salario, temporadas: 1 + Math.floor(rnd(s) * 3), fichaje: red(salario * (2 + rnd(s) * 6), 50),
    primaVictoria: red(salario * 0.12, 5), primaGol: red(salario * pos.primaGol, 5),
    primaAscenso: conAscenso ? red(salario * (6 + rnd(s) * 6), 100) : 0, subidaAscenso: conAscenso ? azar(s, [20, 30, 50]) : 0,
    bajadaDescenso: i.tier < i.n && rnd(s) < 0.5 ? 25 : 0,
    vida: familia ? CFG.club.gastosFamilia : i.P.vida, familia,
    motivo: `Tu nivel (${Math.round(s.p.nivel)}) encaja con su equipo (fuerza ${c.fuerza}) y tu reputación (${s.p.rep}) llega a la que piden (${repRequerida(id, s)}).`,
  };
}
function generarOfertas(s, max) {
  if (s.edad >= CFG.retiro.edadSinOfertas) return [];
  if (s.edad >= 34) max = Math.min(max, 1);
  const cands = [];
  for (const c of Object.values(s.mundo.clubs)) {
    if (s.contrato && c.id === s.contrato.clubId) continue;
    const d = s.p.nivel - c.fuerza;
    if (d < -5 || d > 12) continue;
    if (s.p.rep < repRequerida(c.id, s)) continue;
    cands.push({ id: c.id, peso: 1 / (1 + Math.abs(d - 3)) + (c.pais !== 'es' ? 0.05 : 0) });
  }
  const out = [];
  while (out.length < max && cands.length) {
    const tot = cands.reduce((a, x) => a + x.peso, 0);
    let u = rnd(s) * tot, k = 0;
    while (k < cands.length - 1 && (u -= cands[k].peso) > 0) k++;
    out.push(terminosOferta(s, cands[k].id));
    cands.splice(k, 1);
  }
  return out;
}
function abrirMercado(s, R, ventana) {
  const ofertas = generarOfertas(s, (ventana === 'invierno' ? 2 : 3) + (rel(s, 'agente') ? 1 : 0));
  const c = s.contrato;
  if (ventana === 'verano' && c.temporadasRestantes <= 0 && s.edad < CFG.retiro.edadSinRenovacion) {
    const m = notaMedia(s), sube = m >= CFG.club.notaMejora;
    ofertas.unshift({ ...c, renovacion: true, salario: red(c.salario * (sube ? 1.1 : 0.9), 10), temporadas: 2, fichaje: 0,
      motivo: `Renovación con tu club: sueldo ${sube ? '+10 %' : '−10 %'} porque tu nota media (${nf(m)}) ${sube ? 'llega' : 'no llega'} a ${nf(CFG.club.notaMejora)}.` });
  }
  if (!ofertas.length) {
    if (ventana === 'verano' && c.temporadasRestantes <= 0) { retirarse(s, true, R); return; }
    R.opo.push([`Mercado de ${ventana}`, 'Ningún club ha preguntado por ti. Mejora tu nivel o tu reputación.']);
    if (ventana === 'verano') arrancarNuevaTemporada(s);
    return;
  }
  encolar(s, { tipo: 'ofertas', ventana, ofertas });
  R.opo.push([`Mercado de ${ventana}: ${ofertas.length} ${ofertas.length === 1 ? 'oferta' : 'ofertas'}`, 'Puedes fichar o seguir donde estás.']);
}

function finTemporada(s, R) {
  const T = s.temporada, c = s.contrato, yo = c.clubId, orden = clasificacion(T);
  const pos = orden.indexOf(yo) + 1, z = zona(T.liga, pos), tramo = tramoActual(s);
  const info = { tipo: 'fin', clubId: yo, año: T.año, liga: T.liga, pos, zona: z, tabla: orden.map(id => [id, { ...T.tabla[id] }]), primas: [], tramo: { ...tramo } };
  balancePatros(s, R, z);
  s.patroTemp = { partidos: 0, pj: 0, tit: 0, goles: 0 };
  guardarTarjeta(s, { tipo: 'futbol', titulo: `Temporada ${T.año}/${String(T.año + 1).slice(2)}`, sub: club(s, yo).nombre, pos, liga: infoLiga(T.liga).L.n, pj: tramo.pj, goles: tramo.goles, asist: tramo.asist, nota: tramo.pj ? nf(tramo.sumaNota / tramo.pj) : '—' });
  if (z === 'ascenso' || z === 'campeon') {
    s.ascensos += 1;
    if (c.primaAscenso) {
      if (tramo.pj >= CFG.club.partidosMinPrimaAscenso) {
        const imp = Math.round(c.primaAscenso * tipoImpuesto(c.primaAscenso));
        s.p.dinero += c.primaAscenso - imp; s.acum.ingresosPers += c.primaAscenso - imp; s.acum.impuestos += imp;
        info.primas.push(`Prima por ${z === 'campeon' ? 'título' : 'ascenso'}: +${cr(c.primaAscenso)} (−${cr(imp)} de impuestos)`);
        R.eco.push([`Prima por ${z === 'campeon' ? 'título' : 'ascenso'} (neta)`, c.primaAscenso - imp]);
      } else info.primas.push(`Sin prima por ascenso: necesitabas ${CFG.club.partidosMinPrimaAscenso} partidos jugados (tienes ${tramo.pj}).`);
    }
    if (c.subidaAscenso) { const antes = c.salario; c.salario = red(c.salario * (1 + c.subidaAscenso / 100), 10); info.primas.push(`Cláusula de ascenso: sueldo ${cr(antes)} → ${cr(c.salario)} (+${c.subidaAscenso} %)`); }
  }
  if (z === 'descenso' && c.bajadaDescenso) { const antes = c.salario; c.salario = red(c.salario * (1 - c.bajadaDescenso / 100), 10); info.primas.push(`Cláusula de descenso: sueldo ${cr(antes)} → ${cr(c.salario)} (−${c.bajadaDescenso} %)`); }

  actualizarMundo(s, T.liga, orden);
  cumpleaños(s, R);
  c.temporadasRestantes -= 1;
  info.ligaNueva = s.mundo.de[yo];
  encolar(s, info);
  R.opo.push([z === 'campeon' ? '🏆 ¡Campeones de liga!' : z === 'ascenso' ? '🎉 ¡Ascenso!' : z === 'descenso' ? '😢 Descenso' : 'Fin de temporada',
    `${miClub(s).nombre} termina ${pos}º en la ${infoLiga(T.liga).L.n}. Cumples ${s.edad} años.`]);
  if (s.edad >= CFG.retiro.edadForzosa) { retirarse(s, true, R); return; }
  abrirMercado(s, R, 'verano');
}
function actualizarMundo(s, ligaJugador, ordenJugador) {
  const M = s.mundo, T = CFG.temporada, mov = [];
  for (const [pk, P] of Object.entries(CFG.paises)) {
    const ordenes = P.ligas.map((L, i) => {
      const key = `${pk}-${i + 1}`;
      if (key === ligaJugador) return ordenJugador.slice();
      return M.ligas[key].map(id => [id, club(s, id).fuerza + rnd(s) * 12]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    });
    for (let i = 0; i < ordenes.length; i++) {
      if (i > 0) for (const id of ordenes[i].slice(0, T.ascienden)) mov.push([id, `${pk}-${i}`, +3]);
      if (i < ordenes.length - 1) for (const id of ordenes[i].slice(-T.descienden)) mov.push([id, `${pk}-${i + 2}`, -3]);
    }
  }
  for (const [id, key, df] of mov) {
    const old = M.de[id];
    M.ligas[old] = M.ligas[old].filter(x => x !== id);
    M.ligas[key].push(id);
    M.de[id] = key;
    club(s, id).fuerza += df;
  }
  for (const c of Object.values(M.clubs)) { // cada club se acerca al nivel de su división
    const L = infoLiga(M.de[c.id]).L;
    c.fuerza = Math.round(c.fuerza + (L.fuerza - c.fuerza) * 0.2 + (rnd(s) * 2 - 1) * 2);
  }
}
function arrancarNuevaTemporada(s) {
  const año = s.temporada.año + 1;
  iniciarTemporada(s, s.mundo.de[s.contrato.clubId], 0, año);
  nuevoTramo(s);
}
function nuevoTramo(s) {
  s.trayectoria.push({ año: s.temporada.año, clubId: s.contrato.clubId, liga: s.mundo.de[s.contrato.clubId], pj: 0, tit: 0, goles: 0, asist: 0, sumaNota: 0 });
}
function firmar(s, o, ventana) {
  const cambia = !s.contrato || s.contrato.clubId !== o.clubId;
  const paisAntes = s.contrato ? miClub(s).pais : 'es';
  s.contrato = { clubId: o.clubId, salario: o.salario, temporadasRestantes: o.temporadas, fichaje: o.fichaje,
    primaVictoria: o.primaVictoria, primaGol: o.primaGol, primaAscenso: o.primaAscenso, subidaAscenso: o.subidaAscenso,
    bajadaDescenso: o.bajadaDescenso, vida: o.vida, familia: o.familia, mejora: false, semanas: 0 };
  s.fase = 'club';
  s.prep = null;
  const msgs = [];
  if (o.fichaje) {
    const imp = Math.round(o.fichaje * tipoImpuesto(o.fichaje));
    s.p.dinero += o.fichaje - imp; s.acum.ingresosPers += o.fichaje - imp; s.acum.impuestos += imp;
    msgs.push(`Prima de fichaje: +${cr(o.fichaje - imp)} netos.`);
  }
  if (cambia && club(s, o.clubId).pais !== paisAntes) {
    s.mods.push({ tipo: 'sel', v: -4, sem: 6, motivo: 'adaptación al país' });
    msgs.push(`Nuevo país: −4 en la selección durante 6 semanas (adaptación).`);
  }
  if (ventana === 'inicio') { iniciarTemporada(s, s.mundo.de[o.clubId], 0, CFG.temporada.añoInicio); nuevoTramo(s); }
  else if (ventana === 'invierno' && cambia) { iniciarTemporada(s, s.mundo.de[o.clubId], s.temporada.jornada, s.temporada.año); nuevoTramo(s); }
  else if (ventana === 'verano') arrancarNuevaTemporada(s);
  return msgs;
}

/* =====================================================================
   8. IMPREVISTOS (ventanas emergentes con opciones; cada opción dice qué cambia)
   Iconos de efecto: € dinero · 😊 felicidad · ⚡ energía · ⭐ reputación · 💪 nivel ·
   👩 mamá · 👨 papá · 🧑‍🤝‍🧑 amistad · ❤️ pareja
   ===================================================================== */
const ICONO_REL = { '👩': 'madre', '👨': 'padre', '🧑‍🤝‍🧑': 'amigo', '❤️': 'pareja' };
function rel(s, tipo) { return s.rel.find(r => r.tipo === tipo) || null; }
function cambiarRel(s, tipo, v) { const r = rel(s, tipo); if (r) r.v = clamp(r.v + v, 0, 100); }
function aplicarFx(s, fx) {
  for (const [ic, v] of fx) {
    if (typeof v !== 'number') continue;
    if (ic === '€') s.p.dinero += v;
    else if (ic === '😊') s.p.fel = clamp(s.p.fel + v, 0, 100);
    else if (ic === '⚡') s.p.energia = clamp(s.p.energia + v, 0, CFG.energiaMax);
    else if (ic === '⭐') s.p.rep = clamp(s.p.rep + v, 0, 100);
    else if (ic === '💪') s.p.nivel = clamp(s.p.nivel + v, 0, CFG.nivelMax);
    else if (ICONO_REL[ic]) cambiarRel(s, ICONO_REL[ic], v);
  }
}
const negAzar = s => azar(s, s.negocios).tipo;
const inmAzar = (s, f) => { const l = s.inmuebles.filter(f || (() => true)); return l.length ? azar(s, l).id : null; };
const nomNeg = (s, d) => CFG.negocios[d.neg].n.toLowerCase();
const nomInm = (s, d) => { const i = s.inmuebles.find(x => x.id === d.inm); return i ? `${CFG.inmuebles[i.tipo].n.toLowerCase()} de ${i.ciudad}` : 'tu propiedad'; };
const amigo = s => (rel(s, 'amigo') || { nombre: 'Tu amigo' }).nombre;
const pareja = s => (rel(s, 'pareja') || { nombre: 'Tu pareja' }).nombre;

const SUCESOS = {

/* ---- Niveles y grados ---- */
function nivelMod(s, m) {
  const at = s.esc.at;
  if (m === 'combinada') return (nivelMod(s, 'bloque') + nivelMod(s, 'dificultad')) / 2;
  return Object.entries(MODS[m].pesos).reduce((a, [k, w]) => a + w * at[k], 0);

  if (c.mod === 'bloque') { const nb = ronda === 'clasificación' ? 5 : 4, t = clamp(Math.round(nb / 2 + z * 1.2), 0, nb); marca = `${t}T${clamp(t + (rnd(s) < 0.6 ? 1 : 0), t, nb)}Z (tops y zonas de ${nb} bloques)`; }
  else if (c.mod === 'dificultad') { const h = clamp(Math.round(10 + 35 * phi(z + 0.3)), 5, 45); marca = h >= 45 ? '¡TOP! (llegas arriba)' : `presa ${h}${rnd(s) < 0.5 ? '+' : ''} de 45`; }
  else if (c.mod === 'velocidad') { if (resbalon) marca = 'resbalón: sin tiempo'; else { const t = Math.max(4.8, 5 + (96 - L) / 7.5 - suerte * 0.06); marca = `${t.toFixed(2).replace('.', ',')} s`; if (!E.mejorTiempo || t < E.mejorTiempo) E.mejorTiempo = Math.round(t * 100) / 100; } }

  // Dinero
  const coste = costeComp(s, c), premio = A.premio[pos - 1] || 0;
  pagarEsc(s, R, coste, `Inscripción${coste > A.ins ? ' y viaje' : ''}: ${A.n}`);
  let bruto = premio;
  if (premio) R.eco.push([c.amb === 'jjoo' ? 'Premio del Consejo Superior de Deportes por la medalla' : `Premio (${pos}º)`, premio]);
  if (pos <= 3 && ORDEN_AMB.indexOf(c.amb) >= 1) for (const pt of s.patros) if (pt.primaPodio) { const b = Math.round(pt.primaPodio * K.factorPrima[c.amb]); bruto += b; R.eco.push([`Prima de ${pt.marca} por el podio`, b]); }
  if (bruto) { const imp = Math.round(bruto * tipoImpuesto(bruto)); s.p.dinero += bruto - imp; if (imp) { R.eco.push([`Impuestos de premios (${Math.round(tipoImpuesto(bruto) * 100)} %)`, -imp]); s.acum.impuestos += imp; } E.anual.premios += premio; }
  // Reputación y seguidores
  const f = pos === 1 ? 1.6 : pos <= 3 ? 1.2 : ronda === 'final' ? 0.7 : ronda === 'semifinal' ? 0.35 : 0.1;
  // Una competición pequeña no te hace famoso/a: cuanto más cerca estás de su techo de fama, menos suma
  const dRep = Math.round(A.rep * f * clamp((A.techo - s.p.rep) / 25, 0, 1));
  s.p.rep += dRep; E.seg += dRep * 250 + (pos <= 3 ? 1000 * (ORDEN_AMB.indexOf(c.amb) + 1) : 0);
  s.p.energia -= A.energia; E.piel = clamp(E.piel - 15, 0, 100); E.carga = clamp(E.carga + 10, 0, 100);
  // Estadísticas
  E.comps += 1; E.anual.comps += 1;

  E.mejor[c.amb] = Math.min(E.mejor[c.amb] || 99, pos);
  if (c.amb === 'esp' || c.amb === 'cesp') E.anual.mejorEsp = Math.min(E.anual.mejorEsp, pos);
  if (c.amb === 'mundo') { E.anual.cm = true; E.anual.mejorMundo = Math.min(E.anual.mejorMundo, pos); const m = E.mejorMundoMod[c.mod] = E.mejorMundoMod[c.mod] || {}; m[E.año] = Math.min(m[E.año] || 99, pos); if (ronda === 'final') E.finales += 1; }
  if (['mundial', 'europeo', 'jjoo'].includes(c.amb) && pos <= 3) E.medallas.push({ año: E.año, amb: c.amb, mod: c.mod, pos });
  if (c.amb === 'clasif' && pos <= A.plazas) { E.olimpico = { año: E.año, mod: c.mod }; R.opo.push(['🏅', `¡Plaza para los Juegos Olímpicos de ${SEDES_JJOO[E.año] || E.año} (${MODS[c.mod].n.toLowerCase()})!`]); celebrar = true; }

    `Tu nivel de ${MODS[c.mod].n.toLowerCase()} ${nf(L)} ${sg(r1(fz))} por tu forma (energía ${s.p.energia}) ${sg(r1(animo))} por felicidad ${sg(r1(cab))} por cabeza y presión${piel ? ` ${sg(r1(piel))} por la piel` : ''} ${sg(r1(suerte))} de suerte${resbalon ? ' − 40 por el resbalón' : ''} = ${nf(score)}, frente a una media de ${nf(media)} (± ${nf(A.sd)}) entre ${N} participantes${juv ? ' de tu categoría' : ''}.`]);

    else if (E.becaOlimpica && E.becaOlimpica.hasta === E.año) { E.becaOlimpica = null; R.opo.push(['🎓', 'No repito el oro: pierdo la beca olímpica.']); }

}

/* ---- Lesiones ---- */
const LESIONES_ESC = {
  dedos: [['polea A2 del dedo anular', 4, 8, 'fuerza']], codo: [['epicondilitis (codo)', 3, 5, 'resistencia'], ['polea A2 del dedo corazón', 4, 7, 'fuerza']],
  bloque: [['polea A2 del dedo anular', 4, 8, 'fuerza'], ['hombro (labrum)', 6, 10, 'fuerza'], ['esguince de tobillo al caer', 2, 6, 'velocidad']],
  roca: [['polea A2 del dedo anular', 4, 8, 'fuerza'], ['esguince de tobillo en una caída', 2, 5, 'velocidad']],
  velocidad: [['hombro', 3, 6, 'velocidad'], ['esguince de tobillo', 2, 4, 'velocidad']],

function riesgoLesionEsc(s, energiaAntes, en) {
  const E = s.esc, K = CFG.escalada;
  return Math.round((Math.max(0, E.carga - K.cargaRiesgo) * K.lesionPorCarga + (energiaAntes < 30 ? (30 - energiaAntes) * 0.5 : 0) + (s.edad > 30 ? (s.edad - 30) * 0.3 : 0)) * (en.tabla ? 1.5 : 1) * (1 - efMejoras(s).lesion) * 10) / 10;
}

  R.escLineas.push(['🤕', `Me lesiono: ${l[0]}. ${sem} semanas de baja.`]);
  return [l[0], sem];
}

/* ---- Semana de escalada ---- */
function semanaEscalada(s, R) {
  const E = s.esc, K = CFG.escalada, energiaAntes = R.antes.energia;

  // Lesión: riesgo si has entrenado con los dedos cargados o sin energía
  if (s.lesion > 0) {
    s.lesion -= 1;

    R.dep.push([`Lesión: ${E.lesTipo}`, s.lesion ? `quedan ${s.lesion} semanas` : 'recuperación completa', `Mientras estás de baja pierdes ${nf(K.desentreno)} de fuerza y resistencia por semana.`]);

    else if (prob > 0) R.dep.push(['Sin lesión', '', `Riesgo de lesión ${nf(prob)} %: carga en los dedos ${E.carga} (por encima de ${K.cargaRiesgo} sube el riesgo)${energiaAntes < 30 ? ' y poca energía' : ''}.`]);

  // Recuperación

  R.dep.push(['Recuperación semanal', `+${K.recuperacion} energía, +${K.pielRecupera} piel, −${K.cargaBaja} carga`, 'Cada semana el cuerpo se recupera un poco.']);
  // Edad

  if (dec) { for (const k of Object.keys(ATTRS)) E.at[k] = Math.max(0, E.at[k] - dec); R.dep.push([`Edad: −${nf(dec)} en cada cualidad`, '', `A partir de los ${K.declive[0][0] + 1} años se pierde un poco cada semana.`]); }
  // Dinero

  // Equipo de competición (rocódromo)

    E.equipoOfrecido = true; encolar(s, { tipo: 'equipoEsc' });
    R.opo.push(['🧗', 'El entrenador del rocódromo me propone entrar en un equipo de competición.']);
  }
  // Patrocinadores
  if (s.fase === 'escalador') {
    s.p.rep = clamp(s.p.rep, 0, 100);
    buscarInvitaciones(s, R);
  }
  // La fama se apaga sin resultados; los seguidores se acercan a lo que corresponde a tu reputación
  if (s.fase === 'escalador' && s.semana % 3 === 0 && s.p.rep > 20) { s.p.rep -= 1; R.dep.push(['Reputación −1', '', 'Si no das que hablar, la gente se va olvidando de ti (una vez cada 3 semanas).']); }

  if (R.escLineas.some(([i]) => i === '🎉')) R.felExtra.push([5, 'encadenamiento']);
}
function economiaEsc(s, R) {

  for (const pt of s.patros) if (pt.año) { const v = Math.round(pt.año / CFG.hipoteca.semanasAño); bruto += v; R.eco.push([`Patrocinio de ${pt.marca} (${cr(pt.año)}/año)`, v]); }
  if (E.nacional === E.año && E.beca) { bruto += E.beca; R.eco.push(['Ayuda de la federación', E.beca]); }
  const colab = E.seg >= K.segColab ? Math.round(E.seg / 1000 * K.colabPorMil) : 0;
  if (colab) { bruto += colab; R.eco.push([`Colaboraciones en redes (${nf(E.seg / 1000)} mil seguidores)`, colab]); }
  if (bruto) { const t = tipoImpuesto(bruto), imp = Math.round(bruto * t); s.p.dinero += bruto - imp; if (imp) { R.eco.push([`Impuestos (${Math.round(t * 100)} %)`, -imp]); s.acum.impuestos += imp; } }

  if (E.becaHasta >= E.año) { const v = Math.round(K.becaEstado.mes * 12 / CFG.hipoteca.semanasAño); E.becaSaldo += v; R.dep.push([`Beca del Estado: +${cr(v)}`, `saldo ${cr(E.becaSaldo)}`, `${cr(K.becaEstado.mes)} al mes (cada semana de juego son unas 3 semanas reales). Solo se puede gastar en escalada; lo que sobre al acabar el año se pierde.`]); }
  if (E.equipo && EQUIPOS[E.equipo].cuota && s.edad >= K.edadPagas) pagarEsc(s, R, EQUIPOS[E.equipo].cuota, `Cuota: ${EQUIPOS[E.equipo].n.toLowerCase()}`);
  if (E.semPies >= K.semanasPies) { E.semPies = 0; const pm = s.patros.find(pt => pt.material); if (pm) R.escLineas.push(['👟', `Pies de gato nuevos, cortesía de ${pm.marca}.`]); else if (s.edad < K.edadPagas) R.escLineas.push(['👟', 'Mis padres me compran unos pies de gato nuevos.']); else pagarEsc(s, R, K.piesGato, 'Pies de gato nuevos (los viejos están rotos)'); }

// ---- Másters por invitación ----
function invitadoMaster(s, c) { return s.edad >= 16 && (s.p.rep >= 65 || mejorMundoReciente(s, c.mod) <= 16 || nivelMod(s, c.mod) >= 75); }
function buscarInvitaciones(s, R) {
  const E = s.esc;

    if (c.amb !== 'master' || c.sem !== s.semanasAño + 2 || E.invit[c.id] !== undefined || !invitadoMaster(s, c)) continue;
    E.invit[c.id] = true;
    for (const x of calendarioEsc(s, E.año)) if (x.sem === c.sem && x.id !== c.id) E.ins[x.id] = false;
    E.ins[c.id] = true;
    R.opo.push(['💌', `Me invitan al ${nombreComp(c, s)} de ${c.lugar} (viaje pagado, hasta ${cr(AMBITOS.master.premio[0])} de premio). Voy en 2 semanas; si no quiero ir, lo cancelo en Carrera.`]);
  }
}

function nuevoAñoEsc(s, R) {
  const E = s.esc, K = CFG.escalada, A = E.anual;
  const resumen = { tipo: 'finEsc', año: E.año, comps: A.comps, podios: A.podios, mejorEsp: A.mejorEsp, mejorMundo: A.mejorMundo, premios: A.premios, maxVia: E.maxVia, maxBloque: E.maxBloque, edad: s.edad + 1, beca: E.becaHasta > E.año, perdida: Math.round(E.becaSaldo), patros: s.patros.reduce((a, p) => a + p.año, 0) };
  if (s.fase === 'escalador') balancePatros(s, R);
  if (s.fase === 'escalador') guardarTarjeta(s, { tipo: 'escalada', titulo: `Temporada ${E.año}`, sub: E.equipo ? EQUIPOS[E.equipo].n : 'Por libre', comps: A.comps, podios: A.podios, esp: A.mejorEsp < 99 ? `${A.mejorEsp}º` : '—', mundo: A.mejorMundo < 99 ? `${A.mejorMundo}º` : '—', grado: E.maxVia >= 0 ? gV(E.maxVia) : '—' });
  if (E.becaSaldo > 0) R.opo.push(['🎓', `Se pierden ${cr(E.becaSaldo)} de la beca que no he gastado en escalada.`]);
  E.becaSaldo = 0;

  const ofrecer = s.fase === 'escalador' && s.edad >= 15 && (A.mejorEsp <= 3 || A.mejorMundo <= 30 || (E.puntosSel >= 2 && A.mejorEsp <= 8));
  s.semanasAño = 0; E.año += 1; E.anual = nuevoAnual(); E.ins = {}; E.puntosSel = 0;
  cumpleaños(s, R);
  R.opo.push(['🎂', `Cumplo ${s.edad} años. Empieza ${E.año}.`]);
  if (s.fase === 'escalador') {
    if (s.edad >= K.edadPagas) pagarEsc(s, R, K.licencia, 'Licencia federativa del año');
    encolar(s, resumen);
    if (s.edad >= K.edadRetiroForzosa) { R.opo.push(['🦴', `Cumplo ${s.edad}: los dedos y la espalda dicen basta.`]); retirarseEsc(s, true, R); return; }
    if (ofrecer) encolar(s, { tipo: 'nacional', año: E.año, beca: K.becaBase });

}

/* =====================================================================
   15b. PATROCINADORES (fútbol y escalada)
   Una marca por categoría. Cada contrato trae obligaciones:
   · compromisos (anuncios, fiestas, firmas…) que te ocupan una tarde,
   · un objetivo de temporada (si lo cumples, prima; si no, la marca se enfada),
   · una relación con la marca: por debajo de 25 rompen el contrato y para renovar piden 40.
   ===================================================================== */
const CAT_PATRO = { local: 'Patrocinador local', bebida: 'Bebida', pies: 'Pies de gato', material: 'Material (cuerdas y arneses)', ropa: 'Ropa', botas: 'Botas', reloj: 'Reloj', coche: 'Coche', comida: 'Comida', tecno: 'Tecnología', magnesio: 'Magnesio' };
const POPUPS_PATRO = { patrocinio: 1, eventoPatro: 1 };
const NOMBRE_TIER = ['Primera División', 'Segunda División', 'Primera Federación', 'Segunda Federación', 'Tercera Federación'];
function catalogoPatro(s) { return s.deporte === 'escalada' ? CFG.escalada.patrocinadores : CFG.patrocinio.futbol; }
function patroDe(s, id) { return catalogoPatro(s).find(P => P.id === id); }
function puedePatro(s) { return s.deporte === 'escalada' ? s.fase === 'escalador' : s.fase === 'club' && !!s.contrato; }
function tienePatro(s, id) { return s.patros.some(p => p.id === id); }
function tierActual(s) { return s.contrato ? ligaDe(s, s.contrato.clubId).tier : 9; }
// Divisiones en las que ficha una marca de fútbol: [más alta, más baja]
function tiersPatro(P) { return P.req === 'estrella' ? [1, 1] : P.tiers || [1, 5]; }
// Nivel deportivo que pide una marca de escalada
const REQ_ESC = {
  esp: [s => Math.min(s.esc.mejor.esp || 99, s.esc.mejor.cesp || 99) <= 10 || maxRoca(s) >= 14, () => `un top 10 en España o ${GRADOS_VIA[14]} en roca`],
  nacional: [s => !!s.esc.nacional || Math.min(s.esc.mejor.esp || 99, s.esc.mejor.cesp || 99) <= 3 || maxRoca(s) >= 16, () => `equipo nacional, un podio en España o ${GRADOS_VIA[16]} en roca`],
  mundo: [s => !!s.esc.mejor.mundo || maxRoca(s) >= 18, () => `competir en Copa del Mundo o ${GRADOS_VIA[18]} en roca`],
  estrella: [s => (s.esc.mejor.mundo || 99) <= 8 || (s.esc.mejor.mundial || 99) <= 8 || s.esc.maxVia >= 20 || s.esc.medallas.length > 0, () => 'una final de Copa del Mundo, un 9a o una medalla'],
};
// renovar = true: para renovar no importa que ahora juegues más arriba de lo que la marca suele fichar
function cumpleReqPatro(s, P, renovar) {
  if (!P || s.p.rep < P.rep) return false;
  if (s.deporte === 'escalada') return (renovar || !P.repMax || s.p.rep <= P.repMax) && (!P.req || !REQ_ESC[P.req] || REQ_ESC[P.req][0](s));
  const t = tierActual(s), [alta, baja] = tiersPatro(P);
  return t <= baja && (renovar || t >= alta);
}
function textoReqPatro(s, P) {
  if (s.deporte === 'escalada') return P.repMax && s.p.rep > P.repMax ? `marca pequeña: busca escaladores con menos de ${P.repMax + 1} de fama` : `fama ${P.rep}${P.req && REQ_ESC[P.req] ? ` y ${REQ_ESC[P.req][1]()}` : ''}`;
  const [alta, baja] = tiersPatro(P), t = tierActual(s);
  if (t < alta) return `solo ficha en ${alta === baja ? NOMBRE_TIER[alta - 1] : `divisiones de ${NOMBRE_TIER[alta - 1]} a ${NOMBRE_TIER[baja - 1]}`}: juegas demasiado arriba para ellos`;
  return `fama ${P.rep} y jugar ${alta === baja ? `en ${NOMBRE_TIER[alta - 1]}` : alta === 1 ? `en ${NOMBRE_TIER[baja - 1]} o más arriba` : `entre ${NOMBRE_TIER[alta - 1]} y ${NOMBRE_TIER[baja - 1]}`}`;
}
// Marcas que no pueden llamarte ahora: las que ya tienes, las que rechazaste hace poco y las que rompieron contigo
function marcaBloqueada(s, id) {
  const O = s.patroOf;
  return tienePatro(s, id) || (O.veto || {})[id] > s.semana;
}
// Lo que te paga una marca: de su mínimo a su máximo según cuánto superas la fama que pide

/* ---- Números rojos: carta del banco, intereses y embargo ---- */
function semanaBanco(s, R) {
  const K = CFG.banco, B = s.banco;
  if (s.p.dinero < 0 && s.edad < K.edadPadres) {
    const d = -s.p.dinero; s.p.dinero = 0; s.banco = null;
    cambiarRel(s, 'madre', -K.enfadoPadres); cambiarRel(s, 'padre', -K.enfadoPadres);
    R.opo.push(['👪', `Mis padres pagan mi deuda de ${cr(d)}… y me echan una buena bronca (−${K.enfadoPadres} con mamá y con papá).`]);
    return;
  }
  if (s.p.dinero >= 0) { if (B) { s.banco = null; R.opo.push(['✅', 'Salgo de los números rojos: el banco me deja en paz.']); } return; }
  if (!B) {
    s.banco = { carta: s.semana, plazo: s.semana + K.plazo, intereses: 0 };
    encolar(s, { tipo: 'cartaBanco', deuda: -s.p.dinero });
    R.opo.push(['✉️', `Carta del banco: estoy en números rojos (${cr(s.p.dinero)}). Tengo ${K.plazo === 1 ? 'una semana' : `${K.plazo} semanas`} para arreglarlo.`]);
    return;
  }
  if (s.semana < B.plazo) return;
  if (-s.p.dinero < K.deudaMinima) {
    s.p.dinero -= K.comision; s.acum.gastosPers += K.comision; B.sinBienes = 0;
    R.eco.push(['Comisión del banco por números rojos', -K.comision]);
    R.dep.push(['El banco cobra una comisión', `−${cr(K.comision)}`, `Debes menos de ${cr(K.deudaMinima)}: solo una comisión cada semana. Si la deuda llega a ${cr(K.deudaMinima)}, intereses y embargo.`]);
    return;
  }
  const int = Math.max(K.interesMin, Math.round(-s.p.dinero * K.interes));
  s.p.dinero -= int; B.intereses += int; s.acum.gastosPers += int;
  R.eco.push([`Intereses del banco por números rojos (${Math.round(K.interes * 100)} % a la semana)`, -int]);
  R.dep.push(['El banco cobra intereses', `−${cr(int)}`, `Sigues en números rojos después del plazo: ${Math.round(K.interes * 100)} % de lo que debes cada semana (mínimo ${cr(K.interesMin)}) y embargo de tus bienes hasta cubrir la deuda.`]);
  const l = embargar(s);
  for (const t of l) R.opo.push(['🏛️', t]);
  // La ventana sale si embargan algo (o la primera vez); si no, queda anotado en el parte
  if (l.some(t => t.startsWith('Embargo')) || !B.avisado) { B.avisado = true; encolar(s, { tipo: 'embargo', intereses: int, lineas: l, deuda: Math.max(0, -s.p.dinero) }); }
  if (s.p.dinero >= 0) { s.banco = null; R.opo.push(['✅', 'Con lo embargado, la cuenta vuelve a estar en positivo.']); return; }
  // Ya no queda nada que embargar
  B.sinBienes = (B.sinBienes || 0) + 1;
  if (B.sinBienes >= K.semanasQuiebra) { quiebra(s, true, R); encolar(s, { tipo: 'quiebraForzada', deuda: B.deudaQuiebra }); return; }
  if (B.sinBienes === 1) encolar(s, { tipo: 'quiebra', deuda: -s.p.dinero });
  R.opo.push(['⚠️', `No me queda nada que embargar. Si en ${K.semanasQuiebra - B.sinBienes} ${K.semanasQuiebra - B.sinBienes === 1 ? 'semana' : 'semanas'} sigo debiendo, el banco me declara en quiebra.`]);
}
// Quiebra personal: se borra la deuda, pero tiene consecuencias
function quiebra(s, forzada, R) {
  const K = CFG.banco, deuda = Math.max(0, -s.p.dinero), nota = (ic, t) => R ? R.opo.push([ic, t]) : anotar(s, ic, t);
  s.p.dinero = 0;
  s.p.rep = clamp(s.p.rep - K.quiebraFama, 0, 100); s.p.fel = clamp(s.p.fel - K.quiebraAnimo, 0, 100);
  if ((s.patros || []).length) nota('💔', `Mis marcas no quieren saber nada de alguien en quiebra: ${s.patros.map(p => p.marca).join(', ')} rompen el contrato.`);
  s.patros = []; s.personal = [];
  s.vetoBanco = s.semana + K.vetoSemanas; s.quiebras = (s.quiebras || 0) + 1;
  if (s.banco) s.banco.deudaQuiebra = deuda;
  s.banco = null;
  s.cola = s.cola.filter(e => e.tipo !== 'quiebra');
  nota('📉', `${forzada ? 'El banco me declara en quiebra' : 'Me declaro en quiebra'}: se borra mi deuda de ${cr(deuda)}, pero pierdo ${K.quiebraFama} de fama y ${K.quiebraAnimo} de ánimo, mis marcas y mi equipo, y no me darán hipotecas hasta la semana ${s.vetoBanco}.`);
}
// El banco se cobra en este orden: cajas de tus negocios y clubes, coches, casas (la tuya la última),
// negocios y clubes. Los bienes se venden deprisa y por menos de lo que valen.
function embargar(s) {
  const K = CFG.banco, l = [], deuda = () => -s.p.dinero;
  for (const n of s.negocios) { if (deuda() <= 0) break; const v = Math.min(Math.max(0, n.caja), deuda()); if (v > 0) { n.caja -= v; s.p.dinero += v; l.push(`Embargo: ${cr(v)} de la caja de la ${CFG.negocios[n.tipo].n.toLowerCase()}.`); } }
  for (const o of s.clubes) { if (deuda() <= 0) break; const v = Math.min(Math.max(0, o.caja), deuda()); if (v > 0) { o.caja -= v; s.p.dinero += v; l.push(`Embargo: ${cr(v)} de la caja del ${club(s, o.clubId).nombre}.`); } }
  for (const k of s.coches.slice().sort((a, b) => a.valor - b.valor)) {
    if (deuda() <= 0) break;
    const v = Math.round(k.valor * K.ventaForzosa); s.p.dinero += v; s.coches = s.coches.filter(x => x !== k);
    l.push(`Embargo: el banco se lleva tu ${CFG.coches[k.tipo].n.toLowerCase()} y lo subasta por ${cr(v)}.`);
  }
  for (const i of s.inmuebles.slice().sort((a, b) => (a.modo === 'vivienda') - (b.modo === 'vivienda') || a.valor - b.valor)) {
    if (deuda() <= 0) break;
    const deudaH = i.hipoteca ? Math.round(i.hipoteca.deuda) : 0, v = Math.round(i.valor * K.ventaForzosa);
    s.p.dinero += v - deudaH; s.inmuebles = s.inmuebles.filter(x => x !== i);
    l.push(`Embargo: subastan tu ${CFG.inmuebles[i.tipo].n.toLowerCase()} de ${i.ciudad} por ${cr(v)}${deudaH ? ` (se cancela la hipoteca de ${cr(deudaH)})` : ''}${i.modo === 'vivienda' ? '. Te toca vivir de alquiler' : ''}.`);
  }
  for (const n of s.negocios.slice().sort((a, b) => valorNegocio(a) - valorNegocio(b))) {
    if (deuda() <= 0) break;
    const v = Math.round(valorNegocio(n) * K.ventaForzosa) + n.caja; s.p.dinero += v; s.negocios = s.negocios.filter(x => x !== n);
    l.push(`Embargo: subastan tu ${CFG.negocios[n.tipo].n.toLowerCase()} por ${cr(v)}.`);
  }
  for (const o of s.clubes.slice()) {
    if (deuda() <= 0) break;
    const v = Math.round(valorClub(s, o.clubId) * K.ventaForzosa) + o.caja; s.p.dinero += v; s.clubes = s.clubes.filter(x => x !== o);
    l.push(`Embargo: el ${club(s, o.clubId).nombre} pasa a otras manos por ${cr(v)}.`);
  }
  if (deuda() > 0) l.push(`No queda nada que embargar: sigues debiendo ${cr(deuda())} y los intereses siguen corriendo.`);
  return l;
}

function bocadillo(s) {

    h += `<div class="sec">Trayectoria</div><div class="card"><table><tr class="hd"><td>Temp.</td><td>Club</td><td class="n">PJ</td><td class="n">Goles</td><td class="n">Nota</td></tr>
      ${s.trayectoria.slice().reverse().map(x => `<tr><td>${x.año}/${String(x.año + 1).slice(2)}</td><td>${esc(club(s, x.clubId).nombre)}<div class="small">${esc(nombreLiga(x.liga))}</div></td><td class="n">${x.pj}</td><td class="n">${x.goles}</td><td class="n">${x.pj ? nf(x.sumaNota / x.pj) : '—'}</td></tr>`).join('')}</table>
      <p class="small">Potencial estimado: ${s.potencial - 3}–${s.potencial + 3}. Ascensos: ${s.ascensos}.${s.edad > 30 ? ` Con ${s.edad} años pierdes ${nf(declive(s))} de nivel por semana.` : ''}</p></div>`;

      <button class="btn r full" data-act="retirarse" ${s.edad >= CFG.retiro.edadMin && !s.pendiente ? '' : 'disabled'}>👋 Retirarme del fútbol${s.edad < CFG.retiro.edadMin ? ` (desde los ${CFG.retiro.edadMin})` : ''}</button></div>`;
  } else {
    h += `<div class="scene">${escenaBarrio(s.fase === 'prep')}<div class="chap">${s.fase === 'prep' ? `Pruebas en ${s.prep.semanasRestantes} semanas` : `Barrio de ${esc(s.ciudad)}`}</div></div>`;
    h += `<div class="sec">Plan semanal (se repite hasta que lo cambies)</div><div class="grid">${accionesDisponibles(s).map(([id, a]) => htmlPlan(id, a)).join('')}</div>`;
    const a = ACCIONES[s.plan];
    if (a) h += `<div class="card"><b>${a.t}</b><p class="small">👍 ${esc(a.pro(s))}<br>👎 ${esc(a.con(s))}<br>📏 ${esc(a.why(s))}</p></div>`;
  }
  h += `<div class="sec">El mundo del fútbol</div><div class="card">${Object.entries(CFG.paises).map(([, P]) => `<details><summary><b>${P.flag} ${P.n}</b> · ${P.ligas.length} divisiones</summary>
      ${P.ligas.map((L, k) => `<p class="small">${k + 1}. ${esc(L.n)} · fuerza ~${L.fuerza} · sueldos ${cr(L.sueldo[0])}–${cr(L.sueldo[1])}/sem</p>`).join('')}</details>`).join('')}
    <p class="small">Clubes, ciudades y estadios ficticios.</p></div>`;
  return hoja('⚽ Carrera', h);
}

function hojaBienes() {
  const s = S, pat = patrimonio(s);
  const sumN = s.negocios.reduce((a, n) => a + n.caja + valorNegocio(n), 0), sumI = s.inmuebles.reduce((a, i) => a + i.valor, 0);
  const sumK = s.coches.reduce((a, k) => a + k.valor, 0), sumC = s.clubes.reduce((a, o) => a + o.caja + valorClub(s, o.clubId), 0);
  const deuda = s.inmuebles.reduce((a, i) => a + (i.hipoteca ? Math.round(i.hipoteca.deuda) : 0), 0);
  const h0 = s.historial, mx = Math.max(1, ...h0.map(x => x.patrimonio));
  let h = `<div class="card" id="resumen"><div class="small" style="text-align:center">Patrimonio</div><div class="big" id="patrimonio">${cr(pat)}</div>
    <div class="chips" style="justify-content:center">${chip('👛', cr(s.p.dinero))}${sumN ? chip('🏪', cr(sumN)) : ''}${sumI ? chip('🏠', cr(sumI)) : ''}${sumK ? chip('🚗', cr(sumK)) : ''}${sumC ? chip('🏟️', cr(sumC)) : ''}${deuda ? `<span class="chip b">🏦 −${cr(deuda)}</span>` : ''}</div>
    ${h0.length > 1 ? `<div class="chart" style="margin-top:10px">${h0.map(x => `<div style="height:${Math.max(3, Math.max(0, x.patrimonio) / mx * 100)}%"></div>`).join('')}</div><p class="small">Últimas ${h0.length} semanas</p>` : ''}</div>`;
  // Negocios
  h += `<div class="sec">Negocios</div><div class="card lista">${Object.entries(CFG.negocios).map(([k, T]) => {
    const n = negocioDe(s, k);
    if (n) return `<div class="row"><div class="ic">${T.ic}</div><div class="tx"><b>${T.n}</b><span>Caja ${cr(n.caja)} · fama ${Math.round(n.fama)} · 🔨 ${(n.mejoras || []).length}/${DECISIONES[k].mejoras.length}${n.ultimo ? ` · última semana ${n.ultimo.resultado >= 0 ? '+' : ''}${cr(n.ultimo.resultado)}` : ''}</span></div><button class="btn w" data-act="hoja" data-v="negocio:${k}">Gestionar</button></div>`;
    const b = bloqueoNegocio(s, k);
    return `<div class="row"><div class="ic" style="${b ? 'filter:grayscale(1);opacity:.5' : ''}">${T.ic}</div><div class="tx"><b>${T.n}</b><span>Traspaso ${cr(T.precio)}${b ? ` · 🔒 ${esc(b)}` : ` · gana ~${cr(beneficioTipico(s, k))}/sem`}</span></div><button class="btn" data-act="hoja" data-v="negocio:${k}" ${b ? 'disabled' : ''}>Ver</button></div>`;
  }).join('')}</div>`;
  // Inmuebles
  h += `<div class="sec">Mis propiedades</div><div class="card lista">${s.inmuebles.length ? s.inmuebles.map(i => {
    const T = CFG.inmuebles[i.tipo], dif = i.valor / i.compra - 1;
    return `<div class="row" style="flex-wrap:wrap"><div class="ic">${T.ic}</div><div class="tx"><b>${T.n} · ${esc(i.ciudad)}</b><span>Vale ${cr(i.valor)} (<span class="${dif >= 0 ? 'up' : 'down'}">${dif >= 0 ? '+' : ''}${nf(dif * 100)} %</span>) · ${i.modo === 'vivienda' ? '🛋️ vives aquí' : i.modo === 'alquiler' ? (i.inquilino ? `🔑 alquilado ${cr(i.alquiler)}/sem` : '🔎 buscando inquilino') : 'vacío'}</span></div>
      ${i.hipoteca ? `<div class="small" style="width:100%">🏦 Hipoteca: debes ${cr(i.hipoteca.deuda)} · cuota ${cr(i.hipoteca.cuota)}/sem · quedan ${Math.ceil(i.hipoteca.restantes / CFG.hipoteca.semanasAño)} años · interés ${nf(i.hipoteca.interes * 100)} %
        <button class="btn w" style="min-height:36px;padding:4px 10px;margin-left:4px" data-act="amortizar" data-id="${i.id}" ${s.p.dinero >= Math.min(CFG.hipoteca.amortizar, i.hipoteca.deuda) ? '' : 'disabled'}>Amortizar ${cr(Math.min(CFG.hipoteca.amortizar, i.hipoteca.deuda))}</button></div>` : ''}
      <div class="seg" style="width:100%">${[['vivienda', '🛋️ Vivir'], ['alquiler', '🔑 Alquilar'], ['vacio', 'Vacío']].map(([m, t]) => `<button data-act="inm" data-id="${i.id}" data-v="${m}" class="${i.modo === m ? 'sel' : ''}">${t}</button>`).join('')}
      <button data-act="venderInm" data-id="${i.id}">Vender ${cr(red(i.valor * (1 - CFG.inmo.comisionVenta), 100))}</button></div></div>`; }).join('')
    : '<p class="small">Aún no tienes propiedades. Vivir en tu casa rebaja tus gastos y sube tu felicidad; alquilarla te da ingresos cada semana.</p>'}</div>`;
  if (!desbloqueado(s, 'inmuebles')) h += `<div class="sec">Inmobiliaria</div><div class="card">🔒 ${esc(textoBloqueo(s, 'inmuebles'))}</div>`;
  else {
    const H = CFG.hipoteca;
    h += `<div class="sec">Inmobiliaria · se renueva cada ${CFG.inmo.renovarCada} semanas</div><div class="card">
      <div class="small">🏦 Hipoteca: entrada del ${H.entrada * 100} %, interés ${nf(s.interesHipoteca * 100)} %, plazo:</div>
      <div class="seg">${H.plazos.map(p => `<button data-act="plazo" data-v="${p}" class="${s.plazoHipoteca === p ? 'sel' : ''}">${p} años</button>`).join('')}</div>
      <div class="small">El banco te deja pagar cuotas de hasta ${cr(capacidadHipoteca(s))}/sem (el ${H.esfuerzoMax * 100} % de lo que ingresas de media${cuotasActuales(s) ? `, menos las cuotas que ya pagas` : ''}). Al comprar se pagan además un ${CFG.inmo.gastosCompra * 100} % de impuestos y notaría.</div>
      <div class="lista">${s.anuncios.map(a => {
        const T = CFG.inmuebles[a.tipo], hc = condicionesHipoteca(s, a), b1 = bloqueoInmueble(s, a, false), b2 = bloqueoInmueble(s, a, true);
        return `<div class="row" style="flex-wrap:wrap"><div class="ic">${T.ic}</div><div class="tx"><b>${T.n} · ${esc(a.ciudad)}</b><span>${cr(a.precio)} · alquiler posible ${cr(a.alquiler)}/sem</span>
          <span style="display:block">Con hipoteca: entrada ${cr(hc.entrada)} + ${cr(hc.gastos)} y ${cr(hc.cuota)}/sem durante ${s.plazoHipoteca} años</span></div>
          <div class="seg" style="width:100%"><button data-act="comprarInm" data-id="${a.id}" data-v="contado" ${b1 ? 'disabled' : ''}>💶 Al contado</button><button data-act="comprarInm" data-id="${a.id}" data-v="hipoteca" ${b2 ? 'disabled' : ''}>🏦 Con hipoteca</button></div>
          ${b1 && b2 ? `<div class="lock" style="width:100%">🔒 ${esc(b2)}</div>` : ''}</div>`; }).join('')}</div>
      <p class="small">Los precios se mueven cada semana (tendencia al alza con altibajos). Gastos: ${nf3(CFG.inmo.gastosPct * 100 * 52)} % del valor al año. Alquiler: impuesto del ${CFG.inmo.impuestoAlquiler * 100} %. Vender cuesta un ${CFG.inmo.comisionVenta * 100} %.</p></div>`;
  }
  // Coches
  h += `<div class="sec">Coches</div><div class="card lista">${s.coches.map(k => { const T = CFG.coches[k.tipo];
    return `<div class="row"><div class="ic">${T.ic}</div><div class="tx"><b>${T.n}</b><span>Vale ${cr(k.valor)} (pierde ${nf3(CFG.cocheDeprecia * 100)} % por semana)</span></div><button class="btn w" data-act="venderCoche" data-id="${k.id}">Vender</button></div>`; }).join('')}
    ${!desbloqueado(s, 'coches') ? `<p>🔒 ${esc(textoBloqueo(s, 'coches'))}</p>` : Object.entries(CFG.coches).map(([k, T]) => `<div class="row"><div class="ic">${T.ic}</div><div class="tx"><b>${T.n}</b><span>${cr(T.precio)} · 😊 +${T.fel} · ⭐ +${T.rep}</span></div><button class="btn g" data-act="comprarCoche" data-v="${k}" ${s.p.dinero >= T.precio ? '' : 'disabled'}>Comprar</button></div>`).join('')}
    <p class="small">Un coche alegra y da imagen, pero pierde valor y tiene mantenimiento.</p></div>`;
  // Clubes
  if (s.deporte !== 'escalada') h += `<div class="sec">Clubes de fútbol</div><div class="card lista">${s.clubes.map(o => { const c = club(s, o.clubId);
    return `<div class="row"><div class="ic">${escudoClub(c, 30)}</div><div class="tx"><b>${esc(c.nombre)} 👑</b><span>${esc(nombreLiga(s.mundo.de[c.id]))} · vale ${cr(valorClub(s, c.id))} · caja ${cr(o.caja)}</span></div><button class="btn w" data-act="hoja" data-v="club:${c.id}">Gestionar</button></div>`; }).join('')}
    ${!desbloqueado(s, 'clubes') ? `<p>🔒 ${esc(textoBloqueo(s, 'clubes'))}</p>` : clubesEnVenta(s).map(id => { const c = club(s, id), v = valorClub(s, id), cj = cajaInicialClub(s, id);
      return `<div class="row"><div class="ic">${escudoClub(c, 30)}</div><div class="tx"><b>${esc(c.nombre)}${id === s.clubLocal ? ' · tu barrio' : s.contrato && id === s.contrato.clubId ? ' · tu club' : ''}</b><span>${esc(nombreLiga(s.mundo.de[id]))} · ${cr(v)} + ${cr(cj)} de caja</span></div><button class="btn g" data-act="comprarClub" data-id="${id}" ${s.p.dinero >= v + cj ? '' : 'disabled'}>Comprar</button></div>`; }).join('')}
    <p class="small">Valor del club = ${cr(CFG.clubCompra.base)} × e^((fuerza − 45) / ${CFG.clubCompra.escala}). Si invierte y asciende, vale más.</p></div>`;
