<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3a2d7a">
<title>Del barrio al negocio · P1</title>
<!--
  PROTOTIPO P1 — Juego de gestión y decisiones: carrera de futbolista + inversión en un negocio.
  No hay partidos controlables, física ni gráficos 3D: los partidos se simulan con reglas explicadas.
  Archivo autónomo: no carga nada de Internet. Sin anuncios, compras, cuentas ni servicios de IA.

  ORGANIZACIÓN DEL CÓDIGO:
    1. CONFIGURACIÓN  → todos los importes y reglas ajustables (IMPORTES PROVISIONALES, unidades ficticias)
    2. UTILIDADES     → azar reproducible, formato
    3. ESTADO         → partida nueva, guardado local, reinicio
    4. REGLAS         → fórmulas (prueba, selección, nota, negocio, patrimonio)
    5. DECISIONES     → acciones semanales con ventajas y costes
    6. SEMANA         → avanzar una semana y calcular resultados
    7. EVENTOS        → ojeador, ofertas de clubes, mejora de contrato, meta final
    8. NEGOCIO        → compra, personal, precios, caja
    9. OBJETIVOS      → objetivo actual y siguiente
   10. INTERFAZ       → pantallas y botones
   11. GANCHOS DE PRUEBA (solo para pruebas automáticas)
-->
<style>
  :root {
    --ink: #2a2340;
    --paper: #fff8e7;
    --paper-2: #ffeec4;
    --sky1: #3a2d7a;
    --sky2: #6a3fb0;
    --yellow: #ffc93c;
    --green: #4fd36a;
    --red: #ff6b5e;
    --blue: #48a9ff;
    --pink: #ff7eb6;
    --dim: #6d6488;
    --chip-g: #c4f5cf;
    --chip-b: #ffd0ca;
    --chip-n: #ffe7a3;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: linear-gradient(170deg, var(--sky1), var(--sky2) 60%, #8b4fc0) fixed;
    background-color: var(--sky1);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.35;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
    -webkit-user-select: none; user-select: none;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
  button { font-family: inherit; color: inherit; }

  /* ---------- HUD ---------- */
  #top {
    position: sticky; top: 0; z-index: 5;
    padding: calc(var(--safe-top) + 8px) 12px 8px;
    background: rgba(32, 24, 70, .92);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border-bottom: 3px solid var(--ink);
  }
  #top:empty { display: none; }
  .hudrow { display: flex; align-items: center; gap: 8px; }
  .ava { width: 44px; height: 44px; border-radius: 50%; background: var(--yellow); border: 3px solid var(--ink);
         display: grid; place-items: center; font-size: 26px; box-shadow: 0 3px 0 var(--ink); flex: none; }
  .who { flex: 1; min-width: 0; color: #fff; }
  .who b { display: block; font-size: 17px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { font-size: 12px; opacity: .8; font-weight: 700; }
  .coin { background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 900;
          font-size: 17px; box-shadow: 0 3px 0 var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 4px; }
  .coin i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; background: var(--yellow); border: 2px solid var(--ink);
            display: grid; place-items: center; font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .sp { background: rgba(255,255,255,.12); border-radius: 12px; padding: 4px 8px; color: #fff; font-size: 12px; font-weight: 800; }
  .sp b { font-size: 16px; }
  .sp small { display: block; font-size: 10px; opacity: .75; margin-top: 2px; text-transform: uppercase; letter-spacing: .06em; }
  .bar { height: 7px; background: rgba(0,0,0,.35); border-radius: 4px; overflow: hidden; margin-top: 3px; }
  .bar i { display: block; height: 100%; border-radius: 4px; transition: width .6s ease; }

  /* ---------- Contenido ---------- */
  main { padding: 12px 14px calc(var(--safe-bottom) + 170px); }
  .card { background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; padding: 14px; margin-bottom: 14px;
          box-shadow: 0 5px 0 var(--ink); position: relative; }
  .card h2 { margin: 0 0 6px; font-size: 12px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .card h3 { margin: 0 0 6px; font-size: 21px; font-weight: 900; line-height: 1.15; }
  .card p { margin: 6px 0; }
  .small { font-size: 13px; color: var(--dim); }
  .sec-t { color: #fff; font-weight: 900; font-size: 18px; margin: 18px 4px 10px; text-shadow: 0 2px 0 var(--ink); }

  /* Escena */
  .scene { height: 178px; border: 3px solid var(--ink); border-radius: 22px; overflow: hidden; position: relative;
           box-shadow: 0 5px 0 var(--ink); margin-bottom: 14px; background: #333; }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .chap { position: absolute; top: 10px; left: 10px; background: var(--ink); color: #fff; font-weight: 900; font-size: 11px;
          letter-spacing: .08em; padding: 5px 10px; border-radius: 999px; max-width: calc(100% - 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero { position: absolute; bottom: 10px; left: 18%; font-size: 58px; line-height: 1; animation: bob 2.4s ease-in-out infinite;
          filter: drop-shadow(0 4px 0 rgba(0,0,0,.25)); }
  .bubble { position: absolute; right: 10px; bottom: 14px; width: 56%; background: #fff; border: 3px solid var(--ink); border-radius: 16px;
            padding: 7px 10px; font-size: 13px; font-weight: 800; line-height: 1.25; }
  .bubble::before { content: ''; position: absolute; left: -12px; bottom: 14px; border: 6px solid transparent; border-right: 8px solid var(--ink); }
  .badge { display: inline-block; font-size: 12px; font-weight: 900; padding: 3px 9px; border-radius: 999px; border: 2px solid var(--ink); background: #fff; margin: 2px 3px 2px 0; }
  .badge.g { background: var(--chip-g); } .badge.b { background: var(--chip-b); } .badge.n { background: var(--chip-n); }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  /* Misión */
  .mission { background: linear-gradient(180deg, #fff3c4, var(--paper)); }
  .mission .h { display: flex; align-items: center; gap: 8px; }
  .mission .h .ic { font-size: 30px; }
  .xp { height: 18px; background: #e9dfc6; border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; margin: 10px 0 4px; position: relative; }
  .xp i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--yellow) 0 10px, #ffb52e 10px 20px); transition: width .8s ease; }
  .xp span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 900; }
  .road { display: flex; justify-content: space-between; align-items: flex-start; margin: 12px 0 2px; position: relative; }
  .road::before { content: ''; position: absolute; left: 18px; right: 18px; top: 17px; height: 4px; background: var(--ink); opacity: .2; border-radius: 2px; }
  .node { position: relative; z-index: 1; width: 20%; text-align: center; font-size: 10px; font-weight: 900; color: var(--dim); }
  .node i { font-style: normal; width: 38px; height: 38px; margin: 0 auto 3px; border-radius: 50%; border: 3px solid var(--ink); background: #ddd;
            display: grid; place-items: center; font-size: 17px; filter: grayscale(1); opacity: .6; }
  .node.done i { background: var(--green); filter: none; opacity: 1; }
  .node.now i { background: var(--yellow); filter: none; opacity: 1; animation: pulse 1.6s infinite; }
  .node.now { color: var(--ink); }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,201,60,.9); } 50% { box-shadow: 0 0 0 7px rgba(255,201,60,0); } }

  /* Cartas de decisión */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt { position: relative; background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; padding: 12px 8px 10px;
         box-shadow: 0 5px 0 var(--ink); text-align: center; cursor: pointer; min-height: 138px; font: inherit;
         display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .12s ease; }
  .opt:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  .opt .ic { font-size: 38px; line-height: 1.1; }
  .opt .t { font-weight: 900; font-size: 15px; line-height: 1.15; }
  .opt.sel { background: #fff1b8; transform: translateY(-4px) rotate(-1deg); box-shadow: 0 9px 0 var(--ink); outline: 4px solid var(--yellow); outline-offset: 2px; }
  .opt.sel::after { content: '✔'; position: absolute; top: -12px; right: -8px; width: 30px; height: 30px; border-radius: 50%;
                    background: var(--green); border: 3px solid var(--ink); display: grid; place-items: center; font-weight: 900; color: #fff; }
  .opt:disabled { filter: grayscale(1); opacity: .55; cursor: not-allowed; }
  .opt .lock { font-size: 12px; font-weight: 800; color: var(--dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 2px; }
  .chip { font-size: 12px; font-weight: 900; padding: 2px 7px; border-radius: 999px; border: 2px solid var(--ink); background: var(--chip-n); white-space: nowrap; }
  .chip.g { background: var(--chip-g); } .chip.b { background: var(--chip-b); }
  .plan { background: #fff; border-style: dashed; margin-top: 14px; }
  .plan .pro { color: #15803d; font-weight: 800; } .plan .con { color: #c2410c; font-weight: 800; }

  /* Botones */
  .btn { display: block; width: 100%; min-height: 58px; border: 3px solid var(--ink); border-radius: 18px; background: var(--yellow);
         font-size: 19px; font-weight: 900; letter-spacing: .02em; padding: 12px 16px; cursor: pointer; margin-bottom: 10px;
         box-shadow: 0 6px 0 var(--ink); text-transform: uppercase; transition: transform .08s ease; }
  .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
  .btn.go { background: var(--green); color: #fff; text-shadow: 0 2px 0 var(--ink); }
  .btn.sec { background: #fff; font-size: 16px; min-height: 50px; text-transform: none; }
  .btn.danger { background: var(--red); color: #fff; font-size: 16px; text-transform: none; }
  .btn:disabled { background: #b9b3c9; color: #6d6488; text-shadow: none; cursor: not-allowed; box-shadow: 0 6px 0 #6d6488; border-color: #6d6488; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin: 8px 0 10px; }
  .seg button { min-height: 52px; border-radius: 14px; border: 3px solid var(--ink); background: #fff; font-size: 15px; font-weight: 900;
                padding: 6px 4px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); }
  .seg button.sel { background: var(--yellow); transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
  .seg button:disabled { opacity: .45; }

  /* Dock y pestañas */
  #dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 6; width: 100%; max-width: 480px; padding: 16px 14px 0;
          background: linear-gradient(180deg, rgba(58,45,122,0), rgba(58,45,122,.95) 30%); }
  #dock:empty { display: none; }
  nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-bottom: calc(var(--safe-bottom) + 8px); }
  nav button { min-height: 54px; border-radius: 16px; border: 3px solid var(--ink); background: #5b4a9a; color: #fff;
               font-size: 13px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
  nav button span { font-size: 20px; line-height: 1; }
  nav button.on { background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--ink); transform: translateY(-3px); }

  /* Resultados */
  .board { background: #1b1638; color: #fff; text-align: center; padding: 16px 12px; }
  .board h2 { color: #b9b0e0; }
  .teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; font-weight: 900; font-size: 14px; }
  .score { font-family: ui-monospace, Menlo, monospace; font-size: 44px; font-weight: 900; color: var(--yellow); letter-spacing: .05em;
           background: #000; border-radius: 12px; padding: 2px 14px; border: 3px solid #444; }
  .ribbon { display: inline-block; margin-top: 12px; padding: 6px 18px; border-radius: 999px; font-weight: 900; font-size: 18px;
            letter-spacing: .1em; border: 3px solid #fff; animation: pop .5s ease both .3s; }
  .ribbon.victoria { background: var(--green); } .ribbon.empate { background: #8a84a6; } .ribbon.derrota { background: var(--red); }
  .me { display: flex; align-items: center; gap: 12px; text-align: left; }
  .nota { flex: none; width: 74px; height: 74px; border-radius: 50%; border: 4px solid var(--ink); display: grid; place-items: center;
          font-size: 28px; font-weight: 900; animation: pop .5s ease both .5s; }
  .nota.hi { background: var(--green); color: #fff; } .nota.mid { background: var(--yellow); } .nota.lo { background: var(--red); color: #fff; } .nota.no { background: #ddd; font-size: 30px; }
  .rewards { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .rw { font-size: 17px; font-weight: 900; padding: 6px 12px; border-radius: 14px; border: 3px solid var(--ink); background: #fff; box-shadow: 0 3px 0 var(--ink);
        animation: pop .45s ease both; }
  .rw.g { background: var(--chip-g); } .rw.b { background: var(--chip-b); }
  .big { font-size: 64px; font-weight: 900; text-align: center; line-height: 1; margin: 8px 0; animation: pop .6s ease both .2s; }
  .news { background: linear-gradient(180deg, #fff3c4, #ffe08a); }
  .news .it { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
  .news .it .ic { font-size: 26px; }
  details.why { background: #fff; }
  details.why summary { font-weight: 900; cursor: pointer; list-style: none; padding: 4px 0; font-size: 16px; }
  details.why summary::-webkit-details-marker { display: none; }
  details.why h4 { margin: 12px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  .res-line { padding: 7px 0; border-bottom: 2px dashed #e6dcc4; }
  .res-line:last-child { border-bottom: 0; }
  .res-line .h { font-weight: 900; }
  .res-line .r { color: var(--dim); font-size: 13px; display: block; margin-top: 2px; }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }

  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td { padding: 6px 0; border-bottom: 2px dashed #e6dcc4; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 800; }
  tr.tot td { font-weight: 900; border-bottom: 0; font-size: 17px; }
  .up { color: #15803d; } .down { color: #c2410c; }

  /* Clubes */
  .club .top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .club .top h3 { margin: 0; }
  .cmp { display: grid; grid-template-columns: 112px 1fr auto; gap: 6px 8px; align-items: center; font-size: 14px; font-weight: 800; margin: 8px 0; }
  .cmp .b { height: 12px; background: #e9dfc6; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .cmp .b i { display: block; height: 100%; }
  .cmp .v { font-size: 13px; white-space: nowrap; }
  details.more summary { font-weight: 900; font-size: 14px; cursor: pointer; color: var(--dim); padding: 6px 0; }

  /* Negocio y finanzas */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .tile { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; padding: 8px 6px; text-align: center; box-shadow: 0 4px 0 var(--ink); }
  .tile .ic { font-size: 22px; }
  .tile b { display: block; font-size: 16px; font-weight: 900; white-space: nowrap; }
  .tile span { font-size: 11px; font-weight: 800; color: var(--dim); }
  .stars { color: #f5a300; letter-spacing: 1px; font-size: 15px; }
  .staff { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
  .staff .rb { width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; font-size: 26px; font-weight: 900;
               box-shadow: 0 4px 0 var(--ink); cursor: pointer; flex: none; }
  .staff .rb:disabled { opacity: .4; }
  .staff .people { font-size: 34px; text-align: center; flex: 1; }
  .meter { margin: 6px 0; font-size: 13px; font-weight: 800; }
  .meter .b { height: 14px; background: #e9dfc6; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; margin-top: 2px; }
  .meter .b i { display: block; height: 100%; }
  .bigmoney { font-size: 40px; font-weight: 900; text-align: center; margin: 4px 0; }
  .chart { display: flex; align-items: flex-end; gap: 4px; height: 90px; padding-top: 6px; }
  .chart div { flex: 1; background: var(--blue); border: 2px solid var(--ink); border-radius: 6px 6px 2px 2px; min-height: 4px; }
  .chart div.last { background: var(--yellow); }
  .note { font-size: 12px; color: rgba(255,255,255,.8); text-align: center; margin: 14px 8px 0; font-weight: 700; }

  /* Intro */
  .intro { padding: calc(var(--safe-top) + 30px) 18px 40px; text-align: center; color: #fff; }
  .logo { font-size: 64px; animation: bob 2.4s ease-in-out infinite; }
  .intro h1 { font-size: 34px; font-weight: 900; line-height: 1.05; margin: 8px 0 6px; text-shadow: 0 3px 0 var(--ink); letter-spacing: .02em; }
  .intro .sub { font-weight: 800; opacity: .9; margin-bottom: 22px; }
  .intro .card { text-align: left; color: var(--ink); }
  .intro input { width: 100%; font: inherit; font-size: 18px; font-weight: 800; padding: 12px 14px; border-radius: 14px; border: 3px solid var(--ink); background: #fff;
                 -webkit-user-select: text; user-select: text; }
  .avas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .avas button { font-size: 32px; min-height: 58px; border-radius: 16px; border: 3px solid var(--ink); background: #fff; box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
  .avas button.sel { background: var(--yellow); transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }

  /* Aviso flotante y confeti */
  #toast { position: fixed; left: 50%; top: calc(var(--safe-top) + 110px); transform: translateX(-50%); z-index: 9; width: calc(100% - 28px); max-width: 452px; pointer-events: none; }
  #toast div { background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 10px 14px; font-weight: 800; font-size: 14px;
               box-shadow: 0 5px 0 var(--ink); animation: toast 4.5s ease both; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-20px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-10px); } }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 8; }
  .confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border: 2px solid var(--ink); border-radius: 3px; animation: fall 2.8s linear both; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="main"></main>
  <div id="dock"></div>
</div>
<div id="toast" aria-live="polite"></div>
<script>
'use strict';

/* =====================================================================
   1. CONFIGURACIÓN
   Todos los importes están en euros pero son PROVISIONALES, de juego.
   No representan precios ni salarios reales. Cámbialos aquí para equilibrar.
   ===================================================================== */
const CFG = {
  moneda: '€',
  guardado: 'del_barrio_al_negocio_p1_v1',
  inicio: { nivel: 30, energia: 70, rep: 5, dinero: 40 },
  energiaMax: 100,

  barrio: {
    recuperacion: 10,          // energía que se recupera sola cada semana en el barrio
    repOjeador: 25,            // reputación necesaria para que aparezca el ojeador
    plazaRepBase: 3,           // reputación por partido en la plaza: base + nivel/10 + bonus si energía >= 50
    plazaBonusEnergia: 2,
    trabajoPago: 60,
    entrenadorCoste: 90,
  },
  prueba: {
    semanasCorto: 3, semanasLargo: 5, penalLargo: 4,
    suerte: 5,                 // ± puntos de suerte en la prueba
    // puntuación = nivel + energía/5 + reputación/5 + suerte (+ ajuste por plazo)
  },
  club: {
    gastosVida: 60,            // gastos personales semanales al ser profesional
    recuperacion: 20,          // energía que se recupera cada semana
    energiaTitular: 15, energiaSuplente: 5,
    probJugarSuplente: 0.5,
    probEmpate: 0.25,
    lesionUmbral: 35,          // si juegas con energía por debajo de esto, puedes lesionarte
    lesionPctPorPunto: 2,      // % de riesgo por cada punto por debajo del umbral
    lesionSemanas: 2,
    semanasMinMejora: 6, partidosMinMejora: 4, notasMejora: 5,
    fisioCoste: 40,
  },
  clubs: {
    ciudad: {
      nombre: 'Atlético Ciudad', equipo: 'Equipo filial', tipo: 'Club grande', siglas: 'AC', color1: '#e63946', color2: '#ffffff',
      umbralContratoBueno: 60, salarioBueno: 110, salarioFormacion: 70,
      fichaje: 0, primaVictoria: 15, semanas: 26,

/* =====================================================================
   2. UTILIDADES
   ===================================================================== */
function rnd(s) { // mulberry32, estado guardado en la partida (resultados reproducibles)
  s.rng = (s.rng + 0x6D2B79F5) | 0;
  let t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = v => Math.round(v * 10) / 10;
const cr = n => (n < 0 ? '−' : '') + String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' ' + CFG.moneda;
const nf = v => String(r1(v)).replace('.', ',');
const sg = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + nf(Math.abs(n));
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

   3. ESTADO
   ===================================================================== */
let S = null;

function nuevaPartida(seed) {
  const i = CFG.inicio;
  return {
    v: 1,
    rng: (seed == null ? (Date.now() & 0x7fffffff) : seed) | 0,
    semana: 1,
    fase: 'barrio',          // barrio → prep → club
    p: { nivel: i.nivel, energia: i.energia, rep: i.rep, dinero: i.dinero },
    prep: null,              // { semanasRestantes, ajuste }
    contrato: null,
    lesion: 0, tension: 0,
    stats: { semanasClub: 0, partidos: 0, jugados: 0, victorias: 0, notas: [] },
    mejora: 'pendiente',     // pendiente | ofrecida | hecha
    negocio: null,
    pendiente: null,         // evento que requiere decisión
    eleccion: null,
    ultimo: null,            // resultados de la última semana
    verResultado: false,

  };
}

function guardar() {
  try { localStorage.setItem(CFG.guardado, JSON.stringify(S)); return true; } catch (_) { return false; }
}
function cargar() {
  try {
    const t = localStorage.getItem(CFG.guardado);
    if (!t) return null;
    const s = JSON.parse(t);
    if (!s || s.v !== 1) return null;
    if (s.intro === undefined) { s.intro = false; s.nombre = 'Crack'; s.avatar = CFG.avatares[0]; }
    return s;
  } catch (_) { return null; }
}
function reiniciar(seed) {
  try { localStorage.removeItem(CFG.guardado); } catch (_) {}
  S = nuevaPartida(seed);
  confirmarReinicio = false;
  guardar();
  render();
}

/* =====================================================================
   4. REGLAS (fórmulas que se muestran al jugador)
   ===================================================================== */
function repPlaza(s) {
  const b = CFG.barrio;
  return b.plazaRepBase + Math.floor(s.p.nivel / 10) + (s.p.energia >= 50 ? b.plazaBonusEnergia : 0);
}
function pruebaBase(s) { // sin suerte
  return s.p.nivel + s.p.energia / 5 + s.p.rep / 5 + (s.prep ? s.prep.ajuste : 0);
}
function ofertasClubes(score) {
  const c = CFG.clubs.ciudad, p = CFG.clubs.puerto;
  const bueno = score >= c.umbralContratoBueno;
  return {
    ciudad: {
      id: 'ciudad', nombre: c.nombre, equipo: c.equipo, tipo: c.tipo,
      salario: bueno ? c.salarioBueno : c.salarioFormacion,
      detalleSalario: bueno ? `Contrato de filial (tu prueba ≥ ${c.umbralContratoBueno})` : `Contrato de formación (tu prueba < ${c.umbralContratoBueno})`,
      fichaje: c.fichaje, primaVictoria: c.primaVictoria, semanas: c.semanas,
      calidad: c.calidad, umbral: c.umbral, rivalNivel: c.rivalNivel, visibilidad: c.visibilidad,
      probVictoria: c.probVictoria, notaMejora: c.notaMejora,
    },
    puerto: {
      id: 'puerto', nombre: p.nombre, equipo: p.equipo, tipo: p.tipo,
      salario: p.salarioBase + Math.max(0, Math.round(score) - p.puntosDesde) * p.salarioPorPunto,
      detalleSalario: `${p.salarioBase} + ${p.salarioPorPunto} por cada punto de prueba por encima de ${p.puntosDesde}`,
      fichaje: p.fichaje, primaVictoria: p.primaVictoria, semanas: p.semanas,
      calidad: p.calidad, umbral: p.umbral, rivalNivel: p.rivalNivel, visibilidad: p.visibilidad,
      probVictoria: p.probVictoria, notaMejora: p.notaMejora,
    },
  };
}
function seleccionMalus(s, accionId) {
  let m = 0;
  if (accionId === 'patrocinio') m += 8;
  if (accionId === 'visitaNegocio') m += 4;
  if (s.tension > 0) m += CFG.negociacion.tensionSeleccion;
  return m;
}
function puntSeleccion(s, malus) { return s.p.nivel + s.p.energia / 4 - malus; }
function notaMedia(s) {
  const n = s.stats.notas.slice(-CFG.club.notasMejora);
  return n.length ? n.reduce((a, b) => a + b, 0) / n.length : 0;
}
function valorNegocio(s) {
  if (!s.negocio) return 0;
  return Math.round(CFG.negocio.precio * (0.5 + s.negocio.fama / 100));
}
function patrimonio(s) { return s.p.dinero + (s.negocio ? s.negocio.caja + valorNegocio(s) : 0); }
function capacidadNegocio(n) { return n.empleados * CFG.negocio.sueldos[n.sueldo].capacidad; }
function demandaNegocio(s, n) { // sin la variación aleatoria (±10 %)
  const pr = CFG.negocio.precios[n.precio];
  return CFG.negocio.demandaBase * pr.factor * (0.2 + n.fama / 80) * (1 + s.p.rep / 200);
}

for (const a of Object.values(ACCIONES)) a.t = a.ic + ' ' + a.n;

function accionesDisponibles(s) {
  return Object.entries(ACCIONES).filter(([id, a]) => a.fases.includes(s.fase) && !(id === 'visitaNegocio' && !s.negocio));
}

/* =====================================================================
   6. SEMANA
   ===================================================================== */
function elegir(id) {
  if (S.pendiente || S.verResultado) return false;
  const a = ACCIONES[id];
  if (!a || !a.fases.includes(S.fase)) return false;
  if (a.disponible && a.disponible(S)) return false;
  S.eleccion = id;
  guardar(); render();
  return true;
}

function foto(s) {
  return { nivel: s.p.nivel, energia: s.p.energia, rep: s.p.rep, dinero: s.p.dinero, caja: s.negocio ? s.negocio.caja : null, fama: s.negocio ? s.negocio.fama : null };
}

function avanzarSemana() {
  const s = S;
  if (s.pendiente || s.verResultado || !s.eleccion) return false;
  const id = s.eleccion, a = ACCIONES[id];
  if (!a || !a.fases.includes(s.fase) || (a.disponible && a.disponible(s))) { s.eleccion = null; render(); return false; }

  const R = { semana: s.semana, accion: a.t, accionId: id, fase: s.fase, dep: [], eco: [], neg: [], opo: [], negocio: null, partido: null, antes: foto(s) };
  const dineroAntes = s.p.dinero;
  const malus = seleccionMalus(s, id);
  a.aplicar(s, R);
  s.p.energia = clamp(s.p.energia, 0, CFG.energiaMax);

  if (s.fase === 'barrio') {
    s.p.energia = clamp(s.p.energia + CFG.barrio.recuperacion, 0, CFG.energiaMax);
    R.dep.push(['Recuperación semanal', `+${CFG.barrio.recuperacion} energía`, 'Todas las semanas recuperas algo de energía.']);
    if (s.p.rep >= CFG.barrio.repOjeador) {
      s.pendiente = { tipo: 'ojeador' };
      R.opo.push(['Un ojeador te ha visto jugar', `Tu reputación (${s.p.rep}) llega a ${CFG.barrio.repOjeador}. Quiere invitarte a unas pruebas.`]);
    }
  } else if (s.fase === 'prep') {
    s.p.energia = clamp(s.p.energia + CFG.barrio.recuperacion, 0, CFG.energiaMax);
    R.dep.push(['Recuperación semanal', `+${CFG.barrio.recuperacion} energía`, 'Todas las semanas recuperas algo de energía.']);
    s.prep.semanasRestantes -= 1;
    if (s.prep.semanasRestantes <= 0) {
      const suerte = Math.round((rnd(s) * 2 - 1) * CFG.prueba.suerte);
      const base = pruebaBase(s);
      const score = Math.round(base + suerte);
      const of = ofertasClubes(score);
      s.pendiente = { tipo: 'ofertas', score, ofertas: of };
      R.prueba = { score, suerte, nivel: s.p.nivel, energia: s.p.energia, rep: s.p.rep, ajuste: s.prep.ajuste };
      R.dep.push(['Día de las pruebas', `Puntuación: ${score}`,
        `Nivel ${nf(s.p.nivel)} + energía ${s.p.energia}/5 + reputación ${s.p.rep}/5${s.prep.ajuste ? ` ${sg(s.prep.ajuste)} por pedir más tiempo` : ''} + suerte ${sg(suerte)}.`]);
      R.opo.push(['Dos clubes te hacen una oferta', 'Compara las condiciones antes de firmar.']);
    }
  } else if (s.fase === 'club') {
    semanaClub(s, R, malus);
  }

  if (s.negocio) semanaNegocio(s, R);

  // Oportunidades / avisos
  if (s.fase === 'club' && !s.negocio && s.p.dinero >= CFG.negocio.precio + CFG.negocio.cajaOpciones[0] && dineroAntes < CFG.negocio.precio + CFG.negocio.cajaOpciones[0]) {
    R.opo.push(['Ya puedes comprar la peluquería', `Ve a la pestaña «Negocio». Necesitas ${cr(CFG.negocio.precio)} + una caja inicial.`]);
  }
  if (!s.metaVista && s.negocio && patrimonio(s) >= CFG.metaPatrimonio && !s.pendiente) {
    s.pendiente = { tipo: 'meta' };
    R.opo.push(['¡Objetivo de la versión cumplido!', `Tu patrimonio supera ${cr(CFG.metaPatrimonio)}.`]);
  }

  // Contabilidad personal
  for (const [, v] of R.eco) { if (v > 0) s.acum.ingresosPers += v; else s.acum.gastosPers -= v; }
  R.dineroFinal = s.p.dinero;
  R.patrimonio = patrimonio(s);
  s.historial.push({ semana: s.semana, dinero: s.p.dinero, caja: s.negocio ? s.negocio.caja : null, patrimonio: R.patrimonio });
  if (s.historial.length > 12) s.historial.shift();

  s.p.nivel = clamp(r1(s.p.nivel), 0, 100);
  s.p.rep = clamp(s.p.rep, 0, 100);
  R.despues = foto(s);
  s.ultimo = R;
  s.eleccion = null;
  s.semana += 1;
  s.verResultado = true;
  guardar();
  render();
  return true;
}

function semanaClub(s, R, malus) {
  const c = s.contrato, K = CFG.club;
  s.stats.semanasClub += 1;
  s.stats.partidos += 1;

  // --- Partido simulado ---
  const P = { rival: c.rivalNivel };
  const energiaAntes = s.p.energia;
  if (s.lesion > 0) {
    P.rol = 'lesionado';
    s.lesion -= 1;
    R.dep.push(['No juegas: tienes una lesión', s.lesion > 0 ? `Quedan ${s.lesion} semanas` : 'Recuperación completa para la próxima semana', 'Las lesiones duran ' + K.lesionSemanas + ' semanas (el fisio las acorta).']);
  } else {
    const sel = puntSeleccion(s, malus);
    P.seleccion = r1(sel);
    if (sel >= c.umbral) P.rol = 'titular';
    else P.rol = rnd(s) < K.probJugarSuplente ? 'suplente' : 'banquillo';
    const explSel = `Selección = nivel ${nf(s.p.nivel)} + energía ${s.p.energia}/4${malus ? ` − ${malus} (${[seleccionMalus(s, null) ? 'relación tensa con el club' : '', malus - seleccionMalus(s, null) ? 'faltaste a sesiones' : ''].filter(Boolean).join(', ')})` : ''} = ${nf(sel)}. El umbral para ser titular es ${c.umbral}.`;
    R.dep.push([P.rol === 'titular' ? 'Eres titular' : P.rol === 'suplente' ? 'Sales desde el banquillo' : 'No llegas a jugar', '', explSel + (P.rol !== 'titular' ? ` Como suplente juegas el ${Math.round(K.probJugarSuplente * 100)} % de las veces.` : '')]);
  }

  const juega = P.rol === 'titular' || P.rol === 'suplente';
  if (juega) {
    const suerte = (rnd(s) * 2 - 1) * 1.2;
    const nota = clamp(6 + (s.p.nivel - c.rivalNivel) / 8 + (s.p.energia - 60) / 30 + suerte, 3, 10);
    P.nota = r1(nota);
    s.stats.jugados += 1;
    s.stats.notas.push(P.nota);
    if (s.stats.notas.length > 20) s.stats.notas.shift();
    R.dep.push([`Tu nota: ${P.nota.toFixed(1).replace('.', ',')}`, '',
      `6 + (nivel ${nf(s.p.nivel)} − nivel rival ${c.rivalNivel})/8 + (energía ${s.p.energia} − 60)/30 + suerte ${sg(r1(suerte))}.`]);
  }

  // Resultado del equipo
  const influencia = juega ? (P.nota - 6) * (P.rol === 'titular' ? 0.08 : 0.04) : 0;
  const pv = clamp(c.probVictoria + influencia, 0.05, 0.9);
  const x = rnd(s);
  P.resultado = x < pv ? 'victoria' : x < pv + K.probEmpate ? 'empate' : 'derrota';
  P.pv = Math.round(pv * 100);
  { // marcador solo visual (no usa el azar de la partida)
    const h = Math.imul(s.semana + 7, 2654435761) >>> 0, base = h % 3, dif = 1 + ((h >>> 5) % 2);
    P.rival = CFG.rivales[s.semana % CFG.rivales.length];
    P.gf = P.resultado === 'derrota' ? base : P.resultado === 'empate' ? base : base + dif;
    P.gc = P.resultado === 'victoria' ? base : P.resultado === 'empate' ? base : base + dif;
  }
  if (P.resultado === 'victoria') s.stats.victorias += 1;
  R.dep.push([`Resultado del equipo: ${P.resultado}`, '',
    `Probabilidad de victoria ${P.pv} % (base del club ${Math.round(c.probVictoria * 100)} %${juega ? ` ${influencia >= 0 ? '+' : '−'} ${Math.abs(Math.round(influencia * 100))} % por tu nota` : ''}), empate ${Math.round(K.probEmpate * 100)} %.`]);

  // Reputación
  let dRep;
  if (juega) dRep = Math.round((P.nota - 6) * 3 * c.visibilidad * (P.rol === 'titular' ? 1 : 0.5));
  else dRep = -1;
  if (P.resultado === 'victoria' && juega) dRep += 1;
  s.p.rep = clamp(s.p.rep + dRep, 0, 100);
  R.dep.push([`Reputación ${sg(dRep)}`, '', juega
    ? `(nota − 6) × 3 × visibilidad del club ${c.visibilidad}${P.rol === 'suplente' ? ' × 0,5 por jugar poco' : ''}${P.resultado === 'victoria' ? ' + 1 por la victoria' : ''}.`
    : 'Si no juegas pierdes 1 punto de reputación.']);

  // Energía del partido y lesiones
  if (P.rol === 'titular') s.p.energia -= K.energiaTitular;
  if (P.rol === 'suplente') s.p.energia -= K.energiaSuplente;
  if (juega && energiaAntes < K.lesionUmbral) {
    const prob = (K.lesionUmbral - energiaAntes) * K.lesionPctPorPunto;
    if (rnd(s) * 100 < prob) {
      s.lesion = K.lesionSemanas;
      R.dep.push(['⚠️ Te lesionas', `${K.lesionSemanas} semanas sin jugar`, `Jugaste con energía ${energiaAntes} (< ${K.lesionUmbral}): riesgo ${prob} %.`]);
    } else {
      R.dep.push(['Sin lesión, por poco', '', `Jugaste con energía ${energiaAntes} (< ${K.lesionUmbral}): había un riesgo de lesión del ${prob} %.`]);
    }
  }
  s.p.energia = clamp(s.p.energia + K.recuperacion, 0, CFG.energiaMax);
  R.dep.push(['Recuperación semanal', `+${K.recuperacion} energía`, `Partido: titular −${K.energiaTitular}, suplente −${K.energiaSuplente}.`]);
  R.partido = P;

  // Economía personal
  s.p.dinero += c.salario; R.eco.push([`Salario (${c.nombre})`, c.salario]);
  if (P.resultado === 'victoria' && juega) { s.p.dinero += c.primaVictoria; R.eco.push(['Prima por victoria', c.primaVictoria]); }
  s.p.dinero -= K.gastosVida; R.eco.push(['Gastos de vida', -K.gastosVida]);

  if (s.tension > 0) s.tension -= 1;

  // Contrato
  c.semanasRestantes -= 1;
  if (c.semanasRestantes <= 0) {
    const m = notaMedia(s), N = CFG.negociacion;
    const f = m >= c.notaMejora ? N.renovacionSube : N.renovacionBaja;
    const antes = c.salario;
    c.salario = Math.round(c.salario * f);
    c.semanasRestantes = CFG.clubs[c.id].semanas;
    R.opo.push(['Tu contrato ha terminado y se renueva', `Salario ${cr(antes)} → ${cr(c.salario)}: tu nota media (${m.toFixed(1).replace('.', ',')}) ${m >= c.notaMejora ? 'llega' : 'no llega'} a ${nf(c.notaMejora)}.`]);
  }

  // Oportunidad de mejora de contrato
  if (s.mejora === 'pendiente' && condicionMejora(s).ok) {
    s.mejora = 'ofrecida';
    s.pendiente = { tipo: 'mejora', oferta: ofertaMejora(s) };
    R.opo.push(['El club quiere mejorar tu contrato', 'Tu rendimiento ha convencido al club.']);
  }
}

function condicionMejora(s) {
  const K = CFG.club, c = s.contrato;
  const notas = s.stats.notas.slice(-K.notasMejora);
  const media = notaMedia(s);
  return {
    semanas: s.stats.semanasClub, jugados: s.stats.jugados, media, notaReq: c.notaMejora,
    ok: s.stats.semanasClub >= K.semanasMinMejora && s.stats.jugados >= K.partidosMinMejora && notas.length > 0 && media >= c.notaMejora,
  };
}
function ofertaMejora(s) {
  const c = s.contrato, m = CFG.clubs[c.id].mejora;
  const salario = m.salario != null ? m.salario : Math.round(c.salario * m.salarioFactor);
  return {
    texto: m.texto, equipo: m.equipo, salario, primaVictoria: m.primaVictoria, umbral: m.umbral,
    rivalNivel: m.rivalNivel, visibilidad: m.visibilidad, probVictoria: m.probVictoria, semanas: m.semanas,
  };
}

/* =====================================================================
   7. EVENTOS
   ===================================================================== */
function resolver(opcion) {
  const s = S, ev = s.pendiente;
  if (!ev || s.verResultado) return false;
  const msgs = [];
  if (ev.tipo === 'ojeador') {
    const largo = opcion === 'largo';
    if (opcion !== 'corto' && !largo) return false;
    s.fase = 'prep';
    s.prep = { semanasRestantes: largo ? CFG.prueba.semanasLargo : CFG.prueba.semanasCorto, ajuste: largo ? -CFG.prueba.penalLargo : 0 };
  } else if (ev.tipo === 'ofertas') {
    const o = ev.ofertas[opcion];
    if (!o) return false;
    s.fase = 'club';
    s.contrato = { ...o, semanasRestantes: o.semanas };
    if (o.fichaje) { s.p.dinero += o.fichaje; s.acum.ingresosPers += o.fichaje; msgs.push(`Prima de fichaje: +${cr(o.fichaje)}`); }
    s.prep = null;
  } else if (ev.tipo === 'mejora') {
    const o = ev.oferta, N = CFG.negociacion, c = s.contrato;
    const aplicar = (sal, sem) => {
      Object.assign(c, { equipo: o.equipo, salario: sal, primaVictoria: o.primaVictoria, umbral: o.umbral, rivalNivel: o.rivalNivel,
        visibilidad: o.visibilidad, probVictoria: o.probVictoria, semanasRestantes: sem });
    };
    if (opcion === 'aceptar') { aplicar(o.salario, o.semanas); msgs.push(`Firmas: ${cr(o.salario)} por semana.`); }
    else if (opcion === 'pedir') {
      const prob = clamp(s.p.rep, N.probMin, N.probMax);
      const ok = rnd(s) * 100 < prob;
      if (ok) { const sal = Math.round(o.salario * N.pedirMasFactor); aplicar(sal, o.semanas); msgs.push(`¡El club acepta! Firmas por ${cr(sal)} por semana (probabilidad era ${prob} %).`); }
      else { aplicar(o.salario, o.semanas); s.tension = N.tensionSemanas; msgs.push(`El club no acepta (probabilidad era ${prob} %). Firmas la oferta inicial, pero la relación queda tensa: −${N.tensionSeleccion} en la selección durante ${N.tensionSemanas} semanas.`); }
    } else if (opcion === 'largo') {
      const sal = Math.round(o.salario * N.largoFactor), prima = sal * N.largoPrimaSemanas;
      aplicar(sal, N.largoSemanas);
      s.p.dinero += prima; s.acum.ingresosPers += prima;
      msgs.push(`Firmas ${N.largoSemanas} semanas por ${cr(sal)} por semana y cobras ahora ${cr(prima)} de prima de firma.`);
    } else return false;
    s.mejora = 'hecha';
  } else if (ev.tipo === 'meta') {
    s.metaVista = true;
  } else return false;
  s.pendiente = null;
  s.aviso = msgs.join(' ');
  guardar(); render();
  return true;
}

/* =====================================================================
   8. NEGOCIO
   ===================================================================== */
function comprarNegocio(caja) {
  const s = S, N = CFG.negocio;
  if (s.negocio || s.fase !== 'club' || !N.cajaOpciones.includes(caja)) return false;
  if (s.p.dinero < N.precio + caja) return false;
  s.p.dinero -= N.precio + caja;
  s.acum.gastosPers += N.precio + caja;
  s.negocio = { fama: N.famaInicial, precio: 'normal', empleados: 1, sueldo: 'basico', caja, semanas: 0, ultimo: null, impagos: 0 };
  s.aviso = `Has comprado la ${N.nombre}. Pagas ${cr(N.precio)} y pones ${cr(caja)} en su caja. A partir de ahora, la caja del negocio y tu dinero personal van por separado.`;
  s.tab = 'negocio';
  guardar(); render();
  return true;
}
function cambiarNegocio(campo, valor) {
  const n = S.negocio, N = CFG.negocio;
  if (!n || S.verResultado) return false;
  if (campo === 'precio' && N.precios[valor]) n.precio = valor;
  else if (campo === 'sueldo' && N.sueldos[valor]) n.sueldo = valor;
  else if (campo === 'empleados') {
    const v = n.empleados + valor;
    if (v < N.empleadosMin || v > N.empleadosMax) return false;
    if (valor > 0) { if (n.caja < N.costeContratar) return false; n.caja -= N.costeContratar; S.acum.gastosNeg += N.costeContratar; S.aviso = `Contratas a una persona más: −${cr(N.costeContratar)} de la caja (formación).`; }
    else { const ind = N.sueldos[n.sueldo].coste; n.caja -= ind; S.acum.gastosNeg += ind; S.aviso = `Despides a una persona: −${cr(ind)} de indemnización (una semana de sueldo).`; }
    n.empleados = v;
  } else return false;
  guardar(); render();
  return true;
}
function traspasar(dir) {
  const s = S, n = s.negocio, t = CFG.negocio.traspaso;
  if (!n || s.verResultado) return false;
  if (dir === 'aCaja') { if (s.p.dinero < t) return false; s.p.dinero -= t; n.caja += t; s.aviso = `Pasas ${cr(t)} de tu dinero a la caja del negocio.`; }
  else if (dir === 'aPersonal') { if (n.caja < t) return false; n.caja -= t; s.p.dinero += t; s.aviso = `Retiras ${cr(t)} de la caja a tu dinero personal.`; }
  else return false;
  guardar(); render();
  return true;
}

function semanaNegocio(s, R) {
  const n = s.negocio, N = CFG.negocio;
  const pr = N.precios[n.precio], su = N.sueldos[n.sueldo];
  const famaAntes = n.fama;
  const base = demandaNegocio(s, n);
  const variacion = 0.9 + rnd(s) * 0.2;
  const demanda = Math.round(base * variacion);
  const cap = capacidadNegocio(n);
  const clientes = Math.min(demanda, cap);
  const perdidos = demanda - clientes;
  const ingresos = clientes * pr.precio;
  const sueldos = n.empleados * su.coste;
  const productos = clientes * N.productoPorCliente;
  const gastos = N.alquiler + sueldos + productos;
  const resultado = ingresos - gastos;
  n.caja += resultado;
  n.semanas += 1;
  s.acum.ingresosNeg += ingresos; s.acum.gastosNeg += gastos;

  const fam = [];
  let dPrecio = pr.fama;
  if (n.precio === 'premium' && n.fama >= pr.famaSinPenal) dPrecio = 0;
  if (dPrecio) fam.push([dPrecio, n.precio === 'premium' ? `precio premium con fama < ${pr.famaSinPenal}` : 'precios populares']);
  fam.push([su.fama, su.fama > 0 ? 'personal bien pagado' : 'rotación por sueldo básico']);
  if (perdidos > 3) fam.push([N.colasFama, `${perdidos} clientes sin atender`]);
  if (n.caja < 0) { fam.push([N.impagoFama, 'caja en negativo: pagos con retraso']); n.impagos += 1; }
  for (const [d] of fam) n.fama += d;
  n.fama = clamp(n.fama, 0, 100);

  n.ultimo = { demanda, cap, clientes, perdidos, ingresos, sueldos, productos, alquiler: N.alquiler, gastos, resultado, famaAntes, fama: n.fama, fam };
  R.negocio = n.ultimo;
  R.neg.push([`Clientes: ${clientes} de ${demanda} interesados`, perdidos > 0 ? `${perdidos} se van sin atender` : '',
    `Demanda = ${N.demandaBase} × precio ${pr.nombre.toLowerCase()} ${pr.factor} × (0,2 + fama ${famaAntes}/80) × (1 + tu reputación ${s.p.rep}/200) ± 10 %. Capacidad = ${n.empleados} × ${su.capacidad}.`]);
  R.neg.push([`Resultado semanal: ${resultado >= 0 ? '+' : '−'}${cr(Math.abs(resultado))}`, '',
    `Ingresos ${cr(ingresos)} (${clientes} × ${pr.precio}) − alquiler ${N.alquiler} − sueldos ${sueldos} − productos ${productos}.`]);
  R.neg.push([`Fama ${famaAntes} → ${n.fama}`, '', fam.map(([d, t]) => `${sg(d)} ${t}`).join(' · ')]);
  if (n.caja < 0) R.opo.push(['⚠️ La caja del negocio está en negativo', 'Pasa dinero personal a la caja o cambia precios/personal; cada semana en negativo resta fama.']);
}

/* =====================================================================
   9. OBJETIVOS
   ===================================================================== */
function objetivos(s) {
  const out = [];
  const N = CFG.negocio;
  if (s.fase === 'barrio') {
    out.push({ t: 'Llama la atención de un ojeador', d: `Reputación ${s.p.rep} de ${CFG.barrio.repOjeador}. Los partidos en la plaza dan reputación (más con nivel y energía).`, prog: s.p.rep / CFG.barrio.repOjeador });
    out.push({ t: 'Después: preparar las pruebas' });
  } else if (s.fase === 'prep') {
    const k = s.prep.semanasRestantes, est = Math.round(pruebaBase(s));
    out.push({ t: k === 1 ? 'Las pruebas son al final de esta semana' : `Prepara las pruebas: quedan ${k} semanas`,
      d: `Puntuación estimada ahora: ${est} (± ${CFG.prueba.suerte} de suerte) = nivel + energía/5 + reputación/5${s.prep.ajuste ? ` ${sg(s.prep.ajuste)}` : ''}. Con ${CFG.clubs.ciudad.umbralContratoBueno} o más, el club grande ofrece contrato de filial; el modesto paga más cuanto más alta sea.`,
      prog: clamp(est / CFG.clubs.ciudad.umbralContratoBueno, 0, 1) });
    out.push({ t: 'Después: elegir entre dos clubes' });
  } else {
    const cm = condicionMejora(s);
    const objCompra = N.precio + N.cajaOpciones[0];
    if (s.mejora !== 'hecha') {
      out.push({ t: 'Gánate una mejora de contrato',
        d: `Necesitas ${CFG.club.semanasMinMejora} semanas en el club (${cm.semanas}), ${CFG.club.partidosMinMejora} partidos jugados (${cm.jugados}) y nota media ≥ ${nf(cm.notaReq)} en tus últimos ${CFG.club.notasMejora} partidos (${cm.media ? cm.media.toFixed(1).replace('.', ',') : '—'}).`,
        prog: Math.min(cm.semanas / CFG.club.semanasMinMejora, cm.jugados / CFG.club.partidosMinMejora, cm.media / cm.notaReq, 1) });
    }
    if (!s.negocio) {
      out.push({ t: 'Ahorra para comprar la peluquería', d: `Dinero ${cr(s.p.dinero)} de ${cr(objCompra)} (precio ${cr(N.precio)} + caja mínima ${cr(N.cajaOpciones[0])}). Cuando lo tengas, cómprala en «Negocio».`, prog: s.p.dinero / objCompra });
    } else {
      out.push({ t: `Haz crecer tu patrimonio hasta ${cr(CFG.metaPatrimonio)}`, d: `Ahora: ${cr(patrimonio(s))} = dinero personal + caja del negocio + valor del negocio. Mira «Finanzas».`, prog: patrimonio(s) / CFG.metaPatrimonio });
    }
    if (s.metaVista) out.unshift({ t: 'Objetivos de esta versión cumplidos', d: 'Puedes seguir jugando o reiniciar en «Finanzas».', prog: 1 });
  }
  return out;
}

function chip(ic, v) {
  if (typeof v === 'string') return `<span class="chip">${ic} ${esc(v)}</span>`;
  const txt = ic === '€' ? `${v >= 0 ? '+' : '−'}${cr(Math.abs(v))}` : `${ic} ${sg(v)}`;
  return `<span class="chip ${v >= 0 ? 'g' : 'b'}">${txt}</span>`;
}

/* ---- Escenas dibujadas (SVG, sin archivos externos) ---- */
function edificios(colores) {
  const xs = [0, 52, 98, 150, 214, 262, 310], hs = [70, 96, 58, 84, 104, 66, 90];
  return xs.map((x, i) => {
    const w = (xs[i + 1] || 362) - x - 4, h = hs[i], y = 122 - h;
    let win = '';
    for (let yy = y + 10; yy < 112; yy += 18) for (let xx = x + 7; xx < x + w - 10; xx += 14)
      win += `<rect x="${xx}" y="${yy}" width="7" height="9" rx="1" fill="${(xx + yy) % 3 ? '#ffe9a6' : '#3b3160'}"/>`;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${colores[i % colores.length]}" stroke="#2a2340" stroke-width="3"/>${win}`;
  }).join('');
}

      <rect width="360" height="170" fill="url(#skC)"/>

      ${foco(40)}${foco(320)}${franjas}
      <rect x="0" y="110" width="360" height="60" fill="none" stroke="#2a2340" stroke-width="3"/>
      <path d="M180 110 V170 M120 170 Q180 120 240 170" stroke="#fff" stroke-width="3" fill="none" opacity=".8"/></svg>`;
  }
  // negocio
  const n = S.negocio, aw = n ? (n.fama >= 60 ? '#4fd36a' : n.fama >= 30 ? '#e63946' : '#8a84a6') : '#8a84a6';
  let toldo = '';
  for (let i = 0; i < 9; i++) toldo += `<path d="M${40 + i * 31} 62 h31 v18 q-15.5 10 -31 0 z" fill="${i % 2 ? '#fff' : aw}" stroke="#2a2340" stroke-width="2.5"/>`;
  const sillas = n ? Array.from({ length: n.empleados }, (_, i) => `<text x="${140 + i * 44}" y="132" font-size="30">💇</text>`).join('') : '';
  return `<svg viewBox="0 0 360 170" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="360" height="170" fill="#ffd9a8"/>
    <rect x="30" y="20" width="300" height="130" fill="#f4e1c4" stroke="#2a2340" stroke-width="3"/>
    <rect x="80" y="26" width="200" height="30" rx="6" fill="#2a2340"/>
    <text x="180" y="47" text-anchor="middle" font-size="17" font-weight="900" fill="#fff" font-family="system-ui, sans-serif" letter-spacing="2">PELUQUERÍA</text>
    ${toldo}
    <rect x="120" y="90" width="170" height="56" fill="#bfe6ff" stroke="#2a2340" stroke-width="3"/>${sillas}
    <rect x="58" y="90" width="44" height="60" fill="#8a5a3c" stroke="#2a2340" stroke-width="3"/>
    <rect x="304" y="86" width="14" height="50" rx="7" fill="#fff" stroke="#2a2340" stroke-width="3"/>
    <path d="M305 96 l12 -6 M305 108 l12 -6 M305 120 l12 -6 M305 132 l12 -6" stroke="#e63946" stroke-width="4"/>
    <rect x="0" y="150" width="360" height="20" fill="#9a97ab" stroke="#2a2340" stroke-width="3"/>
    ${n ? '' : `<g transform="rotate(-8 180 115)"><rect x="118" y="96" width="124" height="40" rx="6" fill="#ffc93c" stroke="#2a2340" stroke-width="3"/><text x="180" y="123" text-anchor="middle" font-size="20" font-weight="900" fill="#2a2340" font-family="system-ui, sans-serif">SE VENDE</text></g>`}</svg>`;
}

function escudo(id, size) {
  const c = CFG.clubs[id];
  return `<svg width="${size}" height="${Math.round(size * 1.15)}" viewBox="0 0 60 70" aria-hidden="true" style="flex:none">
    <path d="M30 3 L56 11 L54 40 Q50 59 30 67 Q10 59 6 40 L4 11 Z" fill="${c.color1}" stroke="#2a2340" stroke-width="4"/>
    <path d="M30 6 L30 64" stroke="${c.color2}" stroke-width="6" opacity=".35"/>
    <text x="30" y="43" text-anchor="middle" font-size="${c.siglas.length > 2 ? 15 : 19}" font-weight="900" fill="${c.color2}" stroke="#2a2340" stroke-width="1" font-family="system-ui, sans-serif">${c.siglas}</text></svg>`;
}

function confeti() {
  const col = ['#ffc93c', '#4fd36a', '#ff6b5e', '#48a9ff', '#ff7eb6'];
  return `<div class="confetti">${Array.from({ length: 36 }, (_, i) =>
    `<i style="left:${Math.random() * 100}%;background:${col[i % 5]};animation-delay:${(Math.random() * 0.8).toFixed(2)}s"></i>`).join('')}</div>`;
}

/* ---- HUD ---- */
function renderTop() {
  const s = S;
  if (s.intro) { $('top').innerHTML = ''; return; }
  const bar = (v, c) => `<div class="bar"><i style="width:${clamp(v, 0, 100)}%;background:${c}"></i></div>`;
  const sub = s.fase === 'club' ? s.contrato.nombre : s.fase === 'prep' ? 'Preparando pruebas' : 'Jugando en el barrio';
  $('top').innerHTML = `
    <div class="hudrow">
      <div class="ava">${s.avatar}</div>
      <div class="who"><b>${esc(s.nombre)}</b><span>Semana ${s.semana} · ${esc(sub)}</span></div>
      <div class="coin" id="dinero"><i>€</i>${cr(s.p.dinero)}</div>
    </div>
    <div class="stats">
      <div class="sp">💪 <b>${Math.round(s.p.nivel)}</b>${bar(s.p.nivel, 'var(--blue)')}<small>nivel</small></div>
      <div class="sp">⚡ <b>${s.p.energia}</b>${bar(s.p.energia, s.p.energia < CFG.club.lesionUmbral ? 'var(--red)' : 'var(--green)')}<small>energía</small></div>
      <div class="sp">⭐ <b>${s.p.rep}</b>${bar(s.p.rep, 'var(--yellow)')}<small>reputación</small></div>
    </div>`;
}

/* ---- Pantalla principal: carrera ---- */
function cardMision() {
  const s = S, ob = objetivos(s), [a, ...rest] = ob;
  const hechos = [s.fase !== 'barrio', s.fase === 'club', s.mejora === 'hecha', !!s.negocio, s.metaVista];
  const nombres = [['🏘️', 'Barrio'], ['📋', 'Pruebas'], ['📝', 'Contrato'], ['✂️', 'Negocio'], ['🏆', 'Meta']];
  const actual = hechos.indexOf(false);
  const pct = a.prog != null ? Math.round(clamp(a.prog, 0, 1) * 100) : null;
  return `<section class="card mission" id="objetivo">
    <div class="h"><span class="ic">🎯</span><div><h2 style="margin:0">Misión</h2><h3 style="margin:0">${esc(a.t)}</h3></div></div>
    ${pct != null ? `<div class="xp"><i style="width:${pct}%"></i><span>${pct} %</span></div>` : ''}
    ${a.d ? `<p class="small">${esc(a.d)}</p>` : ''}
    ${rest.map(o => `<p class="small">🔓 <b>Después:</b> ${esc(o.t.replace(/^Después: /, ''))}</p>`).join('')}
    <div class="road">${nombres.map(([ic, t], i) => `<div class="node ${hechos[i] ? 'done' : i === actual ? 'now' : ''}"><i>${hechos[i] ? '✔' : ic}</i>${t}</div>`).join('')}</div>
  </section>`;
}

function cardEscena() {
  const s = S;
  let chap, texto, badges = '';
  if (s.fase === 'barrio') { chap = 'Capítulo 1 · El barrio'; texto = 'Juego en la plaza con mis amigos. ¡Algún día me verá un ojeador!'; }
  else if (s.fase === 'prep') {
    const k = s.prep.semanasRestantes;
    chap = 'Capítulo 2 · Las pruebas'; texto = k === 1 ? '¡Las pruebas son esta semana! Mejor llegar con energía.' : `Quedan ${k} semanas para las pruebas.`;
  } else {
    const c = s.contrato, sel = puntSeleccion(s, seleccionMalus(s, null));
    chap = `Capítulo ${s.negocio ? 4 : 3} · ${c.nombre}`;
    texto = s.lesion > 0 ? `Lesión: ${s.lesion} ${s.lesion === 1 ? 'semana' : 'semanas'} sin jugar.` : sel >= c.umbral ? '¡El míster cuenta conmigo como titular!' : 'Ahora mismo empezaría en el banquillo…';
    badges = `<span class="badge ${s.lesion ? 'b' : sel >= c.umbral ? 'g' : 'n'}">${s.lesion ? '🤕 Lesión' : sel >= c.umbral ? '✅ Titular' : '🪑 Suplente'} · selección ${nf(sel)} / ${c.umbral}</span>`
      + (s.tension > 0 ? `<span class="badge b">😠 Relación tensa ${s.tension} sem</span>` : '')
      + (s.p.energia < CFG.club.lesionUmbral && !s.lesion ? `<span class="badge b">⚠️ Energía baja: riesgo de lesión</span>` : '');
  }
  return `<div class="scene">${escena(s.fase)}<div class="chap">${esc(chap)}</div>
    <div class="hero">${s.avatar}</div><div class="bubble">${esc(texto)}</div></div>
    ${badges ? `<div style="margin:-6px 0 12px">${badges}</div>` : ''}
    ${s.fase === 'club' ? `<div style="margin:-6px 0 12px">
      <span class="badge">💶 ${cr(s.contrato.salario)}/sem</span><span class="badge">🏆 Prima ${cr(s.contrato.primaVictoria)}</span>
      <span class="badge">📄 ${s.contrato.semanasRestantes} sem de contrato</span>
      <span class="badge">⚽ ${s.stats.jugados}/${s.stats.partidos} jugados · nota ${notaMedia(s) ? nf(notaMedia(s)) : '—'}</span>
      ${s.negocio ? `<span class="badge">🏪 Caja ${cr(s.negocio.caja)}</span>` : ''}</div>` : ''}`;
}

function htmlCarta(id, a) {
  const bloq = a.disponible ? a.disponible(S) : null;
  return `<button class="opt${S.eleccion === id ? ' sel' : ''}" data-act="elegir" data-id="${id}" ${bloq ? 'disabled' : ''}>
    <span class="ic">${a.ic}</span><span class="t">${esc(a.n)}</span>
    <span class="chips">${a.fx(S).map(([ic, v]) => chip(ic, v)).join('')}</span>
    ${bloq ? `<span class="lock">🔒 ${esc(bloq)}</span>` : ''}</button>`;
}

function pantallaSemana() {
  const lista = accionesDisponibles(S);
  const a = S.eleccion && ACCIONES[S.eleccion];
  return cardEscena() + cardMision() +
    `<div class="sec-t">🃏 Elige tu plan de la semana</div><div class="grid">${lista.map(([id, x]) => htmlCarta(id, x)).join('')}</div>` +
    (a ? `<section class="card plan"><h2>Tu plan</h2><h3>${a.t}</h3>
      <p class="pro">👍 ${esc(a.pro(S))}</p><p class="con">👎 ${esc(a.con(S))}</p><p class="small">📏 ${esc(a.why(S))}</p></section>` : '');
}

/* ---- Negocio ---- */
function estrellas(f) { const k = Math.round(f / 20); return '★'.repeat(k) + '☆'.repeat(5 - k); }

function pantallaNegocio() {
  const s = S, N = CFG.negocio;
  if (!s.negocio) {
    const puede = s.fase === 'club', total = N.precio + s.cajaElegida;
    const pct = Math.round(clamp(s.p.dinero / total, 0, 1) * 100);
    return `<div class="scene">${escena('negocio')}<div class="chap">Oportunidad de negocio</div></div>
      <section class="card"><h2>${N.nombre}</h2><h3>El dueño se jubila y la vende</h3>
      <p>Precio: <b>${cr(N.precio)}</b> + dinero para la <b>caja</b> del negocio.</p>
      <p class="small">La caja paga alquiler (${cr(N.alquiler)}/sem), sueldos (${cr(N.sueldos.basico.coste)}–${cr(N.sueldos.bueno.coste)} por persona) y productos (${cr(N.productoPorCliente)} por cliente). Es independiente de tu dinero.</p>
      ${puede ? `<h2 style="margin-top:12px">Caja inicial</h2><div class="seg">${N.cajaOpciones.map(c => `<button data-act="caja" data-v="${c}" class="${s.cajaElegida === c ? 'sel' : ''}">${cr(c)}</button>`).join('')}</div>
      <p class="small">Más caja = más colchón para semanas malas, pero tardas más en poder comprar.</p>
      <div class="xp"><i style="width:${pct}%"></i><span>${cr(s.p.dinero)} / ${cr(total)}</span></div>
      <button class="btn go" data-act="comprar" ${s.p.dinero >= total ? '' : 'disabled'} style="margin-top:12px">${s.p.dinero >= total ? `🔑 Comprar por ${cr(total)}` : `Te faltan ${cr(total - s.p.dinero)}`}</button>`
      : '<p><b>🔒 Necesitas un contrato profesional para comprarla.</b></p>'}
      </section>`;
  }
  const n = s.negocio, u = n.ultimo, dem = Math.round(demandaNegocio(s, n)), cap = capacidadNegocio(n);
  const mx = Math.max(dem, cap, 1);
  const pr = N.precios[n.precio];
  return `<div class="scene">${escena('negocio')}<div class="chap">Tu peluquería · <span class="stars">${estrellas(n.fama)}</span></div></div>
    <div class="tiles">
      <div class="tile"><div class="ic">🏪</div><b id="caja" class="${n.caja < 0 ? 'down' : ''}">${cr(n.caja)}</b><span>Caja</span></div>
      <div class="tile"><div class="ic">✨</div><b>${n.fama}</b><span>Fama /100</span></div>
      <div class="tile"><div class="ic">🏠</div><b>${cr(valorNegocio(s))}</b><span>Valor</span></div>
    </div>
    <section class="card"><h2>Previsión semanal</h2>
      <div class="meter">👥 Clientes interesados: ~${dem}<div class="b"><i style="width:${dem / mx * 100}%;background:var(--pink)"></i></div></div>
      <div class="meter">💇 Capacidad del equipo: ${cap}<div class="b"><i style="width:${cap / mx * 100}%;background:var(--blue)"></i></div></div>
      <p class="small">${dem > cap ? '⚠️ Vendrá más gente de la que puedes atender: se irán clientes y bajará la fama.' : dem < cap * 0.6 ? '💸 Sobra mucho personal: pagas sueldos de más.' : '👍 Demanda y capacidad equilibradas.'}</p>
    </section>
    <section class="card"><h2>🏷️ Precio del corte</h2>
      <div class="seg">${Object.entries(N.precios).map(([k, p]) => `<button data-act="neg" data-c="precio" data-v="${k}" class="${n.precio === k ? 'sel' : ''}">${p.nombre}<br>${cr(p.precio)}</button>`).join('')}</div>
      <p class="small">${n.precio === 'economico' ? 'Muchos clientes y +1 fama/semana, pero poco margen.' : n.precio === 'normal' ? 'Equilibrado: sin efectos en la fama.' : `Pocos clientes y mucho margen; −3 fama/semana mientras la fama sea menor de ${pr.famaSinPenal}.`}</p>
    </section>
    <section class="card"><h2>💇 Tu equipo</h2>
      <div class="staff">
        <button class="rb" data-act="neg" data-c="empleados" data-v="-1" ${n.empleados <= N.empleadosMin ? 'disabled' : ''} aria-label="Despedir">−</button>
        <div class="people">${'💇'.repeat(n.empleados)}<div class="small"><b>${n.empleados} ${n.empleados === 1 ? 'persona' : 'personas'}</b></div></div>
        <button class="rb" data-act="neg" data-c="empleados" data-v="1" ${n.empleados >= N.empleadosMax || n.caja < N.costeContratar ? 'disabled' : ''} aria-label="Contratar">+</button>
      </div>
      <p class="small">Contratar: −${cr(N.costeContratar)} de la caja (formación). Despedir: −1 semana de sueldo.</p>
      <h2 style="margin-top:10px">Sueldo</h2>
      <div class="seg">${Object.entries(N.sueldos).map(([k, x]) => `<button data-act="neg" data-c="sueldo" data-v="${k}" class="${n.sueldo === k ? 'sel' : ''}">${x.nombre}<br>${cr(x.coste)}</button>`).join('')}</div>
      <p class="small">${n.sueldo === 'basico' ? `Básico: ${N.sueldos.basico.capacidad} clientes por persona y −1 fama/semana (la gente se va).` : `Bueno: ${N.sueldos.bueno.capacidad} clientes por persona y +1 fama/semana.`}</p>
    </section>
    <section class="card"><h2>👛 Tu dinero ↔ 🏪 Caja</h2>
      <p class="small">Son cuentas separadas. Tu sueldo va a tu bolsillo; los clientes pagan a la caja.</p>
      <div class="seg">
        <button data-act="traspaso" data-v="aCaja" ${s.p.dinero >= N.traspaso ? '' : 'disabled'}>👛 → 🏪<br>${cr(N.traspaso)}</button>
        <button data-act="traspaso" data-v="aPersonal" ${n.caja >= N.traspaso ? '' : 'disabled'}>🏪 → 👛<br>${cr(N.traspaso)}</button>
      </div>
    </section>
    ${u ? `<section class="card"><h2>Última semana</h2><table>
      <tr><td>💰 Cortes (${u.clientes} clientes)</td><td class="n up">+${cr(u.ingresos)}</td></tr>
      <tr><td>🏠 Alquiler</td><td class="n down">−${cr(u.alquiler)}</td></tr>
      <tr><td>💇 Sueldos</td><td class="n down">−${cr(u.sueldos)}</td></tr>
      <tr><td>🧴 Productos</td><td class="n down">−${cr(u.productos)}</td></tr>
      <tr class="tot"><td>Resultado</td><td class="n ${u.resultado >= 0 ? 'up' : 'down'}">${u.resultado >= 0 ? '+' : ''}${cr(u.resultado)}</td></tr></table></section>` : ''}
    <p class="note">Cambiar precio o equipo no gasta tu plan semanal: se aplica al jugar la semana.</p>`;
}

/* ---- Finanzas ---- */
function pantallaFinanzas() {
  const s = S, a = s.acum, n = s.negocio, u = s.ultimo, pat = patrimonio(s);
  const pers = u ? u.eco : [], tot = pers.reduce((x, [, v]) => x + v, 0);
  const h = s.historial.slice(-12), mx = Math.max(1, ...h.map(x => x.patrimonio));
  const pct = Math.round(clamp(pat / CFG.metaPatrimonio, 0, 1) * 100);
  return `<section class="card" id="resumen"><h2>💎 Patrimonio</h2>
      <div class="bigmoney" id="patrimonio">${cr(pat)}</div>
      <div class="xp"><i style="width:${pct}%"></i><span>Meta ${cr(CFG.metaPatrimonio)} · ${pct} %</span></div>
      <p class="small">Patrimonio = dinero personal + caja del negocio + valor del negocio.</p></section>
    <div class="tiles">
      <div class="tile"><div class="ic">👛</div><b>${cr(s.p.dinero)}</b><span>Tu dinero</span></div>
      <div class="tile"><div class="ic">🏪</div><b>${n ? cr(n.caja) : '—'}</b><span>Caja negocio</span></div>
      <div class="tile"><div class="ic">🏠</div><b>${n ? cr(valorNegocio(s)) : '—'}</b><span>Valor negocio</span></div>
    </div>
    ${h.length > 1 ? `<section class="card"><h2>📈 Evolución</h2><div class="chart">${h.map((x, i) =>
      `<div class="${i === h.length - 1 ? 'last' : ''}" style="height:${Math.max(4, x.patrimonio / mx * 100)}%" title="Semana ${x.semana}: ${cr(x.patrimonio)}"></div>`).join('')}</div>
      <p class="small">Semanas ${h[0].semana}–${h[h.length - 1].semana}</p></section>` : ''}
    <section class="card"><h2>👛 Tu dinero · última semana</h2>${pers.length ? `<table>
      ${pers.map(([t, v]) => `<tr><td>${esc(t)}</td><td class="n ${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : ''}${cr(v)}</td></tr>`).join('')}
      <tr class="tot"><td>Neto</td><td class="n">${tot >= 0 ? '+' : ''}${cr(tot)}</td></tr></table>` : '<p class="small">Sin movimientos todavía.</p>'}
      <p class="small">Valor del negocio = ${cr(CFG.negocio.precio)} × (0,5 + fama/100).</p></section>
    <section class="card"><h2>🧾 Desde el principio</h2><table>
      <tr><td>Tus ingresos</td><td class="n up">+${cr(a.ingresosPers)}</td></tr>
      <tr><td>Tus gastos (con compras)</td><td class="n down">−${cr(a.gastosPers)}</td></tr>
      <tr><td>Ingresos del negocio</td><td class="n up">+${cr(a.ingresosNeg)}</td></tr>
      <tr><td>Gastos del negocio</td><td class="n down">−${cr(a.gastosNeg)}</td></tr></table></section>
    <section class="card"><h2>⚙️ Partida</h2>
      <p class="small">Se guarda sola en este dispositivo y navegador.</p>
      <button class="btn danger" data-act="reiniciar" id="btnReiniciar">${confirmarReinicio ? '⚠️ Toca otra vez para borrar la partida' : '🔄 Reiniciar partida'}</button>
      ${confirmarReinicio ? '<button class="btn sec" data-act="noReiniciar">Cancelar</button>' : ''}
    </section>
    <p class="note">Importes de juego, provisionales: no son precios ni salarios reales.</p>`;
}

/* ---- Resultado de la semana ---- */
function pantallaResultado() {
  const R = S.ultimo, A = R.antes, D = R.despues;
  const lineas = items => items.map(([h, v, r]) => `<div class="res-line"><span class="h">${esc(h)}</span>${v ? ` <span>${esc(v)}</span>` : ''}${r ? `<span class="r">${esc(r)}</span>` : ''}</div>`).join('');
  let html = `<section class="card" id="resultado" style="text-align:center"><h2>Semana ${R.semana} · resumen</h2><h3>${esc(R.accion)}</h3></section>`;

  const P = R.partido;
  if (P) {
    const c = S.contrato;
    const notaCls = P.nota == null ? 'no' : P.nota >= 7 ? 'hi' : P.nota >= 6 ? 'mid' : 'lo';
    const rol = { titular: '✅ Titular', suplente: '🔁 Suplente', banquillo: '🪑 Sin jugar', lesionado: '🤕 Lesión' }[P.rol];
    const motivo = P.rol === 'lesionado' ? 'No puedes jugar hasta recuperarte.' : `Selección ${nf(P.seleccion)} frente al umbral ${c.umbral}.`;
    html += `<section class="card board"><h2>Jornada ${S.stats.partidos}</h2>
      <div class="teams"><div>${escudo(c.id, 40)}<br>${esc(c.nombre)}</div><div class="score">${P.gf}-${P.gc}</div><div>🛡️<br>${esc(P.rival)}</div></div>
      <div class="ribbon ${P.resultado}">${P.resultado.toUpperCase()}</div></section>
      <section class="card"><div class="me"><div class="nota ${notaCls}">${P.nota == null ? '—' : nf(P.nota)}</div>
      <div><h3 style="margin:0">${rol}</h3><p class="small" style="margin:2px 0">${esc(motivo)}</p>
      ${P.nota != null ? `<p class="small" style="margin:2px 0">Nota: tu nivel frente al rival (${c.rivalNivel}), tu energía y algo de suerte.</p>` : ''}</div></div></section>`;
  }
  if (R.prueba) {
    html += `<section class="card board"><h2>Día de las pruebas</h2><div class="big">${R.prueba.score}</div>
      <p>💪 ${nf(R.prueba.nivel)} + ⚡ ${R.prueba.energia}/5 + ⭐ ${R.prueba.rep}/5${R.prueba.ajuste ? ` ${sg(R.prueba.ajuste)}` : ''} + 🍀 ${sg(R.prueba.suerte)}</p></section>`;
  }

  const rw = [];
  const add = (ic, d, txt) => { if (d && Math.abs(d) >= 0.05) rw.push(`<span class="rw ${d > 0 ? 'g' : 'b'}" style="animation-delay:${0.15 + rw.length * 0.12}s">${txt || `${ic} ${sg(d)}`}</span>`); };
  add('€', D.dinero - A.dinero, `👛 ${D.dinero - A.dinero > 0 ? '+' : ''}${cr(D.dinero - A.dinero)}`);
  add('💪', D.nivel - A.nivel); add('⚡', D.energia - A.energia); add('⭐', D.rep - A.rep);
  if (A.caja != null && D.caja != null) add('🏪', D.caja - A.caja, `🏪 ${D.caja - A.caja > 0 ? '+' : ''}${cr(D.caja - A.caja)}`);
  if (A.fama != null && D.fama != null) add('✨', D.fama - A.fama);
  if (rw.length) html += `<section class="card"><h2 style="text-align:center">Botín de la semana</h2><div class="rewards">${rw.join('')}</div></section>`;

  if (R.opo.length) html += `<section class="card news"><h2>📣 Novedades</h2>${R.opo.map(([h, r]) =>
    `<div class="it"><span class="ic">${h.startsWith('⚠️') ? '⚠️' : '🔔'}</span><div><b>${esc(h.replace(/^⚠️ /, ''))}</b><div class="small">${esc(r)}</div></div></div>`).join('')}</section>`;

  html += `<details class="card why"><summary>🔍 ¿Por qué ha pasado esto? (reglas)</summary>
    ${R.dep.length ? `<h4>⚽ Deporte</h4>${lineas(R.dep)}` : ''}
    ${R.eco.length ? `<h4>👛 Tu dinero</h4><table>${R.eco.map(([t, v]) => `<tr><td>${esc(t)}</td><td class="n ${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : ''}${cr(v)}</td></tr>`).join('')}
      <tr class="tot"><td>Ahora tienes</td><td class="n">${cr(R.dineroFinal)}</td></tr></table>` : ''}
    ${R.neg.length ? `<h4>🏪 Negocio</h4>${lineas(R.neg)}` : ''}</details>`;
  return html;
}

/* ---- Eventos ---- */
function pantallaEvento() {
  const ev = S.pendiente, P = CFG.prueba;
  if (ev.tipo === 'ojeador') {
    return `<div class="scene">${escena('barrio')}<div class="chap">¡Evento!</div><div class="hero">🕵️</div>
      <div class="bubble">«Te he visto en la plaza. Te invito a unas pruebas. ¿Cuándo puedes hacerlas?»</div></div>
      <section class="card mission" id="evento"><h2>Un ojeador quiere verte</h2><h3>Elige cuándo hacer las pruebas</h3>
      <p class="small">En la prueba cuenta: 💪 nivel + ⚡ energía/5 + ⭐ reputación/5 ± ${P.suerte} de suerte.</p></section>
      <div class="grid">
        <button class="opt" data-act="resolver" data-v="corto"><span class="ic">⏩</span><span class="t">En ${P.semanasCorto} semanas</span>
          <span class="chips"><span class="chip g">Sin penalización</span><span class="chip b">Menos tiempo</span></span></button>
        <button class="opt" data-act="resolver" data-v="largo"><span class="ic">⏳</span><span class="t">Pedir ${P.semanasLargo} semanas</span>
          <span class="chips"><span class="chip g">+${P.semanasLargo - P.semanasCorto} semanas</span><span class="chip b">−${P.penalLargo} en la prueba</span></span></button>
      </div>`;
  }
  if (ev.tipo === 'ofertas') {
    const ofs = Object.values(ev.ofertas);
    const maxSal = Math.max(...ofs.map(o => o.salario));
    const fila = (t, v, pctV, col) => `<span>${t}</span><div class="b"><i style="width:${clamp(pctV, 0.05, 1) * 100}%;background:${col}"></i></div><span class="v">${v}</span>`;
    return `<section class="card mission" id="evento" style="text-align:center"><h2>Resultado de las pruebas</h2><div class="big">${ev.score}</div>
      <h3>¡Dos clubes quieren ficharte!</h3><p class="small">Ninguna oferta es mejor en todo. Compara y firma.</p></section>` +
      ofs.map(o => {
        const m = CFG.clubs[o.id].mejora;
        const mejoraTxt = m.salario != null ? `${m.texto}: ${cr(m.salario)}/sem, pero titular con selección ≥ ${m.umbral}` : `${m.texto}: sueldo × ${nf(m.salarioFactor)}`;
        return `<section class="card club"><div class="top">${escudo(o.id, 52)}<div><h3>${esc(o.nombre)}</h3><span class="small">${esc(o.tipo)} · ${esc(o.equipo)}</span></div></div>
        <div class="cmp">
          ${fila('💶 Sueldo', cr(o.salario) + '/sem', o.salario / maxSal, 'var(--yellow)')}
          ${fila('💪 Entreno', '× ' + nf(o.calidad), o.calidad / 1.5, 'var(--blue)')}
          ${fila('⏱️ Minutos', o.umbral <= 55 ? 'Fácil' : 'Difícil', (80 - o.umbral) / 30, 'var(--green)')}
          ${fila('📣 Visibilidad', '× ' + nf(o.visibilidad), o.visibilidad / 2, 'var(--pink)')}
        </div>
        <span class="badge">🎁 Fichaje ${cr(o.fichaje)}</span><span class="badge">🏆 Victoria ${cr(o.primaVictoria)}</span><span class="badge">📄 ${o.semanas} sem</span>
        <details class="more"><summary>📄 Ver letra pequeña</summary><table>
          <tr><td>Sueldo</td><td class="n">${esc(o.detalleSalario)}</td></tr>
          <tr><td>Titular con selección ≥</td><td class="n">${o.umbral}</td></tr>
          <tr><td>Nivel de los rivales</td><td class="n">${o.rivalNivel}</td></tr>
          <tr><td>Mejora si nota media ≥</td><td class="n">${nf(o.notaMejora)}</td></tr></table>
          <p class="small">Posible mejora: ${esc(mejoraTxt)}.</p></details>
        <button class="btn go" data-act="resolver" data-v="${o.id}" style="margin-top:10px">✍️ Firmar con ${esc(o.nombre)}</button></section>`;
      }).join('') + `<p class="note">Tu selección hoy sería ${nf(puntSeleccion(S, 0))} (nivel + energía/4).</p>`;
  }
  if (ev.tipo === 'mejora') {
    const o = ev.oferta, N = CFG.negociacion, c = S.contrato;
    const prob = clamp(S.p.rep, N.probMin, N.probMax), salL = Math.round(o.salario * N.largoFactor);
    return `<section class="card mission" id="evento" style="text-align:center"><h2>📝 ${esc(c.nombre)}</h2><div style="font-size:52px">${escudo(c.id, 56)}</div>
      <h3>${esc(o.texto)}</h3>
      <p>Ahora cobras <b>${cr(c.salario)}</b>. Te ofrecen <b>${cr(o.salario)}</b>/semana durante ${o.semanas} semanas.</p>
      <p class="small">${o.umbral !== c.umbral ? `Ojo: en el ${esc(o.equipo.toLowerCase())} hay más competencia (titular con ≥ ${o.umbral}, rivales de nivel ${o.rivalNivel}).` : `Mismo puesto en el equipo (titular con ≥ ${o.umbral}).`}</p></section>
      <div class="sec-t">¿Qué haces?</div>
      <div class="grid">
        <button class="opt" data-act="resolver" data-v="aceptar"><span class="ic">🤝</span><span class="t">Aceptar</span>
          <span class="chips"><span class="chip g">${cr(o.salario)}/sem</span><span class="chip g">Seguro</span></span></button>
        <button class="opt" data-act="resolver" data-v="pedir"><span class="ic">🎲</span><span class="t">Pedir un ${Math.round((N.pedirMasFactor - 1) * 100)} % más</span>
          <span class="chips"><span class="chip g">${prob} %: ${cr(Math.round(o.salario * N.pedirMasFactor))}</span><span class="chip b">Si falla: tensión</span></span></button>
      </div>
      <div style="height:12px"></div>
      <button class="opt" data-act="resolver" data-v="largo" style="width:100%;min-height:0"><span class="ic">🔒</span><span class="t">Contrato largo con prima</span>
        <span class="chips"><span class="chip g">+${cr(salL * N.largoPrimaSemanas)} ahora</span><span class="chip g">${N.largoSemanas} semanas</span><span class="chip b">${cr(salL)}/sem</span></span></button>
      <p class="note">Pedir más: probabilidad = tu reputación (entre ${N.probMin} % y ${N.probMax} %). Si falla, firmas la oferta inicial y el club te lo tiene en cuenta (−${N.tensionSeleccion} en la selección durante ${N.tensionSemanas} semanas).</p>`;
  }
  if (ev.tipo === 'meta') {
    return confeti() + `<section class="card mission" id="evento" style="text-align:center"><h2>Fin de esta versión</h2>
      <div style="font-size:80px" class="logo">🏆</div><h3>¡Del barrio al negocio!</h3>
      <p>Tu patrimonio: <b>${cr(patrimonio(S))}</b>.</p>
      <p class="small">Del barrio a un club profesional y con tu propio negocio en ${S.semana - 1} semanas.</p>
      <button class="btn go" data-act="resolver" data-v="ok">Seguir jugando</button></section>`;
  }
  return '';
}

/* ---- Presentación ---- */
function pantallaIntro() {
  return `<div class="intro"><div class="logo">⚽💼</div><h1>DEL BARRIO<br>AL NEGOCIO</h1>
    <div class="sub">De la plaza del barrio a futbolista profesional… y a tener tu propio negocio.</div>
    <section class="card"><h2>¿Cómo te llamas?</h2>
      <input id="nombre" maxlength="16" placeholder="Tu nombre" value="${esc(S.nombre)}" autocomplete="off">
      <h2 style="margin-top:14px">Elige tu personaje</h2>
      <div class="avas">${CFG.avatares.map(a => `<button data-act="avatar" data-v="${a}" class="${S.avatar === a ? 'sel' : ''}">${a}</button>`).join('')}</div>
    </section>
    <button class="btn go" data-act="empezar" id="btnEmpezar">▶ ¡A jugar!</button>
    <p class="note">Cada semana eliges un plan, juegas la semana y ves qué pasa. Los importes son de juego: no son precios ni salarios reales.</p></div>`;
}

function render() {
  if (!S) return;
  renderTop();
  const main = $('main'), dock = $('dock');
  let html, d = '';
  if (S.intro) {
    html = pantallaIntro();
  } else if (S.verResultado) {
    html = pantallaResultado();
    d = `<button class="btn ${S.pendiente ? '' : 'go'}" data-act="continuar" id="btnContinuar">${S.pendiente ? '🔔 ¡Ver la oportunidad!' : 'Continuar ▶'}</button><div style="height:calc(var(--safe-bottom) + 8px)"></div>`;
  } else if (S.pendiente) {
    html = pantallaEvento();
  } else {
    html = S.tab === 'negocio' ? pantallaNegocio() : S.tab === 'finanzas' ? pantallaFinanzas() : pantallaSemana();
    const a = S.eleccion && ACCIONES[S.eleccion];
    d = (S.tab === 'semana'
      ? `<button class="btn go" data-act="avanzar" id="btnAvanzar" ${a ? '' : 'disabled'}>${a ? `▶ Jugar semana ${S.semana}` : 'Elige un plan'}</button>`
      : '') +
      `<nav>${[['semana', '⚽', 'Carrera'], ['negocio', '✂️', 'Negocio'], ['finanzas', '💰', 'Finanzas']].map(([k, ic, t]) =>
        `<button data-act="tab" data-v="${k}" class="${S.tab === k ? 'on' : ''}"><span>${ic}</span>${t}</button>`).join('')}</nav>`;
  }
  if (celebrar) { html = confeti() + html; celebrar = false; }
  main.innerHTML = html;
  dock.innerHTML = d;
  if (S.aviso) { $('toast').innerHTML = `<div>${esc(S.aviso)}</div>`; S.aviso = null; }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v;
  const prevTab = S.tab;
  if (act !== 'reiniciar' && act !== 'noReiniciar') confirmarReinicio = false;
  switch (act) {
    case 'avatar': S.nombre = $('nombre').value; S.avatar = v; render(); break;
    case 'empezar': S.nombre = ($('nombre').value || '').trim().slice(0, 16) || 'Crack'; S.intro = false; guardar(); render(); break;
    case 'elegir': elegir(b.dataset.id); break;
    case 'avanzar': avanzarSemana(); break;
    case 'continuar': S.verResultado = false; S.tab = 'semana'; guardar(); render(); break;
    case 'resolver': celebrar = !!(S.pendiente && S.pendiente.tipo === 'ofertas'); if (!resolver(v)) celebrar = false; break;
    case 'tab': S.tab = v; guardar(); render(); break;
    case 'caja': S.cajaElegida = Number(v); render(); break;
    case 'comprar': celebrar = true; if (!comprarNegocio(S.cajaElegida)) celebrar = false; break;
    case 'neg': cambiarNegocio(b.dataset.c, b.dataset.c === 'empleados' ? Number(v) : v); break;
    case 'traspaso': traspasar(v); break;
    case 'reiniciar': if (confirmarReinicio) reiniciar(); else { confirmarReinicio = true; render(); } break;
    case 'noReiniciar': confirmarReinicio = false; render(); break;
  }
  if (S.tab !== prevTab || ['continuar', 'resolver', 'avanzar', 'empezar', 'comprar'].includes(act)) window.scrollTo(0, 0);
});

S = cargar() || nuevaPartida();
guardar();
render();

/* =====================================================================
   11. GANCHOS DE PRUEBA (no afectan al juego)
   ===================================================================== */
window.__P1 = {
  CFG, ACCIONES,
  get S() { return S; }, set S(v) { S = v; },
  nueva(seed) { S = nuevaPartida(seed); S.intro = false; S.nombre = 'Prueba'; guardar(); render(); return S; },
  elegir, avanzarSemana, resolver, comprarNegocio, cambiarNegocio, traspasar, reiniciar,
  continuar() { S.verResultado = false; S.tab = 'semana'; guardar(); render(); },
  objetivos: () => objetivos(S), patrimonio: () => patrimonio(S), valorNegocio: () => valorNegocio(S),
  pruebaBase: () => pruebaBase(S), condicionMejora: () => condicionMejora(S), ofertasClubes,
  disponible: id => !(ACCIONES[id].disponible && ACCIONES[id].disponible(S)) && ACCIONES[id].fases.includes(S.fase),
};
</script>
</body>
</html>
